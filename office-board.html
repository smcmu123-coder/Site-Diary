<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CGC siteHUB — Site Board</title>
<style>
:root{--green:#1F5A2D;--dark:#12331C;--lime:#8BC34A;--ink:#12331C;--ink-2:#48554D;--ink-3:#7C8A82;
  --paper:#fff;--canvas:#EEF2EE;--amber:#A9761B;--amber-bg:#FBF1DF;--red:#A72B22;--red-bg:#FBEDEC;
  --blue:#1B4F7A;--blue-bg:#E7EFF7;--plum:#8A3B62;--plum-bg:#F6EAF0;--teal:#0F6B63;--teal-bg:#E3F1EF;
  --orange:#B4551E;--orange-bg:#FBEDE4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact}
body{background:var(--canvas);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  height:100vh;overflow:hidden}
.ghost{position:fixed;right:-140px;bottom:-190px;width:920px;opacity:.045}
.wrap{position:relative;height:100vh;padding:24px 30px 18px}
.top{overflow:hidden}
.top .mark{height:54px;float:left;margin-right:24px}
.jobpill{float:left;background:var(--green);color:#fff;padding:13px 32px;border-radius:999px;
  font-size:28px;font-weight:750;letter-spacing:-.01em}
.clock{float:right;text-align:right}
.clock .t{font-size:40px;font-weight:800;letter-spacing:-.02em}
.clock .d{font-size:15px;color:var(--ink-2);font-weight:650;margin-top:-2px}
.rings{margin:20px 0 18px;font-size:0;overflow:hidden}
.ring{float:left;width:23%;margin-right:1.8%;font-size:16px}
.ring:last-child{margin-right:0}
.ring{background:var(--paper);border-radius:20px;padding:16px 12px 14px;text-align:center;
  box-shadow:0 3px 18px -10px rgba(18,51,28,.3)}
.rings .ring{float:left;width:23%;margin-right:1.8%}
.ring h3{font-size:17px;font-weight:750;margin-bottom:6px}
.dial{position:relative;width:180px;height:180px;margin:0 auto}
.mid{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--ink-2);font-weight:650}
.note{margin-top:8px;font-size:14px;font-weight:700}
.cols{font-size:0;height:560px;height:calc(100vh - 472px);clear:both}
.cols > .panel{display:inline-block;vertical-align:top;font-size:16px;height:100%;
  margin-right:1.3%}
.cols > .panel:nth-child(1){width:39.5%}
.cols > .panel:nth-child(2){width:32%}
.cols > .panel:nth-child(3){width:25.9%;margin-right:0}
.panel{background:var(--paper);border-radius:20px;padding:16px 18px;
  box-shadow:0 3px 18px -10px rgba(18,51,28,.3);overflow:hidden}
.panel h2{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:#fff;
  background:var(--green);padding:7px 16px;border-radius:999px;margin-bottom:12px;
  font-weight:800;display:inline-block}
.panel.dark{background:var(--dark)}
.panel.dark h2{background:var(--lime);color:var(--dark)}
.list{overflow:hidden}
/* six or more and the rows tighten; a dozen and they go two abreast */
.list.compact .item{padding:8px 11px;margin-bottom:6px;padding-left:24px}
.list.compact .item b{font-size:15.5px;margin-top:2px}
.list.compact .item span{font-size:12.5px}
.list.compact .item .when{font-size:13px}
.list.compact .tag{font-size:10px;padding:1px 7px}
.list.two{font-size:0}
.list.two .item{display:inline-block;width:48.6%;margin-right:2.6%;vertical-align:top;
  font-size:16px;padding:7px 10px 7px 22px;margin-bottom:6px}
.list.two .item:nth-child(2n){margin-right:0}
.list.two .item b{font-size:14.5px;margin-top:2px}
.list.two .item span{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list.two .item .when{font-size:12.5px}
.list.two .item i{top:8px;bottom:8px;left:10px;width:4px}
.list.two .tag{font-size:9.5px;padding:1px 6px;letter-spacing:.04em}
.item{padding:10px 12px;border-radius:13px;background:var(--canvas);margin-bottom:8px;
  overflow:hidden;position:relative;padding-left:26px}
.item i{position:absolute;left:12px;top:10px;bottom:10px;width:5px;border-radius:3px;
  background:var(--green)}
.item .txt{overflow:hidden}
.item b{display:block;font-size:17px;font-weight:750;letter-spacing:-.01em;margin-top:3px}
.item span{display:block;font-size:13.5px;color:var(--ink-2);margin-top:1px}
.item .when{float:right;font-size:14px;font-weight:800;color:var(--ink-2);white-space:nowrap;
  margin-left:10px}
.item.alert{background:var(--red-bg)}.item.alert i{background:var(--red)}.item.alert b{color:var(--red)}
.item.warnbg{background:var(--amber-bg)}.item.warnbg i{background:var(--amber)}.item.warnbg b{color:#7A5512}
.empty{color:var(--ink-3);font-size:15px;padding:6px 2px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800;
  letter-spacing:.05em;text-transform:uppercase}
.tag.del{background:var(--blue-bg);color:var(--blue)}
.tag.exc{background:var(--plum-bg);color:var(--plum)}
.tag.off,.tag.on{background:var(--teal-bg);color:var(--teal)}
.tag.vis{background:#EFEAF7;color:#5B3E8C}
.tag.rep{background:var(--orange-bg);color:var(--orange)}
.tag.hol{background:var(--amber-bg);color:var(--amber)}
.tag.in{background:#E7F0E9;color:#1F5A2D}
.tag.part{background:var(--amber-bg);color:var(--amber)}
.item.done b{color:#1F5A2D}
.stat{padding:11px 14px;border-radius:13px;background:rgba(255,255,255,.08);margin-bottom:8px;
  overflow:hidden}
.stat .n{float:left;font-size:30px;font-weight:800;letter-spacing:-.02em;color:#fff;
  width:92px;line-height:1.1}
.stat .l{overflow:hidden;font-size:14px;color:#CFE6D6;font-weight:650;line-height:1.25}
.stat .l span{color:#8FB49C;font-weight:600;font-size:12.5px}
.foot{margin-top:12px;font-size:13px;color:var(--ink-3);font-weight:650;overflow:hidden}
.foot .dot{float:left;margin:4px 10px 0 0}
.foot .right{float:right}
.dot{width:9px;height:9px;border-radius:50%;background:var(--lime);display:inline-block}

.state{position:fixed;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:14px;background:var(--canvas);z-index:5;
  text-align:center;padding:40px}
.state img{width:180px;opacity:.9;margin-bottom:10px}
.state h2{font-size:22pt;font-weight:800;letter-spacing:-.02em}
.state p{font-size:12pt;color:var(--ink-2);max-width:620px;line-height:1.5}
.state code{background:#fff;padding:3px 8px;border-radius:6px;font-size:11pt}
.stale{background:#B4551E !important}
</style></head><body>

<script>
/* ------------------------------------------------------------------------
   The board reads a snapshot the app publishes. It re-reads it every two
   minutes, so a fresh publish appears on the wall without anyone touching it.
   ------------------------------------------------------------------------ */
var REFRESH_MS = 120000;

function pad(n){ return (n<10?"0":"")+n; }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parse(s){ var p=String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function shortDate(s){ return s ? pad(parse(s).getDate())+"/"+pad(parse(s).getMonth()+1) : ""; }
function addDays(s,n){ var d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
function weekStart(s){ var d=parse(s), dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return iso(d); }
function weekDays(ws){ var a=[],i; for(i=0;i<7;i++) a.push(addDays(ws,i)); return a; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;"); }

function ring(title, done, total, note){
  var pct = total ? Math.min(1, done/total) : 0;
  var R=76, C=2*Math.PI*R;
  var col = total===0 ? "#9DB3A5" : pct>=1 ? "#1F5A2D" : pct>0 ? "#A9761B" : "#A72B22";
  return '<div class="ring"><h3>'+title+'</h3>'
    + '<div class="dial"><svg width="180" height="180" viewBox="0 0 180 180">'
    + '<circle cx="90" cy="90" r="'+R+'" fill="none" stroke="#E4EAE6" stroke-width="16"/>'
    + '<circle cx="90" cy="90" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="16" '
    + 'stroke-linecap="round" stroke-dasharray="'+(C*pct).toFixed(1)+' '+(C*(1-pct)).toFixed(1)+'" '
    + 'transform="rotate(-90 90 90)"/></svg>'
    + '<div class="mid"><div class="big" style="color:'+col+'">'
    + (total===0 ? "None" : done+" of "+total)+'</div>'
    + '<div class="sub">'+(total===0 ? "to complete" : "complete")+'</div></div></div>'
    + '<div class="note" style="color:'+col+'">'+note+'</div></div>';
}

function draw(D){
  var T = iso(new Date()), WS = weekStart(T);
  /* only submitted records are published, so a missing status means submitted */
  var recs = (D.records||[]).filter(function(r){ return r.job===D.job; })
    .map(function(r){ if(!r.status) r.status = "submitted"; return r; });
  var onSite = (D.plant||[]).filter(function(p){
    return p.job===D.job && (!p.onDate||p.onDate<=T) && (!p.offDate||p.offDate>T); });
  var done = function(form,date){ return recs.some(function(r){
    return r.form===form && r.date===date && r.status==="submitted"; }); };

  var checksToday = recs.filter(function(r){
    return r.form==="plantcheck" && r.date===T && r.status==="submitted"; }).length;
  var prev = (function(){ var d=addDays(T,-1), n=0;
    while([0,6].indexOf(parse(d).getDay())>=0 && n++<7) d=addDays(d,-1); return d; })();
  var pd = recs.filter(function(r){ return r.form==="diary" && r.date===prev
    && r.status==="submitted"; })[0];
  var excOpen = (pd && pd.data && pd.data.excavationsOpen ? (pd.data.excavationList||[]) : []).length;
  var excDone = recs.filter(function(r){ return r.form==="excavation" && r.date===T
    && r.status==="submitted"; }).length;
  var formsDone = ["briefing","diary"].filter(function(k){ return done(k,T); }).length;
  var weeklyDone = ["puwer","loler"].filter(function(k){
    return recs.some(function(r){ return r.form===k && r.status==="submitted"
      && weekStart(r.date)===WS; }); }).length;

  document.getElementById("rings").innerHTML =
    ring("Plant Inspections", checksToday, onSite.length,
      onSite.length ? (onSite.length-checksToday ? (onSite.length-checksToday)+" still to check"
        : "All machines checked") : "No plant on site")
  + ring("Excavation Inspections", excDone, excOpen,
      excOpen ? (excOpen-excDone ? (excOpen-excDone)+" before work starts" : "All signed off")
        : "None left open")
  + ring("Today&rsquo;s Paperwork", formsDone, 2,
      formsDone===2 ? "Briefing and diary in"
        : (done("briefing",T) ? "Diary still to come" : "Briefing still to come"))
  + ring("Weekly Registers", weeklyDone, 2,
      weeklyDone===2 ? "PUWER and LOLER in" : "Due by "+shortDate(addDays(WS,4)));

  /* today on site */
  var COL={del:"var(--blue)",exc:"var(--plum)",off:"var(--teal)",on:"var(--teal)",
    vis:"#5B3E8C",rep:"var(--orange)",hol:"var(--amber)"};
  var ov=[];
  (D.deliveries||[]).forEach(function(x){
    if(x.job!==D.job || x.dueDate!==T || x.cancelled) return;
    var got=(x.received||[]).reduce(function(n,r){ return n+(Number(r.qty)||0); },0);
    var want=Number(x.qty)||0;
    if(want && got>=want) return;          /* it has landed — it shows on the other side */
    ov.push({k:"del",label:"Delivery",b:x.description||x.type,
      s:(x.supplier||"")+" · "+(want?want+" "+(x.unit||""):""),
      when: got ? got+" of "+want+" in" : "due"});
  });
  [].concat(D.plant||[], D.lifting||[], D.tools||[]).forEach(function(x){
    if(x.job!==D.job) return;
    var tag=x.fleetNo||x.idNo||"";
    if(x.exchangeDate===T) ov.push({k:"exc",label:"Exchange",b:x.item,
      s:tag+(x.exchangeNote?" · "+x.exchangeNote:""),when:"today"});
    if(x.offDate===T) ov.push({k:"off",label:"Off hire",b:x.item,
      s:tag+(x.hireCompany?" · "+x.hireCompany:""),when:"today"});
    if(x.onDate===T) ov.push({k:"on",label:"Arriving",b:x.item,
      s:tag+(x.hireCompany?" · "+x.hireCompany:""),when:"today"});
  });
  (D.events||[]).forEach(function(e){
    if(e.job!==D.job || e.date!==T) return;
    ov.push({k:"vis",label:"Visitor",b:e.title,s:e.notes||"",when:e.time||""});
  });
  (D.defects||[]).forEach(function(x){
    if(x.status!=="open" || !x.repair || x.repair.date!==T) return;
    var m=(D.plant||[]).filter(function(p){ return p.id===x.plantId; })[0]||{};
    ov.push({k:"rep",label:"Repair",b:m.item||"Machine",s:x.item,when:"booked in"});
  });
  (D.leave||[]).forEach(function(l){
    if(l.from>T || l.to<T) return;
    var p=(D.labour||[]).filter(function(x){ return x.id===l.personId; })[0];
    if(!p || p.job!==D.job) return;
    ov.push({k:"hol",label:"Off",b:p.name,s:l.type==="HOL"?"Holiday":l.type,
      when:"back "+shortDate(addDays(l.to,1))});
  });
  var ovList = document.getElementById("overview");
  /* the more there is on, the tighter it packs — nothing gets cut off */
  ovList.className = "list" + (ov.length>12 ? " two compact"
    : ov.length>8 ? " two" : ov.length>5 ? " compact" : "");
  var ovShow = ov.length > 18 ? ov.slice(0,18) : ov;
  ovList.innerHTML = ov.length
    ? ovShow.map(function(x){
        return '<div class="item"><i style="background:'+COL[x.k]+'"></i><div class="txt">'
          + '<span class="tag '+x.k+'">'+x.label+'</span><b>'+esc(x.b)+'</b>'
          + '<span>'+esc(x.s)+'</span></div><div class="when">'+esc(x.when)+'</div></div>';
      }).join("") + (ov.length>18 ? '<div class="empty">and '+(ov.length-18)+' more</div>' : "")
    : '<div class="empty">Nothing booked in for today.</div>';

  /* needs attention */
  var att=[];
  (D.defects||[]).forEach(function(x){
    if(x.status!=="open") return;
    var m=(D.plant||[]).filter(function(p){ return p.id===x.plantId; })[0]||{};
    if(m.job && m.job!==D.job) return;
    var days=Math.max(0, Math.round((Date.now()-x.reportedAt)/86400000));
    att.push({cls:"alert",b:(m.item||"Machine")+(m.fleetNo?" ("+m.fleetNo+")":""),
      s:x.item+(x.description?" — "+x.description:""),
      when:days===0?"today":days+(days===1?" day":" days")});
  });
  onSite.forEach(function(p){
    if(!p.examDate) return;
    var days=Math.round((parse(p.examDate)-parse(T))/86400000);
    if(days<=30) att.push({cls:days<0?"alert":"warnbg",b:p.item+" examination",
      s:days<0?"lapsed "+shortDate(p.examDate):"certificate runs out "+shortDate(p.examDate),
      when:days<0?"overdue":days+(days===1?" day":" days")});
  });
  var missing=[];
  if(!done("briefing",T)) missing.push("daily briefing");
  if(!done("diary",T)) missing.push("site diary");
  if(onSite.length-checksToday>0) missing.push((onSite.length-checksToday)+" plant checks");
  if(excOpen-excDone>0) missing.push((excOpen-excDone)+" excavation inspections");
  if(missing.length) att.push({cls:"warnbg",b:"Still to do today",
    s:missing.join(", ").replace(/,([^,]*)$/," and$1"),when:""});
  /* ---------- what has come in ---------- */
  var inToday=[];
  (D.deliveries||[]).forEach(function(x){
    if(x.job!==D.job || x.cancelled) return;
    var todayDrops=(x.received||[]).filter(function(r){ return r.date===T; });
    if(!todayDrops.length) return;
    var gotToday=todayDrops.reduce(function(n,r){ return n+(Number(r.qty)||0); },0);
    var got=(x.received||[]).reduce(function(n,r){ return n+(Number(r.qty)||0); },0);
    var want=Number(x.qty)||0;
    var tickets=todayDrops.map(function(r){ return r.ticket; }).filter(Boolean);
    inToday.push({ full: want && got>=want, qty:gotToday,
      b:x.description||x.type,
      s:(x.supplier||"") + (tickets.length ? " · ticket "+tickets.join(", ") : ""),
      when: gotToday + " " + (x.unit||""),
      note: want ? (got>=want ? "complete" : got+" of "+want+" so far") : "" });
  });
  var recList = document.getElementById("received");
  recList.className = "list" + (inToday.length>8 ? " two compact"
    : inToday.length>5 ? " compact" : "");
  recList.innerHTML = inToday.length
    ? inToday.map(function(x){
        return '<div class="item'+(x.full?" done":"")+'">'
          + '<i style="background:'+(x.full?"var(--green)":"var(--amber)")+'"></i>'
          + '<div class="txt"><span class="tag '+(x.full?"in":"part")+'">'
          + (x.full?"Complete":"Part load")+'</span><b>'+esc(x.b)+'</b>'
          + '<span>'+esc(x.s)+(x.note?(x.s?" · ":"")+x.note:"")+'</span></div>'
          + '<div class="when">'+esc(x.when)+'</div></div>';
      }).join("")
    : '<div class="empty">Nothing taken in yet today.</div>';

  var attList = { className:"", innerHTML:"" };
  attList.className = "list" + (att.length>8 ? " two compact" : att.length>4 ? " compact" : "");
  attList.innerHTML = att.length
    ? att.slice(0, att.length>14 ? 14 : att.length).map(function(x){
        return '<div class="item '+x.cls+'"><i></i><div class="txt"><b>'+esc(x.b)+'</b>'
          + '<span>'+esc(x.s)+'</span></div><div class="when">'+esc(x.when)+'</div></div>'; }).join("")
      + (att.length>14 ? '<div class="empty">and '+(att.length-14)+' more</div>' : "")
    : '<div class="empty">Nothing outstanding — everything is in.</div>';

  /* this week */
  var wkRecs = recs.filter(function(r){ return weekStart(r.date)===WS && r.status==="submitted"; });
  var checksWeek = wkRecs.filter(function(r){ return r.form==="plantcheck"; }).length;
  var lastDiary = recs.filter(function(r){ return r.form==="diary" && r.status==="submitted"; })
    .sort(function(a,b){ return b.date.localeCompare(a.date); })[0];
  var labour = lastDiary ? (lastDiary.data.labourTable||[])
    .filter(function(x){ return x.onSite===true; }).length : 0;
  var taken = (D.deliveries||[]).filter(function(x){ return x.job===D.job && !x.cancelled; })
    .reduce(function(n,x){ return n + (x.received||[])
      .filter(function(r){ return weekStart(r.date)===WS; })
      .reduce(function(m,r){ return m+(Number(r.qty)||0); },0); },0);
  var stat=function(n,l,s){ return '<div class="stat"><div class="n">'+n+'</div>'
    + '<div class="l">'+l+'<br><span>'+s+'</span></div></div>'; };
  document.getElementById("week").innerHTML =
      stat(wkRecs.length, "records in the pack", "week commencing "+shortDate(WS))
    + stat(checksWeek, "plant checks done", "this week")
    + stat(labour, "on site", "from the last diary")
    + stat(onSite.length, "machines on site",
        (D.tools||[]).filter(function(x){ return x.job===D.job; }).length+" items of equipment")
    + stat(Math.round(taken*10)/10, "tonnes and loads in", "taken this week");

  document.getElementById("job").textContent = D.job || "—";
  document.getElementById("state").style.display = "none";
  document.getElementById("board").style.display = "";
}

function clock(publishedAt){
  var now=new Date();
  document.getElementById("clock").textContent = pad(now.getHours())+":"+pad(now.getMinutes());
  document.getElementById("today").textContent = now.toLocaleDateString("en-GB",
    { weekday:"long", day:"numeric", month:"long" });
  if(publishedAt){
    var p=new Date(publishedAt);
    var mins=Math.round((Date.now()-publishedAt)/60000);
    var age = mins<2 ? "just now" : mins<60 ? mins+" minutes ago"
      : mins<1440 ? Math.round(mins/60)+" hours ago" : Math.round(mins/1440)+" days ago";
    document.getElementById("stamp").textContent = "Published "+pad(p.getHours())+":"
      + pad(p.getMinutes())+" · "+age;
    /* the dot goes orange when the board is running behind */
    document.getElementById("dot").className = mins > 180 ? "dot stale" : "dot";
  }
}

var lastPublished = 0;
function load(){
  fetch("board-data.json?t=" + Date.now(), { cache:"no-store" })
    .then(function(r){ if(!r.ok) throw new Error("no file"); return r.json(); })
    .then(function(D){
      lastPublished = D.publishedAt || 0;
      draw(D);
      clock(lastPublished);
    })
    .catch(function(){
      document.getElementById("stateTitle").textContent = "No site data yet";
      document.getElementById("stateText").innerHTML =
        "This board reads <code>board-data.json</code> from the same folder.<br>"
        + "Publish it from the app: Profile \u2192 Update the office board.";
    });
}
load();
setInterval(load, REFRESH_MS);
setInterval(function(){ clock(lastPublished); }, 20000);
</script>
</body></html>
