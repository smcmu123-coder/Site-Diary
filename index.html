<style>
:root{
  --green:#1F5A2D; --green-700:#17441F; --green-50:#F1F6F2; --green-100:#E3EDE6;
  --ink:#121714; --ink-2:#59645C; --ink-3:#8A948C;
  --line:#DDE3DE; --line-2:#ECEFEB; --paper:#fff; --canvas:#F7F9F7;
  --ok:#2E7D46; --ok-bg:#E6F2EA; --warn:#A96A00; --warn-bg:#FAEFDC;
  --bad:#A72B22; --bad-bg:#F8E6E3; --info:#1E4E8C; --info-bg:#E7EEF7;
  --sh:0 1px 2px rgba(20,34,24,.05), 0 10px 24px -18px rgba(20,34,24,.35);
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden}
img,canvas,table{max-width:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  background:var(--canvas);color:var(--ink);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7FB394;outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;min-height:100vh;
  padding:0 16px calc(104px + env(safe-area-inset-bottom));
  padding-left:max(16px, env(safe-area-inset-left));
  padding-right:max(16px, env(safe-area-inset-right));
  background:var(--paper);overflow-x:hidden}
.projgrid{display:grid;gap:12px}
.reggrid{display:grid;gap:0}
@media(min-width:760px){
  .reggrid{grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .reggrid > .card,.reggrid > .rep{margin-bottom:0}
}

/* iPad: more room, bigger type, cards side by side. Same code, one layout. */
@media(min-width:760px){
  body{background:var(--canvas)}
  .app{max-width:760px;padding:0 34px 120px;box-shadow:0 0 0 1px var(--line);
    background:var(--paper)}
  h1.greet{font-size:34px}
  .sub{font-size:15px;margin-bottom:26px}
  .week{gap:6px;margin-bottom:28px}
  .wd{padding:13px 0 15px;border-radius:18px}
  .wd .l{font-size:12.5px} .wd .n{font-size:19px} .wd .s{width:7px;height:7px}
  .warrow{width:38px;font-size:22px}
  .hero{padding:34px 28px;border-radius:28px}
  .hero .ttl{font-size:29px}
  .hero .why{font-size:15px}
  .begin{min-height:56px;font-size:17.5px;padding:0 48px}
  .card{padding:22px}
  .projgrid{grid-template-columns:repeat(3,1fr);align-items:start}
  .projgrid .card{margin-bottom:0;height:100%}
  .cg{grid-template-columns:repeat(3,1fr)}
  .pg{grid-template-columns:repeat(4,1fr);gap:10px}
  .btn{min-height:58px}
  .sect{margin:32px 0 12px}
  .thead .c2{display:block;flex:none}
  .trow .c2{display:block} .trow .subfleet{display:none}
  .tsgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tsgrid .tsperson{margin-bottom:0}
  .tstotal .big{font-size:40px}
  .tsday{padding:10px 2px}
  .timegrid{grid-template-columns:1fr 1fr auto}
  .timegrid .calc{grid-column:auto;text-align:left}
}
@media(min-width:1024px){
  .app{max-width:880px}
  .pg{grid-template-columns:repeat(5,1fr)}
  .lightbox .lbimg{padding:0 40px}
  .sheet{padding:34px 40px}
}

/* landscape on a tablet: keep the reading width sensible */
@media(min-width:900px) and (orientation:landscape){
  .app{max-width:900px}
}
.hide{display:none!important}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) 0 2px}
.top .chip{background:var(--canvas);border-radius:999px;padding:8px 14px;font-size:13px;
  font-weight:640;color:var(--ink-2)}
h1.greet{text-align:center;font-size:28px;font-weight:640;letter-spacing:-.03em;margin:14px 0 2px}
.sub{text-align:center;color:var(--ink-3);font-size:13.5px;margin:0 0 20px}

/* week strip */
.week{display:flex;gap:3px;margin-bottom:22px}
.wd{flex:1;border-radius:15px;padding:9px 0 10px;display:grid;justify-items:center;gap:4px;
  background:transparent}
.wd .l{font-size:11px;color:var(--ink-3);font-weight:640}
.wd .n{font-size:16.5px;font-weight:640}
.wd .s{width:6px;height:6px;border-radius:50%;background:transparent}
.wd .s.ok{background:var(--ok)}
.wd .s.amber{background:var(--warn)}
.wd .s.red{background:var(--bad)}
.wd .s.due{background:var(--line)}
.wd.on{background:var(--canvas);box-shadow:inset 0 0 0 1.5px var(--green)}
.wd.on .n{color:var(--green)}
.wd.we .l,.wd.we .n{color:var(--ink-3)}
.wd.fut .l,.wd.fut .n{color:#CBD3CD}
.warrow{width:30px;display:grid;place-items:center;color:var(--ink-3);font-size:19px}
.warrow[disabled]{opacity:.25}

/* hero */
.hero{background:#0C2A18;color:#fff;border-radius:26px;padding:26px 22px;text-align:center;
  display:grid;justify-items:center;gap:5px;margin-bottom:14px}
.hero .lab{font-size:13px;color:rgba(255,255,255,.55)}
.hero .ttl{font-size:25px;font-weight:640;letter-spacing:-.025em}
.hero .why{font-size:13.5px;color:rgba(255,255,255,.6);max-width:32ch}
.hero.calm{background:var(--green-50);color:var(--green-700)}
.hero.calm .lab{color:var(--ink-3)} .hero.calm .why{color:var(--ink-2)}
.hero.late{background:#7A2019}
.begin{margin-top:14px;background:#fff;color:#0C2A18;border-radius:999px;min-height:52px;
  padding:0 42px;font-size:16.5px;font-weight:660}
.hero.calm .begin{background:var(--green);color:#fff}

/* hero carousel */
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;margin:0 -16px 8px;padding:0 16px 6px;
  scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel > *{flex:0 0 calc(100% - 26px);scroll-snap-align:center;margin:0}
@media(min-width:760px){
  .carousel{margin:0 0 8px;padding:0 0 6px;gap:14px}
  .carousel > *{flex:0 0 calc(50% - 7px)}
  .ctabs{padding-bottom:16px}
  .ctab{font-size:14px;padding:9px 16px}
}
/* the last card can still sit at the left edge when scrolled to */
.carousel::after{content:"";flex:0 0 1px}
@media(min-width:760px){ .carousel::after{flex:0 0 calc(50% - 7px)} }
.ctabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.ctabs::-webkit-scrollbar{display:none}
.ctab{flex:none;display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;
  background:var(--canvas);color:var(--ink-2);font-size:13.5px;font-weight:640;
  border:1.5px solid transparent;transition:background .2s, color .2s, border-color .2s}
.ctab.on{background:var(--green);color:#fff}
.ctab .tick{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;
  background:var(--ok-bg);color:var(--ok);font-size:10px;font-weight:800}
.ctab.on .tick{background:rgba(255,255,255,.22);color:#fff}
.ctab .todo{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.ctab.on .todo{background:#fff}
.hero .count{font-size:12.5px;color:rgba(255,255,255,.55);margin-top:2px}
.hero.calm .count{color:var(--ink-3)}

/* cards + rows */
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);padding:18px;
  margin-bottom:12px;min-width:0}
.card table{display:block;overflow-x:auto;white-space:nowrap}
.card h3{margin:0 0 3px;font-size:16px;font-weight:650}
.card p{margin:0;color:var(--ink-2);font-size:14px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 0}
.row+.row{border-top:1px solid var(--line-2)}
.row .n{flex:1;min-width:0}
.row .n b{display:block;font-size:16px;font-weight:620}
.row .n span{display:block;font-size:13px;color:var(--ink-3);margin-top:1px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;
  font-size:12px;font-weight:680;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.amber{background:var(--warn-bg);color:var(--warn)}
.pill.red{background:var(--bad-bg);color:var(--bad)}
.pill.grey{background:var(--canvas);color:var(--ink-3)}
.pill.info{background:var(--info-bg);color:var(--info)}
.sect{font-size:12px;font-weight:700;color:var(--ink-3);margin:26px 0 10px;
  text-transform:uppercase;letter-spacing:.09em}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:56px;
  border-radius:15px;background:var(--green);color:#fff;font-weight:660;font-size:16.5px;
  padding:0 18px;margin-bottom:10px}
.btn:active{background:var(--green-700)}
.btn[disabled]{background:#D3DAD5}
.btn.ghost{background:var(--canvas);color:var(--ink)}
.btn.line{background:none;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}
.btn.sm{min-height:44px;font-size:14.5px;width:auto;padding:0 16px;border-radius:12px}
.btn.danger{background:var(--bad)}

/* fields */
.f{margin-bottom:20px}
.f label{display:block;font-weight:650;font-size:15px;margin-bottom:7px}
.f .hint{font-size:13px;color:var(--ink-3);margin:-3px 0 8px;line-height:1.4}
.in{width:100%;min-height:54px;border:1.5px solid var(--line);border-radius:13px;padding:14px;
  background:#fff}
.in:focus{border-color:var(--green);outline:none}
textarea.in{min-height:110px;resize:vertical;line-height:1.5}
select.in{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' stroke='%238A948C' stroke-width='2'><path d='M5 8l5 5 5-5'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center}
.in.err{border-color:var(--bad);background:#FFFBFB}
.err-msg{color:var(--bad);font-size:13px;font-weight:600;margin-top:6px}
.seg{display:grid;grid-auto-flow:column;gap:10px}
.segb{min-height:56px;border:1.5px solid var(--line);border-radius:13px;background:#fff;
  font-weight:660;font-size:15.5px}
.segb.y{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.segb.n{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cg>*{min-width:0}
@media(max-width:360px){ .cg{grid-template-columns:1fr} }
.cb{display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 12px;
  border:1.5px solid var(--line);border-radius:13px;background:#fff;font-size:14.5px;
  font-weight:620;text-align:left;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.cb.on{border-color:var(--green);background:var(--green-50);color:var(--green-700)}
.cb .b{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;
  display:grid;place-items:center;background:#fff;font-size:13px}
.cb.on .b{background:var(--green);border-color:var(--green);color:#fff}
.rep{border:1.5px solid var(--line-2);border-radius:14px;padding:14px;background:var(--canvas);
  margin-bottom:10px}
.rep .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
  font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.rep .rm{color:var(--bad);font-weight:650;font-size:13px;text-transform:none;letter-spacing:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2>*{min-width:0}
.in{max-width:100%}
input[type=date].in,input[type=time].in,
.timegrid input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;
  display:block;text-align:left}
/* iOS ignores width on these unless the container is also constrained */
.f,.rep,.card{min-width:0}
@media(max-width:360px){ .g2{grid-template-columns:1fr} }

/* leave calendar */
.cal{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);padding:14px 12px 12px;
  margin-bottom:12px}
.calnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.calnav b{flex:1;text-align:center;font-size:16px;font-weight:660}
.calnav button{width:42px;height:42px;border-radius:12px;font-size:20px;color:var(--green);
  display:grid;place-items:center;flex:none}
.calnav button[disabled]{color:var(--line)}
.caldow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.caldow span{text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-3)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.calday{aspect-ratio:1;border-radius:11px;display:grid;align-content:center;justify-items:center;
  gap:3px;background:transparent;padding:2px}
.calday .dn{font-size:13.5px;font-weight:620;line-height:1}
.calday .dots{display:flex;gap:2px;height:6px;align-items:center;flex-wrap:wrap;
  justify-content:center;max-width:100%}
.calday .dots i{width:6px;height:6px;border-radius:50%;display:block}
.calday.out .dn{color:#D3DAD5}
.calday.we .dn{color:var(--ink-3)}
.calday.today{box-shadow:inset 0 0 0 1.5px var(--green)}
.calday.on{background:var(--green);}
.calday.on .dn{color:#fff}
.calday.on .dots i{box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.calkey{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2)}
.calkey span{display:inline-flex;align-items:center;gap:6px}
.calkey i{width:9px;height:9px;border-radius:50%;display:block}
.dayoff{background:var(--info-bg);border-radius:14px;padding:14px;margin-bottom:12px}
.dayoff h4{margin:0 0 8px;font-size:13.5px;font-weight:700;color:var(--info)}
.dayoff .who{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14.5px}
.dayoff .who i{width:9px;height:9px;border-radius:50%;flex:none}

/* project tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--paper);border-radius:20px;box-shadow:var(--sh);padding:16px;
  text-align:left;display:flex;flex-direction:column;justify-content:space-between;
  min-height:132px;position:relative;overflow:hidden}
.tile:active{transform:scale(.985)}
.tile .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--green-50);color:var(--green);flex:none}
.tile .tl{font-size:15.5px;font-weight:660;letter-spacing:-.01em;margin-top:12px;line-height:1.2}
.tile .tv{font-size:13px;color:var(--ink-3);margin-top:3px;line-height:1.3}
.tile .badge{position:absolute;top:14px;right:14px;min-width:24px;height:24px;padding:0 7px;
  border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:700}
.tile.amber{background:var(--warn-bg);box-shadow:none}
.tile.amber .ic{background:rgba(169,106,0,.13);color:var(--warn)}
.tile.amber .tl,.tile.amber .tv{color:var(--warn)}
.tile.amber .badge{background:var(--warn);color:#fff}
.tile.red{background:var(--bad-bg);box-shadow:none}
.tile.red .ic{background:rgba(167,43,34,.13);color:var(--bad)}
.tile.red .tl,.tile.red .tv{color:var(--bad)}
.tile.red .badge{background:var(--bad);color:#fff}
@media(min-width:760px){
  .tiles{grid-template-columns:repeat(3,1fr)}
  .tile{min-height:146px;padding:18px}
}

/* storage warning */
.savewarn{position:fixed;left:0;right:0;top:0;z-index:110;display:none;
  background:var(--bad);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  font-size:13.5px;line-height:1.4;text-align:center}
.savewarn.show{display:block}
.savewarn b{font-weight:700}
.savewarn button{margin-left:8px;background:rgba(255,255,255,.2);color:#fff;
  border-radius:8px;padding:5px 11px;font-size:13px;font-weight:640}

/* start-up screen */
.splash{position:fixed;inset:0;z-index:120;background:var(--paper);
  display:grid;place-items:center;
  transition:opacity .5s ease, transform .5s ease}
.splash.gone{opacity:0;transform:scale(1.04);pointer-events:none}
.sp-inner{display:grid;justify-items:center;gap:2px}
.sp-mark{position:relative;width:148px;height:148px;display:grid;place-items:center}
.sp-ring{position:absolute;inset:0;width:148px;height:148px;transform:rotate(-90deg)}
.sp-ring circle{fill:none;stroke-width:3;stroke-linecap:round}
.sp-ring .track{stroke:var(--line-2)}
.sp-ring .run{stroke:var(--green);stroke-dasharray:339.3;stroke-dashoffset:339.3;
  animation:spRing 4.6s cubic-bezier(.5,.05,.2,1) forwards}
@keyframes spRing{ to { stroke-dashoffset:0 } }
.sp-mark img{width:92px;height:auto;opacity:0;transform:scale(.86);
  animation:spLogo .9s cubic-bezier(.2,1.1,.3,1) .15s forwards}
@keyframes spLogo{ to { opacity:1; transform:scale(1) } }
.sp-name{margin-top:16px;font-size:21px;font-weight:700;letter-spacing:-.02em;
  display:flex;gap:.02em}
.sp-name span{opacity:0;transform:translateY(10px);
  animation:spChar .5s cubic-bezier(.2,1.2,.3,1) forwards}
.sp-name .sp-space{width:.3em}
@keyframes spChar{ to { opacity:1; transform:none } }
.sp-sub{font-size:13px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;
  opacity:0;animation:spFade .7s ease 1.5s forwards}
@keyframes spFade{ to { opacity:1 } }
.sp-skip{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));
  padding:10px 20px;border-radius:999px;font-size:14px;font-weight:640;color:var(--ink-3);
  background:var(--canvas);opacity:0;animation:spFade .4s ease 1.2s forwards}
@media (prefers-reduced-motion:reduce){
  .sp-ring .run,.sp-mark img,.sp-name span,.sp-sub,.sp-skip{animation:none;opacity:1;
    transform:none;stroke-dashoffset:0}
}

/* bottom navigation — frosted glass, brand green, sliding indicator */
.navpill{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:70;
  width:min(440px, calc(100% - 28px));
  display:grid;grid-template-columns:repeat(3,1fr);
  padding:7px;border-radius:999px;
  background:rgba(255,255,255,.66);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(31,90,45,.16);
  box-shadow:0 12px 34px -14px rgba(16,44,26,.5),
             0 2px 8px -4px rgba(16,44,26,.25),
             inset 0 1px 0 rgba(255,255,255,.75);
  transition:opacity .25s ease, transform .25s ease}
.navpill.hidden{opacity:0;pointer-events:none;transform:translate(-50%,20px)}
.navslide{position:absolute;top:7px;left:7px;height:calc(100% - 14px);
  width:calc((100% - 14px) / 3);border-radius:999px;
  background:linear-gradient(180deg,#2A7440 0%,var(--green) 55%,#194A26 100%);
  box-shadow:0 6px 14px -6px rgba(31,90,45,.75), inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform .38s cubic-bezier(.34,1.24,.42,1);
  will-change:transform;z-index:0}
.navpill button{position:relative;z-index:1;height:52px;border-radius:999px;
  display:grid;place-items:center;gap:3px;color:var(--green-700);
  transition:color .28s ease}
.navpill button.on{color:#fff}
.navpill button span{font-size:10.5px;font-weight:700;letter-spacing:.03em;line-height:1}
.navdot{position:absolute;top:5px;right:calc(50% - 17px);width:9px;height:9px;border-radius:50%;
  background:var(--bad);box-shadow:0 0 0 2.5px rgba(255,255,255,.92);
  opacity:0;transform:scale(.4);transition:opacity .25s ease, transform .25s cubic-bezier(.34,1.5,.5,1)}
.navpill button.on .navdot{box-shadow:0 0 0 2.5px rgba(26,72,40,.95)}
.navdot.show{opacity:1;transform:scale(1)}
@media (prefers-reduced-motion:no-preference){
  .navdot.show{animation:dotPulse 2.4s ease-in-out 1.2s infinite}
}
@keyframes dotPulse{
  0%,72%,100%{box-shadow:0 0 0 2.5px rgba(255,255,255,.92), 0 0 0 0 rgba(167,43,34,.5)}
  84%{box-shadow:0 0 0 2.5px rgba(255,255,255,.92), 0 0 0 6px rgba(167,43,34,0)}
}
.navpill button svg{transition:transform .28s ease}
.navpill button.on svg{transform:translateY(-1px)}
@media(min-width:760px){
  .navpill{width:420px;bottom:24px}
  .navpill button{height:56px}
}
@media (prefers-reduced-motion:reduce){
  .navslide{transition:none}
}

/* timesheet */
.tstotal{background:var(--green-50);border-radius:var(--r);padding:18px 20px;margin-bottom:12px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.tstotal .big{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1;
  color:var(--green-700);font-variant-numeric:tabular-nums}
.tstotal .lab{font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:4px}
.tstotal .side{text-align:right;font-size:13px;color:var(--ink-2);font-weight:600}

.tsperson{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);
  padding:14px 14px 12px;margin-bottom:10px}
.tshead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin-bottom:10px}
.tshead .nm{font-size:16px;font-weight:650;letter-spacing:-.01em;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tshead .tr{font-size:12.5px;color:var(--ink-3);font-weight:500;display:block}
.tshead .tot{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.tshead .tot span{font-size:12px;color:var(--ink-3);font-weight:600}

.tsdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.tsday{display:grid;gap:3px;justify-items:center;padding:8px 1px;border-radius:11px;
  background:var(--canvas)}
.tsday .dl{font-size:9.5px;font-weight:700;color:var(--ink-3);letter-spacing:.03em}
.tsday .dv{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tsday.none{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
.tsday.none .dv{color:#C3CCC6}
.tsday.norm .dv{color:var(--ink)}
.tsday.extra{background:var(--warn-bg)} .tsday.extra .dv{color:var(--warn)}
.tsday.hol{background:var(--info-bg)} .tsday.hol .dv{color:var(--info);font-size:11px}
.tsday.we .dl{color:#C3CCC6}
.tskey{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-3);
  padding:2px 4px 0}
.tskey i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;
  vertical-align:-1px}

/* HAVs read-outs */
.havsbox{border-radius:13px;padding:12px 14px;background:var(--canvas);
  border:1.5px solid var(--line-2)}
.havsbox.amber{background:var(--warn-bg);border-color:#EBD6B4}
.havsbox.red{background:var(--bad-bg);border-color:#EBC7C3}
.havsbox .hrow{display:flex;justify-content:space-between;align-items:baseline;
  padding:4px 0;font-size:13.5px;color:var(--ink-2)}
.havsbox .hrow b{font-size:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.havsbox .hstat{margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,.08);
  font-size:13px;font-weight:660}
.havsbox.ok .hstat{color:var(--ok)}
.havsbox.amber .hstat{color:var(--warn)}
.havsbox.red .hstat{color:var(--bad)}
.hbarwrap{position:relative;height:7px;border-radius:4px;background:var(--line-2);
  margin-top:10px;overflow:visible}
.hbarwrap i{display:block;height:100%;border-radius:4px}
.hbarwrap em{position:absolute;top:-3px;width:2px;height:13px;background:var(--ink-3);
  opacity:.5;transform:translateX(-1px)}

/* yes / no / na check rows */
.chk{border:1.5px solid var(--line-2);border-radius:14px;padding:12px;margin-bottom:8px;
  background:#fff}
.chk.bad{border-color:var(--bad);background:#FFFBFB}
.chk .lab{font-size:15px;font-weight:600;line-height:1.3;margin-bottom:10px;display:block}
.chk .opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.chk .opts button{min-height:46px;border:1.5px solid var(--line);border-radius:11px;
  background:#fff;font-size:14.5px;font-weight:660}
.chk .opts button.y{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.chk .opts button.n{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.chk .opts button.na{background:var(--canvas);border-color:var(--ink-3);color:var(--ink-2)}
.chk .fix{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}

/* diary tables */
.ttable{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.thead{display:flex;gap:8px;padding:9px 12px;background:var(--canvas);font-size:11px;
  font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.thead .c1{flex:1;min-width:0} .thead .c2{display:none;width:92px}
.thead .c3{width:104px;text-align:center;flex:none}
@media(min-width:430px){ .thead .c2{display:block;flex:none} }
.trow{padding:11px 12px}
.trow+.trow{border-top:1px solid var(--line-2)}
.trow .main{display:flex;gap:8px;align-items:center}
.trow .c1{flex:1;min-width:0}
.trow .c1 b{display:block;font-size:15px;font-weight:620;line-height:1.25}
.trow .c1 span{display:block;font-size:12.5px;color:var(--ink-3)}
.trow .c2{display:none;width:92px;font-size:13px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;flex:none}
.trow .subfleet{display:block;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
@media(min-width:430px){
  .trow .c2{display:block}
  .trow .subfleet{display:none}
}
.trow .yn{width:104px;display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:none}
.yn button{min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;
  font-size:13.5px;font-weight:660}
.yn button.y{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.yn button.n{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.trow .more{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.trow .lbl{font-size:12.5px;font-weight:640;color:var(--ink-2);margin-bottom:6px;display:block}
.timegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}
.timegrid>*{min-width:0}
.timegrid .calc{grid-column:1/-1;text-align:right}
@media(min-width:430px){
  .timegrid{grid-template-columns:1fr 1fr auto}
  .timegrid .calc{grid-column:auto;text-align:left}
}
.timegrid input{min-height:46px;border:1.5px solid var(--line);border-radius:11px;padding:0 10px;
  background:#fff;width:100%}
.timegrid .calc{font-size:13px;font-weight:700;color:var(--green);white-space:nowrap}
.tempty{padding:16px 12px;color:var(--ink-3);font-size:14px}

/* photos */
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--canvas)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:9px;
  background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}


/* progress */
.bar{height:7px;border-radius:4px;background:var(--line-2);overflow:hidden;display:block;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.kv{display:flex;gap:12px;padding:9px 0;font-size:14px}
.kv+.kv{border-top:1px solid var(--line-2)}
.kv{flex-wrap:wrap}
.kv .k{color:var(--ink-2);flex:0 0 42%;min-width:120px}
.kv .v{font-weight:620;flex:1;text-align:right;min-width:0;overflow-wrap:anywhere}

/* signing */
.sigbtn{width:100%;border:1.5px dashed var(--line);border-radius:13px;background:#fff;
  min-height:104px;display:grid;place-items:center;gap:6px;color:var(--ink-3);
  font-size:14.5px;font-weight:620;padding:12px}
.sigbtn.signed{border-style:solid;border-color:var(--ok);background:#fff}
.sigbtn img{max-height:70px;max-width:100%}
.sigbtn .done{color:var(--ok);font-size:13px;font-weight:650}
.sigpad{display:block;width:100%;height:230px;background:#fff;border:1.5px solid var(--line);
  border-radius:13px;touch-action:none;overscroll-behavior:contain;cursor:crosshair}
.sigline{position:relative;margin-top:-46px;margin-bottom:14px;padding:0 18px;
  pointer-events:none;color:var(--ink-3);font-size:12.5px}
.sigline::before{content:"";display:block;border-top:1px solid var(--line);margin-bottom:6px}

/* scanner */
.scanwrap{position:fixed;inset:0;background:#0D1711;z-index:97;display:flex;flex-direction:column}
.scanbar{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  color:#fff}
.scanbar .t{flex:1;text-align:center;font-size:14px;font-weight:600;color:rgba(255,255,255,.8)}
.scanbar button{background:rgba(255,255,255,.16);color:#fff;border-radius:11px;padding:9px 15px;
  font-size:14.5px;font-weight:650}
.scanbar [data-save]{background:var(--green);}
.scanstage{flex:1;display:grid;place-items:center;min-height:0;padding:12px}
.scanstage canvas{touch-action:none;max-width:100%;max-height:100%;border-radius:6px}
.scanstage .scanshot{max-width:100%;max-height:100%;border-radius:6px;
  box-shadow:0 10px 30px -12px rgba(0,0,0,.8);background:#fff}
.scanfoot{display:flex;gap:10px;padding:12px 16px calc(20px + env(safe-area-inset-bottom));
  justify-content:center}
.scanfoot .btn{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}

/* photo viewer */
.lightbox{position:fixed;inset:0;background:#0A140E;z-index:96;display:flex;flex-direction:column}
.lightbox .lbtop{display:flex;align-items:center;justify-content:flex-end;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
.lightbox .lbtop button{background:rgba(255,255,255,.16);color:#fff;border-radius:12px;
  padding:10px 16px;font-size:15px;font-weight:640}
.lightbox .lbimg{flex:1;display:grid;place-items:center;padding:0 10px;min-height:0}
.lightbox .lbimg img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lightbox .lbfoot{padding:16px 20px calc(24px + env(safe-area-inset-bottom));
  color:rgba(255,255,255,.7);font-size:13.5px;text-align:center}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(12,22,15,.45);z-index:95;display:flex;
  align-items:flex-end;justify-content:center}
@media(min-width:700px){.scrim{align-items:center}}
.dlg{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:700px){.dlg{border-radius:18px}}
.dlg h3{margin:0 0 6px;font-size:19px;font-weight:660;letter-spacing:-.02em}
.dlg p{margin:0 0 18px;color:var(--ink-2);font-size:14.5px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:90;background:#16261C;
  color:#fff;padding:12px 18px;border-radius:12px;font-size:14.5px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw}

/* PDF preview — on screen first, then print or save */
.sheetwrap{position:fixed;inset:0;background:#39413C;z-index:80;overflow:auto;display:none}
.sheetwrap.open{display:block}
.sheetbar{position:sticky;top:0;z-index:2;background:var(--green);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;gap:10px;align-items:center}
.sheetbar .t{flex:1;font-size:14.5px;font-weight:640}
.sheetbar button{background:rgba(255,255,255,.16);color:#fff;border-radius:10px;
  padding:9px 14px;font-size:14px;font-weight:640}
.sheet{background:#fff;width:min(794px,100%);margin:14px auto 40px;padding:28px 30px;color:#111;
  font-size:12px;line-height:1.5}
.sheet h1{font-size:19px;margin:0}
.sheet .ph-head{display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:2.5px solid #1F5A2D;padding-bottom:9px;margin-bottom:14px;gap:14px}
.sheet .ph-head img{width:150px;height:auto}
.pk-page{padding-bottom:26px;margin-bottom:26px;border-bottom:2px dashed #CFD6D1}
.pk-page:last-child{border-bottom:0;margin-bottom:0}
.pk-cover{text-align:center;padding:40px 0 30px}
.pk-cover h1{font-size:26px;margin:18px 0 6px;letter-spacing:-.02em}
.pk-cover .wc{font-size:15px;color:#555;margin-bottom:22px}
.pk-draft{display:inline-block;border:2px solid #A72B22;color:#A72B22;font-weight:700;
  padding:7px 14px;border-radius:4px;margin-bottom:16px;letter-spacing:.04em}
.pk-h{background:#1F5A2D;color:#fff;font-weight:700;font-size:11px;padding:6px 9px;
  margin:14px 0 6px;border-radius:2px}
.sheet table.pk{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:10.5px}
.sheet table.pk.fixed{table-layout:fixed}
.sheet table.pk.fixed th,.sheet table.pk.fixed td{overflow-wrap:anywhere}
.sheet table.pk th{background:#EEF3EF;text-align:left;font-weight:700;padding:5px 7px;
  border:1px solid #C9D2CC}
.sheet table.pk td{padding:5px 7px;border:1px solid #D8DFDA;vertical-align:top}
.sheet table.pk td.c{text-align:center}
.sheet table.pk td.bad{color:#A72B22;font-weight:700}
.sheet .pk-sig{height:46px}
.sheet h2{font-size:11.5px;background:#1F5A2D;color:#fff;padding:5px 9px;margin:15px 0 8px;
  border-radius:3px;font-weight:650}
.sheet table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:8px;
  display:table;white-space:normal;overflow:visible}
.sheet th,.sheet td{border:1px solid #CBD3CD;padding:5px 7px;text-align:left;vertical-align:top}
.sheet th{background:#EDF2EE;width:32%;font-weight:640}
.sheet .imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .imgs img{width:100%;border:1px solid #CBD3CD}
.sheet .foot{margin-top:20px;padding-top:8px;border-top:1px solid #CBD3CD;color:#666;
  font-size:10px;display:flex;justify-content:space-between}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  /* Nothing belonging to the app itself goes on the paper: the navigation, the
     splash, messages and any overlay all live outside the page container. */
  .app, .navpill, .splash, .savewarn, .toast, .scrim, .sigwrap, .scanwrap,
  .lightbox, .photoview, .dlg{display:none!important}
  .sheetwrap{position:static;display:block!important;background:#fff;overflow:visible}
  .pk-page{page-break-after:always;break-after:page}
  .pk-page:last-child{page-break-after:auto;break-after:auto}
  .sheetbar{display:none!important}
  .sheet{width:auto;margin:0;padding:0}
}
</style>
</head>

<div class="splash" id="splash" aria-hidden="true">
  <div class="sp-inner">
    <div class="sp-mark">
      <svg class="sp-ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="54"></circle>
        <circle class="run" cx="60" cy="60" r="54"></circle>
      </svg>
      <img id="splashLogo" alt="">
    </div>
    <div class="sp-name" id="splashName"></div>
    <div class="sp-sub">Site records</div>

</div>

<div class="savewarn" id="savewarn">

</div>

<div class="app" id="app"></div>

<nav class="navpill" id="navpill" aria-label="Sections">

    <span class="t" id="sheetTitle">Daily Diary</span>
    <button id="sheetPrint">Print / Save PDF</button>
  </div>
  <div class="sheet" id="sheet"></div>
</div>

const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");

/* Has a weekly check already been done for this machine this week? */
function weeklyDone(date, plantId){
  const wc = weekStart(date);
  return DB.records.some(r => r.form==="plantcheck" && r.plantId===plantId
    && r.status==="submitted" && weekStart(r.date)===wc && r.data && r.data.__weekly===true);
}

function machineType(plantId){
  const m = (DB.plant||[]).find(x=>x.id===plantId);
  return (m && m.type) || "Excavator";
}
function plantCheckSections(){
  const date = formState ? formState.date : todayISO();
  const pid = formState ? formState.plantId : null;
  const sheet = sheetFor(machineType(pid)) || CHECKSHEETS.Excavator;
  const showWeekly = !weeklyDone(date, pid) || (formState && formState.values.__weekly===true);

  const secs = [
    { title:"Daily pre-use checks",
      fields: sheet.daily.map(t=>({ id:"d_"+slug(t), type:"check", label:t, required:true })) }
  ];
  if(showWeekly && sheet.weekly.length){
    secs.push({ title:"Weekly checks", note:"Due once a week for this machine.",
      fields: sheet.weekly.map(t=>({ id:"w_"+slug(t), type:"check", label:t, required:true })) });

/* ------------------------------------------------------------ HAVs maths --
   Control of Vibration at Work Regulations 2005, using the HSE points system.
     points per hour = 2 x a^2          (a = vibration magnitude, m/s^2)
     EAV  2.5 m/s^2 A(8) = 100 points
     ELV  5.0 m/s^2 A(8) = 400 points
     A(8) = 2.5 x sqrt(points / 100)
     time to a value = 8 x (value / a)^2 hours
   -------------------------------------------------------------------------*/
const HAVS_EAV = 100, HAVS_ELV = 400;

const durHours = v => {
  if(v===undefined||v===null||v==="") return 0;
  if(typeof v==="number") return v;
  return (Number(v.h)||0) + (Number(v.m)||0)/60;
};
function havsPoints(a, hours){
  a = Number(a)||0;
  return Math.round(2 * a * a * hours);
}
function havsTimeTo(a, value){          /* hours until that exposure value */
  a = Number(a)||0;
  if(a <= 0) return null;
  return 8 * Math.pow(value / a, 2);
}
function havsA8(points){
  return Math.round(2.5 * Math.sqrt(Math.max(0,points) / 100) * 100) / 100;
}
function hoursText(h){
  if(h===null||h===undefined) return "—";
  if(h >= 24) return "over a day";
  const m = Math.round(h * 60);
  const hh = Math.floor(m / 60), mm = m % 60;
  if(!hh) return mm + " min";
  return hh + " hr" + (hh===1?"":"s") + (mm ? " " + mm + " min" : "");
}
function havsStatus(points){
  if(points >= HAVS_ELV) return { key:"elv", label:"Over the exposure limit value", cls:"red" };
  if(points >= HAVS_EAV) return { key:"eav", label:"Over the exposure action value", cls:"amber" };
  return { key:"ok", label:"Below the action value", cls:"ok" };
}
/* Totals per operative for a day's entries. */
function havsTotals(entries){
  const by = {};
  (entries||[]).forEach(e=>{
    if(!e || !e.operative) return;
    const pts = havsPoints(e.magnitude, durHours(e.triggerTime));
    if(!by[e.operative]) by[e.operative] = { name:e.operative, points:0, tools:0 };
    by[e.operative].points += pts;
    by[e.operative].tools += 1;
  });
  return Object.values(by).map(x=>Object.assign(x, {
    a8: havsA8(x.points), status: havsStatus(x.points)
  })).sort((a,b)=>b.points-a.points);
}

/* -------------------------------------------------------------- storage -- */
const KEY = "cgc.diary.v1";

/* ------------------------------------------------------------- storage --
   localStorage is capped at about 5MB, which a few scanned certificates will
   fill. IndexedDB is measured in gigabytes, so the store lives there and
   localStorage is only used to carry across anything saved before.
   -------------------------------------------------------------------------*/
const IDB_NAME = "cgc-sitehub", IDB_STORE = "app";

function idb(){
  return new Promise((res, rej)=>{
    if(!self.indexedDB){ rej(new Error("no indexeddb")); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function idbGet(key){
  return idb().then(db => new Promise((res, rej)=>{
    const tx = db.transaction(IDB_STORE, "readonly");
    const rq = tx.objectStore(IDB_STORE).get(key);
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  }));
}
function idbSet(key, value){
  return idb().then(db => new Promise((res, rej)=>{
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error("aborted"));
  }));
}

function blankDB(){
  return { records:[], counter:0, config:JSON.parse(JSON.stringify(CONFIG)),
    job:CONFIG.jobs[0], plant:[], labour:[], lifting:[], tools:[], leave:[], vos:[], packs:[] };
}

/* Read what is there: IndexedDB first, then anything left in localStorage from
   before the change, then a fresh start. */
async function loadDB(){
  try{
    const fromIdb = await idbGet(KEY);
    if(fromIdb) return fromIdb;
  }catch(e){ /* fall through to the old store */ }
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const old = JSON.parse(raw);
      old.__movedFromLocalStorage = true;
      return old;
    }
  }catch(e){}
  return blankDB();
}

let DB = blankDB();


let saveFailed = false, savePending = null;

function warnBanner(on){
  const b = document.getElementById("savewarn");
  if(b) b.classList.toggle("show", !!on);
}

/* Writes are batched so a burst of typing is one write, and flushed the moment
   the app is put into the background. */
function save(){
  clearTimeout(savePending);
  savePending = setTimeout(flushSave, 250);
  return true;
}

function flushSave(){
  clearTimeout(savePending);
  savePending = null;
  const snapshot = JSON.parse(JSON.stringify(DB));
  delete snapshot.__movedFromLocalStorage;
  return idbSet(KEY, snapshot)
    .then(()=>{
      if(saveFailed){ saveFailed = false; warnBanner(false); }
      /* once it is safely in the new store, the old one can be let go */
      if(DB.__movedFromLocalStorage){
        try{ localStorage.removeItem(KEY); }catch(e){}
        delete DB.__movedFromLocalStorage;
      }
      return true;
    })
    .catch(()=>{
      /* fall back to the old store rather than lose the work outright */
      try{
        localStorage.setItem(KEY, JSON.stringify(DB));
        return true;
      }catch(e){
        saveFailed = true;
        warnBanner(true);
        toast("Not saved — storage is full. Open Profile.");
        return false;
      }
    });
}

/* The browser will tell us how much room there is, but only asynchronously,
   so the answer is kept here for the next time the screen is drawn. */
let quotaBytes = 0, quotaUsed = 0;
function refreshQuota(){
  if(!(navigator.storage && navigator.storage.estimate)) return Promise.resolve();
  return navigator.storage.estimate().then(est=>{
    quotaBytes = est.quota || 0;
    quotaUsed = est.usage || 0;
  }).catch(()=>{});
}

/* How much room is left, and what is taking it up. */
function storageInfo(){
  const json = JSON.stringify(DB);
  const bytes = json.length;
  let photos = 0, photoBytes = 0;
  const walk = v => {
    if(!v) return;
    if(typeof v === "string"){
      if(v.startsWith("data:image")){ photos++; photoBytes += v.length; }
      return;
    }
    if(Array.isArray(v)) return v.forEach(walk);
    if(typeof v === "object") return Object.values(v).forEach(walk);
  };
  walk(DB);
  /* the real allowance, once the browser has told us; a cautious guess until */
  const cap = quotaBytes || (2 * 1024 * 1024 * 1024);
  return { bytes, photos, photoBytes, cap, known: !!quotaBytes,
    pct: Math.min(100, Math.round(bytes/cap*100)) };
}

const kb = n => n < 1024*1024 ? Math.round(n/1024) + " KB"
  : n < 1024*1024*1024 ? Math.round(n/1024/1024) + " MB"
  : (Math.round(n/1024/1024/1024*10)/10) + " GB";

/* Strip photographs off anything older than the given date, keeping the words.
   The records stay; only the images go. */
function reclaimSpace(before){
  let removed = 0;
  /* Take the image out and the thing holding it goes too, so nothing is left
     rendering an empty frame. */
  const strip = v => {
    if(!v || typeof v !== "object") return v;
    if(Array.isArray(v)) return v.map(strip).filter(x => !(x && x.__gone));
    Object.keys(v).forEach(k=>{
      const val = v[k];
      if(typeof val === "string" && val.startsWith("data:image")){
        delete v[k]; removed++;
        if(k === "src") v.__gone = true;
      } else {
        v[k] = strip(val);
        if(v[k] && v[k].__gone) delete v[k];
      }
    });
    return v;
  };
  (DB.records||[]).forEach(r=>{ if(r.date < before) strip(r.data); });
  (DB.defects||[]).forEach(d=>{ if(d.date < before){ 
    if((d.photos||[]).length){ removed += d.photos.length; d.photos = []; }
    if((d.fixPhotos||[]).length){ removed += d.fixPhotos.length; d.fixPhotos = []; }
  }});
  save();
  return removed;
}

/* ---------------------------------------------------------------- dates -- */
const iso = d => { const x=new Date(d);
  return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const todayISO = () => iso(new Date());
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const DAYL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const longDate = s => { const d=parse(s); return DAYL[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear(); };
const shortDate = s => { const d=parse(s);
  return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); };
const stamp = t => { const d=new Date(t);
  return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()
    +" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
const timeOnly = t => { const d=new Date(t);
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
function weekStart(s){ const d=parse(s); const n=(d.getDay()+6)%7; d.setDate(d.getDate()-n); return iso(d); }
function weekDays(ws){ const out=[]; for(let i=0;i<7;i++) out.push(addDays(ws,i)); return out; }
const isWorking = s => cfg().workingDays.includes(parse(s).getDay());
const initials = n => n.split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase();

/* ------------------------------------------------------------ diary state --
   Status rules you set:
     today          -> due (grey)
     yesterday      -> amber
     older than that-> red
   Weekends are never chased; a diary can still be created on one.
   -------------------------------------------------------------------------*/
function recordFor(date, job){
  return DB.records.find(r => r.date===date && r.job===(job||DB.job) && (r.form||"diary")==="diary");
}
function checksFor(date){
  return DB.records.filter(r => r.date===date && r.job===DB.job && r.form==="plantcheck");
}
function checkFor(date, plantId){
  return checksFor(date).find(r => r.plantId===plantId) || null;
}
/* A form is only chased from the day it was first used, so switching one on
   does not suddenly report a month of missing paperwork. */
function firstUsed(formKey){
  const dates = DB.records
    .filter(r=>r.form===formKey && r.job===DB.job && r.status==="submitted")
    .map(r=>r.date).sort();
  return dates.length ? dates[0] : null;
}

/* Everything a working day owes: the diary, the briefing, a check for each
   machine on site, and an inspection for anything left open the day before. */
function dayOutstanding(date){
  const out = [];
  if(!isWorking(date) || !inScope(date) || date > todayISO()) return out;

  const diary = recordFor(date);
  if(!diary || diary.status!=="submitted") out.push("Site diary");

  const briefFrom = firstUsed("briefing");
  if(briefFrom && date >= briefFrom){
    const brief = dailyRecordFor("briefing", date);
    if(!brief || brief.status!=="submitted") out.push("Daily activities briefing");
  }

  const checkFrom = firstUsed("plantcheck");
  if(checkFrom && date >= checkFrom){
    plantNeedingCheck(date).forEach(m=>{
      const c = checkFor(date, m.id);
      if(!c || c.status!=="submitted")
        out.push((m.item||"Machine") + (m.fleetNo ? " ("+m.fleetNo+")" : "") + " inspection");
    });
  }

  excavationsDue(date).forEach(x=>{
    const e = excFor(date, x.ref);
    if(!e || e.status!=="submitted") out.push("Excavation inspection — " + x.ref);
  });

  return out;
}

function statusFor(date){
  const t = todayISO();
  const rec = recordFor(date);
  if(date > t) return "future";
  if(!inScope(date)) return "none";     /* before the app started */
  if(!isWorking(date)) return rec ? (rec.status==="submitted"?"done":"draft") : "none";

  const owed = dayOutstanding(date);
  if(!owed.length) return "done";
  if(date === t) return (rec || owed.length < 2) ? "draft" : "due";
  if(date === prevWorking(t)) return "amber";
  return "red";
}
function prevWorking(s){ let d=addDays(s,-1); let i=0; while(!isWorking(d) && i++<10) d=addDays(d,-1); return d; }
/* Only chase from the day the app started being used. Anything before that was
   kept on paper and is none of its business. */
function startDate(){ return DB.startDate || todayISO(); }
function inScope(d){ return d >= startDate(); }

function missedDays(){
  const t = todayISO(), out=[];
  let d = addDays(t,-1);
  for(let i=0;i<60;i++){
    if(!inScope(d)) break;
    if(isWorking(d)){
      const owed = dayOutstanding(d);
      if(owed.length) out.push({ date:d, owed, level: d===prevWorking(t) ? "amber":"red" });
    }
    d = addDays(d,-1);
  }
  return out;
}

/* ------------------------------------------------------- plant register -- */
/* Kept once, on the job. Every new diary is pre-loaded with whatever is on
   site that day, so the diary only ever asks for hours. */
/* Was this item on site on a given day? Inclusive of the day it left, since it
   was working that morning — this feeds the diary. */
/* On site on a given day. The day a machine is taken off is the day it stops
   appearing — on the diary, on the checks and in the pack alike. */
function onSitePlant(date){
  const d = date || todayISO();
  return (DB.plant||[]).filter(p => p.job===DB.job
    && (!p.onDate || p.onDate<=d) && (!p.offDate || p.offDate > d));
}
/* Is it on site now? Off hired today counts as gone — this drives the register. */
function plantNeedingCheck(date){ return onSitePlant(date); }

function currentPlant(){
  const t = todayISO();
  return (DB.plant||[]).filter(p => p.job===DB.job && (!p.offDate || p.offDate>t));
}
/* Thorough examination — LOLER for anything that lifts, PUWER for the rest, so
   the register just calls it what it is. Warns a month out. */
function examDateOf(p){ return p.examDate || p.lolerDate || ""; }
function lolerState(p){
  const dt = examDateOf(p);
  if(!dt) return { key:"none", label:"No examination date", cls:"grey" };
  const days = Math.round((parse(dt) - parse(todayISO())) / 86400000);
  if(days < 0) return { key:"expired", label:"Thorough examination overdue — "+shortDate(dt), cls:"red", days };
  if(days <= 30) return { key:"soon", label:"Thorough examination due in "+days+" day"+(days===1?"":"s"), cls:"amber", days };
  return { key:"ok", label:"Thorough examination due "+shortDate(dt), cls:"ok", days };
}
function lolerAlerts(){
  return currentPlant().map(p=>({p, st:lolerState(p)}))
    .filter(x=>x.st.key==="expired" || x.st.key==="soon");
}


/* ------------------------------------------------------------ PDF writer --
   A small PDF generator so reports can be shared as a file rather than only
   printed. No libraries — PDF is a text format, and the photographs are JPEG
   already, so they drop straight in.
   -------------------------------------------------------------------------*/
function PdfDoc(){
  this.pages = [];          /* { ops:[], images:[] } */
  this.page = null;
  this.newPage();
}
PdfDoc.M = 42;              /* margin, points */
PdfDoc.W = 595; PdfDoc.H = 842;

PdfDoc.prototype.newPage = function(){
  this.page = { ops: [], images: [] };
  this.pages.push(this.page);
  this.y = PdfDoc.H - PdfDoc.M;
  return this.page;
};
PdfDoc.prototype.room = function(h){
  if(this.y - h < PdfDoc.M){ this.newPage(); return true; }
  return false;
};
function pdfEsc(t){ return String(t==null?"":t).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)"); }
/* Helvetica is close enough to half the point size per character for wrapping */
function pdfWidth(t, size){ return String(t).length * size * 0.5; }

PdfDoc.prototype.text = function(t, opts){
  opts = opts || {};
  const size = opts.size || 10.5;
  const bold = !!opts.bold;
  const x = PdfDoc.M + (opts.indent || 0);
  const maxW = (opts.width || (PdfDoc.W - PdfDoc.M*2)) - (opts.indent||0);
  const words = String(t==null?"":t).split(/\s+/);
  const lines = [];
  let line = "";
  words.forEach(w=>{
    const test = line ? line+" "+w : w;
    if(pdfWidth(test,size) > maxW && line){ lines.push(line); line = w; }
    else line = test;
  });
  if(line) lines.push(line);
  lines.forEach(l=>{
    this.room(size + 4);
    const col = opts.colour || [0,0,0];
    this.page.ops.push(
      `BT ${col[0]} ${col[1]} ${col[2]} rg /${bold?"F2":"F1"} ${size} Tf 1 0 0 1 ${x.toFixed(1)} ${(this.y-size).toFixed(1)} Tm (${pdfEsc(l)}) Tj ET`);
    this.y -= size + (opts.lead || 3.5);
  });
  if(opts.after) this.y -= opts.after;
};
PdfDoc.prototype.heading = function(t){
  this.room(26);
  this.y -= 6;
  this.page.ops.push(`0.12 0.35 0.18 rg ${PdfDoc.M} ${(this.y-14).toFixed(1)} ${(PdfDoc.W-PdfDoc.M*2).toFixed(1)} 16 re f`);
  this.page.ops.push(`BT 1 1 1 rg /F2 10 Tf 1 0 0 1 ${(PdfDoc.M+6)} ${(this.y-10.5).toFixed(1)} Tm (${pdfEsc(t)}) Tj ET`);
  this.y -= 24;
};
PdfDoc.prototype.rule = function(){
  this.room(8);
  this.page.ops.push(`0.8 0.83 0.81 RG 0.7 w ${PdfDoc.M} ${this.y.toFixed(1)} m ${(PdfDoc.W-PdfDoc.M).toFixed(1)} ${this.y.toFixed(1)} l S`);
  this.y -= 8;
};
PdfDoc.prototype.pair = function(k, v, colour){
  const size = 10.5;
  this.room(size+6);
  const kx = PdfDoc.M, vx = PdfDoc.M + 150;
  this.page.ops.push(`BT 0.35 0.39 0.36 rg /F1 ${size} Tf 1 0 0 1 ${kx} ${(this.y-size).toFixed(1)} Tm (${pdfEsc(k)}) Tj ET`);
  const col = colour || [0,0,0];
  const wrapped = [];
  let line = "";
  String(v==null?"":v).split(/\s+/).forEach(w=>{
    const t = line?line+" "+w:w;
    if(pdfWidth(t,size) > (PdfDoc.W - PdfDoc.M - vx) && line){ wrapped.push(line); line=w; } else line=t;
  });
  if(line) wrapped.push(line);
  wrapped.forEach((l,i)=>{
    if(i) this.room(size+4);
    this.page.ops.push(`BT ${col[0]} ${col[1]} ${col[2]} rg /F2 ${size} Tf 1 0 0 1 ${vx} ${(this.y-size).toFixed(1)} Tm (${pdfEsc(l)}) Tj ET`);
    if(i < wrapped.length-1) this.y -= size + 3;
  });
  this.y -= size + 6;
};
PdfDoc.prototype.banner = function(t){
  this.room(30);
  this.page.ops.push(`0.65 0.17 0.13 rg ${PdfDoc.M} ${(this.y-20).toFixed(1)} ${(PdfDoc.W-PdfDoc.M*2).toFixed(1)} 22 re f`);
  this.page.ops.push(`BT 1 1 1 rg /F2 11 Tf 1 0 0 1 ${(PdfDoc.M+8)} ${(this.y-14.5).toFixed(1)} Tm (${pdfEsc(t)}) Tj ET`);
  this.y -= 32;
};
/* A plain table: column widths in points, rows of strings. */
PdfDoc.prototype.table = function(cols, rows, opts){
  opts = opts || {};
  const size = opts.size || 8.5;
  const pad = opts.pad === undefined ? 3 : opts.pad;
  const rowH = size + pad*2 + 1;
  const total = cols.reduce((a,b)=>a+b,0);
  rows.forEach((row, ri)=>{
    if(this.room(rowH + 2)){
      /* carried onto a new page — repeat the header */
      if(opts.header && ri>0) this.table(cols, [rows[0]], { size, header:true, align:opts.align });
    }
    const top = this.y;
    const head = opts.header && ri===0;
    if(head){
      this.page.ops.push(`0.93 0.95 0.93 rg ${PdfDoc.M} ${(top-rowH).toFixed(1)} ${total} ${rowH} re f`);
    }
    let x = PdfDoc.M;
    row.forEach((cell, ci)=>{
      const w = cols[ci];
      const txt = String(cell==null?"":cell);
      const al = (opts.align && opts.align[ci]) || "left";
      const tw = pdfWidth(txt, size);
      let tx = x + pad;
      if(al==="center") tx = x + (w - tw)/2;
      if(al==="right")  tx = x + w - tw - pad;
      const col = (opts.colour && opts.colour(ri, ci, txt)) || [0,0,0];
      this.page.ops.push(
        `BT ${col[0]} ${col[1]} ${col[2]} rg /${head?"F2":"F1"} ${size} Tf 1 0 0 1 ${tx.toFixed(1)} ${(top-size-pad).toFixed(1)} Tm (${pdfEsc(txt)}) Tj ET`);
      x += w;
    });
    this.page.ops.push(`0.82 0.85 0.83 RG 0.5 w ${PdfDoc.M} ${(top-rowH).toFixed(1)} m ${(PdfDoc.M+total).toFixed(1)} ${(top-rowH).toFixed(1)} l S`);
    this.y -= rowH;
  });
  this.y -= 6;
};

PdfDoc.prototype.image = function(img, maxW){
  const w = Math.min(maxW || 240, img.w);
  const h = w * (img.h / img.w);
  this.room(h + 10);
  const name = "Im" + (this.page.images.length + 1);
  this.page.images.push(Object.assign({ name }, img));
  this.page.ops.push(`q ${w.toFixed(1)} 0 0 ${h.toFixed(1)} ${PdfDoc.M} ${(this.y-h).toFixed(1)} cm /${name} Do Q`);
  this.y -= h + 8;
  return h;
};

/* JPEG bytes and dimensions, via a canvas so PNGs work too */
function jpegFromDataUrl(src, maxPx){
  return new Promise((res, rej)=>{
    const im = new Image();
    im.onerror = () => rej(new Error("image"));
    im.onload = () => {
      const sc = Math.min(1, (maxPx||900) / Math.max(im.width, im.height));
      const cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(im.width*sc));
      cv.height = Math.max(1, Math.round(im.height*sc));
      const g = cv.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0,0,cv.width,cv.height);
      g.drawImage(im, 0, 0, cv.width, cv.height);
      const b64 = cv.toDataURL("image/jpeg", 0.75).split(",")[1];
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
      res({ bytes, w: cv.width, h: cv.height });
    };
    im.src = src;
  });
}

/* Every sheet in the pack opens the same way: logo left, title right, then a
   header table. */
PdfDoc.prototype.sheetHead = function(logo, title, code, meta){
  if(logo){ this.image(logo, 118); this.y += 8; }
  const top = this.y + (logo ? 46 : 0);
  this.page.ops.push(
    `BT 0 0 0 rg /F2 14 Tf 1 0 0 1 ${PdfDoc.M} ${top.toFixed(1)} Tm (${pdfEsc(title)}) Tj ET`);
  if(code) this.page.ops.push(
    `BT 0.42 0.46 0.43 rg /F1 8.5 Tf 1 0 0 1 ${PdfDoc.M} ${(top-12).toFixed(1)} Tm (${pdfEsc(code)}) Tj ET`);
  this.y -= 6;
  this.rule();
  if(meta && meta.length){
    const wide = PdfDoc.W - PdfDoc.M*2;
    this.table([wide*0.22, wide*0.28, wide*0.22, wide*0.28], meta,
      { size:8.5, pad:2, colour:(r,c)=> (c%2===0) ? [.35,.39,.36] : [0,0,0] });
  }
};

PdfDoc.prototype.signature = function(img, name, when){
  this.room(60);
  this.text("Declaration", { bold:true, size:9.5, colour:[.12,.35,.18], after:1 });
  this.text("Upon inspecting, I confirm that the inspection results are accurate and where deemed "
    + "as safe are fit for purpose.", { size:8.5, colour:[.42,.46,.43], after:4 });
  if(img) this.image(img, 130);
  this.text((name||"") + (when ? "   ·   " + stamp(when) : ""), { size:9, colour:[.35,.39,.36] });
};

PdfDoc.prototype.blob = function(){
  const chunks = [];
  let len = 0;
  const push = x => {
    const b = (typeof x === "string")
      ? Uint8Array.from(x, ch => ch.charCodeAt(0) & 0xff) : x;
    chunks.push(b); len += b.length; return len;
  };

  const objs = [];                  /* index 0 unused */
  const offsets = [];
  const add = body => { objs.push(body); return objs.length; };   /* 1-based */

  const catalogNum = add(null), pagesNum = add(null);
  const f1 = add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  const f2 = add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");

  const pageNums = [];
  this.pages.forEach(pg=>{
    const imgRefs = [];
    pg.images.forEach(im=>{
      const n = add({ image: im });
      imgRefs.push({ name: im.name, num: n });
    });
    const content = pg.ops.join("\n");
    const cNum = add({ stream: content });
    const res = "<< /Font << /F1 " + f1 + " 0 R /F2 " + f2 + " 0 R >>"
      + (imgRefs.length ? " /XObject << " + imgRefs.map(r=>"/"+r.name+" "+r.num+" 0 R").join(" ") + " >>" : "")
      + " >>";
    const pNum = add("<< /Type /Page /Parent " + pagesNum + " 0 R /MediaBox [0 0 "
      + PdfDoc.W + " " + PdfDoc.H + "] /Resources " + res + " /Contents " + cNum + " 0 R >>");
    pageNums.push(pNum);
  });

  objs[catalogNum-1] = "<< /Type /Catalog /Pages " + pagesNum + " 0 R >>";
  objs[pagesNum-1] = "<< /Type /Pages /Kids [" + pageNums.map(n=>n+" 0 R").join(" ")
    + "] /Count " + pageNums.length + " >>";

  push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  objs.forEach((body, i)=>{
    offsets[i+1] = len;
    push((i+1) + " 0 obj\n");
    if(body && body.stream !== undefined){
      push("<< /Length " + body.stream.length + " >>\nstream\n");
      push(body.stream);
      push("\nendstream\n");
    } else if(body && body.image){
      const im = body.image;
      push("<< /Type /XObject /Subtype /Image /Width " + im.w + " /Height " + im.h
        + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "
        + im.bytes.length + " >>\nstream\n");
      push(im.bytes);
      push("\nendstream\n");
    } else {
      push(body + "\n");
    }
    push("endobj\n");
  });

  const xref = len;
  push("xref\n0 " + (objs.length+1) + "\n0000000000 65535 f \n");
  for(let i=1;i<=objs.length;i++)
    push(String(offsets[i]).padStart(10,"0") + " 00000 n \n");
  push("trailer\n<< /Size " + (objs.length+1) + " /Root " + catalogNum + " 0 R >>\nstartxref\n" + xref + "\n%%EOF");

  return new Blob(chunks, { type: "application/pdf" });
};

/* ------------------------------------------------- weekly H&S pack -- */
/* Everything health and safety that was completed in a week, gathered into
   one document with a cover, a contents page and a section per form. */
const PACK_ORDER = ["briefing","toolboxtalk","havs","plantcheck","puwer","loler","excavation"];

function packSections(ws){
  const days = weekDays(ws);
  return PACK_ORDER
    .filter(k=>FORMS[k])
    .map(k=>{
      const def = FORMS[k];
      const items = DB.records.filter(r=>r.form===k && r.job===DB.job
        && r.status==="submitted" && days.includes(r.date))
        .sort((a,b)=>a.date<b.date?-1:1);
      let expected;
      if(k === "plantcheck"){
        /* a check for every machine on site, every working day so far */
        expected = days.filter(isWorking).filter(d=>d<=todayISO())
          .reduce((n,d)=>n + plantNeedingCheck(d).length, 0);
      } else {
        expected = def.daily ? days.filter(isWorking).filter(d=>d<=todayISO()).length
          : def.weekly ? 1
          : items.length;                      /* as required — whatever was done is the whole of it */
      }
      return { key:k, name:def.name, items, expected, def };
    })
    .filter(sec=>sec.items.length || sec.expected>0);
}

function packGaps(ws){
  const out = [];
  packSections(ws).forEach(sec=>{
    if(sec.key === "plantcheck"){
      weekDays(ws).filter(isWorking).filter(d=>d<=todayISO()).forEach(d=>{
        plantNeedingCheck(d).forEach(m=>{
          if(!sec.items.some(r=>r.date===d && r.plantId===m.id))
            out.push({ name: (m.item||"Machine") + (m.fleetNo?" ("+m.fleetNo+")":"") + " inspection",
              date: d });
        });
      });
      return;
    }
    if(sec.def.daily){
      weekDays(ws).filter(isWorking).filter(d=>d<=todayISO()).forEach(d=>{
        if(!sec.items.some(r=>r.date===d)) out.push({ name:sec.name, date:d });
      });
    } else if(sec.def.weekly && !sec.items.length){
      out.push({ name:sec.name, date:null });
    }
  });
  return out;
}

function packFor(ws){ return (DB.packs||[]).find(p=>p.job===DB.job && p.weekCommencing===ws) || null; }
function nextPackRef(ws){
  const yr = parse(ws).getFullYear();
  const n = (DB.packs||[]).filter(p=>parse(p.weekCommencing).getFullYear()===yr).length + 1;
  return "CGC-HSP-" + yr + "-" + String(n).padStart(3,"0");
}

/* ------------------------------------------------------------- defects -- */
/* A "No" on a check raises a defect that lives on its own until somebody closes
   it out with evidence. Closed ones stay against the machine as its history, so
   the same fault is not chased twice. */
const daysSince = ts => Math.floor((Date.now() - ts) / 86400000);
function ageText(ts){
  const d = daysSince(ts);
  return d <= 0 ? "today" : d === 1 ? "yesterday" : d + " days ago";
}

function checkLabels(plantId){
  const sheet = sheetFor(machineType(plantId)) || CHECKSHEETS.Excavator;
  const map = {};
  sheet.daily.forEach(t=>map["d_"+slug(t)] = t);
  sheet.weekly.forEach(t=>map["w_"+slug(t)] = t);
  return map;
}

function raiseDefects(rec){
  if(rec.form!=="plantcheck") return;
  DB.defects = DB.defects || [];
  const labels = checkLabels(rec.plantId);
  Object.keys(rec.data||{}).forEach(k=>{
    const val = rec.data[k];
    if(!val || typeof val!=="object" || val.v!==false) return;
    if(DB.defects.some(d=>d.checkId===rec.id && d.key===k)) return;
    DB.defects.push({
      id: "df_"+Date.now()+"_"+k, plantId: rec.plantId, job: rec.job, key: k,
      item: labels[k] || k, description: val.defect || "", photos: val.photos || [],
      checkId: rec.id, checkRef: rec.ref, date: rec.date,
      reportedBy: rec.by, reportedAt: rec.submittedAt || Date.now(),
      unsafe: rec.data.safe === false, status: "open"
    });
  });
}

/* Our own machines are our problem and go straight to the fitter. Hired plant
   is the hire company's problem, so it goes to them with the hire reference. */
function recipientFor(m){
  const c = cfg();
  if(!m) return { kind:"internal", name:(c.fitter&&c.fitter.name)||"our fitter",
    email:(c.fitter&&c.fitter.email)||"", priority:true };
  if((m.owner||"Hired") === "Owned"){
    return { kind:"internal", label:"Our fitter",
      name:(c.fitter&&c.fitter.name)||"our fitter",
      email:(c.fitter&&c.fitter.email)||"", priority:true };
  }
  return { kind:"hire", label: m.owner==="Subcontractor" ? "Subcontractor" : "Hire company",
    name: m.hireCompany || (m.owner==="Subcontractor" ? "the subcontractor" : "the hire company"),
    email: m.hireEmail || "", phone: m.hirePhone || "", ref: m.hireRef || "", priority:false };
}

const openDefects  = pid => (DB.defects||[]).filter(d=>d.plantId===pid && d.status==="open")
  .sort((a,b)=>a.reportedAt-b.reportedAt);
const closedDefects = pid => (DB.defects||[]).filter(d=>d.plantId===pid && d.status==="closed")
  .sort((a,b)=>(b.fixedAt||0)-(a.fixedAt||0));

function defectsFor(plantId){
  const items = openDefects(plantId);
  if(!items.length) return null;
  return {
    items,
    unsafe: items.some(d=>d.unsafe),
    oldest: items[0].reportedAt,
    record: { ref: items[0].checkRef, date: items[0].date, job: items[0].job,
      by: items[0].reportedBy, data: {} }
  };
}

/* The week's checks for one machine on a single sheet, laid out like the paper
   form. Produce it any day — the days not yet done are simply blank. */
function weekChecks(plantId, ws){
  const days = weekDays(ws);
  const map = {};
  days.forEach(d=>{
    map[d] = DB.records.find(r=>r.form==="plantcheck" && r.plantId===plantId
      && r.date===d && r.status==="submitted") || null;
  });
  return { days, map };
}

function printWeeklyPlantSheet(plantId, ws){
  const m = (DB.plant||[]).find(x=>x.id===plantId);
  if(!m){ toast("That machine could not be found."); return; }
  const c = cfg();
  ws = ws || weekStart(todayISO());
  const { days, map } = weekChecks(plantId, ws);
  const sheet = sheetFor(m.type||"Excavator") || CHECKSHEETS.Excavator;
  const done = days.filter(d=>map[d]);
  if(!done.length){ toast("No checks have been recorded for that week yet."); return; }

  const DL = ["M","T","W","T","F","S","S"];
  const mark = (rec, key) => {
    if(!rec) return `<td style="text-align:center;background:#F4F6F4"></td>`;
    const v = (rec.data||{})[key];
    if(!v || v.v===undefined) return `<td style="text-align:center"></td>`;
    if(v.v===true)  return `<td style="text-align:center;font-weight:700">&#10003;</td>`;
    if(v.v==="na")  return `<td style="text-align:center;color:#666;font-size:9px">N/A</td>`;
    return `<td style="text-align:center;color:#A72B22;font-weight:700">&#10007;</td>`;
  };

  /* the weekly column is filled in on whichever day it was done */
  const weeklyRec = days.map(d=>map[d]).find(r=>r && r.data && r.data.__weekly===true) || null;

  const defects = (DB.defects||[]).filter(d=>d.plantId===plantId && days.includes(d.date));

  document.getElementById("sheet").innerHTML = `

    <h2>Declaration</h2>

      <span>Produced ${stamp(Date.now())}</span></div>`;

  document.getElementById("sheetTitle").textContent =
    (m.fleetNo || m.item || "Machine") + " — w/c " + shortDate(ws);

function recordLines(doc, rec){
  const fmt = (f,v) => {
    if(v===undefined||v===null||v==="") return "—";
    if(f.type==="check") return v.v===true?"Yes":v.v===false?"No":v.v==="na"?"N/A":"—";
    if(f.type==="duration") return durText(v)||"—";
    if(f.type==="yesno") return v?"Yes":"No";
    if(Array.isArray(v)) return v.length?v.join(", "):"—";
    return String(v)+(f.suffix?" "+f.suffix:"");
  };
  sectionsFor(rec.form).forEach(sec=>{
    const fields = sec.fields.filter(f=>visible(f,rec.data) && f.type!=="signature" && f.type!=="photos");
    if(!fields.length) return;
    doc.text(sec.title, { bold:true, size:10.5, colour:[.12,.35,.18], after:1 });
    fields.forEach(f=>{
      const v = rec.data[f.id];
      if(f.type==="repeater"){
        const rows = v||[];
        doc.text(f.label, { bold:true, size:9.5, indent:8 });
        if(!rows.length){ doc.text("None recorded", { size:9.5, indent:16, colour:[.42,.46,.43] }); return; }
        rows.forEach((row,i)=>{
          const bits = f.columns.filter(c=>c.type!=="signature")
            .map(c=>c.label+": "+fmt(c,row[c.id]))
            .filter(x=>!/: —$/.test(x));
          doc.text((i+1)+".  "+bits.join("   ·   "), { size:9.5, indent:16 });
        });
        return;
      }
      if(f.type==="check" && v && v.v===false){
        doc.pair(f.label, "No — " + (v.defect||""), [.65,.17,.13]);
        return;
      }
      doc.pair(f.label, fmt(f,v));
    });
    doc.y -= 3;
  });
}

/* Every image the pack needs, converted once up front so the pages can then be
   drawn in one pass. */
async function packImages(ws, secs){
  const wanted = new Set([LOGO]);
  secs.forEach(sec=>sec.items.forEach(r=>{
    const d = r.data || {};
    if(d.signature && d.signature.src) wanted.add(d.signature.src);
    (d.entries||[]).forEach(e=>{ if(e.opSignature && e.opSignature.src) wanted.add(e.opSignature.src); });
    (d.photos||[]).forEach(ph=>wanted.add(ph.src));
    Object.values(d).forEach(v=>{
      if(v && typeof v==="object" && v.v===false) (v.photos||[]).forEach(ph=>wanted.add(ph.src));
    });
  }));
  const map = new Map();
  for(const src of wanted){
    try{ map.set(src, await jpegFromDataUrl(src, src===LOGO ? 460 : 900)); }catch(e){}
  }
  return map;
}

function yn(v){ return v===true ? "Yes" : v===false ? "No" : "—"; }
function ckMark(v){
  if(!v || v.v===undefined) return "";
  return v.v===true ? "Yes" : v.v==="na" ? "N/A" : "No";
}
