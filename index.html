<style>
:root{
  --green:#1F5A2D; --green-700:#17441F; --green-50:#F1F6F2; --green-100:#E3EDE6;
  --ink:#121714; --ink-2:#59645C; --ink-3:#8A948C;
  --line:#DDE3DE; --line-2:#ECEFEB; --paper:#fff; --canvas:#F7F9F7;
  --ok:#2E7D46; --ok-bg:#E6F2EA; --warn:#A96A00; --warn-bg:#FAEFDC;
  --bad:#A72B22; --bad-bg:#F8E6E3; --info:#1E4E8C; --info-bg:#E7EEF7;
  --sh:0 1px 2px rgba(20,34,24,.05), 0 10px 24px -18px rgba(20,34,24,.35);
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden}
img,canvas,table{max-width:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  background:var(--canvas);color:var(--ink);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7FB394;outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;min-height:100vh;
  padding:0 16px calc(30px + env(safe-area-inset-bottom));
  padding-left:max(16px, env(safe-area-inset-left));
  padding-right:max(16px, env(safe-area-inset-right));

/* -------------------------------------------------------------- storage -- */
const KEY = "cgc.diary.v1";
let DB = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { records:[], counter:0, config:JSON.parse(JSON.stringify(CONFIG)),
    job:CONFIG.jobs[0], plant:[], labour:[], leave:[], vos:[], voCounter:0 };
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast("Storage full — export a backup and remove old photos"); }
}
const cfg = () => DB.config || CONFIG;

/* Working hours are set per job — a footway job and a deep drainage job rarely
   run the same day. Falls back to the app default for a job never set up. */
function hoursFor(job){
  const j = job || DB.job;
  const h = (DB.jobHours || {})[j];
  return h || CONFIG.hours;
}
function setJobHours(patch){
  DB.jobHours = DB.jobHours || {};
  DB.jobHours[DB.job] = Object.assign({}, hoursFor(DB.job), patch);
  save();
}

/* ---------------------------------------------------------------- dates -- */
const iso = d => { const x=new Date(d);
  return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const todayISO = () => iso(new Date());
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const DAYL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const longDate = s => { const d=parse(s); return DAYL[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear(); };
const shortDate = s => { const d=parse(s);
  return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); };
const stamp = t => { const d=new Date(t);
  return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()
    +" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
const timeOnly = t => { const d=new Date(t);
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
function weekStart(s){ const d=parse(s); const n=(d.getDay()+6)%7; d.setDate(d.getDate()-n); return iso(d); }
function weekDays(ws){ const out=[]; for(let i=0;i<7;i++) out.push(addDays(ws,i)); return out; }
const isWorking = s => cfg().workingDays.includes(parse(s).getDay());
const initials = n => n.split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase();

/* ------------------------------------------------------------ diary state --
   Status rules you set:
     today          -> due (grey)
     yesterday      -> amber
     older than that-> red
   Weekends are never chased; a diary can still be created on one.
   -------------------------------------------------------------------------*/
function recordFor(date, job){
  return DB.records.find(r => r.date===date && r.job===(job||DB.job));
}
function statusFor(date){
  const t = todayISO();
  const rec = recordFor(date);
  if(rec && rec.status==="submitted") return "done";
  if(date > t) return "future";
  if(!inScope(date)) return "none";     /* before the app started */
  if(!isWorking(date)) return rec ? "draft" : "none";
  if(date === t) return rec ? "draft" : "due";
  if(date === prevWorking(t)) return "amber";
  return "red";
}
function prevWorking(s){ let d=addDays(s,-1); let i=0; while(!isWorking(d) && i++<10) d=addDays(d,-1); return d; }
/* Only chase from the day the app started being used. Anything before that was
   kept on paper and is none of its business. */
function startDate(){ return DB.startDate || todayISO(); }
function inScope(d){ return d >= startDate(); }

function missedDays(){
  const t = todayISO(), out=[];
  let d = addDays(t,-1);
  for(let i=0;i<60;i++){
    if(!inScope(d)) break;
    if(isWorking(d) && !recordFor(d)) out.push({date:d, level: d===prevWorking(t) ? "amber":"red"});
    d = addDays(d,-1);
  }
  return out;
}

/* ------------------------------------------------------- plant register -- */
/* Kept once, on the job. Every new diary is pre-loaded with whatever is on
   site that day, so the diary only ever asks for hours. */
/* Was this item on site on a given day? Inclusive of the day it left, since it
   was working that morning — this feeds the diary. */
function onSitePlant(date){
  const d = date || todayISO();
  return (DB.plant||[]).filter(p => p.job===DB.job
    && (!p.onDate || p.onDate<=d) && (!p.offDate || p.offDate>=d));
}
/* Is it on site now? Off hired today counts as gone — this drives the register. */
function currentPlant(){
  const t = todayISO();
  return (DB.plant||[]).filter(p => p.job===DB.job && (!p.offDate || p.offDate>t));
}
/* Thorough examination — LOLER for anything that lifts, PUWER for the rest, so
   the register just calls it what it is. Warns a month out. */
function examDateOf(p){ return p.examDate || p.lolerDate || ""; }
function lolerState(p){
  const dt = examDateOf(p);
  if(!dt) return { key:"none", label:"No examination date", cls:"grey" };
  const days = Math.round((parse(dt) - parse(todayISO())) / 86400000);
  if(days < 0) return { key:"expired", label:"Thorough examination overdue — "+shortDate(dt), cls:"red", days };
  if(days <= 30) return { key:"soon", label:"Thorough examination due in "+days+" day"+(days===1?"":"s"), cls:"amber", days };
  return { key:"ok", label:"Thorough examination due "+shortDate(dt), cls:"ok", days };
}
function lolerAlerts(){
  return currentPlant().map(p=>({p, st:lolerState(p)}))
    .filter(x=>x.st.key==="expired" || x.st.key==="soon");
}

function refreshPlantPill(id){
  const p = (DB.plant||[]).find(x=>x.id===id);
  const el = document.getElementById("pill_"+id);
  if(!p || !el) return;
  const st = lolerState(p);
  el.className = "pill " + st.cls;
  el.textContent = st.label;
  const inp = document.querySelector('[data-pl-'+id+'="examDate"]');
  if(inp) inp.classList.toggle("err", st.key==="expired");
}

/* Who can be picked in the diary: whoever has been ticked on site today, and
   if nobody has been ticked yet, everyone on the register. */
function availablePeople(){
  const rows = (formState && formState.values.labourTable) || [];
  const on = rows.filter(r=>r.onSite===true && !r.leave).map(r=>r.name).filter(Boolean);
  if(on.length) return on;
  return onSiteLabour(formState ? formState.date : null).map(l=>l.name).filter(Boolean);
}
function availablePlant(){
  return onSitePlant(formState ? formState.date : null)
    .map(p => p.item + (p.fleetNo ? " ("+p.fleetNo+")" : "")).filter(Boolean);
}

/* ------------------------------------------------------- dayworks / VOs -- */
/* Every diary with dayworks on it raises a numbered variation sheet — VO1,
   VO2 and so on, in the order they happen — for the Principal Contractor to
   sign, either on the screen or on paper. */
function smallPlantText(v){
  if(!v) return "";
  if(typeof v === "string") return v;              /* entries made before it was a list */
  return v.filter(x=>x && x.item)
    .map(x=>x.item + (durText(x.hours) ? " — "+durText(x.hours) : ""))
    .join(", ");
}

function nextVoRef(){
  DB.voCounter = (DB.voCounter||0) + 1;
  return "VO" + DB.voCounter;
}
function voForRecord(recId){ return (DB.vos||[]).find(v=>v.recordId===recId) || null; }

function syncVo(rec){
  DB.vos = DB.vos || [];
  const d = rec.data || {};
  const has = d.dayworks === true;
  const existing = voForRecord(rec.id);

  if(!has){
    /* dayworks answer changed to no — drop it, unless it has been signed */
    if(existing && existing.status !== "signed")
      DB.vos = DB.vos.filter(v=>v.id!==existing.id);
    return;
  }
  const snapshot = {
    ref: d.dwRef||"", instructedBy: d.dwBy||"", what: d.dwWhat||"",
    labour: d.dwLabour||[], plant: d.dwPlant||[], smallPlant: d.dwSmallPlant||"",
    hours: d.dwHours||"", materials: d.dwMaterials||"", comments: d.dwComments||""
  };
  if(existing){
    if(existing.status !== "signed"){ existing.data = snapshot; existing.updatedAt = Date.now(); }
    return;
  }
  DB.vos.push({
    id:"vo_"+Date.now(), ref: nextVoRef(), recordId: rec.id, job: rec.job, date: rec.date,
    raisedBy: rec.by, createdAt: Date.now(), status:"unsigned", data: snapshot
  });
}

/* ------------------------------------------------------------------ leave -- */
/* Booked against a person, not a job — someone on holiday is off everywhere.
   Codes are what shows on the timesheet. */
const LEAVE_TYPES = [
  { key:"HOL",  label:"Annual leave" },
  { key:"SICK", label:"Sick" },
  { key:"TRN",  label:"Training" },
  { key:"OFF",  label:"Other" }
];
const leaveLabel = k => (LEAVE_TYPES.find(t=>t.key===k)||{}).label || k;

function leaveOn(personId, date){
  return (DB.leave||[]).find(l => l.personId===personId && l.from<=date && l.to>=date) || null;
}
function leaveToday(date){
  const d = date || todayISO();
  return (DB.leave||[]).filter(l => l.from<=d && l.to>=d);
}
function leaveThisWeek(){
  const days = weekDays(weekStart(todayISO()));
  return (DB.leave||[]).filter(l => days.some(d => l.from<=d && l.to>=d));
}

/* Durations are entered as hours and minutes, kept as {h,m}. */
function durText(v){
  if(v===undefined||v===null||v==="") return "";
  if(typeof v === "number") return v+" hrs";                 /* entered before the change */
  const h = Number(v.h)||0, m = Number(v.m)||0;
  if(!h && !m) return "";
  const parts = [];
  if(h) parts.push(h+" hr"+(h===1?"":"s"));
  if(m) parts.push(m+" min"+(m===1?"":"s"));
  return parts.join(" ");
}
const durEmpty = v => !v || (typeof v==="object" && !(Number(v.h)||0) && !(Number(v.m)||0));

/* Hours worked = finish minus start, less the break. */
const toMins = t => { if(!t||t.indexOf(":")<0) return null;
  const [h,m]=t.split(":").map(Number); return h*60+m; };
function workedHours(start, finish){
  const a=toMins(start), b=toMins(finish);
  if(a==null||b==null) return null;
  let mins = b-a; if(mins<0) mins += 24*60;
  mins -= (Number(hoursFor().breakMins)||30);
  if(mins<0) mins = 0;
  return Math.round((mins/60)*100)/100;
}
const normalHours = (job) => workedHours(hoursFor(job).start, hoursFor(job).finish);
function rowHours(row){
  if(!row || row.onSite!==true) return 0;
  if(row.normal===true) return normalHours() || 0;
  return workedHours(row.start, row.finish) || 0;
}

/* Signing happens in its own panel, so a finger on the canvas can never drag
   the page underneath it. */
function openSignaturePad(existing, onSave){
  const wrap = document.createElement("div");
  wrap.className = "scrim";
  wrap.innerHTML = `<div class="dlg">
      <h3>Sign here</h3>
      <p>Use your finger. Landscape gives you more room.</p>
      <canvas class="sigpad" id="padCanvas"></canvas>
      <div class="sigline">Sign above</div>
      <div class="g2" style="margin-bottom:10px">
        <button class="btn line" style="margin:0" data-padclear>Clear</button>
        <button class="btn line" style="margin:0" data-padcancel>Cancel</button>
      </div>
      <button class="btn" style="margin:0" data-padsave>Save signature</button>
    </div>`;
  document.body.appendChild(wrap);

  const cv = wrap.querySelector("#padCanvas");
  const rect = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = rect.width*dpr; cv.height = rect.height*dpr;
  const g = cv.getContext("2d");
  g.scale(dpr,dpr);
  g.lineWidth = 2.4; g.lineCap = "round"; g.lineJoin = "round"; g.strokeStyle = "#16261C";
  let touched = false;
  if(existing){
    const im = new Image();
    im.onload = () => g.drawImage(im, 0, 0, rect.width, rect.height);
    im.src = existing; touched = true;
  }

  let drawing = false, last = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; };
  cv.addEventListener("pointerdown", e => {
    e.preventDefault(); drawing = true; touched = true; last = pos(e);
    cv.setPointerCapture(e.pointerId);
    g.beginPath(); g.moveTo(last.x,last.y); g.lineTo(last.x+0.1,last.y); g.stroke();
  });
  cv.addEventListener("pointermove", e => {
    if(!drawing) return;
    e.preventDefault();
    const p = pos(e);
    g.beginPath(); g.moveTo(last.x,last.y); g.lineTo(p.x,p.y); g.stroke();
    last = p;
  });
  const stop = e => { if(e) e.preventDefault(); drawing = false; };
  cv.addEventListener("pointerup", stop);
  cv.addEventListener("pointercancel", stop);
  cv.addEventListener("pointerleave", stop);
  cv.addEventListener("touchmove", e => e.preventDefault(), { passive:false });

  const close = () => wrap.remove();
  wrap.querySelector("[data-padcancel]").onclick = close;
  wrap.querySelector("[data-padclear]").onclick = () => {
    g.clearRect(0,0,cv.width,cv.height); touched = false;
  };
  wrap.querySelector("[data-padsave]").onclick = () => {
    if(!touched){ toast("Nothing signed yet"); return; }
    const src = cv.toDataURL("image/png");
    close();
    onSave(src);
  };
}

}

/* ------------------------------------------------------------------- form -- */
let formState = null;

function visible(f, v){ return !f.showIf || v[f.showIf.field] === f.showIf.equals; }

function startForm(date){
  const rec = recordFor(date);
  if(rec && rec.status==="submitted"){ go("record",{id:rec.id}); return; }
  const values = rec ? JSON.parse(JSON.stringify(rec.data)) : prefill(date);
  if(rec){
    ["personnel","plant","activities","progress","deliveries","dwLabour_old"].forEach(k=>{ delete values[k]; });
    values.tasks = values.tasks || [];
    values.plantTable = values.plantTable || [];
    onSitePlant(date).forEach(p=>{ if(!values.plantTable.some(r=>r.id===p.id))
      values.plantTable.push({ id:p.id, item:p.item, fleetNo:p.fleetNo,
        exam:examDateOf(p)?shortDate(examDateOf(p)):"n/a", inUse:undefined }); });
    values.labourTable = values.labourTable || [];
    onSiteLabour(date).forEach(l=>{ if(!values.labourTable.some(r=>r.id===l.id))
      { const lv = leaveOn(l.id, date);
        values.labourTable.push({ id:l.id, name:l.name, trade:l.trade,
          leave: lv?lv.type:"", leaveNote: lv?leaveLabel(lv.type):"",
          onSite: lv?false:undefined, normal:undefined, start:"", finish:"", reason:"" }); } });
    /* leave booked after a draft was started still shows */
    values.labourTable.forEach(r=>{
      const lv = leaveOn(r.id, date);
      if(lv && !r.leave){ r.leave = lv.type; r.leaveNote = leaveLabel(lv.type); r.onSite = false; }
      if(!lv && r.leave){ r.leave = ""; r.leaveNote = ""; }
    });
  }
  formState = { date, values, errors:{}, touched:false, id: rec?rec.id:null };
  go("form",{date});
}
function prefill(date){
  const v = {};
  DIARY.forEach(s=>s.fields.forEach(f=>{
    if(f.type==="repeater"||f.type==="checkboxes"||f.type==="photos") v[f.id]=[];
  }));
  const prev = DB.records.filter(r=>r.job===DB.job && r.status==="submitted" && r.date<date)
    .sort((a,b)=>a.date<b.date?1:-1)[0];
  if(prev && prev.data.personnel) v.personnel = JSON.parse(JSON.stringify(prev.data.personnel));

  /* Plant comes straight off the register, so the only thing to type is hours. */
  v.plantTable = onSitePlant(date).map(p => ({
    id:p.id, item:p.item, fleetNo:p.fleetNo,
    exam: examDateOf(p) ? shortDate(examDateOf(p)) : "n/a", inUse:undefined
  }));
  v.labourTable = onSiteLabour(date).map(l => {
    const lv = leaveOn(l.id, date);
    return { id:l.id, name:l.name, trade:l.trade,
      leave: lv ? lv.type : "", leaveNote: lv ? leaveLabel(lv.type) : "",
      onSite: lv ? false : undefined, normal:undefined, start:"", finish:"", reason:"" };
  });
  return v;
}
function validate(){
  const e = {}, v = formState.values;
  DIARY.forEach(s=>s.fields.forEach(f=>{
    if(!visible(f,v) || !f.required) return;
    const val = v[f.id];
    const empty = f.type==="duration" ? durEmpty(val)
      : (val===undefined||val===null||val===""||(Array.isArray(val)&&val.length===0));
    if(empty){ e[f.id]="Required"; return; }
    if(f.type==="planttable"){
      for(let i=0;i<val.length;i++) if(val[i].inUse===undefined)
        { e[f.id]="Say whether each item was in use"; return; }
      return;
    }
    if(f.type==="labourtable"){
      for(let i=0;i<val.length;i++){
        const r = val[i];
        if(r.leave) continue;                       /* booked off, nothing to answer */
        if(r.onSite===undefined){ e[f.id]="Say who was on site"; return; }
        if(r.onSite===true && r.normal===undefined)
          { e[f.id]=(r.name||"Someone")+": normal hours?"; return; }
        if(r.onSite===true && r.normal===false && (!r.start||!r.finish))
          { e[f.id]=(r.name||"Someone")+": start and finish time needed"; return; }
        if(r.onSite===true && r.normal===false && !(r.reason||"").trim())
          { e[f.id]=(r.name||"Someone")+": give a reason for the different hours"; return; }
      }
      return;
    }
    if(f.type==="repeater"){
      for(let i=0;i<val.length;i++) for(const c of f.columns){
        if(c.required && (val[i][c.id]===undefined||val[i][c.id]===""))
          { e[f.id]=(f.itemLabel||"Row")+" "+(i+1)+": "+c.label+" is required"; return; }
      }
    }
  }));
  return e;
}

function fieldHtml(f, v, err, path){
  const id = path||f.id;
  const val = v[f.id];
  const lab = f.type==="signature"||true
    ? `<label for="fl_${id}">${esc(f.label)}${f.required?' <span style="color:var(--bad)">*</span>':""}</label>` : "";
  const hint = f.hint?`<div class="hint">${esc(f.hint)}</div>`:"";
  let c = "";
  const ec = err?" err":"";
  switch(f.type){
    case "text": c=`<input id="fl_${id}" class="in${ec}" data-f="${id}" value="${esc(val||"")}">`; break;
    case "textarea": c=`<textarea id="fl_${id}" class="in${ec}" data-f="${id}">${esc(val||"")}</textarea>`; break;
    case "number":
      c=`<input id="fl_${id}" class="in${ec}" data-f="${id}" type="number" inputmode="decimal" step="any"
        value="${val===undefined||val===null?"":esc(val)}">`; break;
    case "time": c=`<input id="fl_${id}" class="in${ec}" data-f="${id}" type="time" value="${esc(val||"")}">`; break;
    case "duration":{
      const v = (val && typeof val==="object") ? val : { h: (typeof val==="number"?val:""), m:"" };
      c = `<div class="g2">
        <div style="position:relative">
          <input id="fl_${id}" class="in${ec}" type="number" inputmode="numeric" min="0"
            data-dur="${id}" data-part="h" value="${v.h===undefined?"":esc(v.h)}" placeholder="0">
          <span style="position:absolute;right:12px;top:16px;color:var(--ink-3);font-size:13.5px;
            font-weight:600;pointer-events:none">hours</span>
        </div>
        <div style="position:relative">
          <input class="in${ec}" type="number" inputmode="numeric" min="0" max="59"
            data-dur="${id}" data-part="m" value="${v.m===undefined?"":esc(v.m)}" placeholder="0">
          <span style="position:absolute;right:12px;top:16px;color:var(--ink-3);font-size:13.5px;
            font-weight:600;pointer-events:none">mins</span>
        </div>
      </div>`;
      break;
    }
    case "select":
      c=`<select id="fl_${id}" class="in${ec}" data-f="${id}"><option value="">Choose…</option>`+
        f.options.map(o=>`<option ${val===o?"selected":""}>${esc(o)}</option>`).join("")+`</select>`; break;
    case "plantselect":{
      const opts = onSitePlant(formState ? formState.date : null)
        .map(p => p.item + (p.fleetNo ? " ("+p.fleetNo+")" : ""))
        .filter(Boolean).concat(["Other / not on register"]);
      if(val && !opts.includes(val)) opts.unshift(val);
      c=`<select id="fl_${id}" class="in${ec}" data-f="${id}"><option value="">Choose…</option>`+
        opts.map(o=>`<option ${val===o?"selected":""}>${esc(o)}</option>`).join("")+`</select>`; break;
    }
    case "yesno":
      c=`<div class="seg">
        <button type="button" class="segb ${val===true?"y":""}" data-yes="${id}">Yes</button>
        <button type="button" class="segb ${val===false?"n":""}" data-no="${id}">No</button></div>`; break;
    case "checkboxes":{
      const arr = val||[];
      c=`<div class="cg">`+f.options.map(o=>
        `<button type="button" class="cb ${arr.includes(o)?"on":""}" data-chk="${id}" data-val="${esc(o)}">
          <span class="b">${arr.includes(o)?"&#10003;":""}</span>${esc(o)}</button>`).join("")+`</div>`; break;
    }
    case "repeater":{
      const rows = val||[];
      c = rows.map((row,i)=>`<div class="rep">
        <div class="rh"><span>${esc(f.itemLabel||"Item")} ${i+1}</span>
        <button type="button" class="rm" data-del="${id}" data-i="${i}">Remove</button></div>`+
        f.columns.map(col=>fieldHtml(Object.assign({},col,{required:false}), row, null, id+"."+i+"."+col.id)).join("")+
        `</div>`).join("") +
        `<button type="button" class="btn line" data-add="${id}">+ ${esc(f.addLabel||"Add")}</button>`;
      break;
    }
    case "photos":{
      const arr = val||[];
      c = (arr.length?`<div class="pg">`+arr.map((p,i)=>
        `<div class="ph"><img src="${p.src}" alt="Photograph ${i+1}" data-taken="${p.takenAt||""}">
          <button type="button" data-rmph="${id}" data-i="${i}" aria-label="Remove">&times;</button></div>`
        ).join("")+`</div>`:"") +
        `<div class="g2">
          <button type="button" class="btn line" style="margin:0" data-cam="${id}">Take photo</button>
          <button type="button" class="btn line" style="margin:0" data-lib="${id}">Upload</button>
        </div>
        <div class="hint" style="margin:8px 0 0">${arr.length
          ? arr.length+" attached · tap one to see it full size"
          : "Each photo is stamped with the time and the CGC logo."}</div>`;
      break;
    }
    case "peoplepick":
    case "plantpick":{
      const arr = val||[];
      const opts = f.type==="peoplepick" ? availablePeople() : availablePlant();
      if(!opts.length){
        c = `<div class="tempty" style="border:1.5px dashed var(--line);border-radius:13px">
          ${f.type==="peoplepick"
            ? "Tick who was on site further up the form first."
            : "Nothing on the plant register for this job."}</div>`;
        break;
      }
      c = `<div style="display:flex;flex-wrap:wrap;gap:8px">`+
        opts.map(o=>`<button type="button" class="cb ${arr.includes(o)?"on":""}"
          style="min-height:46px;width:auto;padding:0 14px"
          data-chk="${id}" data-val="${esc(o)}">
          <span class="b">${arr.includes(o)?"&#10003;":""}</span>${esc(o)}</button>`).join("")+
        `</div>`;
      break;
    }
    case "planttable":{
      const rows = val||[];
      c = `<div class="ttable">
        <div class="thead"><span class="c1">Plant</span><span class="c2">Fleet no.</span>
          <span class="c3">In use</span></div>`+
        (rows.length ? rows.map((r,i)=>`<div class="trow"><div class="main">
            <span class="c1"><b>${esc(r.item||"Unnamed")}</b>
              <span class="subfleet">${esc(r.fleetNo||"No fleet no.")}</span></span>
            <span class="c2">${esc(r.fleetNo||"—")}</span>
            <span class="yn">
              <button type="button" class="${r.inUse===true?"y":""}" data-tbl="plantTable" data-i="${i}" data-k="inUse" data-v="1">Yes</button>
              <button type="button" class="${r.inUse===false?"n":""}" data-tbl="plantTable" data-i="${i}" data-k="inUse" data-v="0">No</button>
            </span></div></div>`).join("")
          : `<div class="tempty">Nothing on the plant register for this job yet.</div>`)+
        `</div>`;
      break;
    }
    case "labourtable":{
      const rows = val||[];
      c = `<div class="ttable">
        <div class="thead"><span class="c1">Name</span><span class="c3">On site</span></div>`+
        (rows.length ? rows.map((r,i)=>{
          const hrs = rowHours(r);
          if(r.leave){
            return `<div class="trow" style="background:var(--info-bg)"><div class="main">
              <span class="c1"><b>${esc(r.name||"Unnamed")}</b>
                <span>${esc(r.trade||"")}</span></span>
              <span class="pill info" style="flex:none">${esc(r.leave)} · ${esc(leaveLabel(r.leave))}</span>
            </div></div>`;
          }
          return `<div class="trow"><div class="main">
            <span class="c1"><b>${esc(r.name||"Unnamed")}</b><span>${esc(r.trade||"")}</span></span>
            <span class="yn">
              <button type="button" class="${r.onSite===true?"y":""}" data-tbl="labourTable" data-i="${i}" data-k="onSite" data-v="1">Yes</button>
              <button type="button" class="${r.onSite===false?"n":""}" data-tbl="labourTable" data-i="${i}" data-k="onSite" data-v="0">No</button>
            </span></div>
            ${r.onSite===true ? `<div class="more">
              <span class="lbl">Normal hours — ${esc(hoursFor().start)} to ${esc(hoursFor().finish)}, ${normalHours()} hours?</span>
              <span class="yn" style="width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px">
                <button type="button" class="${r.normal===true?"y":""}" data-tbl="labourTable" data-i="${i}" data-k="normal" data-v="1">Yes</button>
                <button type="button" class="${r.normal===false?"n":""}" data-tbl="labourTable" data-i="${i}" data-k="normal" data-v="0">No</button>
              </span>
              ${r.normal===false ? `
                <div class="timegrid" style="margin-top:10px">
                  <input type="time" value="${esc(r.start||"")}" data-tin="labourTable" data-i="${i}" data-k="start" aria-label="Start time">
                  <input type="time" value="${esc(r.finish||"")}" data-tin="labourTable" data-i="${i}" data-k="finish" aria-label="Finish time">
                  <span class="calc">${hrs?hrs+" hrs":"—"}</span>
                </div>
                <input class="in" style="min-height:46px;margin-top:8px" placeholder="Reason — e.g. left early for an appointment"
                  value="${esc(r.reason||"")}" data-tin="labourTable" data-i="${i}" data-k="reason" aria-label="Reason">
                ` : `<div style="margin-top:8px;font-size:13px;color:var(--ink-2)">
                  ${normalHours()} hours, ${esc(hoursFor().breakMins)} minute break deducted</div>`}
            </div>` : ""}
          </div>`;
        }).join("") : `<div class="tempty">Nobody on the labour register for this job yet.</div>`)+
        `</div>`;
      break;
    }
    case "signature":
      c = `<button type="button" class="sigbtn ${val?"signed":""}" data-sigopen="${id}">
          ${val && val.src
            ? `<img src="${val.src}" alt="Signature"><span class="done">Signed — tap to sign again</span>`
            : `<span>Tap to sign</span>
               <span style="font-size:12.5px;font-weight:500">Opens a full width signing pad</span>`}
        </button>
        ${val?`<div style="display:flex;justify-content:flex-end;padding-top:8px">
          <button type="button" data-sigclear="${id}" style="color:var(--bad);font-weight:650;font-size:13px">Clear</button>
        </div>`:""}`;
      break;
  }
  return `<div class="f">${lab}${hint}${c}${err?`<div class="err-msg">${esc(err)}</div>`:""}</div>`;
}

function formView(){
  const v = formState.values;
  const errs = formState.touched ? formState.errors : {};
  let total=0, ok=0;
  DIARY.forEach(s=>s.fields.forEach(f=>{ if(f.required && visible(f,v)){ total++; if(!validate()[f.id]) ok++; }}));

  const body = DIARY.map(s=>{
    const fs = s.fields.filter(f=>visible(f,v));
    if(!fs.length) return "";
    return `<div class="sect">${esc(s.title)}</div><div class="card">`+
      fs.map(f=>fieldHtml(f, v, errs[f.id])).join("")+`</div>`;
  }).join("");

  return `<div class="top">
      <button class="chip" data-go="home">&lsaquo; Back</button>
      <span class="pill info">${ok}/${total} required</span>
    </div>
    <h1 class="greet" style="font-size:22px;margin-top:12px">Site diary</h1>
    <p class="sub">${esc(DB.job)} · ${longDate(formState.date)}</p>
    ${body}
    <button class="btn" data-submit="1">Submit diary</button>
    <button class="btn ghost" data-draft="1">Save draft and close</button>`;
}

function recordView(){
  const r = DB.records.find(x=>x.id===view.id);
  if(!r) return `<div class="card"><h3>Not found</h3></div>`;
  const rows = DIARY.map(s=>{
    const fs = s.fields.filter(f=>visible(f,r.data) && f.type!=="signature");
    if(!fs.length) return "";
    return `<div class="sect">${esc(s.title)}</div><div class="card">`+
      fs.map(f=>readRow(f, r.data[f.id])).join("")+`</div>`;
  }).join("");
  return `<div class="top"><button class="chip" data-go="home">&lsaquo; Back</button>
      <span class="pill ok">Submitted</span></div>
    <h1 class="greet" style="font-size:22px;margin-top:12px">${esc(r.ref)}</h1>
    <p class="sub">${esc(r.job)} · ${longDate(r.date)}</p>
    <div class="card">
      <div class="kv"><span class="k">Submitted by</span><span class="v">${esc(r.by)}</span></div>
      <div class="kv"><span class="k">Submitted at</span><span class="v">${stamp(r.submittedAt)}</span></div>
      <div class="kv"><span class="k">SharePoint</span><span class="v">${r.synced?"Filed":"Awaiting connection"}</span></div>
      <div class="kv"><span class="k">Will file to</span>
        <span class="v" style="font-size:12px;word-break:break-all">${esc(pathFor(r))}</span></div>
    </div>
    <button class="btn" data-pdf="${r.id}">Open PDF</button>
    <button class="btn ghost" data-reopen="${r.id}">Amend</button>
    ${cfg().allowDelete ? `<button class="btn line" style="color:var(--bad)"
      data-del-rec="${r.id}">Delete this diary</button>` : ""}
    ${rows}`;
}
function tableRows(f, val){
  const rows = val||[];
  if(f.type==="planttable"){
    if(!rows.length) return "<div style='color:#666'>None on site</div>";
    return `<table style="width:100%;border-collapse:collapse;font-size:12px">
      <tr><th style="text-align:left">Plant</th><th style="text-align:left">Fleet no.</th>
      <th style="text-align:left">In use</th></tr>`+
      rows.map(r=>`<tr><td>${esc(r.item||"")}</td><td>${esc(r.fleetNo||"")}</td>
        <td>${r.inUse===true?"Yes":r.inUse===false?"No":"—"}</td></tr>`).join("")+`</table>`;
  }
  if(!rows.length) return "<div style='color:#666'>Nobody recorded</div>";
  return `<table style="width:100%;border-collapse:collapse;font-size:12px">
    <tr><th style="text-align:left">Name</th><th style="text-align:left">Trade</th>
    <th style="text-align:left">On site</th><th style="text-align:left">Start</th>
    <th style="text-align:left">Finish</th><th style="text-align:left">Hours</th>
    <th style="text-align:left">Reason if different</th></tr>`+
    rows.map(r=>{
      const h = rowHours(r);
      return `<tr><td>${esc(r.name||"")}</td><td>${esc(r.trade||"")}</td>
        <td>${r.onSite===true?"Yes":r.onSite===false?"No":"—"}</td>
        <td>${esc(r.onSite&&r.normal===false?r.start:(r.onSite?hoursFor().start:"—"))}</td>
        <td>${esc(r.onSite&&r.normal===false?r.finish:(r.onSite?hoursFor().finish:"—"))}</td>
        <td>${r.onSite?h:"—"}</td>
        <td>${esc(r.reason||"")}</td></tr>`;
    }).join("")+`</table>`;
}

function readRow(f, val){
  if(f.type==="peoplepick"||f.type==="plantpick"){
    return `<div class="kv"><span class="k">${esc(f.label)}</span>
      <span class="v">${val&&val.length?esc(val.join(", ")):"—"}</span></div>`;
  }
  if(f.type==="planttable"||f.type==="labourtable"){
    return `<div class="kv" style="display:block"><span class="k">${esc(f.label)}</span>
      <div style="margin-top:6px;overflow-x:auto">${tableRows(f,val)}</div></div>`;
  }
  const fmt = (fl,v) => v===undefined||v===null||v===""?"—"
    : fl.type==="duration" ? (durText(v)||"—")
    : fl.type==="yesno" ? (v?"Yes":"No")
    : Array.isArray(v) ? (v.length?v.join(", "):"—")
    : String(v)+(fl.suffix?" "+fl.suffix:"");
  if(f.type==="photos"){
    if(!val||!val.length) return "";
    return `<div class="kv" style="display:block"><span class="k">${esc(f.label)}</span>
      <div class="pg" style="margin-top:8px">`+val.map((p,i)=>
        `<div class="ph"><img src="${p.src}" alt="Photograph ${i+1}" data-taken="${p.takenAt||""}"></div>`
      ).join("")+`</div>
      <div style="font-size:12.5px;color:var(--ink-3);margin-top:6px">Tap a photo to see it full size.</div></div>`;
  }
  if(f.type==="repeater"){
    const rows = val||[];
    if(!rows.length) return `<div class="kv"><span class="k">${esc(f.label)}</span><span class="v">None</span></div>`;
    return `<div class="kv" style="display:block"><span class="k">${esc(f.label)}</span>
      <table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:6px">
      <tr>`+f.columns.map(c=>`<th style="text-align:left;font-size:11px;color:var(--ink-3);padding:4px 4px">${esc(c.label)}</th>`).join("")+`</tr>`+
      rows.map(row=>`<tr>`+f.columns.map(c=>`<td style="padding:5px 4px;border-top:1px solid var(--line-2)">${esc(fmt(c,row[c.id]))}</td>`).join("")+`</tr>`).join("")+
      `</table></div>`;
  }
  return `<div class="kv"><span class="k">${esc(f.label)}</span><span class="v">${esc(fmt(f,val))}</span></div>`;
}

function listView(){

/* The register is a list, not a page of open forms. Type the details once,
   press Add, and it becomes a line. Take it off hire and it drops to the
   bottom, greyed, with the date it left site. */
let plantDraft = null;
let plantEditId = null;

function blankPlant(){
  return { item:"", fleetNo:"", owner:"Hired", onDate:todayISO(), offDate:"", examDate:"" };
}

function plantFields(p, attr){
  const ls = lolerState(p);
  return `
    <div class="f"><label>Plant item</label>
      <input class="in" ${attr}="item" value="${esc(p.item)}" placeholder="e.g. 13T 360 excavator"></div>
    <div class="g2">
      <div class="f"><label>Fleet / reg no.</label>
        <input class="in" ${attr}="fleetNo" value="${esc(p.fleetNo||"")}"></div>
      <div class="f"><label>Owned or hired</label>
        <select class="in" ${attr}="owner">
          ${["Owned","Hired","Subcontractor"].map(o=>`<option ${p.owner===o?"selected":""}>${esc(o)}</option>`).join("")}
        </select></div>
    </div>
    <div class="g2">
      <div class="f"><label>On site from</label>
        <input class="in" type="date" ${attr}="onDate" value="${esc(p.onDate||"")}"></div>
      <div class="f"><label>Thorough examination due</label>
        <input class="in ${ls.key==="expired"?"err":""}" type="date" ${attr}="examDate"
          value="${esc(examDateOf(p))}"></div>
    </div>
    <div class="hint" style="margin:-8px 0 0">LOLER for lifting equipment, PUWER for everything
    else. Leave blank if neither applies.</div>`;
}

function plantView(){
  const all = (DB.plant||[]).filter(p=>p.job===DB.job);
  const live = currentPlant();
  const liveIds = live.map(p=>p.id);
  const onSite = all.filter(p=>liveIds.includes(p.id));
  const offSite = all.filter(p=>!liveIds.includes(p.id))
    .sort((x,y)=>(y.offDate||"").localeCompare(x.offDate||""));

  const alerts = lolerAlerts();
  const alertCard = alerts.length ? (function(){
    const bad = alerts.some(x=>x.st.key==="expired");
    return `<div class="card" style="background:${bad?"var(--bad-bg)":"var(--warn-bg)"};box-shadow:none">
      <h3 style="color:${bad?"var(--bad)":"var(--warn)"}">
        ${bad?"Thorough examination overdue":"Thorough examination due"}</h3>
      <p>${alerts.map(x=>esc((x.p.item||"Unnamed item")+" — "+x.st.label)).join("<br>")}</p></div>`;
  })() : "";

  const liveRows = onSite.map(p=>{
    if(plantEditId===p.id){
      return `<div class="card" style="box-shadow:inset 0 0 0 1.5px var(--green)">
        ${plantFields(p, "data-pl-"+p.id)}
        <button class="btn" style="margin:14px 0 0" data-pldone="${p.id}">Done</button>
      </div>`;
    }
    const ls = lolerState(p);
    const tint = ls.key==="expired" ? "background:var(--bad-bg);box-shadow:none"
      : ls.key==="soon" ? "background:var(--warn-bg);box-shadow:none" : "";

/* ------------------------------------------------------------- timesheet -- */
/* Built entirely from the diaries. Nothing is typed twice. */
function timesheetWeek(ws){
  const days = weekDays(ws);
  const people = {};
  days.forEach(d=>{
    const rec = DB.records.find(r=>r.date===d && r.job===DB.job && r.status==="submitted");
    (rec && rec.data.labourTable || []).forEach(row=>{
      const key = row.id || row.name;
      if(row.leave){
        if(!people[key]) people[key] = { name:row.name, trade:row.trade, days:{}, total:0 };
        people[key].days[d] = { leave:row.leave, hours:0 };
        return;
      }
      if(row.onSite!==true) return;
      if(!people[key]) people[key] = { name:row.name, trade:row.trade, days:{}, total:0 };
      const h = rowHours(row);
      people[key].days[d] = { hours:h, start: row.normal===false?row.start:hoursFor().start,
        finish: row.normal===false?row.finish:hoursFor().finish, normal: row.normal!==false,
        reason: row.reason||"" };
      people[key].total += h;
    });
  });
  return { days, people:Object.values(people) };
}

function timesheetView(){
  const ws = view.week || weekStart(todayISO());
  const { days, people } = timesheetWeek(ws);
  const grand = people.reduce((n,p)=>n+p.total,0);
  const round = n => Math.round(n*100)/100;
  const LETTERS = ["M","T","W","T","F","S","S"];

  const dayCell = (p, d, i) => {
    const c = p.days[d];
    const weekend = i > 4;
    let cls = "none", val = "–";
    if(c && c.leave){ cls = "hol"; val = c.leave; }
    else if(c){ cls = c.normal ? "norm" : "extra"; val = round(c.hours); }
    return `<div class="tsday ${cls}${weekend?" we":""}">
      <span class="dl">${LETTERS[i]}</span><span class="dv">${esc(val)}</span></div>`;
  };

  const body = people.map(p=>`
    <div class="tsperson">
      <div class="tshead">
        <span class="nm">${esc(p.name)}<span class="tr">${esc(p.trade||"")}</span></span>
        <span class="tot">${round(p.total)}<span> hrs</span></span>
      </div>
      <div class="tsdays">${days.map((d,i)=>dayCell(p,d,i)).join("")}</div>
    </div>`).join("");

  return `<div class="top"><button class="chip" data-go="home">&lsaquo; Back</button></div>
    <h1 class="greet" style="font-size:22px;margin-top:12px">Timesheet</h1>
    <p class="sub">${esc(DB.job)}</p>

    <div class="card" style="display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:12px">
      <button class="btn line sm" style="margin:0" data-ts="-1" aria-label="Previous week">&lsaquo;</button>
      <span style="flex:1;text-align:center">
        <b style="display:block;font-weight:650">${ws===weekStart(todayISO())?"This week":"Week commencing "+shortDate(ws)}</b>
        <span style="font-size:12.5px;color:var(--ink-3)">${shortDate(ws)} – ${shortDate(addDays(ws,6))}</span>
      </span>
      <button class="btn line sm" style="margin:0" data-ts="1"
        ${ws>=weekStart(todayISO())?"disabled":""} aria-label="Next week">&rsaquo;</button>
    </div>

    ${people.length ? `
      <div class="tstotal">
        <div><div class="big">${round(grand)}</div><div class="lab">hours this week</div></div>
        <div class="side">${people.length} ${people.length===1?"person":"people"}<br>
          ${people.filter(p=>p.total>0).length} worked</div>
      </div>

      <div class="tsgrid">${body}</div>

      <div class="tskey">
        <span><i style="background:var(--canvas);box-shadow:inset 0 0 0 1px var(--line)"></i>Normal hours</span>
        <span><i style="background:var(--warn-bg)"></i>Outside normal hours</span>
        <span><i style="background:var(--info-bg)"></i>Booked off</span>
      </div>
      <p style="font-size:12.5px;color:var(--ink-3);padding:8px 4px 0">
        Hours are finish minus start, less a ${hoursFor().breakMins} minute break.</p>

      <button class="btn" style="margin-top:16px" data-tsprint="${ws}">Open timesheet PDF</button>`
    : `<div class="card"><h3>Nothing yet</h3><p>Submit a diary with labour on it and the
        timesheet appears here.</p></div>`}`;
}

function pathFor(r){
  const c = cfg(), d = parse(r.date);
  const folder = c.sharepoint.folder
    .replace(/{job}/g, r.job).replace(/{year}/g, d.getFullYear())
    .replace(/{month}/g, MON[d.getMonth()]);
  const file = c.sharepoint.filename
    .replace(/{job}/g, r.job).replace(/{date}/g, r.date).replace(/{ref}/g, r.ref||"");
  return (c.sharepoint.site?c.sharepoint.site+"/":"") + c.sharepoint.library + "/" + folder + "/" + file + ".pdf";
}
function previewPath(){
  return pathFor({ date: todayISO(), job: DB.job, ref: nextRef(true) });
}
function nextRef(peek){
  const n = (DB.counter||0) + 1;
  if(!peek) DB.counter = n;
  return cfg().refPrefix + "-" + String(n).padStart(4,"0");
}

/* ------------------------------------------------------------------ photos -- */
function pickPhoto(fieldId, useCamera){
  const inp = document.createElement("input");
  inp.type="file"; inp.accept="image/*"; inp.multiple=true;
  if(useCamera) inp.setAttribute("capture","environment");
  inp.onchange = async () => {
    const out=[];
    for(const file of Array.from(inp.files).slice(0,10)){
      try{ out.push(await stampPhoto(file)); }catch(e){}
    }
    const cur = formState.values[fieldId]||[];
    formState.values[fieldId] = cur.concat(out).slice(0,20);
    render(); toast(out.length+" photo"+(out.length===1?"":"s")+" added");
  };
  inp.click();
}
/* Stamp burned into the pixels, so it survives the file being copied out of
   SharePoint and dropped into a report: time top right, logo bottom right. */
const MONS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function photoStampText(t){
  const d = new Date(t);
  const two = n => String(n).padStart(2,"0");
  return d.getDate()+" "+MONS[d.getMonth()]+" "+d.getFullYear()+" at "
    + two(d.getHours())+":"+two(d.getMinutes())+":"+two(d.getSeconds());
}
function loadImage(src){
  return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
}

function stampPhoto(file){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onerror = ()=>rej();
    fr.onload = () => {
      const img = new Image();
      img.onerror = ()=>rej();
      img.onload = async () => {
        const max = 1400;
        const sc = Math.min(1, max/Math.max(img.width,img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width*sc);
        cv.height = Math.round(img.height*sc);
        const g = cv.getContext("2d");
        g.drawImage(img, 0, 0, cv.width, cv.height);

        const W = cv.width, H = cv.height;
        const unit = Math.min(W, H);
        const margin = Math.round(unit*0.022);
        const takenAt = Date.now();

        /* time, top right, on a grey panel */
        const fs = Math.max(15, Math.round(unit*0.045));
        g.font = "700 "+fs+"px -apple-system, 'Segoe UI', system-ui, sans-serif";
        const text = photoStampText(takenAt);
        const tw = g.measureText(text).width;
        const padX = Math.round(fs*0.5), padY = Math.round(fs*0.34);
        const boxW = tw + padX*2, boxH = fs + padY*2;
        const boxX = W - margin - boxW, boxY = margin;
        g.fillStyle = "rgba(96,101,98,.62)";
        g.fillRect(boxX, boxY, boxW, boxH);
        g.fillStyle = "#fff";
        g.textBaseline = "middle";
        g.textAlign = "left";
        g.fillText(text, boxX + padX, boxY + boxH/2 + 1);

        /* logo, bottom right, on white so it reads over any background */
        try{
          const logo = await loadImage(LOGO);
          const lw = Math.round(W*0.24);
          const lh = Math.round(lw * (logo.height/logo.width));
          const lp = Math.round(lw*0.07);
          g.fillStyle = "#fff";
          g.fillRect(W - margin - lw - lp*2, H - margin - lh - lp*2, lw + lp*2, lh + lp*2);
          g.drawImage(logo, W - margin - lw - lp, H - margin - lh - lp, lw, lh);
        }catch(e){ /* carry on without it rather than lose the photo */ }

        res({ src: cv.toDataURL("image/jpeg",.72), takenAt });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ------------------------------------------------------------------ events -- */
function getVal(path){
  const parts = String(path).split(".");
  if(parts.length===1) return formState.values[parts[0]];
  const [fid, idx, cid] = parts;
  const row = (formState.values[fid]||[])[Number(idx)];
  return row ? row[cid] : undefined;
}
function setVal(path, value){
  const parts = String(path).split(".");
  if(parts.length===1){ formState.values[parts[0]] = value; return; }
  const [fid, idx, cid] = parts;
  formState.values[fid][Number(idx)][cid] = value;
}
function getField(id){
  for(const s of DIARY) for(const f of s.fields) if(f.id===id) return f;
  return null;
}

  if(vop) vop.onclick = ()=>printVo(vop.dataset.voprint);

  app.querySelectorAll("[data-lvd]").forEach(el=>{
    el.oninput = () => { if(leaveDraft) leaveDraft[el.dataset.lvd] = el.value; };
    el.onchange = el.oninput;
  });
  const lva = app.querySelector("[data-lvadd]");
  if(lva) lva.onclick = ()=>{ leaveDraft = { personId:"", type:"HOL", from:todayISO(), to:todayISO(), note:"" }; render(); };
  const lvc = app.querySelector("[data-lvcancel]");
  if(lvc) lvc.onclick = ()=>{ leaveDraft = null; render(); };
  const lvs = app.querySelector("[data-lvsave]");
  if(lvs) lvs.onclick = ()=>{
    if(!leaveDraft.personId){ toast("Choose who is off"); return; }
    if(leaveDraft.to < leaveDraft.from){ toast("The end date is before the start"); return; }
    DB.leave = DB.leave || [];
    DB.leave.push(Object.assign({ id:"lv_"+Date.now() }, leaveDraft));
    leaveDraft = null; save(); render(); toast("Booked");
  };
  app.querySelectorAll("[data-lvrm]").forEach(el=>el.onclick=()=>{
    const id = el.getAttribute("data-lvrm");
    askConfirm("Remove this booking?","Diaries already submitted keep what they recorded.",
      "Remove", ()=>{ DB.leave = DB.leave.filter(x=>x.id!==id); save(); render(); toast("Removed"); });
  });

  app.querySelectorAll("[data-ts]").forEach(el=>el.onclick=()=>{
    const ws = view.week || weekStart(todayISO());
    go("timesheet", { week: addDays(ws, 7*Number(el.dataset.ts)) });
  });
  const tsp = app.querySelector("[data-tsprint]");
  if(tsp) tsp.onclick = ()=>printTimesheet(tsp.dataset.tsprint);

  const sh = app.querySelector("[data-share]"); if(sh) sh.onclick = shareBackup;
  const ex = app.querySelector("[data-export]"); if(ex) ex.onclick = exportBackup;
  const im = app.querySelector("[data-import]"); if(im) im.onclick = importBackup;
}
function after(){ if(formState.touched) formState.errors = validate(); render(); }

function saveDraft(){
  const id = formState.id || ("rec_"+Date.now());
  const existing = DB.records.find(r=>r.id===id);
  const rec = existing || { id, job:DB.job, date:formState.date, ref:null,
    status:"draft", createdAt:Date.now(), by:cfg().user.name };
  rec.data = formState.values;
  rec.updatedAt = Date.now();
  if(!existing) DB.records.push(rec);
  formState.id = id;
  save();
  return rec;
}
function submitForm(){
  formState.touched = true;
  formState.errors = validate();
  const n = Object.keys(formState.errors).length;
  if(n){
    render();
    toast(n+" question"+(n>1?"s":"")+" still to answer");
    const first = document.getElementById("fl_"+Object.keys(formState.errors)[0]);
    if(first) first.scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  const rec = saveDraft();
  if(rec.status!=="submitted"){ rec.ref = nextRef(); }
  rec.status = "submitted";
  rec.submittedAt = Date.now();
  rec.by = cfg().user.name;
  rec.byEmail = cfg().user.email;
  rec.synced = false;
  rec.version = (rec.version||0)+1;
  syncVo(rec);
  save();
  const vo = voForRecord(rec.id);
  toast(vo ? "Diary submitted · "+vo.ref+" raised" : "Diary submitted");
  go("record",{id:rec.id});
}

/* -------------------------------------------------------------------- PDF -- */
function printRecord(id){
  const r = DB.records.find(x=>x.id===id);
  const c = cfg();
  const fmt = (fl,v) => v===undefined||v===null||v===""?"—"
    : fl.type==="duration" ? (durText(v)||"—")
    : fl.type==="yesno" ? (v?"Yes":"No")
    : Array.isArray(v) ? (v.length?v.join(", "):"—")
    : String(v)+(fl.suffix?" "+fl.suffix:"");
  let body = "";
  DIARY.forEach(s=>{
    const fs = s.fields.filter(f=>visible(f,r.data) && f.type!=="photos" && f.type!=="signature");
    if(!fs.length) return;
    body += `<h2>${esc(s.title)}</h2>`;
    fs.forEach(f=>{
      if(f.type==="planttable"||f.type==="labourtable"){
        body += tableRows(f, r.data[f.id]);
        return;
      }
      if(f.type==="repeater"){
        const rows = r.data[f.id]||[];
        body += `<div style="font-weight:600;margin:6px 0 3px">${esc(f.label)}</div>`;
        body += rows.length ? `<table><tr>`+f.columns.map(cl=>`<th style="width:auto">${esc(cl.label)}</th>`).join("")+`</tr>`+
          rows.map(row=>`<tr>`+f.columns.map(cl=>{
            const cv = row[cl.id];
            return `<td>${esc(Array.isArray(cv)?(cv.length?cv.join(", "):"—"):fmt(cl,cv))}</td>`;
          }).join("")+`</tr>`).join("")+`</table>`
          : `<div style="color:#666;margin-bottom:6px">None recorded</div>`;
      } else {
        const raw = r.data[f.id];
        const shown = Array.isArray(raw) ? (raw.length?raw.join(", "):"—") : fmt(f,raw);
        body += `<table><tr><th>${esc(f.label)}</th><td>${esc(shown)}</td></tr></table>`;
      }
    });
  });
  const photos = r.data.photos||[];
  if(photos.length){
    body += `<h2>Photographs</h2><div class="imgs">`+
      photos.map((p,i)=>`<figure style="margin:0"><img src="${p.src}">
        <figcaption style="font-size:9.5px;color:#555">Photo ${i+1} · ${stamp(p.takenAt)}</figcaption></figure>`).join("")+`</div>`;
  }
  const sig = r.data.signature;
  if(sig){
    body += `<h2>Declaration</h2><p style="margin:0 0 6px">I confirm this is a true account of activity on site on
      ${longDate(r.date)}.</p><img src="${sig.src}" style="height:58px;border:1px solid #CBD3CD;padding:3px">
      <div style="font-size:10px;color:#555;margin-top:3px">${esc(r.by)} · ${esc(r.byEmail||"")} · ${stamp(r.submittedAt)}</div>`;
  }
  document.getElementById("sheet").innerHTML = `
    <div class="ph-head">
      <img src="${LOGO}" alt="${esc(c.company)}">
      <div style="text-align:right"><h1>Daily Diary</h1>
      <div style="font-size:10.5px;color:#555">${esc(r.ref||"")} · v${r.version||1}</div></div>
    </div>
    <table>
      <tr><th>Job</th><td>${esc(r.job)}</td></tr>
      <tr><th>Date</th><td>${longDate(r.date)}</td></tr>
      <tr><th>Completed by</th><td>${esc(r.by)} — ${stamp(r.submittedAt)}</td></tr>
    </table>
    ${body}
    <div class="foot"><span>${esc(c.company)} · ${esc(r.ref||"")}</span>
      <span>Printed ${stamp(Date.now())}</span></div>`;
  document.getElementById("sheetTitle").textContent = "Daily Diary — " + shortDate(r.date);
  document.getElementById("sheetwrap").classList.add("open");
  window.scrollTo(0,0);
}
document.getElementById("sheetClose").onclick = () =>
  document.getElementById("sheetwrap").classList.remove("open");
document.getElementById("sheetPrint").onclick = () => {
  window.print();
  toast("Choose \u201cSave as PDF\u201d in the print options");
};

function printTimesheet(ws){

    <div class="ph-head">
      <img src="${LOGO}" alt="${esc(c.company)}">
      <div style="text-align:right"><h1>Timesheet</h1>
        <div style="font-size:10.5px;color:#555">Week commencing ${shortDate(ws)}</div></div>
    </div>
    <table><tr><th>Job</th><td>${esc(DB.job)}</td></tr>
      <tr><th>Week</th><td>${shortDate(ws)} to ${shortDate(addDays(ws,6))}</td></tr>
      <tr><th>Prepared by</th><td>${esc(c.user.name)} — ${stamp(Date.now())}</td></tr></table>
    <h2>Hours worked</h2>
    <table>
      <tr><th style="width:auto">Name</th><th style="width:auto">Trade</th>
        ${days.map(d=>`<th style="width:auto;text-align:center">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][days.indexOf(d)]}<br>${parse(d).getDate()}</th>`).join("")}

    })()}
    <h2>Start and finish times</h2>

      ${people.map(p=>days.filter(d=>p.days[d]&&!p.days[d].leave).map(d=>`<tr>
        <td>${esc(p.name)}</td><td>${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][days.indexOf(d)]} ${shortDate(d)}</td>
        <td>${esc(p.days[d].start)}</td><td>${esc(p.days[d].finish)}</td>
        <td>${hoursFor().breakMins} min</td><td>${p.days[d].hours}</td>
        <td>${esc(p.days[d].reason||"")}</td></tr>`).join("")).join("")}
    </table>
    <div class="foot"><span>${esc(c.company)} · timesheet w/c ${shortDate(ws)}</span>
      <span>Built from the site diaries · ${stamp(Date.now())}</span></div>`;
  document.getElementById("sheetTitle").textContent = "Timesheet — w/c " + shortDate(ws);
  document.getElementById("sheetwrap").classList.add("open");
  window.scrollTo(0,0);

    </table>
    <h2>Agreement</h2>

/* ----------------------------------------------------------------- backup -- */
function backupFile(){
  const name = "site-diary-"+DB.job.replace(/[^a-z0-9]+/gi,"-").toLowerCase()+"-"+todayISO()+".json";
  return new File([JSON.stringify(DB,null,2)], name, { type:"application/json" });
}
function exportBackup(){
  const f = backupFile();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(f);
  a.download = f.name;
  a.click();
  toast("Backup saved");
}
async function shareBackup(){
  const f = backupFile();
  if(navigator.canShare && navigator.canShare({ files:[f] })){
    try{
      await navigator.share({ files:[f], title:"Site diary backup" });
      DB.lastShared = Date.now(); save(); render();
      return;
    }catch(e){ return; }              /* cancelled */
  }
  exportBackup();
}
/* Merge, never overwrite. Anything with the same id keeps whichever copy was
   edited last, so moving a file between phone and laptop is safe in both
   directions and nothing already entered is lost. */
function mergeInto(list, incoming, stampKey){
  const out = list.slice();
  (incoming||[]).forEach(inc=>{
    const i = out.findIndex(x=>x.id===inc.id);
    if(i<0){ out.push(inc); return; }
    const a = out[i][stampKey] || out[i].submittedAt || out[i].updatedAt || 0;
    const b = inc[stampKey] || inc.submittedAt || inc.updatedAt || 0;
    if(b >= a) out[i] = inc;
  });
  return out;
}
function importBackup(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{
    const fr=new FileReader();
    fr.onload=()=>{
      let d;
      try{ d = JSON.parse(fr.result); }catch(e){ toast("That file could not be read"); return; }
      if(!d || !Array.isArray(d.records)){ toast("That is not a diary backup"); return; }
      const before = DB.records.length;
      askConfirm("Merge this backup?",
        "It has "+d.records.length+" diar"+(d.records.length===1?"y":"ies")+". Anything newer in the file wins; nothing on this device is deleted.",
        "Merge", ()=>{
          DB.records = mergeInto(DB.records, d.records, "updatedAt");
          DB.plant   = mergeInto(DB.plant||[],  d.plant||[],  "id");
          DB.labour  = mergeInto(DB.labour||[], d.labour||[], "id");
          DB.counter = Math.max(DB.counter||0, d.counter||0);
          if(d.job && !DB.job) DB.job = d.job;
          save(); render();
          toast("Merged — "+(DB.records.length-before)+" new");
        });
    };
    fr.readAsText(inp.files[0]);
  };
  inp.click();
}

/* ------------------------------------------------------------------- boot -- */
if(!DB.config) DB.config = JSON.parse(JSON.stringify(CONFIG));
if(!DB.job) DB.job = CONFIG.jobs[0];
if(!DB.startDate){
  const earliest = (DB.records||[]).map(r=>r.date).sort()[0];
  DB.startDate = earliest && earliest < todayISO() ? earliest : todayISO();
}
if(!DB.plant) DB.plant = [];
if(!DB.labour) DB.labour = [];
if(!DB.leave) DB.leave = [];
if(!DB.vos) DB.vos = [];
if(DB.voCounter === undefined) DB.voCounter = 0;
if(!DB.jobHours) DB.jobHours = {};
if(!DB.jobHours[DB.job]){
  /* carry across anything set on the old app-wide setting, otherwise use the default */
  const old = DB.config && DB.config.hours;
  DB.jobHours[DB.job] = (old && old.start && old.finish)
    ? { start:old.start, finish:old.finish, breakMins:Number(old.breakMins)||30 }
    : JSON.parse(JSON.stringify(CONFIG.hours));
}
if(DB.config) delete DB.config.hours;
if(DB.config.allowDelete === undefined) DB.config.allowDelete = CONFIG.allowDelete;
save();
render();
