function homeView(){
  const c = cfg(), t = todayISO();
  const hour = new Date().getHours();
  const greet = hour<12 ? "Good Morning" : hour<17 ? "Good Afternoon" : "Good Evening";
  const firstName = (cfg().user.name||"").trim().split(" ")[0] || "";
  const sel = view.date || t;
  const days = weekDays(viewWeek);
  const canFwd = weekDays(viewWeek)[0] < weekStart(t);

  const strip = days.map((d,i) => {
    const st = statusFor(d);
    const wknd = !isWorking(d);
    const dot = st==="done" ? "ok" : st==="amber" ? "amber" : st==="red" ? "red"
      : st==="due" ? "due" : "";
    return `<button class="wd ${d===sel?"on":""} ${wknd?"we":""} ${d>t?"fut":""}"
      data-day="${d}" ${d>t?"disabled":""}>
      <span class="l">${["Mo","Tu","We","Th","Fr","Sa","Su"][i]}</span>
      <span class="n">${parse(d).getDate()}</span>
      <span class="s ${wknd?"":dot}"></span></button>`;
  }).join("");

  const rec = recordFor(sel);
  const st = statusFor(sel);
  const isToday = sel===t;
  let hero;
  if(rec && rec.status==="submitted"){
    hero = `<div class="hero calm">
      <div class="lab">${isToday?"Today":longDate(sel)}</div>
      <div class="ttl">Diary complete</div>
      <div class="why">Submitted at ${timeOnly(rec.submittedAt)} · ${esc(rec.ref)}</div>
      <button class="begin" data-view="${rec.id}">View it</button></div>`;
  } else if(st==="red" || st==="amber"){
    hero = `<div class="hero ${st==="red"?"late":""}">
      <div class="lab">${longDate(sel)}</div>
      <div class="ttl">${st==="red"?"Overdue":"Missed yesterday"}</div>
      <div class="why">${st==="red"
        ? "More than a day late. Fill it in while you still remember the day."
        : "Fill it in today and you are back on track."}</div>
      <button class="begin" data-start="${sel}">${rec?"Continue":"Fill it in"}</button></div>`;
  } else if(!isWorking(sel)){
    hero = `<div class="hero calm">
      <div class="lab">${longDate(sel)}</div>
      <div class="ttl">Not a working day</div>
      <div class="why">No diary needed. Add one anyway if the gang worked.</div>
      <button class="begin" data-start="${sel}">${rec?"Continue":"Add a diary"}</button></div>`;
  } else {
    hero = `<div class="hero">
      <div class="lab">${isToday?"Today":longDate(sel)}</div>
      <div class="ttl">Site diary</div>
      <div class="why">${rec?"You have a draft saved.":"Takes a couple of minutes."}</div>
      <button class="begin" data-start="${sel}">${rec?"Continue":"Begin"}</button></div>`;
  }

  /* second card: plant inspections for the selected day */
  const machines = plantNeedingCheck(sel);
  const doneChecks = checksFor(sel).filter(r=>r.status==="submitted");
  const allChecked = machines.length>0 && doneChecks.length>=machines.length;
  const plantHero = machines.length===0
    ? `<div class="hero calm">
        <div class="lab">Plant inspection</div>
        <div class="ttl">No plant on site</div>
        <div class="why">Add machines to the plant register and their checks appear here.</div>
        <button class="begin" data-go="plant">Plant register</button></div>`
    : allChecked
    ? `<div class="hero calm">
        <div class="lab">Plant inspection</div>
        <div class="ttl">All done</div>
        <div class="count">${machines.length} machine${machines.length===1?"":"s"} checked ${
          isToday?"today":"that day"}</div>
        <button class="begin" data-pick="${sel}">View them</button></div>`
    : `<div class="hero">
        <div class="lab">Plant inspection</div>
        <div class="ttl">${machines.length - doneChecks.length} to check</div>
        <div class="count">${doneChecks.length} of ${machines.length} done ${isToday?"today":"that day"}</div>
        <button class="begin" data-pick="${sel}">Begin</button></div>`;

  /* any machine currently carrying a defect */
  const faulty = currentPlant().map(m=>({ m, df: defectsFor(m.id), to: recipientFor(m) }))
    .filter(x=>x.df)
    .sort((a,b)=>(b.to.priority?1:0)-(a.to.priority?1:0) || a.df.oldest-b.df.oldest);

  /* the other daily health and safety forms */
  const dailyCard = (key) => {
    const def = FORMS[key];
    const rec = dailyRecordFor(key, sel);
    if(isDone(rec)) return `<div class="hero calm">
        <div class="lab">${isToday?"Today":shortDate(sel)}</div>
        <div class="ttl">${esc(def.name)}</div>
        <div class="count">Done at ${timeOnly(rec.submittedAt)}</div>
        <button class="begin" data-open="${rec.id}">View it</button></div>`;
    return `<div class="hero">
        <div class="lab">${isToday?"Today":shortDate(sel)}</div>
        <div class="ttl">${esc(def.name)}</div>
        <div class="why">${esc(def.blurb)}</div>
        <button class="begin" data-startf="${key}" data-d="${sel}">${rec?"Continue":"Begin"}</button></div>`;
  };

  /* excavations left open on the last working day */
  const excDue = excavationsDue(sel);
  const excDone = excsFor(sel).filter(r=>r.status==="submitted");
  const excLeft = excDue.filter(x=>!excFor(sel, x.ref) || excFor(sel, x.ref).status!=="submitted").length;

  const missed = missedDays();
  const missedCard = missed.length ? `<button class="card" style="width:100%;text-align:left;
    background:${missed.some(m=>m.level==="red")?"var(--bad-bg)":"var(--warn-bg)"};box-shadow:none"
    data-day="${missed[0].date}">
    <h3 style="color:${missed.some(m=>m.level==="red")?"var(--bad)":"var(--warn)"}">
      ${missed.reduce((n,m)=>n+m.owed.length,0)} outstanding on
      ${missed.length} day${missed.length>1?"s":""}</h3>
    ${missed.slice(0,3).map(m=>`<p style="color:var(--ink-2);margin-top:2px">
      <b style="font-weight:640">${shortDate(m.date)}</b> — ${esc(m.owed.slice(0,3).join(", "))}${
        m.owed.length>3?" and "+(m.owed.length-3)+" more":""}</p>`).join("")}
    ${missed.length>3?`<p style="font-size:12.5px;color:var(--ink-3);margin-top:6px">
      and ${missed.length-3} earlier day${missed.length-3>1?"s":""}</p>`:""}
  </button>` : "";

  const wk = days.filter(d => isWorking(d) && d<=t);
  const wkDone = wk.filter(d => statusFor(d)==="done").length;

  return header(isToday ? "Today" : shortDate(sel)) +
    `<h1 class="greet">${greet}${firstName?", "+esc(firstName):""}!</h1>
     <p class="sub">${esc(DB.job)}</p>
     <div class="week">
       <button class="warrow" data-week="-1" aria-label="Previous week">&lsaquo;</button>
       ${strip}
       <button class="warrow" data-week="1" ${canFwd?"":"disabled"} aria-label="Next week">&rsaquo;</button>
     </div>
     ${(function(){
       const diaryDone = !!(rec && rec.status==="submitted");
       const briefRec = dailyRecordFor("briefing", sel);
       const cards = [
         { label:"Diary",   done: diaryDone,               html: hero },
         { label:"Briefing", done: isDone(briefRec),        html: dailyCard("briefing") },
         { label:"Plant",   done: machines.length>0 && allChecked, html: plantHero }
       ];
       return `<div class="ctabs" id="heroTabs">${cards.map((c,i)=>`
           <button class="ctab ${i?"":"on"}" data-cgo="${i}">
             ${c.done ? `<span class="tick">&#10003;</span>` : `<span class="todo"></span>`}
             ${esc(c.label)}
           </button>`).join("")}</div>
         <div class="carousel" id="heroCar">${cards.map(c=>c.html).join("")}</div>`;
     })()}
     <div class="sect">As required</div>
     ${(function(){
       /* raised by the diary, but only shown when there is something to do */
       const level = excDue.length && excLeft ? "amber" : "";
       const bg = level ? "background:var(--warn-bg);box-shadow:none" : "";
       const fg = level ? "var(--warn)" : "var(--ink-3)";
       const line = excDue.length
         ? (excLeft
             ? excLeft + " raised by the diary — left open on " + shortDate(excDue[0].fromDate)
             : excDone.length + " inspected " + (isToday ? "today" : "that day"))
         : excDone.length
         ? excDone.length + " recorded " + (isToday ? "today" : "that day")
         : "As required — anything left open overnight raises one";
       return `<div class="card" style="${bg}">
         <div style="display:flex;align-items:center;gap:12px">
           <span style="flex:1">
             <b style="font-size:16px;font-weight:640;display:block;${level?`color:${fg}`:""}">
               Excavation inspection</b>
             <span style="font-size:13px;color:${fg}">${esc(line)}</span></span>
           ${level ? `<span class="pill warn">${excLeft}</span>` : ""}
           <button class="btn line sm" style="margin:0" data-pickexc="${sel}">
             ${excDue.length && excLeft ? "Begin" : (excDue.length||excDone.length) ? "View" : "Add one"}</button>
         </div></div>`;
     })()}
     ${(function(){
       const rec = dailyRecordFor("havs", sel);
       const done = isDone(rec);
       return `<div class="card">
         <div style="display:flex;align-items:center;gap:12px">
           <span style="flex:1">
             <b style="font-size:16px;font-weight:640;display:block">HAVs record</b>
             <span style="font-size:13px;color:var(--ink-3)">${done
               ? "Done at "+timeOnly(rec.submittedAt)
               : "As required — only on a day vibrating tools have been used"}</span></span>
           ${done
             ? `<button class="btn line sm" style="margin:0" data-open="${rec.id}">View</button>`
             : `<button class="btn line sm" style="margin:0" data-startf="havs" data-d="${sel}">Add one</button>`}
         </div></div>`;
     })()}
     ${(function(){
       const due = weeklyOutstanding(sel);
       if(!due.length) return `<div class="card" style="background:var(--green-50);box-shadow:none">
         <h3 style="color:var(--green-700)">Weekly checks done</h3>
         <p>PUWER and LOLER registers are in for this week.</p></div>`;
       return `<div class="card" style="background:var(--warn-bg);box-shadow:none">
         <h3 style="color:var(--warn)">${due.length} weekly check${due.length===1?"":"s"} to do</h3>
         <p style="margin-bottom:12px">Due once a week, any day that suits.</p>
         ${due.map(f=>`<button class="row" style="width:100%;border:0;padding:9px 0"
           data-startf="${f.key}" data-d="${sel}">
           <span class="n"><b style="font-size:15px">${esc(f.name)}</b>
             <span>${esc(f.blurb)}</span></span>
           <span style="color:var(--ink-3)">&rsaquo;</span></button>`).join("")}
       </div>`;
     })()}
     ${faulty.length ? `<button class="card" style="width:100%;text-align:left;
       background:var(--bad-bg);box-shadow:none" data-go="plant">
       <h3 style="color:var(--bad)">${faulty.reduce((n,x)=>n+x.df.items.length,0)} plant defect${
         faulty.reduce((n,x)=>n+x.df.items.length,0)===1?"":"s"}</h3>
       ${faulty.map(x=>`<p style="color:var(--ink-2);margin-top:2px">
         <b style="font-weight:640">${esc(x.m.item||"Machine")}${x.m.fleetNo?" ("+esc(x.m.fleetNo)+")":""}</b>
         — ${x.df.items.map(i=>esc(i.item)).join(", ")}${x.df.unsafe?" · not fit for use":""}
         <span style="display:block;color:var(--bad);font-weight:640">Reported ${ageText(x.df.oldest)}
           · ${x.to.priority ? "our fitter · priority" : "on hire from "+esc(x.to.name)}</span></p>`).join("")}
       <span style="display:block;font-size:12.5px;color:var(--bad);font-weight:640;margin-top:8px">
         Open the plant register to send a defect report &rsaquo;</span>
     </button>` : ""}
     ${missedCard}
     <div class="card">
       <div style="display:flex;justify-content:space-between;align-items:baseline">
         <h3>This week</h3>
         <b style="font-variant-numeric:tabular-nums">${wkDone} of ${wk.length}</b>
       </div>
       <span class="bar"><i style="width:${wk.length?(wkDone/wk.length*100):0}%"></i></span>
     </div>
`;
}

/* ------------------------------------------------------------------- form -- */
let formState = null;

function visible(f, v){ return !f.showIf || v[f.showIf.field] === f.showIf.equals; }

function startForm(date, formKey, plantId, excRef){
  formKey = formKey || "diary";
  const def = formDef(formKey);
  const rec = formKey==="diary" ? recordFor(date)
    : formKey==="excavation" ? excFor(date, excRef||"")
    : formKey==="plantcheck" ? checkFor(date, plantId)
    : def.weekly ? weeklyRecordFor(formKey, date)
    : dailyRecordFor(formKey, date);
  if(rec && rec.status==="submitted"){ go("record",{id:rec.id}); return; }
  const values = rec ? JSON.parse(JSON.stringify(rec.data)) : prefill(date, formKey, excRef);
  if(rec){
    ["personnel","plant","activities","progress","deliveries","dwLabour_old"].forEach(k=>{ delete values[k]; });
    values.tasks = values.tasks || [];
    values.plantTable = values.plantTable || [];
    const stillHere = onSitePlant(date).map(p=>p.id);
    values.plantTable = values.plantTable.filter(r =>
      stillHere.includes(r.id) || r.inUse !== undefined);   /* keep anything answered */
    onSitePlant(date).forEach(p=>{ if(!values.plantTable.some(r=>r.id===p.id))
      values.plantTable.push({ id:p.id, item:p.item, fleetNo:p.fleetNo,
        exam:examDateOf(p)?shortDate(examDateOf(p)):"n/a", inUse:undefined }); });
    values.labourTable = values.labourTable || [];
    onSiteLabour(date).forEach(l=>{ if(!values.labourTable.some(r=>r.id===l.id))
      { const lv = leaveOn(l.id, date);
        values.labourTable.push({ id:l.id, name:l.name, trade:l.trade,
          leave: lv?lv.type:"", leaveNote: lv?leaveLabel(lv.type):"",
          onSite: lv?false:undefined, normal:undefined, start:"", finish:"", reason:"" }); } });
    /* leave booked after a draft was started still shows */
    values.labourTable.forEach(r=>{
      const lv = leaveOn(r.id, date);
      if(lv && !r.leave){ r.leave = lv.type; r.leaveNote = leaveLabel(lv.type); r.onSite = false; }
      if(!lv && r.leave){ r.leave = ""; r.leaveNote = ""; }
    });
  }
  formState = { date, values, errors:{}, touched:false, id: rec?rec.id:null,
    form: formKey, plantId: plantId||null, excRef: excRef || (rec&&rec.excRef) || null };
  go("form",{date});
}
function prefill(date, formKey, excRef){
  const v = {};
  sectionsFor(formKey||"diary").forEach(s=>s.fields.forEach(f=>{
    if(f.type==="repeater"||f.type==="checkboxes"||f.type==="photos") v[f.id]=[];
  }));
  if(formKey === "briefing"){
    v.deliveredBy = cfg().user.name;
    v.hazards = [];
    v.attendees = [];
    return v;
  }
  if(formKey === "havs"){
    v.supervisor = cfg().user.name;
    v.entries = [];
    return v;
  }
  if(formKey === "puwer"){
    /* everything on the tool register, ready to tick */
    v.tools = onSiteTools(date).map(t=>({
      tool: (t.item||"") + (t.idNo ? " — " + t.idNo : ""),
      ok: undefined, defects:"", action:""
    }));
    v.location = DB.job;
    return v;
  }
  if(formKey === "loler"){
    v.items = onSiteLifting(date).map(l=>({
      description: l.item || "", idNo: l.idNo || "",
      certEnd: examDateOf(l) || "", ok: undefined, status: "In use"
    }));
    v.location = DB.job;
    return v;
  }
  if(formKey === "excavation"){
    /* carry across what the diary already told us about it */
    const src = excavationsDue(date).find(x=>x.ref===excRef);
    if(src){
      v.ref = src.ref;
      if(src.location) v.location = src.location;
      if(src.depth !== undefined && src.depth !== "") v.depth = src.depth;
      if(src.support) v.support = src.support;
    } else if(excRef){ v.ref = excRef; }
    return v;
  }
  if((formKey||"diary")!=="diary") return v;
  const prev = DB.records.filter(r=>r.job===DB.job && r.status==="submitted" && r.date<date)
    .sort((a,b)=>a.date<b.date?1:-1)[0];
  if(prev && prev.data.personnel) v.personnel = JSON.parse(JSON.stringify(prev.data.personnel));

  /* Plant comes straight off the register, so the only thing to type is hours. */
  v.plantTable = onSitePlant(date).map(p => ({
    id:p.id, item:p.item, fleetNo:p.fleetNo,
    exam: examDateOf(p) ? shortDate(examDateOf(p)) : "n/a", inUse:undefined
  }));
  v.labourTable = onSiteLabour(date).map(l => {
    const lv = leaveOn(l.id, date);
    return { id:l.id, name:l.name, trade:l.trade,
      leave: lv ? lv.type : "", leaveNote: lv ? leaveLabel(lv.type) : "",
      onSite: lv ? false : undefined, normal:undefined, start:"", finish:"", reason:"" };
  });
  return v;
}
function validate(){
  const e = {}, v = formState.values;
  sectionsFor(formState.form).forEach(s=>s.fields.forEach(f=>{
    if(!visible(f,v) || !f.required) return;
    const val = v[f.id];
    if(f.type==="check"){
      if(!val || val.v===undefined){ e[f.id]="Answer this"; return; }
      if(val.v===false && !(val.defect||"").trim()){ e[f.id]="Describe the defect"; return; }
      return;
    }
    const empty = f.type==="duration" ? durEmpty(val)
      : (val===undefined||val===null||val===""||(Array.isArray(val)&&val.length===0));
    if(empty){ e[f.id]="Required"; return; }
    if(f.type==="planttable"){
      for(let i=0;i<val.length;i++) if(val[i].inUse===undefined)
        { e[f.id]="Say whether each item was in use"; return; }
      return;
    }
    if(f.type==="labourtable"){
      for(let i=0;i<val.length;i++){
        const r = val[i];
        if(r.leave) continue;                       /* booked off, nothing to answer */
        if(r.onSite===undefined){ e[f.id]="Say who was on site"; return; }
        if(r.onSite===true && r.normal===undefined)
          { e[f.id]=(r.name||"Someone")+": normal hours?"; return; }
        if(r.onSite===true && r.normal===false && (!r.start||!r.finish))
          { e[f.id]=(r.name||"Someone")+": start and finish time needed"; return; }
        if(r.onSite===true && r.normal===false && !(r.reason||"").trim())
          { e[f.id]=(r.name||"Someone")+": give a reason for the different hours"; return; }
      }
      return;
    }
    if(f.type==="repeater"){
      for(let i=0;i<val.length;i++) for(const c of f.columns){
        if(c.required && (val[i][c.id]===undefined||val[i][c.id]===""))
          { e[f.id]=(f.itemLabel||"Row")+" "+(i+1)+": "+c.label+" is required"; return; }
      }
    }
  }));
  return e;
}

function fieldHtml(f, v, err, path){
  const id = path||f.id;
  const val = v[f.id];
  const lab = f.type==="check" ? ""
    : `<label for="fl_${id}">${esc(f.label)}${f.required?' <span style="color:var(--bad)">*</span>':""}</label>`;
  const hint = f.hint?`<div class="hint">${esc(f.hint)}</div>`:"";
  let c = "";
  const ec = err?" err":"";
  switch(f.type){
    case "text": c=`<input id="fl_${id}" class="in${ec}" data-f="${id}" value="${esc(val||"")}">`; break;
    case "textarea": c=`<textarea id="fl_${id}" class="in${ec}" data-f="${id}">${esc(val||"")}</textarea>`; break;
    case "number":
      c=`<input id="fl_${id}" class="in${ec}" data-f="${id}" type="number" inputmode="decimal" step="any"
        value="${val===undefined||val===null?"":esc(val)}">`; break;
    case "time": c=`<input id="fl_${id}" class="in${ec}" data-f="${id}" type="time" value="${esc(val||"")}">`; break;
    case "duration":{
      const v = (val && typeof val==="object") ? val : { h: (typeof val==="number"?val:""), m:"" };
      c = `<div class="g2">
        <div style="position:relative">
          <input id="fl_${id}" class="in${ec}" type="number" inputmode="numeric" min="0"
            data-dur="${id}" data-part="h" value="${v.h===undefined?"":esc(v.h)}" placeholder="0">
          <span style="position:absolute;right:12px;top:16px;color:var(--ink-3);font-size:13.5px;
            font-weight:600;pointer-events:none">hours</span>
        </div>
        <div style="position:relative">
          <input class="in${ec}" type="number" inputmode="numeric" min="0" max="59"
            data-dur="${id}" data-part="m" value="${v.m===undefined?"":esc(v.m)}" placeholder="0">
          <span style="position:absolute;right:12px;top:16px;color:var(--ink-3);font-size:13.5px;
            font-weight:600;pointer-events:none">mins</span>
        </div>
      </div>`;
      break;
    }
    case "select":
      c=`<select id="fl_${id}" class="in${ec}" data-f="${id}"><option value="">Choose…</option>`+
        f.options.map(o=>`<option ${val===o?"selected":""}>${esc(o)}</option>`).join("")+`</select>`; break;
    case "plantselect":{
      const opts = onSitePlant(formState ? formState.date : null)
        .map(p => p.item + (p.fleetNo ? " ("+p.fleetNo+")" : ""))
        .filter(Boolean).concat(["Other / not on register"]);
      if(val && !opts.includes(val)) opts.unshift(val);
      c=`<select id="fl_${id}" class="in${ec}" data-f="${id}"><option value="">Choose…</option>`+
        opts.map(o=>`<option ${val===o?"selected":""}>${esc(o)}</option>`).join("")+`</select>`; break;
    }
    case "yesno":
      c=`<div class="seg">
        <button type="button" class="segb ${val===true?"y":""}" data-yes="${id}">Yes</button>
        <button type="button" class="segb ${val===false?"n":""}" data-no="${id}">No</button></div>`; break;
    case "checkboxes":{
      const arr = val||[];
      c=`<div class="cg">`+f.options.map(o=>
        `<button type="button" class="cb ${arr.includes(o)?"on":""}" data-chk="${id}" data-val="${esc(o)}">
          <span class="b">${arr.includes(o)?"&#10003;":""}</span>${esc(o)}</button>`).join("")+`</div>`; break;
    }
    case "repeater":{
      const rows = val||[];
      c = rows.map((row,i)=>{
        if(f.collapsible && row.__done){
          const first = f.columns.find(col=>row[col.id]);
          const summary = first ? String(row[first.id]).slice(0,70) : "Filled in";
          return `<div class="rep" style="background:var(--ok-bg);border-color:var(--ok)">
            <div class="rh"><span style="color:var(--ok)">${esc(f.itemLabel||"Item")} ${i+1} — complete</span>
              <button type="button" class="rm" style="color:var(--ink-2)"
                data-undone="${id}" data-i="${i}">Edit</button></div>
            <div style="font-size:14px;color:var(--ink-2)">${esc(summary)}</div>
          </div>`;
        }
        return `<div class="rep">
          <div class="rh"><span>${esc(f.itemLabel||"Item")} ${i+1}</span>
          <button type="button" class="rm" data-del="${id}" data-i="${i}">Remove</button></div>`+
          f.columns.map(col=>fieldHtml(Object.assign({},col,{required:false}), row, null, id+"."+i+"."+col.id)).join("")+
          (f.collapsible ? `<button type="button" class="btn" style="margin:6px 0 0"
            data-done="${id}" data-i="${i}">Complete ${esc((f.itemLabel||"item").toLowerCase())} ${i+1}</button>` : "")+
          `</div>`;
      }).join("") +
        `<button type="button" class="btn line" data-add="${id}">+ ${esc(f.addLabel||"Add")}</button>`;
      break;
    }
    case "photos":{
      const arr = val||[];
      c = (arr.length?`<div class="pg">`+arr.map((p,i)=>
        `<div class="ph"><img src="${p.src}" alt="Photograph ${i+1}" data-taken="${p.takenAt||""}">
          <button type="button" data-rmph="${id}" data-i="${i}" aria-label="Remove">&times;</button></div>`
        ).join("")+`</div>`:"") +
        `<div class="g2">
          <button type="button" class="btn line" style="margin:0" data-cam="${id}">Take photo</button>
          <button type="button" class="btn line" style="margin:0" data-lib="${id}">Upload</button>
        </div>
        <div class="hint" style="margin:8px 0 0">${arr.length
          ? arr.length+" attached · tap one to see it full size"
          : "Each photo is stamped with the time and the CGC logo."}</div>`;
      break;
    }
    case "havscalc":{
      const parts = String(id).split(".");
      const row = getVal(parts.slice(0,-1).join(".")) || {};
      const a = Number(row.magnitude)||0;
      const hrs = durHours(row.triggerTime);
      const pts = havsPoints(a, hrs);
      const st = havsStatus(pts);
      const eav = havsTimeTo(a, 2.5), elv = havsTimeTo(a, 5);
      if(!a){ c = `<div class="tempty" style="border:1.5px dashed var(--line);border-radius:13px">
        Choose a tool to see the exposure.</div>`; break; }
      c = `<div class="havsbox ${st.cls}">
        <div class="hrow"><span>Exposure points</span><b>${pts}</b></div>
        <div class="hrow"><span>Partial A(8)</span><b>${havsA8(pts)} m/s²</b></div>
        <div class="hrow"><span>Time to the action value</span><b>${hoursText(eav)}</b></div>
        <div class="hrow"><span>Time to the limit value</span><b>${hoursText(elv)}</b></div>
        <div class="hstat">${esc(st.label)}</div>
      </div>`;
      break;
    }
    case "havstotals":{
      const rows = havsTotals(formState ? formState.values.entries : []);
      if(!rows.length){ c = `<div class="tempty" style="border:1.5px dashed var(--line);border-radius:13px">
        Add an entry above and the totals appear here.</div>`; break; }
      c = `<div class="ttable">
        <div class="thead"><span class="c1">Operative</span><span class="c2">Points</span>
          <span class="c3">A(8)</span></div>`+
        rows.map(r=>`<div class="trow">
          <div class="main">
            <span class="c1"><b>${esc(r.name)}</b><span>${r.tools} tool${r.tools===1?"":"s"} · ${esc(r.status.label)}</span></span>
            <span class="c2" style="color:${r.status.cls==="red"?"var(--bad)":r.status.cls==="amber"?"var(--warn)":"var(--ok)"};font-weight:700">${r.points}</span>
            <span class="c3" style="text-align:center;font-weight:700">${r.a8}</span>
          </div>
          <div class="hbarwrap"><i style="width:${Math.min(100, r.points/4)}%;
            background:${r.status.cls==="red"?"var(--bad)":r.status.cls==="amber"?"var(--warn)":"var(--ok)"}"></i>
            <em style="left:25%"></em><em style="left:100%"></em></div>
        </div>`).join("")+
        `</div>
        <div class="hint" style="margin:8px 0 0">100 points is the daily action value,
        400 is the limit value. The marks on each bar show both.</div>`;
      break;
    }
    case "attendlist":{
      const arr = val||[];
      const date = formState ? formState.date : todayISO();
      const people = onSiteLabour(date);
      if(!people.length){
        c = `<div class="tempty" style="border:1.5px dashed var(--line);border-radius:13px">
          Nobody on the labour register yet. Add the gang under Project, Labour.</div>`;
        break;
      }
      c = `<div class="ttable">
        <div class="thead"><span class="c1">Name</span><span class="c3">Attended</span></div>`+
        people.map(pn=>{
          const off = leaveOn(pn.id, date);
          const on = arr.includes(pn.name);
          return `<div class="trow"${off?' style="background:var(--info-bg)"':""}>
            <div class="main">
              <span class="c1"><b>${esc(pn.name)}</b><span>${esc(pn.trade||"")}</span></span>
              ${off
                ? `<span class="pill info" style="flex:none">${esc(off.type)}</span>`
                : `<span class="yn" style="width:104px">
                    <button type="button" class="${on?"y":""}" data-att="${id}" data-name="${esc(pn.name)}" data-v="1">Yes</button>
                    <button type="button" class="${!on&&arr.length?"n":""}" data-att="${id}" data-name="${esc(pn.name)}" data-v="0">No</button>
                  </span>`}
            </div></div>`;
        }).join("")+
        `</div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button type="button" class="btn line sm" style="flex:1;margin:0"
            data-attall="${id}">Everyone on site</button>
          <button type="button" class="btn line sm" style="flex:1;margin:0"
            data-attnone="${id}">Clear</button>
        </div>
        <div class="hint" style="margin:8px 0 0">${arr.length} attended. Anyone booked off is
        marked automatically.</div>`;
      break;
    }
    case "peopleselect":{
      const opts = (currentLabour().map(l=>l.name).filter(Boolean));
      if(val && !opts.includes(val)) opts.unshift(val);
      c = `<select id="fl_${id}" class="in${ec}" data-f="${id}">
        <option value="">Choose…</option>`+
        opts.map(o=>`<option ${val===o?"selected":""}>${esc(o)}</option>`).join("")+
        `<option value="__other">Someone else…</option></select>`;
      break;
    }
    case "peoplepick":
    case "plantpick":{
      const arr = val||[];
      const opts = f.type==="peoplepick" ? availablePeople() : availablePlant();
      if(!opts.length){
        c = `<div class="tempty" style="border:1.5px dashed var(--line);border-radius:13px">
          ${f.type==="peoplepick"
            ? "Tick who was on site further up the form first."
            : "Nothing on the plant register for this job."}</div>`;
        break;
      }
      c = `<div style="display:flex;flex-wrap:wrap;gap:8px">`+
        opts.map(o=>`<button type="button" class="cb ${arr.includes(o)?"on":""}"
          style="min-height:46px;width:auto;padding:0 14px"
          data-chk="${id}" data-val="${esc(o)}">
          <span class="b">${arr.includes(o)?"&#10003;":""}</span>${esc(o)}</button>`).join("")+
        `</div>`;
      break;
    }
    case "planttable":{
      const rows = val||[];
      c = `<div class="ttable">
        <div class="thead"><span class="c1">Plant</span><span class="c2">Fleet no.</span>
          <span class="c3">In use</span></div>`+
        (rows.length ? rows.map((r,i)=>`<div class="trow"><div class="main">
            <span class="c1"><b>${esc(r.item||"Unnamed")}</b>
              <span class="subfleet">${esc(r.fleetNo||"No fleet no.")}</span></span>
            <span class="c2">${esc(r.fleetNo||"—")}</span>
            <span class="yn">
              <button type="button" class="${r.inUse===true?"y":""}" data-tbl="plantTable" data-i="${i}" data-k="inUse" data-v="1">Yes</button>
              <button type="button" class="${r.inUse===false?"n":""}" data-tbl="plantTable" data-i="${i}" data-k="inUse" data-v="0">No</button>
            </span></div></div>`).join("")
          : `<div class="tempty">Nothing on the plant register for this job yet.</div>`)+
        `</div>`;
      break;
    }
    case "labourtable":{
      const rows = val||[];
      c = `<div class="ttable">
        <div class="thead"><span class="c1">Name</span><span class="c3">On site</span></div>`+
        (rows.length ? rows.map((r,i)=>{
          const hrs = rowHours(r);
          if(r.leave){
            return `<div class="trow" style="background:var(--info-bg)"><div class="main">
              <span class="c1"><b>${esc(r.name||"Unnamed")}</b>
                <span>${esc(r.trade||"")}</span></span>
              <span class="pill info" style="flex:none">${esc(r.leave)} · ${esc(leaveLabel(r.leave))}</span>
            </div></div>`;
          }
          return `<div class="trow"><div class="main">
            <span class="c1"><b>${esc(r.name||"Unnamed")}</b><span>${esc(r.trade||"")}</span></span>
            <span class="yn">
              <button type="button" class="${r.onSite===true?"y":""}" data-tbl="labourTable" data-i="${i}" data-k="onSite" data-v="1">Yes</button>
              <button type="button" class="${r.onSite===false?"n":""}" data-tbl="labourTable" data-i="${i}" data-k="onSite" data-v="0">No</button>
            </span></div>
            ${r.onSite===true ? `<div class="more">
              <span class="lbl">Normal hours — ${esc(hoursFor().start)} to ${esc(hoursFor().finish)}, ${normalHours()} hours?</span>
              <span class="yn" style="width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px">
                <button type="button" class="${r.normal===true?"y":""}" data-tbl="labourTable" data-i="${i}" data-k="normal" data-v="1">Yes</button>
                <button type="button" class="${r.normal===false?"n":""}" data-tbl="labourTable" data-i="${i}" data-k="normal" data-v="0">No</button>
              </span>
              ${r.normal===false ? `
                <div class="timegrid" style="margin-top:10px">
                  <input type="time" value="${esc(r.start||"")}" data-tin="labourTable" data-i="${i}" data-k="start" aria-label="Start time">
                  <input type="time" value="${esc(r.finish||"")}" data-tin="labourTable" data-i="${i}" data-k="finish" aria-label="Finish time">
                  <span class="calc">${hrs?hrs+" hrs":"—"}</span>
                </div>
                <input class="in" style="min-height:46px;margin-top:8px" placeholder="Reason — e.g. left early for an appointment"
                  value="${esc(r.reason||"")}" data-tin="labourTable" data-i="${i}" data-k="reason" aria-label="Reason">
                ` : `<div style="margin-top:8px;font-size:13px;color:var(--ink-2)">
                  ${normalHours()} hours, ${esc(hoursFor().breakMins)} minute break deducted</div>`}
            </div>` : ""}
          </div>`;
        }).join("") : `<div class="tempty">Nobody on the labour register for this job yet.</div>`)+
        `</div>`;
      break;
    }
    case "check":{
      const cur = (val && typeof val==="object") ? val : {};
      const set = cur.v;
      c = `<div class="chk ${set===false?"bad":""}">
        <span class="lab">${esc(f.label)}</span>
        <div class="opts">
          <button type="button" class="${set===true?"y":""}" data-chk3="${id}" data-v="y">Yes</button>
          <button type="button" class="${set===false?"n":""}" data-chk3="${id}" data-v="n">No</button>
          <button type="button" class="${set==="na"?"na":""}" data-chk3="${id}" data-v="na">N/A</button>
        </div>
        ${set===false ? `<div class="fix">
          <textarea class="in" style="min-height:78px" placeholder="What is the defect?"
            data-chkd="${id}">${esc(cur.defect||"")}</textarea>
          ${(cur.photos||[]).length ? `<div class="pg" style="margin-top:10px">`+
            cur.photos.map((ph,pi)=>`<div class="ph"><img src="${ph.src}" alt="" data-taken="${ph.takenAt||""}">
              <button type="button" data-chkrm="${id}" data-i="${pi}" aria-label="Remove">&times;</button></div>`).join("")+
            `</div>` : ""}
          <div class="g2" style="margin-top:10px">
            <button type="button" class="btn line" style="margin:0" data-chkcam="${id}">Photo</button>
            <button type="button" class="btn line" style="margin:0" data-chklib="${id}">Upload</button>
          </div>
        </div>` : ""}
      </div>`;
      break;
    }
    case "signature":
      c = `<button type="button" class="sigbtn ${val?"signed":""}" data-sigopen="${id}">
          ${val && val.src
            ? `<img src="${val.src}" alt="Signature"><span class="done">Signed — tap to sign again</span>`
            : `<span>Tap to sign</span>
               <span style="font-size:12.5px;font-weight:500">Opens a full width signing pad</span>`}
        </button>
        ${val?`<div style="display:flex;justify-content:flex-end;padding-top:8px">
          <button type="button" data-sigclear="${id}" style="color:var(--bad);font-weight:650;font-size:13px">Clear</button>
        </div>`:""}`;
      break;
  }
  return `<div class="f">${lab}${hint}${c}${err?`<div class="err-msg">${esc(err)}</div>`:""}</div>`;
}

function formView(){
  const v = formState.values;
  const errs = formState.touched ? formState.errors : {};
  const def = formDef(formState.form);
  const secs = sectionsFor(formState.form);
  const machine = formState.plantId
    ? (DB.plant||[]).find(x=>x.id===formState.plantId) : null;
  let total=0, ok=0;
  secs.forEach(s=>s.fields.forEach(f=>{ if(f.required && visible(f,v)){ total++; if(!validate()[f.id]) ok++; }}));

  const body = secs.map(s=>{
    const fs = s.fields.filter(f=>visible(f,v));
    if(!fs.length) return "";
    const isChecks = fs.length && fs[0].type==="check";
    return `<div class="sect">${esc(s.title)}</div>`+
      (s.note?`<p class="sub" style="margin:-4px 0 10px;color:var(--ink-3)">${esc(s.note)}</p>`:"")+
      (isChecks ? fs.map(f=>fieldHtml(f, v, errs[f.id])).join("")
        : `<div class="card">`+fs.map(f=>fieldHtml(f, v, errs[f.id])).join("")+`</div>`);
  }).join("");

  return `<div class="top">
      <button class="chip" data-go="home">&lsaquo; Back</button>
      <span class="pill info">${ok}/${total} required</span>
    </div>
    <h1 class="greet" style="font-size:22px;margin-top:12px">${
      machine ? esc(machineType(machine.id))+" inspection" : esc(def.name)}</h1>
    ${formState.form==="excavation" && formState.excRef
      ? `<p class="sub" style="margin-top:-2px">Raised by the diary — ${esc(formState.excRef)}</p>` : ""}
    <p class="sub">${longDate(formState.date)}</p>
    ${machine ? `<div class="card" style="background:var(--green-50);box-shadow:none">
      <div class="kv"><span class="k">Competent person</span><span class="v">${esc(cfg().user.name)}</span></div>
      <div class="kv"><span class="k">Fleet number</span><span class="v">${esc(machine.fleetNo||"—")}</span></div>
      <div class="kv"><span class="k">Model</span><span class="v">${esc(machine.model||machine.item||"—")}</span></div>
      <div class="kv"><span class="k">Week commencing</span><span class="v">${shortDate(weekStart(formState.date))}</span></div>
      <div class="kv"><span class="k">Site</span><span class="v">${esc(DB.job)}</span></div>
    </div>` : ""}
    ${body}
    <button class="btn" data-submit="1">Submit ${esc(def.name.toLowerCase())}</button>
    <button class="btn ghost" data-draft="1">Save draft and close</button>`;
}

/* --------------------------------------------------------------- records -- */
function recordView(){
  const r = DB.records.find(x=>x.id===view.id);
  if(!r) return `<div class="card"><h3>Not found</h3></div>`;
  const rows = sectionsFor(r.form).map(s=>{
    const fs = s.fields.filter(f=>visible(f,r.data) && f.type!=="signature");
    if(!fs.length) return "";
    return `<div class="sect">${esc(s.title)}</div><div class="card">`+
      fs.map(f=>readRow(f, r.data[f.id])).join("")+`</div>`;
  }).join("");
  return `<div class="top"><button class="chip" data-go="home">&lsaquo; Back</button>
      <span class="pill ok">Submitted</span></div>
    <h1 class="greet" style="font-size:22px;margin-top:12px">${esc(r.ref)}</h1>
    <p class="sub">${esc(r.job)} · ${longDate(r.date)}</p>
    <div class="card">
      <div class="kv"><span class="k">Submitted by</span><span class="v">${esc(r.by)}</span></div>
      <div class="kv"><span class="k">Submitted at</span><span class="v">${stamp(r.submittedAt)}</span></div>
      <div class="kv"><span class="k">SharePoint</span><span class="v">${r.synced?"Filed":"Awaiting connection"}</span></div>
      <div class="kv"><span class="k">Will file to</span>
        <span class="v" style="font-size:12px;word-break:break-all">${esc(pathFor(r))}</span></div>
    </div>
    ${r.form==="plantcheck"
      ? `<button class="btn" data-weeksheet="${r.plantId}" data-ws="${weekStart(r.date)}">
           Open the week's sheet</button>
         <p class="sub" style="margin:-2px 0 12px;font-size:12.5px;color:var(--ink-3)">
           Checks are issued as one sheet per machine per week, not one per day.</p>`
      : `<button class="btn" data-pdf="${r.id}">Open PDF</button>`}
    <button class="btn ghost" data-reopen="${r.id}">Amend</button>
    ${cfg().allowDelete ? `<button class="btn line" style="color:var(--bad)"
      data-del-rec="${r.id}">Delete this diary</button>` : ""}
    ${rows}`;
}
function tableRows(f, val){
  const rows = val||[];
  if(f.type==="planttable"){
    if(!rows.length) return "<div style='color:#666'>None on site</div>";
    return `<table style="width:100%;border-collapse:collapse;font-size:12px">
      <tr><th style="text-align:left">Plant</th><th style="text-align:left">Fleet no.</th>
      <th style="text-align:left">In use</th></tr>`+
      rows.map(r=>`<tr><td>${esc(r.item||"")}</td><td>${esc(r.fleetNo||"")}</td>
        <td>${r.inUse===true?"Yes":r.inUse===false?"No":"—"}</td></tr>`).join("")+`</table>`;
  }
  if(!rows.length) return "<div style='color:#666'>Nobody recorded</div>";
  return `<table style="width:100%;border-collapse:collapse;font-size:12px">
    <tr><th style="text-align:left">Name</th><th style="text-align:left">Trade</th>
    <th style="text-align:left">On site</th><th style="text-align:left">Start</th>
    <th style="text-align:left">Finish</th><th style="text-align:left">Hours</th>
    <th style="text-align:left">Reason if different</th></tr>`+
    rows.map(r=>{
      const h = rowHours(r);
      return `<tr><td>${esc(r.name||"")}</td><td>${esc(r.trade||"")}</td>
        <td>${r.onSite===true?"Yes":r.onSite===false?"No":"—"}</td>
        <td>${esc(r.onSite&&r.normal===false?r.start:(r.onSite?hoursFor().start:"—"))}</td>
        <td>${esc(r.onSite&&r.normal===false?r.finish:(r.onSite?hoursFor().finish:"—"))}</td>
        <td>${r.onSite?h:"—"}</td>
        <td>${esc(r.reason||"")}</td></tr>`;
    }).join("")+`</table>`;
}

function readRow(f, val){
  if(f.type==="havscalc") return "";
  if(f.type==="havstotals"){
    const rows = havsTotals((view && DB.records.find(r=>r.id===view.id) || {data:{}}).data.entries);
    if(!rows.length) return "";
    return `<div class="kv" style="display:block"><span class="k">${esc(f.label)}</span>
      <table class="tbl" style="margin-top:6px"><tr><th>Operative</th><th>Points</th><th>A(8)</th><th>Status</th></tr>`+
      rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.points}</td><td>${r.a8}</td>
        <td style="color:${r.status.cls==="red"?"var(--bad)":r.status.cls==="amber"?"var(--warn)":"var(--ok)"}">
        ${esc(r.status.label)}</td></tr>`).join("")+`</table></div>`;
  }
  if(f.type==="check"){
    const v = val||{};
    const txt = v.v===true?"Yes":v.v===false?"No":v.v==="na"?"N/A":"—";
    return `<div class="kv"><span class="k">${esc(f.label)}</span>
      <span class="v" style="color:${v.v===false?"var(--bad)":"inherit"}">${txt}${
        v.v===false&&v.defect?" — "+esc(v.defect):""}</span></div>`;
  }
  if(f.type==="peoplepick"||f.type==="plantpick"||f.type==="attendlist"){
    return `<div class="kv"><span class="k">${esc(f.label)}</span>
      <span class="v">${val&&val.length?esc(val.join(", ")):"—"}</span></div>`;
  }
  if(f.type==="planttable"||f.type==="labourtable"){
    return `<div class="kv" style="display:block"><span class="k">${esc(f.label)}</span>
      <div style="margin-top:6px;overflow-x:auto">${tableRows(f,val)}</div></div>`;
  }
  const fmt = (fl,v) => v===undefined||v===null||v===""?"—"
    : fl.type==="duration" ? (durText(v)||"—")
    : fl.type==="yesno" ? (v?"Yes":"No")
    : Array.isArray(v) ? (v.length?v.join(", "):"—")
    : String(v)+(fl.suffix?" "+fl.suffix:"");
  if(f.type==="photos"){
    if(!val||!val.length) return "";
    return `<div class="kv" style="display:block"><span class="k">${esc(f.label)}</span>
      <div class="pg" style="margin-top:8px">`+val.map((p,i)=>
        `<div class="ph"><img src="${p.src}" alt="Photograph ${i+1}" data-taken="${p.takenAt||""}"></div>`
      ).join("")+`</div>
      <div style="font-size:12.5px;color:var(--ink-3);margin-top:6px">Tap a photo to see it full size.</div></div>`;
  }
  if(f.type==="repeater"){
    const rows = val||[];
    if(!rows.length) return `<div class="kv"><span class="k">${esc(f.label)}</span><span class="v">None</span></div>`;
    return `<div class="kv" style="display:block"><span class="k">${esc(f.label)}</span>
      <table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:6px">
      <tr>`+f.columns.map(c=>`<th style="text-align:left;font-size:11px;color:var(--ink-3);padding:4px 4px">${esc(c.label)}</th>`).join("")+`</tr>`+
      rows.map(row=>`<tr>`+f.columns.map(c=>`<td style="padding:5px 4px;border-top:1px solid var(--line-2)">${esc(fmt(c,row[c.id]))}</td>`).join("")+`</tr>`).join("")+
      `</table></div>`;
  }
  return `<div class="kv"><span class="k">${esc(f.label)}</span><span class="v">${esc(fmt(f,val))}</span></div>`;
}

let listFilter = "all";
let listDate = "";

function listView(){
  const all = DB.records.slice().sort((a,b)=>
    a.date===b.date ? (b.submittedAt||b.createdAt||0)-(a.submittedAt||a.createdAt||0)
                    : (a.date<b.date?1:-1));
  const counts = { all: all.length };
  Object.keys(FORMS).forEach(k=>{
    counts[k] = all.filter(r=>(r.form||"diary")===k).length;
  });
  let recs = all.filter(r=> listFilter==="all" ? true : (r.form||"diary")===listFilter);
  if(listDate) recs = recs.filter(r=>r.date===listDate);

  const chip = (k,label) => `<button class="pill ${listFilter===k?"ok":"grey"}"
    style="padding:9px 14px;font-size:13.5px" data-lfilter="${k}">${label} ${counts[k]}</button>`;

  /* group what is left by day */
  const days = [];
  recs.forEach(r=>{ if(!days.length || days[days.length-1].date!==r.date) days.push({date:r.date, items:[]});
    days[days.length-1].items.push(r); });

  const row = r => {
    const machine = r.plantId ? ((DB.plant||[]).find(x=>x.id===r.plantId)||{}) : null;
    return `<div class="row">
      <button style="flex:1;text-align:left;display:block" data-view="${r.id}">
        <b style="display:block;font-size:15.5px;font-weight:640">${esc(formDef(r.form).name)}${
          machine ? " — "+esc(machine.item||machine.fleetNo||"") : ""}${
          r.excRef ? " — "+esc(r.excRef) : ""}</b>
        <span style="display:block;font-size:13px;color:var(--ink-3)">
          ${esc(r.ref||"Draft")}${r.submittedAt?" · "+timeOnly(r.submittedAt):""}${
            machine&&machine.fleetNo?" · "+esc(machine.fleetNo):""}</span>
      </button>
      <span class="pill ${r.status==="submitted"?"ok":"amber"}">${r.status==="submitted"?"Done":"Draft"}</span>
      ${cfg().allowDelete ? `<button data-del-rec="${r.id}" aria-label="Delete"
        style="color:var(--bad);font-size:20px;padding:0 4px">&times;</button>` : ""}
    </div>`;
  };

  return `<div class="top"><button class="chip" data-go="project">&lsaquo; Project</button></div>
    <h1 class="greet" style="font-size:22px;margin-top:12px">Records</h1>
    <p class="sub">${esc(DB.job)}</p>

    <div style="display:flex;gap:7px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none">
      ${chip("all","All")}${Object.values(FORMS).filter(f=>counts[f.key])
        .map(f=>chip(f.key, f.short)).join("")}
    </div>

    <div class="card" style="display:flex;align-items:center;gap:10px;padding:10px 12px">
      <span style="font-size:13.5px;font-weight:640;color:var(--ink-2);flex:none">Jump to</span>
      <input class="in" type="date" style="min-height:44px;flex:1" data-listdate value="${esc(listDate)}">
      ${listDate?`<button class="btn line sm" style="margin:0" data-lclear="1">Clear</button>`:""}
    </div>

    ${recs.length ? days.map(d=>`
      <div class="sect" style="margin:22px 0 8px">${longDate(d.date)}</div>
      <div class="card" style="padding:2px 16px">${d.items.map(row).join("")}</div>
    `).join("") : `<div class="card"><h3>Nothing found</h3>
      <p>${listDate ? "No records on "+longDate(listDate)+"." : "Records appear here once submitted."}</p></div>`}`;
}


/* The register is a list, not a page of open forms. Type the details once,
   press Add, and it becomes a line. Take it off hire and it drops to the
   bottom, greyed, with the date it left site. */
let plantDraft = null;
let plantEditId = null;

function blankPlant(){
  return { item:"", fleetNo:"", model:"", type:"Excavator", owner:"Hired",
    onDate:todayISO(), offDate:"", examDate:"", doc:null };
}

function plantFields(p, attr){
  const ls = lolerState(p);
  return `
    <div class="f"><label>Plant item</label>
      <input class="in" ${attr}="item" value="${esc(p.item)}" placeholder="e.g. 13T 360 excavator"></div>
    <div class="f"><label>Type</label>
      <div class="hint">Decides which check sheet this machine gets.</div>
      <select class="in" ${attr}="type">
        ${PLANT_TYPES.map(t=>`<option ${(p.type||"Excavator")===t?"selected":""}>${esc(t)}</option>`).join("")}
      </select></div>
    <div class="g2">
      <div class="f"><label>Fleet number</label>
        <input class="in" ${attr}="fleetNo" value="${esc(p.fleetNo||"")}"></div>
      <div class="f"><label>Model</label>
        <input class="in" ${attr}="model" value="${esc(p.model||"")}" placeholder="e.g. SK130"></div>
    </div>
    <div class="g2">
      <div class="f"><label>Owned or hired</label>
        <select class="in" ${attr}="owner">
          ${["Owned","Hired","Subcontractor"].map(o=>`<option ${p.owner===o?"selected":""}>${esc(o)}</option>`).join("")}
        </select></div>
    </div>
    ${(p.owner||"Hired")!=="Owned" ? `
      <div class="f"><label>${p.owner==="Subcontractor"?"Subcontractor":"Hire company"}</label>
        <div class="hint">Defects on this machine are reported to them, not our fitter.</div>
        <input class="in" ${attr}="hireCompany" value="${esc(p.hireCompany||"")}"></div>
      <div class="g2">
        <div class="f"><label>Their email</label>
          <input class="in" type="email" ${attr}="hireEmail" value="${esc(p.hireEmail||"")}"></div>
        <div class="f"><label>Hire reference</label>
          <input class="in" ${attr}="hireRef" value="${esc(p.hireRef||"")}"></div>
      </div>
      <div class="f"><label>Their phone</label>
        <input class="in" type="tel" ${attr}="hirePhone" value="${esc(p.hirePhone||"")}"></div>
    ` : `<div class="card" style="background:var(--green-50);box-shadow:none;margin-bottom:16px">
        <p style="font-size:13.5px">Company machine — defects go straight to our own fitter and
        are treated as priority.</p></div>`}
    <div class="g2">
      <div class="f"><label>On site from</label>
        <input class="in" type="date" ${attr}="onDate" value="${esc(p.onDate||"")}"></div>
      <div class="f"><label>Thorough examination due</label>
        <input class="in ${ls.key==="expired"?"err":""}" type="date" ${attr}="examDate"
          value="${esc(examDateOf(p))}"></div>

    <div class="hint" style="margin:-8px 0 0">LOLER for lifting equipment, PUWER for everything

let fixDraft = null;

function defectView(){
  const d = (DB.defects||[]).find(x=>x.id===view.id);
  if(!d) return `<div class="card"><h3>Not found</h3></div>`;
  const m = (DB.plant||[]).find(x=>x.id===d.plantId) || {};
  const open = d.status==="open";

  const closeBlock = !open
    ? `<div class="card" style="background:var(--ok-bg);box-shadow:none">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <h3 style="color:var(--ok)">Fixed</h3>
          <span class="pill ok">Closed</span></div>
        <p style="margin-top:4px">${esc(d.fixedBy||"")} — ${stamp(d.fixedAt)}
          · open for ${Math.max(0,Math.round((d.fixedAt-d.reportedAt)/86400000))} day(s)</p>
        <p style="margin-top:8px;white-space:pre-wrap"><b>What was done:</b><br>${esc(d.fixNote||"—")}</p>
        ${(d.fixPhotos||[]).length ? `<div class="pg" style="margin-top:10px">`+
          d.fixPhotos.map(ph=>`<div class="ph"><img src="${ph.src}" data-taken="${ph.takenAt||""}"></div>`).join("")+
          `</div>` : ""}
        <button class="btn line sm" style="margin:12px 0 0" data-reopen-def="${d.id}">Reopen</button>
      </div>`
    : fixDraft
    ? `<div class="card" style="box-shadow:inset 0 0 0 1.5px var(--green)">
        <h3 style="margin-bottom:12px">Close this out</h3>
        <div class="f"><label>What was done to fix it?</label>
          <textarea class="in" data-fixnote="1" placeholder="Parts, adjustment, who did it">${esc(fixDraft.note)}</textarea></div>
        <div class="f" style="margin:0"><label>Proof it is fixed</label>
          ${(fixDraft.photos||[]).length ? `<div class="pg" style="margin-bottom:10px">`+
            fixDraft.photos.map((ph,i)=>`<div class="ph"><img src="${ph.src}">
              <button type="button" data-fixrm="${i}" aria-label="Remove">&times;</button></div>`).join("")+
            `</div>` : ""}
          <div class="g2">
            <button class="btn line" style="margin:0" data-fixcam="1">Photo</button>
            <button class="btn line" style="margin:0" data-fixlib="1">Upload</button>
          </div></div>
        <button class="btn" style="margin:16px 0 8px" data-fixsave="1">Mark as fixed</button>
        <button class="btn ghost" style="margin:0" data-fixcancel="1">Cancel</button>
      </div>`
    : `<button class="btn" data-fixstart="1">Mark as fixed</button>`;

  return `<div class="top"><button class="chip" data-go="plant">&lsaquo; Plant</button>
      <span class="pill ${open?"red":"ok"}">${open?"Open":"Closed"}</span></div>
    <h1 class="greet" style="font-size:21px;margin-top:12px">${esc(d.item)}</h1>
    <p class="sub">${esc(m.item||"Machine")}${m.fleetNo?" · "+esc(m.fleetNo):""}</p>

    ${open ? `<div class="card" style="background:var(--bad-bg);box-shadow:none">
      <h3 style="color:var(--bad)">Reported ${ageText(d.reportedAt)}</h3>
      <p style="color:var(--ink-2)">${shortDate(d.date)} by ${esc(d.reportedBy||"—")}${
        d.unsafe?" · machine marked not fit for use":""}</p>
    </div>` : ""}

    <div class="card">
      <div class="kv"><span class="k">Defect</span><span class="v">${esc(d.description||"—")}</span></div>
      <div class="kv"><span class="k">From inspection</span><span class="v">${esc(d.checkRef||"—")}</span></div>
      <div class="kv"><span class="k">Reported</span><span class="v">${stamp(d.reportedAt)}</span></div>
      ${(d.photos||[]).length ? `<div style="margin-top:10px">
        <span style="font-size:13px;color:var(--ink-2)">Photographs at the time</span>
        <div class="pg" style="margin-top:8px">`+
        d.photos.map(ph=>`<div class="ph"><img src="${ph.src}" data-taken="${ph.takenAt||""}"></div>`).join("")+
        `</div></div>` : ""}
    </div>

    <div class="sect">${open?"Close out":"Fix"}</div>
    ${closeBlock}

    <div class="sect">Report it</div>
    ${(function(){
      const to = recipientFor(m);
      return `<div class="card" style="${to.priority?"background:var(--bad-bg);box-shadow:none":""}">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <h3 style="${to.priority?"color:var(--bad)":""}">${to.priority?"Our machine":"On hire"}</h3>
          ${to.priority?`<span class="pill red">Priority</span>`:`<span class="pill grey">${esc(to.label||"Hire")}</span>`}
        </div>
        <p class="sub" style="margin-top:3px">
          ${to.priority
            ? "Repaired by our own fitter"+(to.name&&to.name!=="our fitter"?" — "+esc(to.name):"")+"."
            : "Reported to "+esc(to.name)+(to.ref?" — hire ref "+esc(to.ref):"")+"."}
        </p>
        ${to.email?`<p class="sub" style="font-size:12.5px;color:var(--ink-3)">${esc(to.email)}</p>`:
          `<p class="sub" style="font-size:12.5px;color:var(--warn)">No email set — add one on the plant register.</p>`}
      </div>`;
    })()}
    <button class="btn ghost" data-defpdf="${d.plantId}">View report</button>
    <button class="btn ghost" data-report="${d.plantId}">Send the PDF</button>
    <button class="btn line" style="color:var(--bad)" data-defdel="${d.id}">Delete this defect</button>`;
}

function plantHistoryView(){
  const pid = view.plantId;
  const m = (DB.plant||[]).find(x=>x.id===pid) || {};
  const closed = closedDefects(pid);
  const open = openDefects(pid);

  const card = d => `<button class="card" style="width:100%;text-align:left" data-defopen="${d.id}">
      <div style="display:flex;align-items:flex-start;gap:10px">

          <b style="font-size:15.5px;font-weight:650;display:block">${esc(d.item)}</b>
          <span style="font-size:13px;color:var(--ink-2)">${esc(d.description||"")}</span>
          <span style="display:block;font-size:12.5px;color:var(--ink-3);margin-top:3px">
            ${d.status==="closed"
              ? shortDate(d.date)+" · fixed "+shortDate(iso(d.fixedAt))
              : "Reported "+ageText(d.reportedAt)}</span>

    ${closed.length ? `<div class="sect">Previous faults (${closed.length})</div>`+closed.map(card).join("")

let excDraftRef = null;

function pickExcView(){
  const d = view.date || todayISO();
  const due = excavationsDue(d);
  const extra = excsFor(d).filter(r=>!due.some(x=>x.ref===r.excRef));

  const row = (ref, src, rec) => {
    const done = rec && rec.status==="submitted";
    return `<button class="task" data-exc="${esc(ref)}" data-excdate="${d}">
      <span class="n"><b>${esc(ref||"No reference")}</b>
        <span>${esc((src&&src.location)||"")}${src&&src.location?" · ":""}${
          done ? "inspected "+timeOnly(rec.submittedAt)
               : rec ? "draft saved"
               : src ? "left open "+shortDate(src.fromDate) : "added by hand"}</span></span>
      ${done?`<span class="pill ok">Done</span>`:`<span class="pill grey">To do</span>`}
    </button>`;
  };

  return `<div class="top"><button class="chip" data-go="home">&lsaquo; Back</button></div>
    <h1 class="greet" style="font-size:22px;margin-top:12px">Excavation inspections</h1>
    <p class="sub">${longDate(d)}</p>

    ${due.length ? `<div class="card" style="background:var(--green-50);box-shadow:none">
      <p>Raised by the diary — these were left open on ${shortDate(due[0].fromDate)}.</p></div>` : ""}

    ${due.map(x=>row(x.ref, x, excFor(d, x.ref))).join("")}
    ${extra.map(r=>row(r.excRef, null, r)).join("")}

    ${(!due.length && !extra.length) ? `<div class="card"><h3>Nothing raised</h3>
      <p>Nothing was left open on the last working day. You can still add an inspection below.</p></div>` : ""}

    ${excDraftRef===null
      ? `<button class="btn line" data-excadd="1">+ Add an inspection</button>`
      : `<div class="card" style="box-shadow:inset 0 0 0 1.5px var(--green)">
          <div class="f" style="margin:0"><label>Excavation reference</label>
            <div class="hint">For anything not picked up from the diary.</div>
            <input class="in" data-excref="1" value="${esc(excDraftRef)}"
              placeholder="e.g. MH8 chamber"></div>
          <button class="btn" style="margin:14px 0 8px" data-excgo="1">Start the inspection</button>
          <button class="btn ghost" style="margin:0" data-exccancel="1">Cancel</button>
        </div>`}`;
}

function pickPlantView(){
  const d = view.date || todayISO();
  const machines = plantNeedingCheck(d);
  const ws = weekStart(d);
  const rows = machines.map(m=>{
    const rec = checkFor(d, m.id);
    const done = rec && rec.status==="submitted";
    const wk = weekChecks(m.id, ws);
    const inWeek = wk.days.filter(x=>wk.map[x]).length;
    return { m, rec, done, inWeek };
  });
  const todo = rows.filter(r=>!r.done);
  const done = rows.filter(r=>r.done);

  const card = (r, faded) => `<div class="card" style="padding:0 14px${faded?
      ";background:var(--canvas);box-shadow:none;opacity:.75":""}">
      <button class="row" style="width:100%;border:0" data-check="${r.m.id}">
        <span class="n"><b${faded?' style="color:var(--ink-2)"':""}>${esc(r.m.item||"Unnamed")}</b>
          <span>${esc(r.m.type||"Excavator")} · ${esc(r.m.fleetNo||"No fleet no.")}${
            r.done?" · checked "+timeOnly(r.rec.submittedAt) : r.rec?" · draft saved":""}</span></span>
        ${r.done?`<span class="pill ok">Done</span>`:`<span class="pill grey">To do</span>`}
      </button>
      ${r.inWeek ? `<div style="border-top:1px solid var(--line-2);padding:10px 0;display:flex;
        align-items:center;gap:10px">
        <span style="flex:1;font-size:13px;color:var(--ink-3)">${r.inWeek} day${r.inWeek===1?"":"s"} recorded this week</span>
        <button class="btn line sm" style="margin:0" data-weeksheet="${r.m.id}" data-ws="${ws}">Week&rsquo;s sheet</button>
      </div>` : ""}
    </div>`;

  return `<div class="top"><button class="chip" data-go="home">&lsaquo; Back</button>
      ${todo.length?`<span class="pill grey">${todo.length} to do</span>`:`<span class="pill ok">All done</span>`}</div>
    <h1 class="greet" style="font-size:22px;margin-top:12px">Plant inspection</h1>
    <p class="sub">${longDate(d)}</p>

    ${machines.length ? "" : `<div class="card"><h3>Nothing on site</h3>
      <p>Add machines to the plant register first.</p></div>`}

    ${todo.length
      ? `<div class="sect">To do (${todo.length})</div>${todo.map(r=>card(r,false)).join("")}`
      : (machines.length ? `<div class="card" style="background:var(--green-50);box-shadow:none">
          <h3 style="color:var(--green-700)">All done</h3>
          <p>Every machine on site has been checked ${d===todayISO()?"today":"that day"}.</p></div>` : "")}

    ${done.length ? `<div class="sect">Checked (${done.length})</div>${done.map(r=>card(r,true)).join("")}` : ""}`;
}

let itemEditing = false;

function itemView(){
  const kind = view.kind || "plant";
  const it = findItem(kind, view.id);
  if(!it) return `<div class="card"><h3>Not found</h3></div>`;
  const isPlant = kind === "plant";
  const isTool = kind === "tools";
  const st = lolerState(it);
  const df = isPlant ? defectsFor(it.id) : null;
  const onSite = (isPlant ? currentPlant() : isTool ? currentTools() : currentLifting())
    .some(x=>x.id===it.id);
  const back = `<button class="chip" data-go="${kind}">&lsaquo; ${
    isPlant?"Plant":isTool?"Equipment":"Lifting"}</button>`;

  /* ---------- editing ---------- */
  if(itemEditing){
    return `<div class="top">${back}<span class="pill info">Editing</span></div>
      <h1 class="greet" style="font-size:21px;margin-top:12px">${esc(it.item||"Unnamed item")}</h1>
      <p class="sub">Change what needs changing, then save.</p>
      <div class="card">
        ${isPlant ? plantFields(it, "data-pl-"+it.id)
          : isTool ? toolFields(it, "data-tl-"+it.id)
          : liftingFields(it, "data-lf-"+it.id)}
      </div>
      <button class="btn" data-itemdone="1">Save changes</button>
      ${onSite
        ? `<button class="btn line" style="color:var(--bad)"
            data-${isPlant?"ploff":isTool?"tloff":"lfoff"}="${it.id}">Take off site</button>`
        : `<button class="btn line" data-${isPlant?"plback":isTool?"tlback":"lfback"}="${it.id}">
             Back on site</button>
           <button class="btn line" style="color:var(--bad)"
             data-${isPlant?"plrm":isTool?"tlrm":"lfrm"}="${it.id}">Delete this item</button>`}`;
  }

  /* ---------- reading ---------- */
  const row = (k,v) => v ? `<div class="kv"><span class="k">${esc(k)}</span>
    <span class="v">${esc(v)}</span></div>` : "";
  const details = isPlant
    ? row("Type", it.type||"Excavator") + row("Fleet number", it.fleetNo)
      + row("Model", it.model) + row("Owned or hired", it.owner)
      + (it.owner!=="Owned" ? row("Supplier", it.hireCompany) + row("Hire reference", it.hireRef)
          + row("Their email", it.hireEmail) + row("Their phone", it.hirePhone) : "")
      + row("On site from", it.onDate?shortDate(it.onDate):"")
      + row("Off site", it.offDate?shortDate(it.offDate):"")
      + row("Next examination", examDateOf(it)?shortDate(examDateOf(it)):"Not set")
    : isTool
    ? row("Type", it.type) + row("ID or serial number", it.idNo)
      + row("Owned or hired", it.owner)
      + (it.owner!=="Owned" ? row("Supplier", it.hireCompany) : "")
      + row("On site from", it.onDate?shortDate(it.onDate):"")
      + row("Off site", it.offDate?shortDate(it.offDate):"")
    : row("Type", it.type) + row("ID number", it.idNo) + row("Safe working load", it.swl)
      + row("Owned or hired", it.owner)
      + (it.owner!=="Owned" ? row("Supplier", it.hireCompany) : "")
      + row("On site from", it.onDate?shortDate(it.onDate):"")
      + row("Off site", it.offDate?shortDate(it.offDate):"")
      + row("LOLER expiry", examDateOf(it)?shortDate(examDateOf(it)):"Not set");

  return `<div class="top">${back}
      <span class="pill ${onSite?st.cls:"grey"}">${onSite?esc(st.label):"Off site"}</span>
    </div>

    <h1 class="greet" style="font-size:22px;margin-top:12px">${esc(it.item||"Unnamed item")}</h1>
    <p class="sub">${esc([isPlant?(it.type||"Excavator"):it.type,
      isPlant?it.fleetNo:it.idNo].filter(Boolean).join(" · "))}</p>

    ${df ? `<button class="card" style="width:100%;text-align:left;background:var(--bad-bg);
      box-shadow:none" data-defopen="${df.items[0].id}">
      <h3 style="color:var(--bad)">${df.items.length} open defect${df.items.length===1?"":"s"}${
        df.unsafe?" · not fit for use":""}</h3>
      ${df.items.map(x=>`<p style="color:var(--ink-2);margin-top:2px">
        <b style="font-weight:640">${esc(x.item)}</b>${x.description?" — "+esc(x.description):""}
        · reported ${ageText(x.reportedAt)}</p>`).join("")}
    </button>` : ""}

    <div class="sect">Details</div>
    <div class="card">${details}</div>

    ${isTool ? `<div class="sect">PUWER</div>
      <div class="card"><p>Checked weekly on the PUWER register with the rest of the equipment.
      Nothing to certificate.</p>
      <button class="btn line sm" style="margin:12px 0 0" data-startf="puwer"
        data-d="${todayISO()}">Open this week&rsquo;s PUWER register</button></div>`
      : `<div class="sect">Examination</div>
         ${examBlock(kind, it)}
         ${docsBlock(kind, it)}`}

    ${isPlant ? `<div class="sect">This machine</div>
      <button class="btn ghost" data-history="${it.id}">Defect history${
        closedDefects(it.id).length?" ("+closedDefects(it.id).length+")":""}</button>
      <button class="btn ghost" data-weeksheet="${it.id}">This week\u2019s inspection sheet</button>
      ${df ? `<button class="btn ghost" data-report="${it.id}">Send the defect report</button>` : ""}` : ""}

    <button class="btn" style="margin-top:18px" data-itemedit="1">Edit this item</button>`;
}

function plantView(){
  const all = (DB.plant||[]).filter(p=>p.job===DB.job);
  const live = currentPlant();
  const liveIds = live.map(p=>p.id);
  const onSite = all.filter(p=>liveIds.includes(p.id));
  const offSite = all.filter(p=>!liveIds.includes(p.id))
    .sort((x,y)=>(y.offDate||"").localeCompare(x.offDate||""));

  const alerts = lolerAlerts();
  const alertCard = alerts.length ? (function(){
    const bad = alerts.some(x=>x.st.key==="expired");
    return `<div class="card" style="background:${bad?"var(--bad-bg)":"var(--warn-bg)"};box-shadow:none">
      <h3 style="color:${bad?"var(--bad)":"var(--warn)"}">
        ${bad?"Thorough examination overdue":"Thorough examination due"}</h3>
      <p>${alerts.map(x=>esc((x.p.item||"Unnamed item")+" — "+x.st.label)).join("<br>")}</p></div>`;
  })() : "";

  const liveRows = onSite.map(p=>{
    if(plantEditId===p.id){
      return `<div class="card" style="box-shadow:inset 0 0 0 1.5px var(--green)">
        ${plantFields(p, "data-pl-"+p.id)}
        <button class="btn" style="margin:14px 0 0" data-pldone="${p.id}">Done</button>
      </div>
      ${examBlock("plant", p)}
      ${docsBlock("plant", p)}`;
    }
    const ls = lolerState(p);
    const df = defectsFor(p.id);
    const tint = (ls.key==="expired" || df) ? "background:var(--bad-bg);box-shadow:none"
      : ls.key==="soon" ? "background:var(--warn-bg);box-shadow:none" : "";

function packView(){
  const ws = view.week || weekStart(todayISO());
  const secs = packSections(ws);
  const gaps = packGaps(ws);
  const have = secs.reduce((n,x)=>n+x.items.length,0);
  const pack = packFor(ws);
  const thisWeek = ws === weekStart(todayISO());

  return `<div class="top"><button class="chip" data-go="project">&lsaquo; Project</button>
      ${pack?`<span class="pill ok">Published</span>`:""}</div>
    <h1 class="greet" style="font-size:22px;margin-top:12px">Health &amp; safety pack</h1>
    <p class="sub">${esc(DB.job)}</p>

    <div class="card" style="display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:12px">
      <button class="btn line sm" style="margin:0" data-pw="-1" aria-label="Previous week">&lsaquo;</button>
      <span style="flex:1;text-align:center">
        <b style="display:block;font-weight:650">${thisWeek?"This week":"Week commencing "+shortDate(ws)}</b>
        <span style="font-size:12.5px;color:var(--ink-3)">${shortDate(ws)} – ${shortDate(addDays(ws,6))}</span>
      </span>
      <button class="btn line sm" style="margin:0" data-pw="1" ${thisWeek?"disabled":""}
        aria-label="Next week">&rsaquo;</button>
    </div>

    <div class="tstotal">
      <div><div class="big">${have}</div><div class="lab">records in the pack</div></div>
      <div class="side">${gaps.length ? gaps.length+" outstanding" : "Nothing missing"}</div>
    </div>

    <div class="sect">Sections</div>
    <div class="card">
      ${secs.map(sec=>{
        const short = sec.def.daily ? sec.items.length+" of "+sec.expected
          : sec.def.weekly ? (sec.items.length?"Done":"Not done")
          : sec.def.asNeeded ? sec.items.length+" as required"
          : String(sec.items.length);
        const ok = sec.def.weekly ? sec.items.length>0 : sec.items.length>=sec.expected;
        return `<div class="kpi">
          <span class="kn">${esc(sec.name)}</span>
          <span class="kv" style="color:${ok?"var(--ok)":"var(--warn)"}">${esc(short)}</span>
        </div>`;
      }).join("")}
    </div>

    ${gaps.length ? `<div class="card" style="background:var(--warn-bg);box-shadow:none">
      <h3 style="color:var(--warn)">${gaps.length} record${gaps.length===1?"":"s"} outstanding</h3>
      <p style="margin-bottom:8px">The pack can still be published. Anything missing is listed
      on its own page rather than quietly left out.</p>
      ${gaps.slice(0,8).map(g=>`<div style="font-size:13.5px;color:var(--ink-2);padding:2px 0">
        ${esc(g.name)}${g.date?" — "+shortDate(g.date):""}</div>`).join("")}
      ${gaps.length>8?`<div style="font-size:13px;color:var(--ink-3);padding-top:4px">
        and ${gaps.length-8} more</div>`:""}
    </div>` : ""}

    ${pack ? `<div class="card" style="background:var(--ok-bg);box-shadow:none">
      <h3 style="color:var(--ok)">Published</h3>
      <p>${esc(pack.ref)} · ${esc(pack.publishedBy)} · ${stamp(pack.publishedAt)}
        · ${pack.count} record${pack.count===1?"":"s"}</p>
    </div>` : ""}

    <button class="btn" data-packview="${ws}">${pack?"Open the pack":"View the pack so far"}</button>
    <button class="btn ghost" data-packshare="${ws}">Send it as a PDF</button>
    ${pack ? "" : `
      <button class="btn line" data-packpub="${ws}" ${gaps.length?'style="color:var(--ink-3)"':""}>
        Publish the pack</button>
      <p class="sub" style="text-align:center;font-size:12.5px;color:var(--ink-3)">
        ${gaps.length
          ? "View it any day of the week. Publishing needs everything in."
          : "Everything is in and it is ready to publish."}</p>`}`;
}

function projectView(){
  const t = todayISO();
  const plantAl = lolerAlerts(), liftAl = liftingAlerts();
  const faulty = currentPlant().map(m=>({ m, df: defectsFor(m.id) })).filter(x=>x.df);
  const defectCount = faulty.reduce((n,x)=>n+x.df.items.length,0);
  const unsignedVos = (DB.vos||[]).filter(v=>v.status!=="signed").length;
  const offToday = leaveToday().length;
  const week = timesheetWeek(weekStart(t));
  const weekHours = Math.round(week.people.reduce((n,p)=>n+p.total,0)*100)/100;

  const tile = (key, icon, title, line, level, badge) => `
    <button class="tile ${level||""}" data-go="${key}">
      ${badge ? `<span class="badge">${esc(badge)}</span>` : ""}
      <span class="ic">${icon}</span>
      <span>
        <span class="tl" style="display:block">${esc(title)}</span>
        <span class="tv" style="display:block">${esc(line)}</span>
      </span>
    </button>`;

  const plantLevel = defectCount || plantAl.some(x=>x.st.key==="expired") ? "red"
    : plantAl.length ? "amber" : "";
  const liftLevel = liftAl.some(x=>x.st.key==="expired") ? "red" : liftAl.length ? "amber" : "";

  return `<h1 class="greet" style="font-size:26px;margin-top:18px">Project</h1>
    <p class="sub">${esc(DB.job)}</p>

    <div class="sect">On site</div>
    <div class="tiles">
      ${tile("plant", TILE_ICONS.plant, "Plant",
        defectCount ? defectCount+" open defect"+(defectCount===1?"":"s")
          : plantAl.length ? plantAl.length+" examination"+(plantAl.length===1?"":"s")+" due"
          : currentPlant().length+" on site",
        plantLevel, defectCount || plantAl.length || "")}
      ${tile("lifting", TILE_ICONS.lifting, "Lifting gear",
        liftAl.length ? liftAl.length+" LOLER due" : currentLifting().length+" on site",
        liftLevel, liftAl.length || "")}
      ${tile("tools", TILE_ICONS.tools, "Work equipment",
        currentTools().length+" on site", "", "")}
      ${tile("labour", TILE_ICONS.labour, "Labour",
        currentLabour().length+" on the register"+(offToday?" · "+offToday+" off":""), "", "")}
      ${tile("leave", TILE_ICONS.leave, "Time off",
        leaveThisWeek().length ? leaveThisWeek().length+" booked this week" : "Nobody booked off", "", "")}
    </div>

    <div class="sect">Paperwork</div>
    <div class="tiles">
      ${tile("vos", TILE_ICONS.vos, "Dayworks",
        unsignedVos ? unsignedVos+" to be signed"
          : (DB.vos||[]).length ? (DB.vos||[]).length+" all signed" : "None raised yet",
        unsignedVos ? "amber" : "", unsignedVos || "")}
      ${(function(){
        const ws = weekStart(t);
        const g = packGaps(ws).length;
        const done = !!packFor(ws);
        return tile("pack", TILE_ICONS.pack, "H&S pack",
          done ? "Published" : g ? g+" to complete" : "Ready to publish",
          done ? "" : g ? "amber" : "", done ? "" : (g||""));
      })()}

const LEAVE_COLOURS = ["#1F5A2D","#1B4F7A","#A9611B","#5B3E8C","#0F6B63","#A72B22","#5C6B21","#8A3B62"];
function personColour(id){
  const list = (DB.labour||[]).filter(l=>l.job===DB.job).map(l=>l.id);
  const i = list.indexOf(id);
  return LEAVE_COLOURS[(i<0?0:i) % LEAVE_COLOURS.length];
}
function monthStart(d){ const x = parse(d||todayISO()); return iso(new Date(x.getFullYear(), x.getMonth(), 1)); }
function addMonths(mStart, n){
  const x = parse(mStart);
  return iso(new Date(x.getFullYear(), x.getMonth()+n, 1));
}
function monthCells(mStart){
  const first = parse(mStart);
  const lead = (first.getDay()+6)%7;                       /* Monday first */
  const start = addDays(mStart, -lead);
  const cells = [];
  for(let i=0;i<42;i++) cells.push(addDays(start, i));
  /* drop a trailing all-next-month week */
  while(cells.length>35 && parse(cells[cells.length-1]).getMonth() !== first.getMonth()
        && parse(cells[cells.length-7]).getMonth() !== first.getMonth()) cells.length -= 7;
  return cells;
}
