  const ref = pack ? pack.ref : (draft ? "Not yet published" : nextPackRef(ws));
  const count = secs.reduce((n,x)=>n+x.items.length,0);

  const yn = v => v===true ? "Yes" : v===false ? "No" : "—";
  const ck = v => !v || v.v===undefined ? "" : v.v===true ? "Y" : v.v==="na" ? "N/A" : "X";
  const cell = (t, cls) => `<td class="${cls||""}">${esc(t==null?"":String(t))}</td>`;
  const tbl = (head, rows, opts) => {
    opts = opts || {};
    const cols = opts.cols
      ? `<colgroup>${opts.cols.map(w=>`<col style="width:${w}">`).join("")}</colgroup>` : "";
    return `<table class="pk${opts.cols?" fixed":""}">${cols}${
      head?`<tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>`:""}
      ${rows.map(r=>`<tr>${r.map((v,i)=>{
        const centre = (opts.centre||[]).includes(i);
        const bad = (v==="X" || v==="No" || v==="NO" || v==="Quarantined");
        return cell(v, (centre?"c ":"") + (bad?"bad":""));
      }).join("")}</tr>`).join("")}</table>`;
  };
  const head = (title, code, meta) => `
    <div class="ph-head">
      <img src="${LOGO}" alt="${esc(c.company)}">
      <div style="text-align:right"><h1>${esc(title)}</h1>
        ${code?`<div style="font-size:10.5px;color:#555">${esc(code)}</div>`:""}</div>
    </div>
    ${meta ? tbl(null, meta, { cols:["19%","31%","19%","31%"] }) : ""}`;
  const declaration = (rows, sig, cols) => `
    <div class="pk-h">Declaration</div>
    <p style="font-size:10px;color:#555;margin:0 0 6px"><i>Upon inspecting, I confirm that the
      inspection results are accurate and where deemed as safe are fit for purpose.</i></p>
    ${tbl(null, rows, cols?{cols}:undefined)}
    ${sig&&sig.src?`<img src="${sig.src}" alt="Signature" style="height:46px">`:""}`;

  const metaFor = (rec, extra) => [
    ["Site / depot", rec.job, "Date", longDate(rec.date)],
    ["Completed by", rec.by || c.user.name, "Reference", rec.ref || ""]
  ].concat(extra||[]);

  const page = inner => `<div class="pk-page">${inner}</div>`;

  /* ---- cover and contents ---- */
  let html = page(`<div class="pk-cover">
      <img src="${LOGO}" alt="${esc(c.company)}" style="width:190px">
      ${draft?`<div style="margin-top:22px"><span class="pk-draft">DRAFT — NOT PUBLISHED</span></div>`:""}
      <h1>Weekly Health and Safety Pack</h1>
      <div class="wc">Week commencing ${longDate(ws)}</div>
    </div>
    ${tbl(null, [
      ["Site", DB.job, "Week", shortDate(ws)+" to "+shortDate(addDays(ws,6))],
      ["Prepared by", c.user.name, "Produced", stamp(Date.now())],
      ["Pack reference", ref, "Records enclosed", String(count)]
    ].concat(gaps.length ? [["Records outstanding", String(gaps.length), "", ""]] : []))}`);

  html += page(`<div class="pk-h">Contents</div>
    ${tbl(["Section","Sheets"], secs.map((sec,i)=>{
      const n = sec.key==="plantcheck"
        ? [...new Set(sec.items.map(r=>r.plantId))].length : sec.items.length;
      return [(i+1)+".  "+sec.name, n + (sec.key==="plantcheck"
        ? (n===1?" machine":" machines") : (n===1?" record":" records"))];
    }).concat(gaps.length ? [["Records outstanding", String(gaps.length)]] : []))}`);

  /* ---- a page per sheet ---- */
  secs.forEach(sec=>{
    if(sec.key === "plantcheck"){
      const DL = ["M","T","W","T","F","S","S"];
      [...new Set(sec.items.map(r=>r.plantId))].forEach(pid=>{
        const m = (DB.plant||[]).find(x=>x.id===pid) || {};
        const sheet = sheetFor(m.type||"Excavator") || CHECKSHEETS.Excavator;
        const { days, map } = weekChecks(pid, ws);
        const doneDays = days.filter(d=>map[d]);
        const weeklyRec = days.map(d=>map[d]).find(r=>r && r.data && r.data.__weekly===true);
        const defs = (DB.defects||[]).filter(x=>x.plantId===pid && days.includes(x.date));
        html += page(
          head(sheet.title || ((m.type||"Plant")+" Inspections"), sheet.code, [
            ["Competent person", (doneDays.length && map[doneDays[0]].by) || c.user.name,
             "Fleet number", m.fleetNo || "—"],
            ["Week commencing", shortDate(ws), "Model", m.model || m.item || "—"],
            ["Site / depot", DB.job, "Days recorded",
              doneDays.length + " of " + days.filter(isWorking).length]
          ]) +
          `<div class="pk-h">Daily pre-use recorded checks</div>` +
          tbl(["Check"].concat(days.map((d,i)=>DL[i]+" "+parse(d).getDate())),
            sheet.daily.map(t=>[t].concat(days.map(d=>ck((map[d]&&map[d].data||{})["d_"+slug(t)])))),
            { centre:[1,2,3,4,5,6,7],
              cols:["44%","8%","8%","8%","8%","8%","8%","8%"] }) +
          `<div class="pk-h">Weekly recorded checks${weeklyRec
            ? " — completed "+shortDate(weeklyRec.date) : " — not done this week"}</div>` +
          tbl(["Check","Result"],
            sheet.weekly.map(t=>[t, ck((weeklyRec&&weeklyRec.data||{})["w_"+slug(t)]) || "—"]),
            { centre:[1], cols:["88%","12%"] }) +
          `<div class="pk-h">Fleet engineer to be advised of defects</div>` +
          tbl(["Check","Defect/s description","Response given and date"],
            defs.length ? defs.map(x=>[x.item, x.description||"—",
              x.status==="closed" ? (x.fixNote||"Fixed")+" — "+shortDate(iso(x.fixedAt)) : "Open"])
              : [["—","No defects recorded this week",""]],
            { cols:["28%","42%","30%"] }) +
          declaration(doneDays.map(d=>[
            ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][days.indexOf(d)],
            map[d].by || "", shortDate(d)+" "+timeOnly(map[d].submittedAt),
            (map[d].data||{}).signature ? "Signed" : ""]), null,
            ["16%","36%","28%","20%"]));
      });
      return;
    }

    sec.items.forEach(rec=>{
      const d = rec.data || {};
      if(sec.key === "briefing"){
        const att = d.attendees || [];
        const pairs = [];
        for(let i=0;i<Math.max(att.length,2);i+=2)
          pairs.push([(i+1)+".  "+(att[i]||""), (i+2)+".  "+(att[i+1]||"")]);
        html += page(
          head("Daily Activities Briefing", rec.ref||"", metaFor(rec, [
            ["Delivered by", d.deliveredBy||rec.by||"", "Position", d.position||""]])) +
          `<div class="pk-h">Activities</div>` +
          tbl(["CGC activities","Other trades activities"],
            [[d.cgcActivities||"—", d.otherActivities||"—"]]) +
          `<div class="pk-h">Permits required</div>` +
          tbl(["Hot works","Excavation","Confined spaces","Other permit"],
            [[yn(d.permitHot), yn(d.permitExc), yn(d.permitConfined), d.permitOther||"—"]],
            { centre:[0,1,2,3] }) +
          `<div class="pk-h">Hazards briefed</div>` +
          `<p style="font-size:10.5px;margin:0 0 8px">${esc((d.hazards||[]).join(",  ")||"None recorded")}</p>` +
          `<div class="pk-h">Pre-start checklist</div>` +
          tbl(["Check","Y / N / N/A"],
            BRIEFING_CHECKS.map(t=>{
              const v = d["b_"+slug(t)] || {};
              return [t + (v.v===false&&v.defect ? "  —  "+v.defect : ""),
                v.v===true?"Yes":v.v===false?"No":v.v==="na"?"N/A":"—"];
            }).concat([["Any conflicting operations?", yn(d.b_conflicting)]]), { centre:[1] }) +
          (d.conflictingDetail?`<p style="font-size:10.5px">${esc(d.conflictingDetail)}</p>`:"") +
          `<div class="pk-h">Attendees of the daily activity briefing</div>` +
          tbl(null, pairs) +
          (d.otherAttendees?`<p style="font-size:10.5px">Also present: ${esc(d.otherAttendees)}</p>`:"") +
          declaration([["Delivered by", d.deliveredBy||rec.by||""],
            ["Date", longDate(rec.date)], ["Signature",""]], d.signature));
        return;
      }
      if(sec.key === "havs"){
        const tot = havsTotals(d.entries);
        html += page(
          head("Hand Arm Vibration (HAVs) Record Sheet", "CGCivils-006", metaFor(rec)) +
          `<div class="pk-h">HAVs record keeping log</div>` +
          tbl(["Operative","Tool used","m/s²","Trigger time","Points","A(8)","Actions to reduce exposure"],
            (d.entries||[]).map(e=>{
              const pts = havsPoints(e.magnitude, durHours(e.triggerTime));
              return [e.operative||"", e.tool==="Other"?(e.toolOther||"Other"):(e.tool||""),
                String(e.magnitude??""), durText(e.triggerTime)||"—",
                String(pts), String(havsA8(pts)), e.actions||"—"];
            }), { centre:[2,3,4,5] }) +
          `<div class="pk-h">Daily totals</div>` +
          tbl(["Operative","Points","A(8)","Status"],
            tot.map(r=>[r.name, String(r.points), String(r.a8), r.status.label]), { centre:[1,2] }) +
          `<p style="font-size:10px;color:#555">Exposure action value 100 points (2.5 m/s² A(8)).
            Exposure limit value 400 points (5.0 m/s² A(8)).</p>` +
          declaration([["Supervisor", d.supervisor||rec.by||""],
            ["Date", longDate(rec.date)], ["Signature",""]], d.signature));
        return;
      }
      if(sec.key === "puwer"){
        html += page(
          head("PUWER Register", "CGCivils-013", metaFor(rec, [
            ["Location", d.location||DB.job, "", ""]])) +
          `<p style="font-size:10px;color:#555;margin:0 0 8px">This weekly inspection schedule
            ensures tools and work equipment are inspected and confirmed as defect free and safe
            to use, in compliance with Regulations 5 and 6 of the Provision and Use of Work
            Equipment Regulations 1998.</p>` +
          tbl(["Tool / ID mark or number","Inspection satisfactory","Details of found defects",
               "Remedial action"],
            (d.tools||[]).map(t=>[t.tool||"", yn(t.ok), t.defects||"—", t.action||"—"]),
            { centre:[1] }) +
          declaration([["Inspected by", rec.by||""], ["Inspection date", longDate(rec.date)],
            ["Location", d.location||DB.job], ["Signature",""]], d.signature));
        return;
      }
      if(sec.key === "loler"){
        html += page(
          head("Register of Excavator Lifting Equipment", "CGCivils-007", metaFor(rec, [
            ["Location", d.location||DB.job, "", ""]])) +
          tbl(["Description","ID no","LOLER cert start","LOLER cert end","Inspection satisfactory",
               "Status","Defects"],
            (d.items||[]).map(i=>[i.description||"", i.idNo||"",
              i.certStart?shortDate(i.certStart):"—", i.certEnd?shortDate(i.certEnd):"—",
              yn(i.ok), i.status||"", i.ok===false?(i.defects||""):""]),
            { centre:[2,3,4] }) +
          declaration([["Inspected by", rec.by||""], ["Inspection date", longDate(rec.date)],
            ["Location", d.location||DB.job], ["Signature",""]], d.signature));
        return;
      }
      if(sec.key === "excavation"){
        const checks = sectionsFor("excavation").find(x=>x.title==="Inspection").fields;
        html += page(
          head("Excavation Inspection", rec.ref||"", metaFor(rec, [
            ["Excavation", d.ref||rec.excRef||"", "Location", d.location||""],
            ["Maximum depth", d.depth?d.depth+" m":"", "Support system", d.support||""]])) +
          `<div class="pk-h">Inspection</div>` +
          tbl(["Check","Y / N / N/A"], checks.map(f=>{
            const v = d[f.id] || {};
            return [f.label + (v.v===false&&v.defect ? "  —  "+v.defect : ""),
              v.v===true?"Yes":v.v===false?"No":v.v==="na"?"N/A":"—"];
          }), { centre:[1] }) +
          tbl(null, [["Safe for work to continue?", d.safe===false?"NO":"Yes"]]
            .concat(d.safe===false?[["Action taken", d.action||""]]:[])) +
          ((d.photos||[]).length ? `<div class="pk-h">Photographs</div>
            <div class="imgs">${(d.photos||[]).map(ph=>`<img src="${ph.src}" alt="">`).join("")}</div>` : "") +
          declaration([["Competent person", rec.by||""], ["Date", longDate(rec.date)],
            ["Signature",""]], d.signature));
        return;
      }
      /* anything else, plainly */
      html += page(head(formDef(rec.form).name, rec.ref||"", metaFor(rec)));
    });
  });

  if(gaps.length){
    html += page(`<div class="pk-h">Records outstanding</div>
      <p style="font-size:10.5px;color:#555">These were not completed for the week covered by
      this pack.</p>` +
      tbl(["Record","Day"], gaps.map(g=>[g.name, g.date?longDate(g.date):"Not done this week"])));
  }

  document.getElementById("sheet").innerHTML = html;
  document.getElementById("sheetTitle").textContent =
    (draft ? "Draft pack — " : "H&S pack — ") + "w/c " + shortDate(ws);
  document.getElementById("sheetwrap").classList.add("open");
  window.scrollTo(0,0);
}

async function buildPackPdf(ws, draft){
  const c = cfg();
  const secs = packSections(ws).filter(x=>x.items.length);
  const gaps = packGaps(ws);
  const existing = packFor(ws);
  const ref = existing ? existing.ref : (draft ? "Not yet published" : nextPackRef(ws));
  const doc = new PdfDoc();
  const imgs = await packImages(ws, secs);
  const logo = imgs.get(LOGO);
  const wide = PdfDoc.W - PdfDoc.M*2;
  const red = [.65,.17,.13];

  /* ---------------- cover ---------------- */
  if(logo) doc.image(logo, 170);
  doc.y -= 26;
  if(draft) doc.banner("DRAFT — NOT PUBLISHED");
  doc.text("Weekly Health and Safety Pack", { size:24, bold:true, after:6 });
  doc.text("Week commencing " + longDate(ws), { size:14, colour:[.35,.39,.36], after:14 });
  doc.rule();
  doc.pair("Site", DB.job);
  doc.pair("Week", shortDate(ws) + " to " + shortDate(addDays(ws,6)));
  doc.pair("Prepared by", c.user.name);
  doc.pair("Produced", stamp(Date.now()));
  doc.pair("Pack reference", ref);
  doc.pair("Records enclosed", String(secs.reduce((n,x)=>n+x.items.length,0)));
  if(gaps.length) doc.pair("Records outstanding", String(gaps.length), [.66,.42,0]);

  /* ---------------- contents (filled in once page numbers are known) ------ */
  doc.newPage();
  doc.text("Contents", { size:18, bold:true, after:8 });
  doc.rule();
  const contentsAnchor = { page: doc.page, y: doc.y };
  doc.y -= 18 * (secs.length + (gaps.length?2:0)) + 12;

  /* ---------------- one sheet per record ---------------- */
  const starts = [];
  const meta = (rec, extra) => [
    ["Site / depot", DB.job, "Date", longDate(rec.date)],
    ["Completed by", rec.by || c.user.name, "Reference", rec.ref || ""]
  ].concat(extra || []);

  secs.forEach((sec, si)=>{
    let first = true;

    /* ---- plant: a page per machine, laid out like the paper sheet ---- */
    if(sec.key === "plantcheck"){
      const DL = ["M","T","W","T","F","S","S"];
      [...new Set(sec.items.map(r=>r.plantId))].forEach(pid=>{
        const m = (DB.plant||[]).find(x=>x.id===pid) || {};
        const sheet = sheetFor(m.type||"Excavator") || CHECKSHEETS.Excavator;
        const { days, map } = weekChecks(pid, ws);
        const doneDays = days.filter(d=>map[d]);
        doc.newPage();
        if(first){ starts.push(doc.pages.length); first = false; }

        doc.sheetHead(logo, sheet.title || ((m.type||"Plant") + " Inspections"), sheet.code, [
          ["Competent person", (doneDays.length && map[doneDays[0]].by) || c.user.name,
           "Fleet number", m.fleetNo || "—"],
          ["Week commencing", shortDate(ws), "Model", m.model || m.item || "—"],
          ["Site / depot", DB.job, "Days recorded",
            doneDays.length + " of " + days.filter(isWorking).length]
        ]);

        const mk = (rec, key) => {
          if(!rec) return "";
          const v = (rec.data||{})[key];
          if(!v || v.v===undefined) return "";
          return v.v===true ? "Y" : v.v==="na" ? "N/A" : "X";
        };
        const cols = [wide - 7*24].concat(new Array(7).fill(24));
        const align = ["left","center","center","center","center","center","center","center"];
        const colour = (r,ci,txt) => txt==="X" ? red : [0,0,0];

        doc.text("Daily pre-use recorded checks", { bold:true, size:9.5, colour:[.12,.35,.18], after:1 });
        doc.table(cols,
          [["Check"].concat(days.map((d,i)=>DL[i]+" "+parse(d).getDate()))]
            .concat(sheet.daily.map(t=>[t].concat(days.map(d=>mk(map[d], "d_"+slug(t)))))),
          { header:true, align, colour, size:8, pad:1.6 });

        const weeklyRec = days.map(d=>map[d]).find(r=>r && r.data && r.data.__weekly===true);
        doc.text("Weekly recorded checks" + (weeklyRec ? " — completed " + shortDate(weeklyRec.date)
          : " — not done this week"), { bold:true, size:9.5, colour:[.12,.35,.18], after:1 });
        doc.table([wide-70, 70],
          [["Check","Result"]].concat(sheet.weekly.map(t=>[t, mk(weeklyRec, "w_"+slug(t)) || "—"])),
          { header:true, align:["left","center"], colour, size:8, pad:1.6 });

        const defs = (DB.defects||[]).filter(x=>x.plantId===pid && days.includes(x.date));
        doc.text("Fleet engineer to be advised of defects", { bold:true, size:9.5,
          colour:[.12,.35,.18], after:1 });
        doc.table([wide*0.28, wide*0.42, wide*0.30],
          defs.length
            ? [["Check","Defect","Response and date"]].concat(defs.map(x=>[x.item, x.description||"—",
                x.status==="closed" ? (x.fixNote||"Fixed") + " — " + shortDate(iso(x.fixedAt)) : "Open"]))
            : [["Check","Defect","Response and date"],["—","No defects recorded this week",""]],
          { header:true, colour:(r,ci,txt)=> txt==="Open" ? red : [0,0,0], size:8, pad:1.6 });

        doc.text("Declaration", { bold:true, size:9.5, colour:[.12,.35,.18], after:1 });
        doc.text("Upon inspecting, I confirm that the inspection results are accurate and where "
          + "deemed as safe are fit for purpose.", { size:8, colour:[.42,.46,.43], after:2 });
        doc.table([wide*0.16, wide*0.34, wide*0.22, wide*0.28],
          [["Day","Inspected by","Date and time","Signed"]].concat(doneDays.map(d=>[
            ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][days.indexOf(d)],
            map[d].by || "", shortDate(d) + " " + timeOnly(map[d].submittedAt),
            (map[d].data||{}).signature ? "Signed" : ""])),
          { header:true, size:8, pad:1.6 });
      });
      return;
    }

    /* ---- everything else: a page per record ---- */
    sec.items.forEach(rec=>{
      const d = rec.data || {};
      doc.newPage();
      if(first){ starts.push(doc.pages.length); first = false; }

      if(sec.key === "briefing"){
        doc.sheetHead(logo, "Daily Activities Briefing", "", meta(rec, [
          ["Delivered by", d.deliveredBy || rec.by || "", "Position", d.position || ""]
        ]));
        doc.table([wide/2, wide/2],
          [["CGC activities","Other trades activities"],
           [d.cgcActivities || "—", d.otherActivities || "—"]], { header:true });
        doc.table([wide*0.25, wide*0.25, wide*0.25, wide*0.25],
          [["Hot works","Excavation","Confined spaces","Other permit"],
           [yn(d.permitHot), yn(d.permitExc), yn(d.permitConfined), d.permitOther || "—"]],
          { header:true, align:["center","center","center","center"] });
        doc.text("Hazards briefed", { bold:true, size:10, colour:[.12,.35,.18], after:2 });
        doc.text((d.hazards||[]).length ? (d.hazards||[]).join(",  ") : "None recorded",
          { size:9.5, after:4 });
        doc.text("Pre-start checklist", { bold:true, size:10, colour:[.12,.35,.18], after:2 });
        doc.table([wide-70, 70],
          [["Check","Y / N / N/A"]].concat(BRIEFING_CHECKS.map(t=>
            [t, ckMark(d["b_"+slug(t)])]))
            .concat([["Any conflicting operations?", yn(d.b_conflicting)]]),
          { header:true, align:["left","center"],
            colour:(r,ci,txt)=> txt==="No" ? red : [0,0,0] });
        if(d.conflictingDetail) doc.pair("Conflicting operations", d.conflictingDetail);
        doc.text("Attendees", { bold:true, size:10, colour:[.12,.35,.18], after:2 });
        const att = (d.attendees||[]).slice();
        doc.table([wide/2, wide/2],
          Array.from({length: Math.ceil(Math.max(att.length,2)/2)}, (_,i)=>
            [ (i*2+1)+".  "+(att[i*2]||""), (i*2+2)+".  "+(att[i*2+1]||"") ]), { size:9 });
        if(d.otherAttendees) doc.pair("Others present", d.otherAttendees);
        doc.signature(d.signature && imgs.get(d.signature.src), rec.by, rec.submittedAt);
        return;
      }

      if(sec.key === "havs"){
        doc.sheetHead(logo, "Hand Arm Vibration (HAVs) Record Sheet", "CGCivils-006", meta(rec));
        doc.text("HAVs record keeping log", { bold:true, size:10, colour:[.12,.35,.18], after:2 });
        doc.table([wide*0.20, wide*0.20, wide*0.12, wide*0.14, wide*0.17, wide*0.17],
          [["Operative","Tool used","m/s²","Trigger time","Points","A(8)"]].concat(
            (d.entries||[]).map(e=>{
              const pts = havsPoints(e.magnitude, durHours(e.triggerTime));
              return [e.operative||"", (e.tool==="Other"? (e.toolOther||"Other") : (e.tool||"")),
                String(e.magnitude||""), durText(e.triggerTime)||"—",
                String(pts), String(havsA8(pts))];
            })),
          { header:true, align:["left","left","center","center","center","center"] });
        doc.text("Actions to reduce exposure", { bold:true, size:10, colour:[.12,.35,.18], after:2 });
        doc.table([wide*0.25, wide*0.75],
          [["Operative","Usage limits / job rotation / operative rotation"]].concat(
            (d.entries||[]).map(e=>[e.operative||"", e.actions||"—"])), { header:true });
        const tot = havsTotals(d.entries);
        doc.text("Daily totals", { bold:true, size:10, colour:[.12,.35,.18], after:2 });
        doc.table([wide*0.34, wide*0.16, wide*0.16, wide*0.34],
          [["Operative","Points","A(8)","Status"]].concat(tot.map(r=>
            [r.name, String(r.points), String(r.a8), r.status.label])),
          { header:true, align:["left","center","center","left"],
            colour:(ri,ci,txt)=> /limit value/.test(txt) ? red
              : /action value/.test(txt) ? [.66,.42,0] : [0,0,0] });
        doc.pair("Supervisor", d.supervisor || rec.by || "");
        doc.signature(d.signature && imgs.get(d.signature.src), d.supervisor || rec.by, rec.submittedAt);
        return;
      }

      if(sec.key === "puwer"){
        doc.sheetHead(logo, "PUWER Register", "CGCivils-013", meta(rec, [
          ["Location", d.location || DB.job, "", ""]
        ]));
        doc.text("This weekly inspection schedule ensures tools and work equipment are inspected "
          + "and confirmed as defect free and safe to use, in compliance with Regulations 5 and 6 "
          + "of the Provision and Use of Work Equipment Regulations 1998.",
          { size:8.5, colour:[.42,.46,.43], after:5 });
        doc.table([wide*0.30, wide*0.16, wide*0.30, wide*0.24],
          [["Tool / ID mark or number","Satisfactory","Details of found defects","Remedial action"]]
            .concat((d.tools||[]).map(t=>[t.tool||"", yn(t.ok), t.defects||"—", t.action||"—"])),
          { header:true, align:["left","center","left","left"],
            colour:(ri,ci,txt)=> txt==="No" ? red : [0,0,0] });
        doc.signature(d.signature && imgs.get(d.signature.src), rec.by, rec.submittedAt);
        return;
      }

      if(sec.key === "loler"){
        doc.sheetHead(logo, "Register of Excavator Lifting Equipment", "CGCivils-007", meta(rec, [
          ["Location", d.location || DB.job, "", ""]
        ]));
        doc.table([wide*0.24, wide*0.13, wide*0.15, wide*0.15, wide*0.13, wide*0.20],
          [["Description","ID no","Cert start","Cert end","Satisfactory","Status"]]
            .concat((d.items||[]).map(i=>[i.description||"", i.idNo||"",
              i.certStart?shortDate(i.certStart):"—", i.certEnd?shortDate(i.certEnd):"—",
              yn(i.ok), i.status||""])),
          { header:true, align:["left","left","center","center","center","left"],
            colour:(ri,ci,txt)=> (txt==="No"||txt==="Quarantined") ? red : [0,0,0] });
        const bad = (d.items||[]).filter(i=>i.ok===false && i.defects);
        if(bad.length){
          doc.text("Details of found defects", { bold:true, size:10, colour:[.12,.35,.18], after:2 });
          doc.table([wide*0.3, wide*0.7],
            [["Item","Defect"]].concat(bad.map(i=>[i.description||"", i.defects])), { header:true });
        }
        doc.signature(d.signature && imgs.get(d.signature.src), rec.by, rec.submittedAt);
        return;
      }

      if(sec.key === "excavation"){
        doc.sheetHead(logo, "Excavation Inspection", "", meta(rec, [
          ["Excavation", d.ref || rec.excRef || "", "Location", d.location || ""],
          ["Maximum depth", (d.depth!==undefined&&d.depth!=="") ? d.depth+" m" : "—",
           "Support system", d.support || ""]
        ]));
        doc.table([wide-70, 70],
          [["Inspection","Y / N / N/A"]].concat(EXCAVATION_CHECKS.map(t=>
            [t, ckMark(d["e_"+slug(t)])])),
          { header:true, align:["left","center"], colour:(r,ci,txt)=> txt==="No" ? red : [0,0,0] });
        const faults = EXCAVATION_CHECKS.filter(t=>{
          const v = d["e_"+slug(t)]; return v && v.v===false;
        });
        if(faults.length){
          doc.table([wide*0.35, wide*0.65],
            [["Check","What was found"]].concat(faults.map(t=>[t, (d["e_"+slug(t)].defect)||"—"])),
            { header:true });
        }
        doc.table([wide*0.35, wide*0.65],
          [["Safe for work to continue?", yn(d.safe)]].concat(d.action ? [["Action taken", d.action]] : []),
          { colour:(r,ci,txt)=> txt==="No" ? red : [0,0,0] });
        (d.photos||[]).slice(0,4).forEach(ph=>{
          const im = imgs.get(ph.src);
          if(im){ doc.image(im, 240); doc.text(stamp(ph.takenAt), { size:8, colour:[.5,.54,.51], after:3 }); }
        });
        doc.signature(d.signature && imgs.get(d.signature.src), rec.by, rec.submittedAt);
        return;
      }

      /* anything new falls back to a plain listing */
      doc.sheetHead(logo, formDef(rec.form).name, "", meta(rec));
      sectionsFor(rec.form).forEach(sc=>{
        sc.fields.filter(f=>visible(f,d) && f.type!=="signature").forEach(f=>{
          const v = d[f.id];
          if(v===undefined || v==="") return;
          doc.pair(f.label, Array.isArray(v) ? v.join(", ") : String(v));
        });
      });
      doc.signature(d.signature && imgs.get(d.signature.src), rec.by, rec.submittedAt);
    });
  });

  /* ---------------- outstanding ---------------- */
  let gapsPage = null;
  if(gaps.length){
    doc.newPage();
    gapsPage = doc.pages.length;
    doc.sheetHead(logo, "Records outstanding", "", null);
    doc.text("These were not completed for the week covered by this pack.",
      { size:9.5, colour:[.42,.46,.43], after:4 });
    doc.table([wide*0.6, wide*0.4],
      [["Record","Day"]].concat(gaps.map(g=>[g.name, g.date ? longDate(g.date) : "Not done this week"])),
      { header:true });
  }

  /* ---------------- contents ---------------- */
  const total = doc.pages.length;
  const saveTo = doc.page, saveY = doc.y;
  doc.page = contentsAnchor.page; doc.y = contentsAnchor.y;
  secs.forEach((sec, i)=>{
    doc.pair((i+1) + ".  " + sec.name,
      sec.items.length + (sec.items.length===1?" record":" records") + "     page " + starts[i]);
  });
  if(gapsPage) doc.pair("Records outstanding", gaps.length + "     page " + gapsPage, [.66,.42,0]);
  doc.pair("Total pages", String(total));
  doc.page = saveTo; doc.y = saveY;

  return { blob: doc.blob(), ref,
    name: (draft ? "DRAFT " : "") + "Weekly HS Pack - " + DB.job.replace(/[^\w\- ]+/g,"")
      + " - wc " + ws + ".pdf",
    count: secs.reduce((n,x)=>n+x.items.length,0), gaps: gaps.length, total };
}

function defectReportText(m, df){
  const lines = [];
  lines.push("Plant defect — " + (m.item||"machine") + (m.fleetNo ? " ("+m.fleetNo+")" : ""));
  lines.push("");
  lines.push("Site: " + DB.job);
  if(m.model) lines.push("Model: " + m.model);
  lines.push("Type: " + (m.type||"Excavator"));
  lines.push("Reported by: " + (df.items[0].reportedBy || cfg().user.name));
  const to = recipientFor(m);
  if(to.kind === "hire" && to.ref) lines.push("Hire reference: " + to.ref);
  if(df.unsafe) lines.push("MACHINE MARKED NOT FIT FOR USE");
  lines.push("");
  lines.push("Defects outstanding:");
  df.items.forEach(x => lines.push("- " + x.item + (x.description ? ": " + x.description : "")
    + " — reported " + ageText(x.reportedAt)));
  return lines.join("\n");
}

/* The defect report as a PDF file. */
async function defectReportPdf(plantId){
  const m = (DB.plant||[]).find(x=>x.id===plantId);
  const df = defectsFor(plantId);
  if(!m || !df) return null;
  const c = cfg();
  const doc = new PdfDoc();

  try{
    const logo = await jpegFromDataUrl(LOGO, 420);
    doc.image(logo, 150);
  }catch(e){}

  doc.text("Plant Defect Report", { size:17, bold:true, after:2 });
  doc.text(c.company + "  ·  " + shortDate(todayISO()), { size:10, colour:[.35,.39,.36], after:6 });
  doc.rule();

  if(df.unsafe) doc.banner("MACHINE MARKED NOT FIT FOR USE");

  doc.pair("Machine", m.item || "—");
  doc.pair("Fleet number", m.fleetNo || "—");
  doc.pair("Model", m.model || "—");
  doc.pair("Type", m.type || "Excavator");
  doc.pair("Site", DB.job);
  doc.pair("Reported by", df.items[0].reportedBy || c.user.name);
  const to = recipientFor(m);
  doc.pair("Reported to", to.kind==="internal"

    : to.name + (to.label==="Subcontractor" ? " (subcontractor)" : " (hire company)"),
    to.priority ? [.65,.17,.13] : [0,0,0]);
  if(to.kind==="hire" && to.ref) doc.pair("Hire reference", to.ref);
  if(to.priority) doc.pair("Priority", "Company machine — internal repair", [.65,.17,.13]);
  doc.pair("Longest outstanding", "Reported " + ageText(df.oldest));
  doc.heading("Defects outstanding");
  df.items.forEach((x,i)=>{
    doc.text((i+1) + ".  " + x.item, { bold:true, size:11 });
    if(x.description) doc.text(x.description, { indent:16, size:10.5 });
    doc.text("Reported " + ageText(x.reportedAt) + "  ·  " + shortDate(x.date)
      + (x.checkRef ? "  ·  " + x.checkRef : ""), { indent:16, size:9.5, colour:[.42,.46,.43], after:4 });
  });

  const shots = [];
  df.items.forEach(x=>(x.photos||[]).forEach(ph=>shots.push({ ph, label:x.item })));
  if(shots.length){
    doc.heading("Photographs");
    for(const shot of shots){
      try{
        const img = await jpegFromDataUrl(shot.ph.src, 1000);
        doc.image(img, 300);
        doc.text(shot.label + "  ·  " + stamp(shot.ph.takenAt),
          { size:9, colour:[.42,.46,.43], after:6 });
      }catch(e){}
    }
  }

  doc.heading(recipientFor(m).kind==="internal" ? "Fleet engineer response" : "Hire company response");
  doc.text("Action taken", { bold:true, size:10 });
  doc.y -= 34; doc.rule();
  doc.text("Date", { bold:true, size:10 });
  doc.y -= 14; doc.rule();
  doc.text("Signed", { bold:true, size:10 });
  doc.y -= 22; doc.rule();

  doc.text((draft ? "Draft produced by " : "Produced by ") + c.company + " on " + stamp(Date.now()),
    { size:8.5, colour:[.5,.54,.51] });

  return { blob: doc.blob(),
    name: "Defect report - " + (m.fleetNo || m.item || "machine").replace(/[^\w\- ]+/g,"") + " - " + todayISO() + ".pdf" };
}

/* Share it if the phone can, without ever navigating the app away. */
async function reportDefect(plantId){
  const m = (DB.plant||[]).find(x=>x.id===plantId);
  const df = defectsFor(plantId);
  if(!m || !df){ toast("There are no open defects on this machine."); return; }
  const to = recipientFor(m);
  const subject = (to.priority ? "PRIORITY — " : "")
    + "Plant defect — " + (m.fleetNo || m.item || "machine") + " — " + DB.job;
  const body = defectReportText(m, df);

  toast("Building the report…");
  let file = null;
  try{
    const out = await defectReportPdf(plantId);
    if(out) file = new File([out.blob], out.name, { type:"application/pdf" });
  }catch(e){ /* fall through to text */ }

  if(navigator.share){
    try{
      if(file && navigator.canShare && navigator.canShare({ files:[file] }))
        await navigator.share({ files:[file], title: subject, text: body });
      else
        await navigator.share({ title: subject, text: body });
      return;
    }catch(e){ return; }   /* cancelled */
  }

  /* no share sheet — download the file instead */
  if(file){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(file); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    toast("Report saved. Attach it to your email.");
    return;
  }

  const a = document.createElement("a");
  a.href = "mailto:" + encodeURIComponent(to.email || "") + "?subject=" + encodeURIComponent(subject)
    + "&body=" + encodeURIComponent(body);
  a.target = "_blank"; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
}

/* Paperwork attached to a machine or an item of lifting gear. */
const DOC_TYPES = ["Thorough examination certificate","LOLER certificate","Test certificate",
  "Service record","Hire agreement","Operator manual","Other"];

function itemsList(kind){
  return kind==="lifting" ? (DB.lifting||[])
    : kind==="tools" ? (DB.tools||[])
    : (DB.plant||[]);
}
function findItem(kind, id){ return itemsList(kind).find(x=>x.id===id) || null; }

function addDoc(kind, id, doc){
  const it = findItem(kind, id);
  if(!it) return;
  it.docs = it.docs || [];
  it.docs.unshift(Object.assign({ id:"doc_"+Date.now() }, doc));
  save();
}
function docCount(it){ return (it.docs||[]).length; }

/* A certificate is only worth anything until it runs out, so each one carries
   the date it expires and is marked once it has. */
function docState(d){
  if(!d.expires) return { label:"", cls:"" };
  const days = Math.round((parse(d.expires) - parse(todayISO())) / 86400000);
  if(days < 0)  return { label:"Expired "+shortDate(d.expires), cls:"red" };
  if(days <= 30) return { label:"Expires "+shortDate(d.expires), cls:"amber" };
  return { label:"Valid to "+shortDate(d.expires), cls:"ok" };
}

function docsBlock(kind, it){
  const docs = (it.docs||[]).slice().sort((a,b)=>
    (b.scannedAt||0)-(a.scannedAt||0));
  return `<div class="sect" style="margin:22px 0 8px">Documents${docs.length?" ("+docs.length+")":""}</div>
    ${docs.length ? `<div class="card" style="padding:4px 14px">${docs.map(d=>{

/* A certificate runs to the day before the anniversary: examined 10/09/26 on a
   12 month interval is due again 09/09/27. */
function addMonthsISO(d, n){
  const x = parse(d);
  const day = x.getDate();
  x.setMonth(x.getMonth() + n);
  if(x.getDate() < day) x.setDate(0);        /* clamp for short months */
  x.setDate(x.getDate() - 1);
  return iso(x);
}

/* Every diary with dayworks on it raises a numbered variation sheet — VO1,
   VO2 and so on, in the order they happen — for the Principal Contractor to
   sign, either on the screen or on paper. */
function smallPlantText(v){
  if(!v) return "";
  if(typeof v === "string") return v;              /* entries made before it was a list */
  return v.filter(x=>x && x.item)
    .map(x=>x.item + (durText(x.hours) ? " — "+durText(x.hours) : ""))
    .join(", ");
}

/* The next number is always one past the highest in use, worked out fresh each
   time. Delete VO1 while it is the only sheet and the next one raised is VO1
   again. Rename one to VO7 and the next is VO8. */
function highestVoNumber(){
  let max = 0;
  (DB.vos||[]).forEach(v=>{
    const m = String(v.ref||"").match(/(\d+)\s*$/);
    if(!m) return;
    const n = parseInt(m[1],10);
    if(!isNaN(n) && n > max) max = n;
  });
  return max;
}
const VO_PREFIX = "CGC-VO-";
function nextVoRef(){ return VO_PREFIX + String(highestVoNumber() + 1).padStart(3,"0"); }
function voForRecord(recId){ return (DB.vos||[]).find(v=>v.recordId===recId) || null; }

function voForRecordIndex(recId, idx){
  return (DB.vos||[]).find(v=>v.recordId===recId && (v.taskIndex||0)===idx) || null;
}

/* One sheet per daywork on the diary, so a day with two instructions raises two. */
function syncVo(rec){
  DB.vos = DB.vos || [];
  const d = rec.data || {};
  let tasks = [];
  if(d.dayworks === true){
    tasks = Array.isArray(d.dwList) && d.dwList.length ? d.dwList
      : (d.dwWhat ? [{ what:d.dwWhat, ref:d.dwRef, by:d.dwBy, labour:d.dwLabour,
          plant:d.dwPlant, smallPlant:d.dwSmallPlant, hours:d.dwHours,
          materials:d.dwMaterials, comments:d.dwComments }] : []);
  }

  /* drop any sheet whose task has gone, unless it has been signed */
  (DB.vos||[]).filter(v=>v.recordId===rec.id).forEach(v=>{
    if((v.taskIndex||0) >= tasks.length && v.status!=="signed")
      DB.vos = DB.vos.filter(x=>x.id!==v.id);
  });

  tasks.forEach((t, i)=>{
    const snapshot = {
      ref: t.ref||"", instructedBy: t.by||"", what: t.what||"",
      labour: t.labour||[], plant: t.plant||[], smallPlant: t.smallPlant||[],
      hours: t.hours||"", materials: t.materials||"", comments: t.comments||""
    };
    const existing = voForRecordIndex(rec.id, i);
    if(existing){
      if(existing.status !== "signed"){ existing.data = snapshot; existing.updatedAt = Date.now(); }
      return;
    }
    DB.vos.push({
      id:"vo_"+Date.now()+"_"+i, ref: nextVoRef(), recordId: rec.id, taskIndex: i,
      job: rec.job, date: rec.date, raisedBy: rec.by, createdAt: Date.now(),
      status:"unsigned", data: snapshot
    });
  });
}

/* Durations are entered as hours and minutes, kept as {h,m}. */
function durText(v){
  if(v===undefined||v===null||v==="") return "";
  if(typeof v === "number") return v+" hrs";                 /* entered before the change */
  const h = Number(v.h)||0, m = Number(v.m)||0;
  if(!h && !m) return "";
  const parts = [];
  if(h) parts.push(h+" hr"+(h===1?"":"s"));
  if(m) parts.push(m+" min"+(m===1?"":"s"));
  return parts.join(" ");
}
const durEmpty = v => !v || (typeof v==="object" && !(Number(v.h)||0) && !(Number(v.m)||0));

/* Hours worked = finish minus start, less the break. */
const toMins = t => { if(!t||t.indexOf(":")<0) return null;
  const [h,m]=t.split(":").map(Number); return h*60+m; };
function workedHours(start, finish){
  const a=toMins(start), b=toMins(finish);
  if(a==null||b==null) return null;
  let mins = b-a; if(mins<0) mins += 24*60;
  mins -= (Number(hoursFor().breakMins)||30);
  if(mins<0) mins = 0;
  return Math.round((mins/60)*100)/100;
}
const normalHours = (job) => workedHours(hoursFor(job).start, hoursFor(job).finish);
function rowHours(row){
  if(!row || row.onSite!==true) return 0;
  if(row.normal===true) return normalHours() || 0;
  return workedHours(row.start, row.finish) || 0;
}

/* ------------------------------------------------------------- scanner --
   Photograph a certificate, drag the corners onto the page, and it is warped
   square and cleaned up — a scan rather than a snapshot of a desk.
   -------------------------------------------------------------------------*/

/* Solve the 8 unknowns of a projective transform mapping the output rectangle
   onto the four corners the user picked. */
function solve8(A, b){
  const n = 8;
  for(let i=0;i<n;i++){
    let piv = i;
    for(let r=i+1;r<n;r++) if(Math.abs(A[r][i]) > Math.abs(A[piv][i])) piv = r;
    [A[i],A[piv]] = [A[piv],A[i]]; [b[i],b[piv]] = [b[piv],b[i]];
    const d = A[i][i] || 1e-9;
    for(let r=i+1;r<n;r++){
      const f = A[r][i] / d;
      for(let c=i;c<n;c++) A[r][c] -= f * A[i][c];
      b[r] -= f * b[i];
    }
  }
  const x = new Array(n).fill(0);
  for(let i=n-1;i>=0;i--){
    let sum = b[i];
    for(let c=i+1;c<n;c++) sum -= A[i][c] * x[c];
    x[i] = sum / (A[i][i] || 1e-9);
  }
  return x;
}
function homography(dst, src){          /* both arrays of 4 {x,y} */
  const A = [], b = [];
  for(let i=0;i<4;i++){
    const {x:u,y:v} = dst[i], {x:X,y:Y} = src[i];
    A.push([u,v,1,0,0,0,-u*X,-v*X]); b.push(X);
    A.push([0,0,0,u,v,1,-u*Y,-v*Y]); b.push(Y);
  }
  const h = solve8(A,b);
  return [h[0],h[1],h[2],h[3],h[4],h[5],h[6],h[7],1];
}

/* Find the page on its own: Otsu threshold, largest bright blob, then the four
   extreme points of that blob give the corners even when the photo is skewed. */
function otsu(hist, total){
  let sum = 0;
  for(let i=0;i<256;i++) sum += i*hist[i];
  let sumB = 0, wB = 0, best = 0, thr = 128;
  for(let i=0;i<256;i++){
    wB += hist[i];
    if(!wB) continue;
    const wF = total - wB;
    if(!wF) break;
    sumB += i*hist[i];
    const mB = sumB/wB, mF = (sum-sumB)/wF;
    const between = wB*wF*(mB-mF)*(mB-mF);
    if(between > best){ best = between; thr = i; }
  }
  return thr;
}

function detectPage(img){
  const W = img.width, H = img.height;
  const sc = 240 / Math.max(W,H);
  const w = Math.max(40, Math.round(W*sc)), h = Math.max(40, Math.round(H*sc));
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const g = cv.getContext("2d");
  g.drawImage(img, 0, 0, w, h);
  const d = g.getImageData(0,0,w,h).data;

  const grey = new Uint8Array(w*h);
  const hist = new Uint32Array(256);
  for(let i=0, p=0; i<d.length; i+=4, p++){
    const v = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) | 0;
    grey[p] = v; hist[v]++;
  }
  const thr = Math.max(60, otsu(hist, w*h) - 6);

  /* largest connected run of bright pixels */
  const lab = new Int32Array(w*h).fill(-1);
  let bestId = -1, bestSize = 0, id = 0;
  const stack = new Int32Array(w*h);
  for(let start=0; start<w*h; start++){
    if(grey[start] < thr || lab[start] !== -1) continue;
    let sp = 0, size = 0;
    stack[sp++] = start; lab[start] = id;
    while(sp){
      const q = stack[--sp]; size++;
      const x = q % w, y = (q / w) | 0;
      if(x>0   && grey[q-1]>=thr && lab[q-1]===-1){ lab[q-1]=id; stack[sp++]=q-1; }
      if(x<w-1 && grey[q+1]>=thr && lab[q+1]===-1){ lab[q+1]=id; stack[sp++]=q+1; }
      if(y>0   && grey[q-w]>=thr && lab[q-w]===-1){ lab[q-w]=id; stack[sp++]=q-w; }
      if(y<h-1 && grey[q+w]>=thr && lab[q+w]===-1){ lab[q+w]=id; stack[sp++]=q+w; }
    }
    if(size > bestSize){ bestSize = size; bestId = id; }
    id++;
  }

  const whole = [{x:0,y:0},{x:W,y:0},{x:W,y:H},{x:0,y:H}];
  if(bestId < 0 || bestSize < w*h*0.12) return { corners: whole, found:false };

  /* extremes of the blob: these are the page corners */
  let tl=null, tr=null, br=null, bl=null;
  let tlv=1e9, trv=-1e9, brv=-1e9, blv=1e9;
  let minX=w, maxX=0, minY=h, maxY=0;
  for(let p=0; p<w*h; p++){
    if(lab[p] !== bestId) continue;
    const x = p % w, y = (p / w) | 0;
    if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
    const sum = x+y, dif = x-y;
    if(sum < tlv){ tlv=sum; tl={x,y}; }
    if(sum > brv){ brv=sum; br={x,y}; }
    if(dif > trv){ trv=dif; tr={x,y}; }
    if(dif < blv){ blv=dif; bl={x,y}; }
  }
  if(!tl||!tr||!br||!bl) return { corners: whole, found:false };

  /* if it fills nearly the whole frame there was probably no visible edge */
  const fills = (maxX-minX) > w*0.97 && (maxY-minY) > h*0.97;
  const k = 1/sc;
  const out = [tl,tr,br,bl].map(c=>({ x:c.x*k, y:c.y*k }));

  /* a page should be a sensible quadrilateral, not a sliver */
  const side = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
  const top = side(out[0],out[1]), right = side(out[1],out[2]),
        bottom = side(out[2],out[3]), left = side(out[3],out[0]);
  const ratio = Math.min(top,bottom)/Math.max(top,bottom,1);
  const ratio2 = Math.min(left,right)/Math.max(left,right,1);
  if(ratio < 0.55 || ratio2 < 0.55) return { corners: whole, found:false };

  return { corners: out, found: !fills };
}

function warpToPage(img, corners, enhance){
  const d = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
  let W = Math.round(Math.max(d(corners[0],corners[1]), d(corners[3],corners[2])));
  let H = Math.round(Math.max(d(corners[0],corners[3]), d(corners[1],corners[2])));
  const cap = 1500;
  const sc = Math.min(1, cap/Math.max(W,H));
  W = Math.max(40, Math.round(W*sc)); H = Math.max(40, Math.round(H*sc));

  const out = document.createElement("canvas");
  out.width = W; out.height = H;
  const og = out.getContext("2d");
  const dest = [{x:0,y:0},{x:W,y:0},{x:W,y:H},{x:0,y:H}];
  const h = homography(dest, corners);

  const src = document.createElement("canvas");
  src.width = img.width; src.height = img.height;
  src.getContext("2d").drawImage(img,0,0);
  const sd = src.getContext("2d").getImageData(0,0,img.width,img.height).data;
  const od = og.createImageData(W,H);

  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const den = h[6]*x + h[7]*y + h[8];
      const sx = Math.round((h[0]*x + h[1]*y + h[2]) / den);
      const sy = Math.round((h[3]*x + h[4]*y + h[5]) / den);
      const o = (y*W + x) * 4;
      if(sx<0 || sy<0 || sx>=img.width || sy>=img.height){
        od.data[o]=od.data[o+1]=od.data[o+2]=255; od.data[o+3]=255; continue;
      }
      const i = (sy*img.width + sx) * 4;
      od.data[o]=sd[i]; od.data[o+1]=sd[i+1]; od.data[o+2]=sd[i+2]; od.data[o+3]=255;
    }
  }

  if(enhance){                                   /* lift the paper, deepen the ink */
    const p = od.data;
    let lo = 255, hi = 0;
    for(let i=0;i<p.length;i+=4){
      const v = (p[i]+p[i+1]+p[i+2])/3;
      if(v<lo) lo=v; if(v>hi) hi=v;
    }
    const range = Math.max(30, hi-lo);
    for(let i=0;i<p.length;i+=4){
      for(let c=0;c<3;c++){
        let v = (p[i+c]-lo) * (255/range);
        v = (v - 128) * 1.25 + 138;              /* contrast, slightly bright */
        p[i+c] = v<0?0:v>255?255:v;
      }
    }
  }
  og.putImageData(od,0,0);
  return out.toDataURL("image/jpeg", 0.82);
}

function openScanner(onDone){
  const pick = document.createElement("input");
  pick.type = "file"; pick.accept = "image/*";
  pick.onchange = () => {
    const file = pick.files[0];
    if(!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const det = detectPage(img);
        scanPreview(img, det, onDone);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  };
  pick.click();
}

function scanEditor(img, onDone, startCorners){
  let corners = startCorners || detectPage(img).corners;
  let enhance = true;

  const wrap = document.createElement("div");
  wrap.className = "scanwrap";
  wrap.innerHTML = `
    <div class="scanbar">
      <button data-cancel>Cancel</button>
      <span class="t">Drag the corners onto the page</span>
      <button data-save>Use it</button>
    </div>
    <div class="scanstage"><canvas id="scanCv"></canvas></div>
    <div class="scanfoot">
      <button class="btn line sm" style="margin:0" data-auto>Find it again</button>
      <button class="btn line sm" style="margin:0" data-full>Whole photo</button>
      <button class="btn line sm" style="margin:0" data-enh>Clean up: on</button>
    </div>`;
  document.body.appendChild(wrap);

  const cv = wrap.querySelector("#scanCv");
  const g = cv.getContext("2d");
  const stage = wrap.querySelector(".scanstage");
  let scale = 1;

  function layout(){
    const maxW = stage.clientWidth - 24, maxH = stage.clientHeight - 24;
    scale = Math.min(maxW/img.width, maxH/img.height);
    cv.width = Math.round(img.width*scale);
    cv.height = Math.round(img.height*scale);
    draw();
  }
  function draw(){
    g.clearRect(0,0,cv.width,cv.height);
    g.drawImage(img,0,0,cv.width,cv.height);
    g.save();
    g.beginPath();
    corners.forEach((c,i)=> i ? g.lineTo(c.x*scale,c.y*scale) : g.moveTo(c.x*scale,c.y*scale));
    g.closePath();
    g.fillStyle = "rgba(0,0,0,.35)";
    g.fillRect(0,0,cv.width,cv.height);
    g.globalCompositeOperation = "destination-out";
    g.fill();
    g.restore();
    g.strokeStyle = "#2A7440"; g.lineWidth = 2;
    g.beginPath();
    corners.forEach((c,i)=> i ? g.lineTo(c.x*scale,c.y*scale) : g.moveTo(c.x*scale,c.y*scale));
    g.closePath(); g.stroke();
    corners.forEach(c=>{
      g.beginPath(); g.arc(c.x*scale, c.y*scale, 11, 0, Math.PI*2);
      g.fillStyle = "#fff"; g.fill();
      g.lineWidth = 3; g.strokeStyle = "#1F5A2D"; g.stroke();
    });
  }
  let drag = -1;
  const at = e => { const r = cv.getBoundingClientRect();
    return { x:(e.clientX-r.left)/scale, y:(e.clientY-r.top)/scale }; };
  cv.addEventListener("pointerdown", e=>{
    e.preventDefault();
    const p = at(e);
    let best = -1, bd = 1e9;
    corners.forEach((c,i)=>{ const d = Math.hypot(c.x-p.x, c.y-p.y); if(d<bd){ bd=d; best=i; } });
    if(bd * scale < 44){ drag = best; cv.setPointerCapture(e.pointerId); }
  });
  cv.addEventListener("pointermove", e=>{
    if(drag<0) return;
    e.preventDefault();
    const p = at(e);
    corners[drag] = { x: Math.max(0, Math.min(img.width, p.x)),
                      y: Math.max(0, Math.min(img.height, p.y)) };
    draw();
  });
  const stop = ()=>{ drag = -1; };
  cv.addEventListener("pointerup", stop);
  cv.addEventListener("pointercancel", stop);

  wrap.querySelector("[data-cancel]").onclick = () => wrap.remove();
  wrap.querySelector("[data-auto]").onclick = () => { corners = detectPage(img).corners; draw(); };
  wrap.querySelector("[data-full]").onclick = () => {
    corners = [{x:0,y:0},{x:img.width,y:0},{x:img.width,y:img.height},{x:0,y:img.height}];
    draw();
  };
  const eb = wrap.querySelector("[data-enh]");
  eb.onclick = () => { enhance = !enhance; eb.textContent = "Clean up: " + (enhance?"on":"off"); };
  wrap.querySelector("[data-save]").onclick = () => {
    const btn = wrap.querySelector("[data-save]");
    btn.textContent = "Working…";
    setTimeout(()=>{
      let src;
      try{ src = warpToPage(img, corners, enhance); }
      catch(e){ toast("That scan could not be processed."); wrap.remove(); return; }
      wrap.remove();
      onDone({ src, scannedAt: Date.now() });
    }, 30);
  };

  layout();
  window.addEventListener("resize", layout);
}

/* The result, straightened and cleaned up, with a way back if it got it wrong. */
function scanPreview(img, det, onDone){
  let src;
  try{ src = warpToPage(img, det.corners, true); }
  catch(e){ scanEditor(img, onDone, det.corners); return; }

  const wrap = document.createElement("div");
  wrap.className = "scanwrap";
  wrap.innerHTML = `
    <div class="scanbar">
      <button data-retake>Retake</button>
      <span class="t">${det.found ? "Page found and straightened" : "Could not find the edges"}</span>
      <button data-save>Use it</button>
    </div>
    <div class="scanstage"><img src="${src}" alt="Scan" class="scanshot"></div>
    <div class="scanfoot">
      <button class="btn line sm" style="margin:0" data-adjust>Adjust the corners</button>
    </div>`;
  document.body.appendChild(wrap);

  wrap.querySelector("[data-save]").onclick = () => {
    wrap.remove();
    onDone({ src, scannedAt: Date.now() });
  };
  wrap.querySelector("[data-adjust]").onclick = () => {
    wrap.remove();
    scanEditor(img, onDone, det.corners);
  };
  wrap.querySelector("[data-retake]").onclick = () => { wrap.remove(); openScanner(onDone); };
}

/* Signing happens in its own panel, so a finger on the canvas can never drag
   the page underneath it. */
function openSignaturePad(existing, onSave){
  const wrap = document.createElement("div");
  wrap.className = "scrim";
  wrap.innerHTML = `<div class="dlg">
      <h3>Sign here</h3>
      <p>Use your finger. Landscape gives you more room.</p>
      <canvas class="sigpad" id="padCanvas"></canvas>
      <div class="sigline">Sign above</div>
      <div class="g2" style="margin-bottom:10px">
        <button class="btn line" style="margin:0" data-padclear>Clear</button>
        <button class="btn line" style="margin:0" data-padcancel>Cancel</button>
      </div>
      <button class="btn" style="margin:0" data-padsave>Save signature</button>
    </div>`;
  document.body.appendChild(wrap);

  const cv = wrap.querySelector("#padCanvas");
  const rect = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = rect.width*dpr; cv.height = rect.height*dpr;
  const g = cv.getContext("2d");
  g.scale(dpr,dpr);
  g.lineWidth = 2.4; g.lineCap = "round"; g.lineJoin = "round"; g.strokeStyle = "#16261C";
  let touched = false;
  if(existing){
    const im = new Image();
    im.onload = () => g.drawImage(im, 0, 0, rect.width, rect.height);
    im.src = existing; touched = true;
  }

  let drawing = false, last = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; };
  cv.addEventListener("pointerdown", e => {
    e.preventDefault(); drawing = true; touched = true; last = pos(e);
    cv.setPointerCapture(e.pointerId);
    g.beginPath(); g.moveTo(last.x,last.y); g.lineTo(last.x+0.1,last.y); g.stroke();
  });
  cv.addEventListener("pointermove", e => {
    if(!drawing) return;
    e.preventDefault();
    const p = pos(e);
    g.beginPath(); g.moveTo(last.x,last.y); g.lineTo(p.x,p.y); g.stroke();
    last = p;
  });
  const stop = e => { if(e) e.preventDefault(); drawing = false; };
  cv.addEventListener("pointerup", stop);
  cv.addEventListener("pointercancel", stop);
  cv.addEventListener("pointerleave", stop);
  cv.addEventListener("touchmove", e => e.preventDefault(), { passive:false });

  const close = () => wrap.remove();
  wrap.querySelector("[data-padcancel]").onclick = close;
  wrap.querySelector("[data-padclear]").onclick = () => {
    g.clearRect(0,0,cv.width,cv.height); touched = false;
  };
  wrap.querySelector("[data-padsave]").onclick = () => {
    if(!touched){ toast("Nothing has been signed yet."); return; }
    const src = cv.toDataURL("image/png");
    close();
    onSave(src);
  };
}

/* An uploaded document, sized down but kept readable. */
function compressDoc(file){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onerror = ()=>rej();
    fr.onload = () => {
      const im = new Image();
      im.onerror = ()=>rej();
      im.onload = () => {
        const sc = Math.min(1, 1500/Math.max(im.width, im.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(im.width*sc); cv.height = Math.round(im.height*sc);
        const g = cv.getContext("2d");
        g.fillStyle="#fff"; g.fillRect(0,0,cv.width,cv.height);
        g.drawImage(im,0,0,cv.width,cv.height);
        res({ src: cv.toDataURL("image/jpeg", 0.82), scannedAt: Date.now() });
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
