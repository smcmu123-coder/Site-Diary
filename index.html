/* ------------------------------------------------------------- timesheet -- */
/* Built entirely from the diaries. Nothing is typed twice. */
function timesheetWeek(ws){
  const days = weekDays(ws);
  const people = {};
  days.forEach(d=>{
    const rec = DB.records.find(r=>r.date===d && r.job===DB.job
      && (r.form||"diary")==="diary" && r.status==="submitted");
    (rec && rec.data.labourTable || []).forEach(row=>{
      const key = row.id || row.name;
      if(row.leave){
        if(!people[key]) people[key] = { name:row.name, trade:row.trade, key, days:{}, total:0 };
        people[key].days[d] = { leave:row.leave, hours:0, recId: rec.id };
        return;
      }
      if(row.onSite!==true) return;
      if(!people[key]) people[key] = { name:row.name, trade:row.trade, key, days:{}, total:0 };
      const h = rowHours(row);
      people[key].days[d] = { hours:h, start: row.normal===false?row.start:hoursFor().start,
        finish: row.normal===false?row.finish:hoursFor().finish, normal: row.normal!==false,
        reason: row.reason||"", recId: rec.id };
      people[key].total += h;
    });
  });
  return { days, people:Object.values(people) };
}

/* Correcting a day: it writes back into that day's diary, so the timesheet and
   the diary never say different things. */
function editTimesheetDay(date, personKey){
  const rec = DB.records.find(r=>r.date===date && r.job===DB.job
    && (r.form||"diary")==="diary" && r.status==="submitted");
  if(!rec){ toast("There is no submitted diary for that day."); return; }
  const rows = rec.data.labourTable || [];
  const row = rows.find(r=>(r.id||r.name)===personKey);
  if(!row){ toast("That person is not on that day\u2019s diary."); return; }

  const h = hoursFor();
  const draft = {
    onSite: row.onSite !== false,
    normal: row.normal !== false,
    start: row.start || h.start,
    finish: row.finish || h.finish,
    reason: row.reason || ""
  };

  const wrap = document.createElement("div");
  wrap.className = "scrim";
  const paint = () => {
    wrap.innerHTML = `<div class="dlg">
      <h3>${esc(row.name || "This person")}</h3>
      <p>${longDate(date)} &middot; ${esc(rec.ref || "diary")}</p>
      ${row.leave ? `<div class="card" style="background:var(--info-bg);box-shadow:none">
        <p>Booked off as ${esc(row.leave)}. Change that under Time off.</p></div>
        <button class="btn" style="margin:0" data-x>Close</button>`
      : `
      <div class="f"><label>On site?</label>
        <div class="yn">
          <button type="button" class="${draft.onSite?"y":""}" data-on="1">Yes</button>
          <button type="button" class="${!draft.onSite?"n":""}" data-on="0">No</button>
        </div></div>
      ${draft.onSite ? `
        <div class="f"><label>Normal hours?</label>
          <div class="hint">${esc(h.start)} to ${esc(h.finish)}, ${h.breakMins} minute break.</div>
          <div class="yn">
            <button type="button" class="${draft.normal?"y":""}" data-nm="1">Yes</button>
            <button type="button" class="${!draft.normal?"n":""}" data-nm="0">No</button>
          </div></div>
        ${!draft.normal ? `
          <div class="g2">
            <div class="f"><label>Start</label>
              <input class="in" type="time" data-tf="start" value="${esc(draft.start)}"></div>
            <div class="f"><label>Finish</label>
              <input class="in" type="time" data-tf="finish" value="${esc(draft.finish)}"></div>
          </div>
          <div class="f"><label>Reason</label>
            <input class="in" data-tf="reason" value="${esc(draft.reason)}"
              placeholder="Overtime, early finish"></div>` : ""}
        <div class="card" style="background:var(--green-50);box-shadow:none;margin-bottom:16px">
          <div class="spread"><span>Hours for the day</span>
            <b style="font-size:17px">${Math.round(rowHours(Object.assign({},row,draft,{onSite:true}))*100)/100}</b></div>
        </div>` : ""}
      <button class="btn" data-save>Save the change</button>
      <button class="btn ghost" style="margin:0" data-x>Cancel</button>`}
    </div>`;
    wire();
  };
  const wire = () => {
    wrap.querySelectorAll("[data-on]").forEach(b=>b.onclick=()=>{ draft.onSite = b.dataset.on==="1"; paint(); });
    wrap.querySelectorAll("[data-nm]").forEach(b=>b.onclick=()=>{ draft.normal = b.dataset.nm==="1"; paint(); });
    wrap.querySelectorAll("[data-tf]").forEach(el=>{
      el.oninput = () => { draft[el.dataset.tf] = el.value; };
      el.onchange = () => { draft[el.dataset.tf] = el.value; paint(); };
    });
    const x = wrap.querySelector("[data-x]"); if(x) x.onclick = () => wrap.remove();
    const sv = wrap.querySelector("[data-save]");
    if(sv) sv.onclick = () => {
      row.onSite = draft.onSite;
      if(draft.onSite){
        row.normal = draft.normal;
        if(!draft.normal){ row.start = draft.start; row.finish = draft.finish; row.reason = draft.reason; }
        else { delete row.start; delete row.finish; delete row.reason; }
      }
      rec.updatedAt = Date.now();
      rec.amendedAt = Date.now();
      save(); wrap.remove(); render();
      toast("Diary updated — " + shortDate(date));
    };
  };
  document.body.appendChild(wrap);
  paint();
  wrap.onclick = e => { if(e.target===wrap) wrap.remove(); };
}

/* When the week looks empty, say why rather than showing a blank grid. */
function timesheetReason(ws){
  const days = weekDays(ws);
  const inWeek = DB.records.filter(r=>days.includes(r.date));
  const diaries = inWeek.filter(r=>(r.form||"diary")==="diary");
  const mine = diaries.filter(r=>r.job===DB.job);
  const submitted = mine.filter(r=>r.status==="submitted");
  const drafts = mine.filter(r=>r.status!=="submitted");

  if(!diaries.length) return "No diaries have been filled in for this week yet.";
  if(!mine.length){
    const jobs = [...new Set(diaries.map(r=>r.job))].filter(Boolean);
    return (diaries.length===1 ? "There is 1 diary" : "There are " + diaries.length + " diaries")
      + " this week, but " + (diaries.length===1?"it is":"they are") + " against "
      + (jobs.length===1 ? "\u201c"+jobs[0]+"\u201d" : "another job")
      + " and this timesheet is for \u201c" + DB.job + "\u201d.";
  }
  if(!submitted.length)
    return drafts.length + " diar" + (drafts.length===1?"y is":"ies are")
      + " still saved as " + (drafts.length===1?"a draft":"drafts")
      + ". Hours are counted once a diary is submitted.";
  const withRows = submitted.filter(r=>(r.data.labourTable||[]).length);
  if(!withRows.length)
    return submitted.length + " diar" + (submitted.length===1?"y has":"ies have")
      + " been submitted, but nobody was on the labour register when they were filled in.";
  const anyOn = withRows.some(r=>(r.data.labourTable||[]).some(x=>x.onSite===true));
  if(!anyOn) return "Everyone was marked as not on site on this week\u2019s diaries.";
  return null;
}

function timesheetView(){
  const ws = view.week || weekStart(todayISO());
  const { days, people } = timesheetWeek(ws);
  const why = people.length ? null : timesheetReason(ws);
  const grand = people.reduce((n,p)=>n+p.total,0);
  const round = n => Math.round(n*100)/100;
  const LETTERS = ["M","T","W","T","F","S","S"];

  const dayCell = (p, d, i) => {
    const c = p.days[d];
    const weekend = i > 4;
    let cls = "none", val = "–";
    if(c && c.leave){ cls = "hol"; val = c.leave; }
    else if(c){ cls = c.normal ? "norm" : "extra"; val = round(c.hours); }
    return `<button class="tsday ${cls}${weekend?" we":""}" data-tsedit="${d}|${esc(p.key)}">
      <span class="dl">${LETTERS[i]}</span><span class="dv">${esc(val)}</span></button>`;
  };

  const body = people.map(p=>`
    <div class="tsperson">
      <div class="tshead">
        <span class="nm">${esc(p.name)}<span class="tr">${esc(p.trade||"")}</span></span>
        <span class="tot">${round(p.total)}<span> hrs</span></span>
      </div>
      <div class="tsdays">${days.map((d,i)=>dayCell(p,d,i)).join("")}</div>
    </div>`).join("");

  return `<div class="top"><button class="chip" data-go="project">&lsaquo; Project</button></div>
    <h1 class="greet" style="font-size:22px;margin-top:12px">Timesheet</h1>
    <p class="sub">${esc(DB.job)}</p>

    <div class="card" style="display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:12px">
      <button class="btn line sm" style="margin:0" data-ts="-1" aria-label="Previous week">&lsaquo;</button>
      <span style="flex:1;text-align:center">
        <b style="display:block;font-weight:650">${ws===weekStart(todayISO())?"This week":"Week commencing "+shortDate(ws)}</b>
        <span style="font-size:12.5px;color:var(--ink-3)">${shortDate(ws)} – ${shortDate(addDays(ws,6))}</span>
      </span>
      <button class="btn line sm" style="margin:0" data-ts="1"
        ${ws>=weekStart(todayISO())?"disabled":""} aria-label="Next week">&rsaquo;</button>
    </div>

    ${people.length ? `
      <div class="tstotal">
        <div><div class="big">${round(grand)}</div><div class="lab">hours this week</div></div>
        <div class="side">${people.length} ${people.length===1?"person":"people"}<br>
          ${people.filter(p=>p.total>0).length} worked</div>
      </div>

      <div class="tsgrid">${body}</div>

      <div class="tskey">
        <span><i style="background:var(--canvas);box-shadow:inset 0 0 0 1px var(--line)"></i>Normal hours</span>
        <span><i style="background:var(--warn-bg)"></i>Outside normal hours</span>
        <span><i style="background:var(--info-bg)"></i>Booked off</span>
      </div>
      <p style="font-size:12.5px;color:var(--ink-3);padding:8px 4px 0">
        Hours are finish minus start, less a ${hoursFor().breakMins} minute break.
        Tap any day to correct it — the change goes back into that day&rsquo;s diary.</p>

      <button class="btn" style="margin-top:16px" data-tsprint="${ws}">Open timesheet PDF</button>`
    : `<div class="card"><h3>No hours this week</h3>
        <p>${esc(why || "Submit a diary with labour on it and the timesheet appears here.")}</p>
        <button class="btn line sm" style="margin:14px 0 0" data-go="list">Look at the records</button>
      </div>`}`;
}

function pathFor(r){
  const c = cfg(), d = parse(r.date);
  const folder = c.sharepoint.folder
    .replace(/{job}/g, r.job).replace(/{year}/g, d.getFullYear())
    .replace(/{month}/g, MON[d.getMonth()]);
  const file = c.sharepoint.filename
    .replace(/{job}/g, r.job).replace(/{date}/g, r.date).replace(/{ref}/g, r.ref||"");
  return (c.sharepoint.site?c.sharepoint.site+"/":"") + c.sharepoint.library + "/" + folder + "/" + file + ".pdf";
}
function previewPath(){
  return pathFor({ date: todayISO(), job: DB.job, ref: nextRef("DD", true) });
}
function nextRef(prefix, peek){
  const p = prefix || cfg().refPrefix;
  DB.counters = DB.counters || {};
  const n = (DB.counters[p]||0) + 1;
  if(!peek) DB.counters[p] = n;
  return p + "-" + String(n).padStart(4,"0");
}

/* Stamp burned into the pixels, so it survives the file being copied out of
   SharePoint and dropped into a report: time top right, logo bottom right. */
const MONS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function photoStampText(t){
  const d = new Date(t);
  const two = n => String(n).padStart(2,"0");
  return d.getDate()+" "+MONS[d.getMonth()]+" "+d.getFullYear()+" at "
    + two(d.getHours())+":"+two(d.getMinutes())+":"+two(d.getSeconds());
}
function loadImage(src){
  return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
}

function stampPhoto(file){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onerror = ()=>rej();
    fr.onload = () => {
      const img = new Image();
      img.onerror = ()=>rej();
      img.onload = async () => {
        const max = 1400;
        const sc = Math.min(1, max/Math.max(img.width,img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width*sc);
        cv.height = Math.round(img.height*sc);
        const g = cv.getContext("2d");
        g.drawImage(img, 0, 0, cv.width, cv.height);

        const W = cv.width, H = cv.height;
        const unit = Math.min(W, H);
        const margin = Math.round(unit*0.022);
        const takenAt = Date.now();

        /* time, top right, on a grey panel */
        const fs = Math.max(15, Math.round(unit*0.045));
        g.font = "700 "+fs+"px -apple-system, 'Segoe UI', system-ui, sans-serif";
        const text = photoStampText(takenAt);
        const tw = g.measureText(text).width;
        const padX = Math.round(fs*0.5), padY = Math.round(fs*0.34);
        const boxW = tw + padX*2, boxH = fs + padY*2;
        const boxX = W - margin - boxW, boxY = margin;
        g.fillStyle = "rgba(96,101,98,.62)";
        g.fillRect(boxX, boxY, boxW, boxH);
        g.fillStyle = "#fff";
        g.textBaseline = "middle";
        g.textAlign = "left";
        g.fillText(text, boxX + padX, boxY + boxH/2 + 1);

        /* logo, bottom right, on white so it reads over any background */
        try{
          const logo = await loadImage(LOGO);
          const lw = Math.round(W*0.24);
          const lh = Math.round(lw * (logo.height/logo.width));
          const lp = Math.round(lw*0.07);
          g.fillStyle = "#fff";
          g.fillRect(W - margin - lw - lp*2, H - margin - lh - lp*2, lw + lp*2, lh + lp*2);
          g.drawImage(logo, W - margin - lw - lp, H - margin - lh - lp, lw, lh);
        }catch(e){ /* carry on without it rather than lose the photo */ }

        res({ src: cv.toDataURL("image/jpeg",.72), takenAt });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ------------------------------------------------------------------ events -- */
function getVal(path){
  let node = formState.values;
  for(const seg of String(path).split(".")){
    if(node == null) return undefined;
    node = node[/^\d+$/.test(seg) ? Number(seg) : seg];
  }
  return node;
}
function setVal(path, value){
  const parts = String(path).split(".");
  let node = formState.values;
  for(let i=0;i<parts.length-1;i++){
    const key = /^\d+$/.test(parts[i]) ? Number(parts[i]) : parts[i];
    if(node[key] == null) node[key] = /^\d+$/.test(parts[i+1]) ? [] : {};
    node = node[key];
  }
  const last = parts[parts.length-1];
  node[/^\d+$/.test(last) ? Number(last) : last] = value;
}
function getField(path){
  const parts = String(path).split(".");
  let field = null;
  for(const s of sectionsFor(formState && formState.form))
    for(const f of s.fields) if(f.id===parts[0]) field = f;
  for(let i=1;i<parts.length && field;i++){
    if(/^\d+$/.test(parts[i])) continue;
    field = (field.columns||[]).find(c=>c.id===parts[i]) || null;
  }
  return field;
}

function saveDraft(){
  const id = formState.id || ("rec_"+Date.now());
  const existing = DB.records.find(r=>r.id===id);
  const rec = existing || { id, job:DB.job, date:formState.date, ref:null,
    form: formState.form || "diary", plantId: formState.plantId || null,
    excRef: formState.excRef || null,
    status:"draft", createdAt:Date.now(), by:cfg().user.name };
  rec.data = formState.values;
  if(formState.form === "excavation") rec.excRef = formState.values.ref || formState.excRef || "";
  rec.updatedAt = Date.now();
  if(!existing) DB.records.push(rec);
  formState.id = id;
  save();
  return rec;
}
function submitForm(){
  formState.touched = true;
  formState.errors = validate();
  const n = Object.keys(formState.errors).length;
  if(n){
    render();
    toast(n+" question"+(n>1?"s":"")+" still to answer");
    const first = document.getElementById("fl_"+Object.keys(formState.errors)[0]);
    if(first) first.scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  if(formState.form==="plantcheck"){
    formState.values.__weekly = sectionsFor("plantcheck").some(x=>x.title==="Weekly checks");
  }
  const rec = saveDraft();
  if(rec.status!=="submitted"){ rec.ref = nextRef(formDef(rec.form).prefix); }
  rec.status = "submitted";
  rec.submittedAt = Date.now();
  rec.by = cfg().user.name;
  rec.byEmail = cfg().user.email;
  rec.synced = false;
  rec.version = (rec.version||0)+1;

function printRecord(id){
  const r = DB.records.find(x=>x.id===id);
  const c = cfg();
  const fmt = (fl,v) => v===undefined||v===null||v===""?"—"
    : fl.type==="duration" ? (durText(v)||"—")
    : fl.type==="yesno" ? (v?"Yes":"No")
    : Array.isArray(v) ? (v.length?v.join(", "):"—")
    : String(v)+(fl.suffix?" "+fl.suffix:"");
  let body = "";
  sectionsFor(r.form).forEach(s=>{
    const fs = s.fields.filter(f=>visible(f,r.data) && f.type!=="photos" && f.type!=="signature");
    if(!fs.length) return;
    body += `<h2>${esc(s.title)}</h2>`;
    fs.forEach(f=>{
      if(f.type==="check"){
        const v = r.data[f.id]||{};
        const txt = v.v===true?"Yes":v.v===false?"No":v.v==="na"?"N/A":"—";
        body += `<table><tr><th>${esc(f.label)}</th><td${v.v===false?' style="color:#A72B22;font-weight:600"':""}>${txt}${
          v.v===false&&v.defect?" — "+esc(v.defect):""}</td></tr></table>`;
        return;
      }
      if(f.type==="planttable"||f.type==="labourtable"){
        body += tableRows(f, r.data[f.id]);
        return;
      }
      if(f.type==="repeater"){
        const rows = r.data[f.id]||[];
        body += `<div style="font-weight:600;margin:6px 0 3px">${esc(f.label)}</div>`;
        body += rows.length ? `<table><tr>`+f.columns.map(cl=>`<th style="width:auto">${esc(cl.label)}</th>`).join("")+`</tr>`+
          rows.map(row=>`<tr>`+f.columns.map(cl=>{
            const cv = row[cl.id];
            return `<td>${esc(Array.isArray(cv)?(cv.length?cv.join(", "):"—"):fmt(cl,cv))}</td>`;
          }).join("")+`</tr>`).join("")+`</table>`
          : `<div style="color:#666;margin-bottom:6px">None recorded</div>`;
      } else {
        const raw = r.data[f.id];
        const shown = Array.isArray(raw) ? (raw.length?raw.join(", "):"—") : fmt(f,raw);
        body += `<table><tr><th>${esc(f.label)}</th><td>${esc(shown)}</td></tr></table>`;
      }
    });
  });
  let photos = (r.data.photos||[]).slice();
  Object.keys(r.data||{}).forEach(k=>{
    const val = r.data[k];
    if(val && typeof val==="object" && val.v===false && (val.photos||[]).length)
      photos = photos.concat(val.photos);
  });
  if(photos.length){
    body += `<h2>Photographs</h2><div class="imgs">`+
      photos.map((p,i)=>`<figure style="margin:0"><img src="${p.src}">
        <figcaption style="font-size:9.5px;color:#555">Photo ${i+1} · ${stamp(p.takenAt)}</figcaption></figure>`).join("")+`</div>`;
  }
  const sig = r.data.signature;
  if(sig){
    body += `<h2>Declaration</h2><p style="margin:0 0 6px">${r.form==="plantcheck"
      ? "Upon inspecting, I confirm that the inspection results are accurate and where deemed as safe are fit for purpose."
      : "I confirm this is a true account of activity on site on "+longDate(r.date)+"."}</p><img src="${sig.src}" style="height:58px;border:1px solid #CBD3CD;padding:3px">
      <div style="font-size:10px;color:#555;margin-top:3px">${esc(r.by)} · ${esc(r.byEmail||"")} · ${stamp(r.submittedAt)}</div>`;
  }
  document.getElementById("sheet").innerHTML = `
    <div class="ph-head">
      <img src="${LOGO}" alt="${esc(c.company)}">
      <div style="text-align:right"><h1>${r.form==="plantcheck"?"Excavator Inspection":"Daily Diary"}</h1>
      <div style="font-size:10.5px;color:#555">${esc(r.ref||"")} · v${r.version||1}</div></div>
    </div>
    <table>
      <tr><th>Site / depot</th><td>${esc(r.job)}</td></tr>
      ${r.form==="excavation"?`<tr><th>Excavation</th><td>${esc(r.excRef||"—")}</td></tr>`:""}
      ${(function(){
        if(r.form!=="plantcheck") return "";
        const m = (DB.plant||[]).find(x=>x.id===r.plantId) || {};
        return `<tr><th>Fleet number</th><td>${esc(m.fleetNo||"—")}</td></tr>

      <tr><th>${r.form==="plantcheck"?"Competent person":"Completed by"}</th>

function backupFile(){

  return new File([JSON.stringify(DB,null,2)], name, { type:"application/json" });
}
function exportBackup(){
  const f = backupFile();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(f);
  a.download = f.name;
  a.click();
  toast("Backup saved");
}
async function shareBackup(){
  const f = backupFile();
  if(navigator.canShare && navigator.canShare({ files:[f] })){
    try{
      await navigator.share({ files:[f], title:"Site diary backup" });
      DB.lastShared = Date.now(); save(); render();
      return;
    }catch(e){ return; }              /* cancelled */
  }
  exportBackup();
}
/* Merge, never overwrite. Anything with the same id keeps whichever copy was
   edited last, so moving a file between phone and laptop is safe in both
   directions and nothing already entered is lost. */
function mergeInto(list, incoming, stampKey){
  const out = list.slice();
  (incoming||[]).forEach(inc=>{
    const i = out.findIndex(x=>x.id===inc.id);
    if(i<0){ out.push(inc); return; }
    const a = out[i][stampKey] || out[i].submittedAt || out[i].updatedAt || 0;
    const b = inc[stampKey] || inc.submittedAt || inc.updatedAt || 0;
    if(b >= a) out[i] = inc;
  });
  return out;
}
function importBackup(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{
    const fr=new FileReader();
    fr.onload=()=>{
      let d;
      try{ d = JSON.parse(fr.result); }catch(e){ toast("That file could not be read."); return; }
      if(!d || !Array.isArray(d.records)){ toast("That is not a backup file."); return; }
      const before = DB.records.length;
      askConfirm("Merge this backup?",
        "It has "+d.records.length+" diar"+(d.records.length===1?"y":"ies")+". Anything newer in the file wins; nothing on this device is deleted.",
        "Merge", ()=>{
          DB.records = mergeInto(DB.records, d.records, "updatedAt");
          DB.plant   = mergeInto(DB.plant||[],  d.plant||[],  "id");
          DB.labour  = mergeInto(DB.labour||[], d.labour||[], "id");
          DB.lifting = mergeInto(DB.lifting||[], d.lifting||[], "id");
          DB.tools   = mergeInto(DB.tools||[], d.tools||[], "id");
          DB.counter = Math.max(DB.counter||0, d.counter||0);
          if(d.job && !DB.job) DB.job = d.job;
          save(); render();
          toast("Merged — "+(DB.records.length-before)+" new");
        });
    };
    fr.readAsText(inp.files[0]);
  };
  inp.click();
}

/* Five seconds is a long time to look at a logo, so it can be tapped away and
   only shows on a cold start, not every time the app is brought forward. */
const SPLASH_MS = 5000;
let splashDone = false, splashStarted = false;

function runSplash(){
  const el = document.getElementById("splash");
  if(!el || splashStarted || splashDone) return;
  splashStarted = true;

  const logo = document.getElementById("splashLogo");
  if(logo) logo.src = LOGO;

  /* the name arrives a letter at a time, behind the ring */
  const name = document.getElementById("splashName");
  if(name){
    const text = cfg().appName || "CGC SiteHUB";
    name.innerHTML = text.split("").map((ch,i)=>
      ch === " "
        ? `<span class="sp-space" style="animation-delay:${0.8 + i*0.045}s"> </span>`
        : `<span style="animation-delay:${0.8 + i*0.045}s">${esc(ch)}</span>`
    ).join("");
  }

  const finish = () => {
    if(splashDone) return;
    splashDone = true;
    el.classList.add("gone");
    setTimeout(()=>{ el.style.display = "none"; }, 550);
  };
  const skip = document.getElementById("splashSkip");
  if(skip) skip.onclick = finish;
  el.onclick = finish;
  setTimeout(finish, SPLASH_MS);
}

  if(!DB.plant) DB.plant = [];
  if(!DB.labour) DB.labour = [];
  if(!DB.lifting) DB.lifting = [];
  if(!DB.tools) DB.tools = [];
  if(!DB.leave) DB.leave = [];
  if(!DB.vos) DB.vos = [];
  if(!DB.packs) DB.packs = [];
  (DB.records||[]).forEach(r=>{ if(r.form==="excavator") r.form = "plantcheck"; });
  (DB.plant||[]).forEach(p=>{ if(!p.type) p.type = "Excavator"; });
  if(!DB.defects) DB.defects = [];
  if(!DB.defectsBackfilled){
    (DB.records||[]).filter(r=>r.form==="plantcheck" && r.status==="submitted").forEach(raiseDefects);
    DB.defectsBackfilled = true;
  }
  delete DB.voCounter;          /* numbering is derived from the sheets themselves now */
  if(!DB.config.fitter) DB.config.fitter = { name:"", email:"" };
  if(!DB.jobHours) DB.jobHours = {};
  if(!DB.jobHours[DB.job]){
    /* carry across anything set on the old app-wide setting, otherwise use the default */
    const old = DB.config && DB.config.hours;
    DB.jobHours[DB.job] = (old && old.start && old.finish)
      ? { start:old.start, finish:old.finish, breakMins:Number(old.breakMins)||30 }
      : JSON.parse(JSON.stringify(CONFIG.hours));
  }
  if(DB.config) delete DB.config.hours;
  if(DB.config.allowDelete === undefined) DB.config.allowDelete = CONFIG.allowDelete;

  /* Ask the browser to hold on to it rather than clearing it out when space
     gets tight. Silently ignored where it is not supported. */
  try{
    if(navigator.storage && navigator.storage.persist) await navigator.storage.persist();
  }catch(e){}

  await flushSave();
  initNav();
  render();

  /* Never lose the last few seconds of work when the app is put away. */
  const flush = () => { if(savePending) flushSave(); };
  window.addEventListener("visibilitychange", flush);
  window.addEventListener("pagehide", flush);
  window.addEventListener("beforeunload", flush);
})();

</script>
<script>
/* Registered from the page so the browser treats this as an installable app. */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
</body>
