<style>
:root{
  --green:#1F5A2D; --green-700:#17441F; --green-50:#F1F6F2; --green-100:#E3EDE6;
  --ink:#121714; --ink-2:#59645C; --ink-3:#8A948C;
  --line:#DDE3DE; --line-2:#ECEFEB; --paper:#fff; --canvas:#F7F9F7;
  --ok:#2E7D46; --ok-bg:#E6F2EA; --warn:#A96A00; --warn-bg:#FAEFDC;
  --bad:#A72B22; --bad-bg:#F8E6E3; --info:#1E4E8C; --info-bg:#E7EEF7;
  --sh:0 1px 2px rgba(20,34,24,.05), 0 10px 24px -18px rgba(20,34,24,.35);
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  background:var(--canvas);color:var(--ink);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7FB394;outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 18px calc(30px + env(safe-area-inset-bottom));
  background:var(--paper)}
@media(min-width:700px){.app{padding:0 34px 40px;box-shadow:0 0 0 1px var(--line)}}
.hide{display:none!important}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) 0 2px}
.top .chip{background:var(--canvas);border-radius:999px;padding:8px 14px;font-size:13px;
  font-weight:640;color:var(--ink-2)}
.top .av{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:14px}
h1.greet{text-align:center;font-size:28px;font-weight:640;letter-spacing:-.03em;margin:14px 0 2px}
.sub{text-align:center;color:var(--ink-3);font-size:13.5px;margin:0 0 20px}

/* week strip */
.week{display:flex;gap:3px;margin-bottom:22px}
.wd{flex:1;border-radius:15px;padding:9px 0 10px;display:grid;justify-items:center;gap:4px;
  background:transparent}
.wd .l{font-size:11px;color:var(--ink-3);font-weight:640}
.wd .n{font-size:16.5px;font-weight:640}
.wd .s{width:6px;height:6px;border-radius:50%;background:transparent}
.wd .s.ok{background:var(--ok)}
.wd .s.amber{background:var(--warn)}
.wd .s.red{background:var(--bad)}
.wd .s.due{background:var(--line)}
.wd.on{background:var(--canvas);box-shadow:inset 0 0 0 1.5px var(--green)}
.wd.on .n{color:var(--green)}
.wd.we .l,.wd.we .n{color:var(--ink-3)}
.wd.fut .l,.wd.fut .n{color:#CBD3CD}
.warrow{width:30px;display:grid;place-items:center;color:var(--ink-3);font-size:19px}
.warrow[disabled]{opacity:.25}

/* hero */
.hero{background:#0C2A18;color:#fff;border-radius:26px;padding:26px 22px;text-align:center;
  display:grid;justify-items:center;gap:5px;margin-bottom:14px}
.hero .lab{font-size:13px;color:rgba(255,255,255,.55)}
.hero .ttl{font-size:25px;font-weight:640;letter-spacing:-.025em}
.hero .why{font-size:13.5px;color:rgba(255,255,255,.6);max-width:32ch}
.hero.calm{background:var(--green-50);color:var(--green-700)}
.hero.calm .lab{color:var(--ink-3)} .hero.calm .why{color:var(--ink-2)}
.hero.late{background:#7A2019}
.begin{margin-top:14px;background:#fff;color:#0C2A18;border-radius:999px;min-height:52px;
  padding:0 42px;font-size:16.5px;font-weight:660}
.hero.calm .begin{background:var(--green);color:#fff}

/* cards + rows */
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:12px}
.card h3{margin:0 0 3px;font-size:16px;font-weight:650}
.card p{margin:0;color:var(--ink-2);font-size:14px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 0}
.row+.row{border-top:1px solid var(--line-2)}
.row .n{flex:1;min-width:0}
.row .n b{display:block;font-size:16px;font-weight:620}
.row .n span{display:block;font-size:13px;color:var(--ink-3);margin-top:1px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;
  font-size:12px;font-weight:680;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.amber{background:var(--warn-bg);color:var(--warn)}
.pill.red{background:var(--bad-bg);color:var(--bad)}
.pill.grey{background:var(--canvas);color:var(--ink-3)}
.pill.info{background:var(--info-bg);color:var(--info)}
.sect{font-size:12px;font-weight:700;color:var(--ink-3);margin:26px 0 10px;
  text-transform:uppercase;letter-spacing:.09em}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:56px;
  border-radius:15px;background:var(--green);color:#fff;font-weight:660;font-size:16.5px;
  padding:0 18px;margin-bottom:10px}
.btn:active{background:var(--green-700)}
.btn[disabled]{background:#D3DAD5}
.btn.ghost{background:var(--canvas);color:var(--ink)}
.btn.line{background:none;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}
.btn.sm{min-height:44px;font-size:14.5px;width:auto;padding:0 16px;border-radius:12px}
.btn.danger{background:var(--bad)}

/* fields */
.f{margin-bottom:20px}
.f label{display:block;font-weight:650;font-size:15px;margin-bottom:7px}
.f .hint{font-size:13px;color:var(--ink-3);margin:-3px 0 8px;line-height:1.4}
.in{width:100%;min-height:54px;border:1.5px solid var(--line);border-radius:13px;padding:14px;
  background:#fff}
.in:focus{border-color:var(--green);outline:none}
textarea.in{min-height:110px;resize:vertical;line-height:1.5}
select.in{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' stroke='%238A948C' stroke-width='2'><path d='M5 8l5 5 5-5'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center}
.in.err{border-color:var(--bad);background:#FFFBFB}
.err-msg{color:var(--bad);font-size:13px;font-weight:600;margin-top:6px}
.seg{display:grid;grid-auto-flow:column;gap:10px}
.segb{min-height:56px;border:1.5px solid var(--line);border-radius:13px;background:#fff;
  font-weight:660;font-size:15.5px}
.segb.y{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.segb.n{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cb{display:flex;align-items:center;gap:10px;min-height:54px;padding:0 12px;border:1.5px solid var(--line);
  border-radius:13px;background:#fff;font-size:14.5px;font-weight:620;text-align:left;line-height:1.2}
.cb.on{border-color:var(--green);background:var(--green-50);color:var(--green-700)}
.cb .b{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;
  display:grid;place-items:center;background:#fff;font-size:13px}
.cb.on .b{background:var(--green);border-color:var(--green);color:#fff}
.rep{border:1.5px solid var(--line-2);border-radius:14px;padding:14px;background:var(--canvas);
  margin-bottom:10px}
.rep .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
  font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.rep .rm{color:var(--bad);font-weight:650;font-size:13px;text-transform:none;letter-spacing:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* diary tables */
.ttable{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.thead{display:flex;gap:8px;padding:9px 12px;background:var(--canvas);font-size:11px;
  font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.thead .c1{flex:1} .thead .c2{width:92px} .thead .c3{width:104px;text-align:center}
.trow{padding:11px 12px}
.trow+.trow{border-top:1px solid var(--line-2)}
.trow .main{display:flex;gap:8px;align-items:center}
.trow .c1{flex:1;min-width:0}
.trow .c1 b{display:block;font-size:15px;font-weight:620;line-height:1.25}
.trow .c1 span{display:block;font-size:12.5px;color:var(--ink-3)}
.trow .c2{width:92px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.trow .yn{width:104px;display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:none}
.yn button{min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;
  font-size:13.5px;font-weight:660}
.yn button.y{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.yn button.n{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.trow .more{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.trow .lbl{font-size:12.5px;font-weight:640;color:var(--ink-2);margin-bottom:6px;display:block}
.timegrid{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.timegrid input{min-height:46px;border:1.5px solid var(--line);border-radius:11px;padding:0 10px;
  background:#fff;width:100%}
.timegrid .calc{font-size:13px;font-weight:700;color:var(--green);white-space:nowrap}
.tempty{padding:16px 12px;color:var(--ink-3);font-size:14px}

/* photos */
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--canvas)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:9px;
  background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
canvas.sig{display:block;width:100%;height:160px;background:#fff;border:1.5px solid var(--line);
  border-radius:13px;touch-action:none}

/* progress */
.bar{height:7px;border-radius:4px;background:var(--line-2);overflow:hidden;display:block;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.kv{display:flex;gap:12px;padding:9px 0;font-size:14px}
.kv+.kv{border-top:1px solid var(--line-2)}
.kv .k{color:var(--ink-2);width:150px;flex:none}
.kv .v{font-weight:620;flex:1;text-align:right}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(12,22,15,.45);z-index:95;display:flex;
  align-items:flex-end;justify-content:center}
@media(min-width:700px){.scrim{align-items:center}}
.dlg{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:700px){.dlg{border-radius:18px}}
.dlg h3{margin:0 0 6px;font-size:19px;font-weight:660;letter-spacing:-.02em}
.dlg p{margin:0 0 18px;color:var(--ink-2);font-size:14.5px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:90;background:#16261C;
  color:#fff;padding:12px 18px;border-radius:12px;font-size:14.5px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw}

/* PDF preview — on screen first, then print or save */
.sheetwrap{position:fixed;inset:0;background:#39413C;z-index:80;overflow:auto;display:none}
.sheetwrap.open{display:block}
.sheetbar{position:sticky;top:0;z-index:2;background:var(--green);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;gap:10px;align-items:center}
.sheetbar .t{flex:1;font-size:14.5px;font-weight:640}
.sheetbar button{background:rgba(255,255,255,.16);color:#fff;border-radius:10px;
  padding:9px 14px;font-size:14px;font-weight:640}
.sheet{background:#fff;width:min(794px,100%);margin:14px auto 40px;padding:28px 30px;color:#111;
  font-size:12px;line-height:1.5}
.sheet h1{font-size:19px;margin:0}
.sheet .ph-head{display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:2.5px solid #1F5A2D;padding-bottom:9px;margin-bottom:14px;gap:14px}
.sheet .ph-head img{width:150px;height:auto}
.sheet h2{font-size:11.5px;background:#1F5A2D;color:#fff;padding:5px 9px;margin:15px 0 8px;
  border-radius:3px;font-weight:650}
.sheet table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:8px}
.sheet th,.sheet td{border:1px solid #CBD3CD;padding:5px 7px;text-align:left;vertical-align:top}
.sheet th{background:#EDF2EE;width:32%;font-weight:640}
.sheet .imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .imgs img{width:100%;border:1px solid #CBD3CD}
.sheet .foot{margin-top:20px;padding-top:8px;border-top:1px solid #CBD3CD;color:#666;
  font-size:10px;display:flex;justify-content:space-between}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  .app{display:none!important}
  .sheetwrap{position:static;display:block!important;background:#fff;overflow:visible}
  .sheetbar{display:none!important}
  .sheet{width:auto;margin:0;padding:0}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="sheetwrap" id="sheetwrap">
  <div class="sheetbar">
    <button id="sheetClose">&lsaquo; Close</button>
    <span class="t" id="sheetTitle">Daily Diary</span>
    <button id="sheetPrint">Print / Save PDF</button>
  </div>
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* ==========================================================================
   SITE DIARY — Cheltenham Green Civils

/* -------------------------------------------------------------- storage -- */
const KEY = "cgc.diary.v1";
let DB = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { records:[], counter:0, config:JSON.parse(JSON.stringify(CONFIG)),
    job:CONFIG.jobs[0], plant:[], labour:[] };
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast("Storage full — export a backup and remove old photos"); }
}
const cfg = () => DB.config || CONFIG;

/* ---------------------------------------------------------------- dates -- */
const iso = d => { const x=new Date(d);
  return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const todayISO = () => iso(new Date());
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const DAYL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const longDate = s => { const d=parse(s); return DAYL[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear(); };
const shortDate = s => { const d=parse(s);
  return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); };
const stamp = t => { const d=new Date(t);
  return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()
    +" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
const timeOnly = t => { const d=new Date(t);
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
function weekStart(s){ const d=parse(s); const n=(d.getDay()+6)%7; d.setDate(d.getDate()-n); return iso(d); }
function weekDays(ws){ const out=[]; for(let i=0;i<7;i++) out.push(addDays(ws,i)); return out; }
const isWorking = s => cfg().workingDays.includes(parse(s).getDay());
const initials = n => n.split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase();

/* ------------------------------------------------------------ diary state --
   Status rules you set:
     today          -> due (grey)
     yesterday      -> amber
     older than that-> red
   Weekends are never chased; a diary can still be created on one.
   -------------------------------------------------------------------------*/
function recordFor(date, job){
  return DB.records.find(r => r.date===date && r.job===(job||DB.job));
}
function statusFor(date){
  const t = todayISO();
  const rec = recordFor(date);
  if(rec && rec.status==="submitted") return "done";
  if(date > t) return "future";
  if(!isWorking(date)) return rec ? "draft" : "none";
  if(date === t) return rec ? "draft" : "due";
  if(date === prevWorking(t)) return "amber";
  return "red";
}
function prevWorking(s){ let d=addDays(s,-1); let i=0; while(!isWorking(d) && i++<10) d=addDays(d,-1); return d; }
function missedDays(){
  const t = todayISO(), out=[];
  let d = addDays(t,-1);
  for(let i=0;i<28;i++){
    if(isWorking(d) && !recordFor(d)) out.push({date:d, level: d===prevWorking(t) ? "amber":"red"});
    d = addDays(d,-1);
  }
  return out;
}

/* ------------------------------------------------------- plant register -- */
/* Kept once, on the job. Every new diary is pre-loaded with whatever is on
   site that day, so the diary only ever asks for hours. */
/* Was this item on site on a given day? Inclusive of the day it left, since it
   was working that morning — this feeds the diary. */
function onSitePlant(date){
  const d = date || todayISO();
  return (DB.plant||[]).filter(p => p.job===DB.job
    && (!p.onDate || p.onDate<=d) && (!p.offDate || p.offDate>=d));
}
/* Is it on site now? Off hired today counts as gone — this drives the register. */
function currentPlant(){
  const t = todayISO();
  return (DB.plant||[]).filter(p => p.job===DB.job && (!p.offDate || p.offDate>t));
}
/* LOLER: a thorough examination certificate lapses after 6 or 12 months. The
   register warns a month out, and refuses to let an expired item go quietly. */
function lolerState(p){
  if(!p.lolerDate) return { key:"none", label:"No LOLER date", cls:"grey" };
  const days = Math.round((parse(p.lolerDate) - parse(todayISO())) / 86400000);
  if(days < 0) return { key:"expired", label:"LOLER expired "+shortDate(p.lolerDate), cls:"red", days };
  if(days <= 30) return { key:"soon", label:"LOLER due in "+days+" day"+(days===1?"":"s"), cls:"amber", days };
  return { key:"ok", label:"LOLER to "+shortDate(p.lolerDate), cls:"ok", days };
}
function lolerAlerts(){
  return currentPlant().map(p=>({p, st:lolerState(p)}))
    .filter(x=>x.st.key==="expired" || x.st.key==="soon");
}

function refreshPlantPill(id){
  const p = (DB.plant||[]).find(x=>x.id===id);

/* Who can be picked in the diary: whoever has been ticked on site today, and
   if nobody has been ticked yet, everyone on the register. */
function availablePeople(){
  const rows = (formState && formState.values.labourTable) || [];
  const on = rows.filter(r=>r.onSite===true).map(r=>r.name).filter(Boolean);
  if(on.length) return on;
  return onSiteLabour(formState ? formState.date : null).map(l=>l.name).filter(Boolean);
}
function availablePlant(){
  return onSitePlant(formState ? formState.date : null)
    .map(p => p.item + (p.fleetNo ? " ("+p.fleetNo+")" : "")).filter(Boolean);
}

/* -------------------------------------------------------- labour register -- */
function onSiteLabour(date){
  const d = date || todayISO();
  return (DB.labour||[]).filter(l => l.job===DB.job
    && (!l.onDate || l.onDate<=d) && (!l.offDate || l.offDate>=d));
}
function currentLabour(){
  const t = todayISO();
  return (DB.labour||[]).filter(l => l.job===DB.job && (!l.offDate || l.offDate>t));
}

/* Hours worked = finish minus start, less the break. */
const toMins = t => { if(!t||t.indexOf(":")<0) return null;
  const [h,m]=t.split(":").map(Number); return h*60+m; };
function workedHours(start, finish){
  const a=toMins(start), b=toMins(finish);
  if(a==null||b==null) return null;
  let mins = b-a; if(mins<0) mins += 24*60;
  mins -= (Number(cfg().hours.breakMins)||30);
  if(mins<0) mins = 0;
  return Math.round((mins/60)*100)/100;
}
const normalHours = () => workedHours(cfg().hours.start, cfg().hours.finish);
function rowHours(row){
  if(!row || row.onSite!==true) return 0;
  if(row.normal===true) return normalHours() || 0;
  return workedHours(row.start, row.finish) || 0;
}

function askConfirm(title, message, confirmLabel, onYes){
  const wrap = document.createElement("div");
  wrap.className = "scrim";
  wrap.innerHTML = `<div class="dlg">
      <h3>${esc(title)}</h3>
      <p>${esc(message)}</p>
      <button class="btn danger" data-yes>${esc(confirmLabel)}</button>
      <button class="btn ghost" style="margin:0" data-no>Cancel</button>
    </div>`;
  const close = () => wrap.remove();
  wrap.onclick = e => { if(e.target===wrap) close(); };
  wrap.querySelector("[data-no]").onclick = close;
  wrap.querySelector("[data-yes]").onclick = () => { close(); onYes(); };
  document.body.appendChild(wrap);
}

function toast(msg){
  const old = document.querySelector(".toast"); if(old) old.remove();
  const el = document.createElement("div"); el.className="toast"; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2800);
}
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ------------------------------------------------------------------- form -- */
let formState = null;

function visible(f, v){ return !f.showIf || v[f.showIf.field] === f.showIf.equals; }

function startForm(date){
  const rec = recordFor(date);
  if(rec && rec.status==="submitted"){ go("record",{id:rec.id}); return; }
  const values = rec ? JSON.parse(JSON.stringify(rec.data)) : prefill(date);
  if(rec){
    ["personnel","plant","activities","progress","deliveries","dwLabour_old"].forEach(k=>{ delete values[k]; });
    values.tasks = values.tasks || [];
    values.plantTable = values.plantTable || [];
    onSitePlant(date).forEach(p=>{ if(!values.plantTable.some(r=>r.id===p.id))
      values.plantTable.push({ id:p.id, item:p.item, fleetNo:p.fleetNo,
        loler:p.lolerDate?shortDate(p.lolerDate):"n/a", inUse:undefined }); });
    values.labourTable = values.labourTable || [];
    onSiteLabour(date).forEach(l=>{ if(!values.labourTable.some(r=>r.id===l.id))
      values.labourTable.push({ id:l.id, name:l.name, trade:l.trade,
        onSite:undefined, normal:undefined, start:"", finish:"", reason:"" }); });
  }
  formState = { date, values, errors:{}, touched:false, id: rec?rec.id:null };
  go("form",{date});
}
function prefill(date){
  const v = {};
  DIARY.forEach(s=>s.fields.forEach(f=>{
    if(f.type==="repeater"||f.type==="checkboxes"||f.type==="photos") v[f.id]=[];
  }));
  const prev = DB.records.filter(r=>r.job===DB.job && r.status==="submitted" && r.date<date)
    .sort((a,b)=>a.date<b.date?1:-1)[0];
  if(prev && prev.data.personnel) v.personnel = JSON.parse(JSON.stringify(prev.data.personnel));

  /* Plant comes straight off the register, so the only thing to type is hours. */
  v.plantTable = onSitePlant(date).map(p => ({
    id:p.id, item:p.item, fleetNo:p.fleetNo,
    loler: p.lolerDate ? shortDate(p.lolerDate) : "n/a", inUse:undefined
  }));
  v.labourTable = onSiteLabour(date).map(l => ({
    id:l.id, name:l.name, trade:l.trade,
    onSite:undefined, normal:undefined, start:"", finish:"", reason:""
  }));
  return v;
}
function validate(){
  const e = {}, v = formState.values;
  DIARY.forEach(s=>s.fields.forEach(f=>{
    if(!visible(f,v) || !f.required) return;
    const val = v[f.id];
    const empty = val===undefined||val===null||val===""||(Array.isArray(val)&&val.length===0);
    if(empty){ e[f.id]="Required"; return; }
    if(f.type==="planttable"){
      for(let i=0;i<val.length;i++) if(val[i].inUse===undefined)
        { e[f.id]="Say whether each item was in use"; return; }
      return;
    }
    if(f.type==="labourtable"){
      for(let i=0;i<val.length;i++){
        const r = val[i];
        if(r.onSite===undefined){ e[f.id]="Say who was on site"; return; }
        if(r.onSite===true && r.normal===undefined)
          { e[f.id]=(r.name||"Someone")+": normal hours?"; return; }
        if(r.onSite===true && r.normal===false && (!r.start||!r.finish))
          { e[f.id]=(r.name||"Someone")+": start and finish time needed"; return; }
        if(r.onSite===true && r.normal===false && !(r.reason||"").trim())
          { e[f.id]=(r.name||"Someone")+": give a reason for the different hours"; return; }
      }
      return;
    }
    if(f.type==="repeater"){
      for(let i=0;i<val.length;i++) for(const c of f.columns){
        if(c.required && (val[i][c.id]===undefined||val[i][c.id]===""))
          { e[f.id]=(f.itemLabel||"Row")+" "+(i+1)+": "+c.label+" is required"; return; }
      }
    }
  }));
  return e;
}

            </div>` : ""}
          </div>`;
        }).join("") : `<div class="tempty">Nobody on the labour register for this job yet.</div>`)+
        `</div>`;
      break;
    }
    case "signature":
      c = `<canvas class="sig" id="sig_${id}" data-sig="${id}"></canvas>
        <div style="display:flex;justify-content:space-between;padding-top:8px;font-size:13px;color:var(--ink-3)">
          <span>${val?"Signed":"Sign above with your finger"}</span>
          <button type="button" data-sigclear="${id}" style="color:var(--bad);font-weight:650">Clear</button></div>`;
      break;
  }
  return `<div class="f">${lab}${hint}${c}${err?`<div class="err-msg">${esc(err)}</div>`:""}</div>`;
}

function formView(){
  const v = formState.values;
  const errs = formState.touched ? formState.errors : {};
  let total=0, ok=0;
  DIARY.forEach(s=>s.fields.forEach(f=>{ if(f.required && visible(f,v)){ total++; if(!validate()[f.id]) ok++; }}));

  const body = DIARY.map(s=>{
    const fs = s.fields.filter(f=>visible(f,v));
    if(!fs.length) return "";
    return `<div class="sect">${esc(s.title)}</div><div class="card">`+
      fs.map(f=>fieldHtml(f, v, errs[f.id])).join("")+`</div>`;
  }).join("");

  return `<div class="top">
      <button class="chip" data-go="home">&lsaquo; Back</button>
      <span class="pill info">${ok}/${total} required</span>
    </div>
    <h1 class="greet" style="font-size:22px;margin-top:12px">Site diary</h1>
    <p class="sub">${esc(DB.job)} · ${longDate(formState.date)}</p>
    ${body}
    <button class="btn" data-submit="1">Submit diary</button>
    <button class="btn ghost" data-draft="1">Save draft and close</button>`;
}

function tableRows(f, val){
  const rows = val||[];
  if(f.type==="planttable"){
    if(!rows.length) return "<div style='color:#666'>None on site</div>";
    return `<table style="width:100%;border-collapse:collapse;font-size:12px">
      <tr><th style="text-align:left">Plant</th><th style="text-align:left">Fleet no.</th>
      <th style="text-align:left">In use</th></tr>`+
      rows.map(r=>`<tr><td>${esc(r.item||"")}</td><td>${esc(r.fleetNo||"")}</td>
        <td>${r.inUse===true?"Yes":r.inUse===false?"No":"—"}</td></tr>`).join("")+`</table>`;
  }
  if(!rows.length) return "<div style='color:#666'>Nobody recorded</div>";
  return `<table style="width:100%;border-collapse:collapse;font-size:12px">
    <tr><th style="text-align:left">Name</th><th style="text-align:left">Trade</th>
    <th style="text-align:left">On site</th><th style="text-align:left">Start</th>
    <th style="text-align:left">Finish</th><th style="text-align:left">Hours</th>
    <th style="text-align:left">Reason if different</th></tr>`+
    rows.map(r=>{
      const h = rowHours(r);
      return `<tr><td>${esc(r.name||"")}</td><td>${esc(r.trade||"")}</td>
        <td>${r.onSite===true?"Yes":r.onSite===false?"No":"—"}</td>
        <td>${esc(r.onSite&&r.normal===false?r.start:(r.onSite?cfg().hours.start:"—"))}</td>
        <td>${esc(r.onSite&&r.normal===false?r.finish:(r.onSite?cfg().hours.finish:"—"))}</td>
        <td>${r.onSite?h:"—"}</td>
        <td>${esc(r.reason||"")}</td></tr>`;
    }).join("")+`</table>`;
}

function readRow(f, val){
  if(f.type==="peoplepick"||f.type==="plantpick"){
    return `<div class="kv"><span class="k">${esc(f.label)}</span>
      <span class="v">${val&&val.length?esc(val.join(", ")):"—"}</span></div>`;
  }
  if(f.type==="planttable"||f.type==="labourtable"){
    return `<div class="kv" style="display:block"><span class="k">${esc(f.label)}</span>
      <div style="margin-top:6px;overflow-x:auto">${tableRows(f,val)}</div></div>`;
  }
  const fmt = (fl,v) => v===undefined||v===null||v===""?"—"
    : fl.type==="yesno" ? (v?"Yes":"No")
    : Array.isArray(v) ? (v.length?v.join(", "):"—")
    : String(v)+(fl.suffix?" "+fl.suffix:"");
  if(f.type==="photos"){
    if(!val||!val.length) return "";
    return `<div class="kv" style="display:block"><span class="k">${esc(f.label)}</span>
      <div class="pg" style="margin-top:8px">`+val.map(p=>`<div class="ph"><img src="${p.src}" alt=""></div>`).join("")+`</div></div>`;
  }
  if(f.type==="repeater"){
    const rows = val||[];
    if(!rows.length) return `<div class="kv"><span class="k">${esc(f.label)}</span><span class="v">None</span></div>`;
    return `<div class="kv" style="display:block"><span class="k">${esc(f.label)}</span>
      <table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:6px">
      <tr>`+f.columns.map(c=>`<th style="text-align:left;font-size:11px;color:var(--ink-3);padding:4px 4px">${esc(c.label)}</th>`).join("")+`</tr>`+
      rows.map(row=>`<tr>`+f.columns.map(c=>`<td style="padding:5px 4px;border-top:1px solid var(--line-2)">${esc(fmt(c,row[c.id]))}</td>`).join("")+`</tr>`).join("")+
      `</table></div>`;
  }
  return `<div class="kv"><span class="k">${esc(f.label)}</span><span class="v">${esc(fmt(f,val))}</span></div>`;
}

/* ------------------------------------------------------------- timesheet -- */
/* Built entirely from the diaries. Nothing is typed twice. */
function timesheetWeek(ws){
  const days = weekDays(ws);
  const people = {};
  days.forEach(d=>{
    const rec = DB.records.find(r=>r.date===d && r.job===DB.job && r.status==="submitted");
    (rec && rec.data.labourTable || []).forEach(row=>{
      if(row.onSite!==true) return;
      const key = row.id || row.name;
      if(!people[key]) people[key] = { name:row.name, trade:row.trade, days:{}, total:0 };
      const h = rowHours(row);
      people[key].days[d] = { hours:h, start: row.normal===false?row.start:cfg().hours.start,
        finish: row.normal===false?row.finish:cfg().hours.finish, normal: row.normal!==false,
        reason: row.reason||"" };
      people[key].total += h;
    });
  });
  return { days, people:Object.values(people) };
}

function timesheetView(){
  const ws = view.week || weekStart(todayISO());
  const { days, people } = timesheetWeek(ws);
  const grand = people.reduce((n,p)=>n+p.total,0);
  const cols = days.map(d=>`<th style="text-align:center;font-size:10.5px">${["M","T","W","T","F","S","S"][days.indexOf(d)]}<br>${parse(d).getDate()}</th>`).join("");

  return `<div class="top"><button class="chip" data-go="home">&lsaquo; Back</button>
      <span class="pill info">${Math.round(grand*100)/100} hrs</span></div>
    <h1 class="greet" style="font-size:22px;margin-top:12px">Timesheet</h1>
    <p class="sub">${esc(DB.job)} · week commencing ${shortDate(ws)}</p>

    <div class="card" style="display:flex;align-items:center;gap:10px;padding:8px">
      <button class="btn line sm" style="margin:0" data-ts="-1">&lsaquo;</button>
      <span style="flex:1;text-align:center;font-weight:640">${shortDate(ws)} – ${shortDate(addDays(ws,6))}</span>
      <button class="btn line sm" style="margin:0" data-ts="1" ${ws>=weekStart(todayISO())?"disabled":""}>&rsaquo;</button>
    </div>

    ${people.length ? `<div class="card" style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <tr><th style="text-align:left;font-size:11px;color:var(--ink-3)">Name</th>${cols}
          <th style="text-align:right;font-size:11px;color:var(--ink-3)">Total</th></tr>
        ${people.map(p=>`<tr>
          <td style="padding:9px 4px;border-top:1px solid var(--line-2)">
            <b style="font-weight:620">${esc(p.name)}</b>
            <span style="display:block;font-size:11.5px;color:var(--ink-3)">${esc(p.trade||"")}</span></td>
          ${days.map(d=>`<td style="padding:9px 2px;border-top:1px solid var(--line-2);text-align:center;
            font-variant-numeric:tabular-nums;${p.days[d]&&!p.days[d].normal?"color:var(--warn);font-weight:700":""}">
            ${p.days[d]?p.days[d].hours:"—"}</td>`).join("")}
          <td style="padding:9px 4px;border-top:1px solid var(--line-2);text-align:right;
            font-weight:700;font-variant-numeric:tabular-nums">${Math.round(p.total*100)/100}</td></tr>`).join("")}
        <tr><td style="padding:10px 4px;border-top:2px solid var(--line)"><b>Total</b></td>
          <td colspan="${days.length}" style="border-top:2px solid var(--line)"></td>
          <td style="padding:10px 4px;border-top:2px solid var(--line);text-align:right;font-weight:700">
            ${Math.round(grand*100)/100}</td></tr>

function pathFor(r){
  const c = cfg(), d = parse(r.date);
  const folder = c.sharepoint.folder
    .replace(/{job}/g, r.job).replace(/{year}/g, d.getFullYear())
    .replace(/{month}/g, MON[d.getMonth()]);
  const file = c.sharepoint.filename
    .replace(/{job}/g, r.job).replace(/{date}/g, r.date).replace(/{ref}/g, r.ref||"");
  return (c.sharepoint.site?c.sharepoint.site+"/":"") + c.sharepoint.library + "/" + folder + "/" + file + ".pdf";
}
function previewPath(){
  return pathFor({ date: todayISO(), job: DB.job, ref: nextRef(true) });
}
function nextRef(peek){
  const n = (DB.counter||0) + 1;
  if(!peek) DB.counter = n;
  return cfg().refPrefix + "-" + String(n).padStart(4,"0");
}

/* ------------------------------------------------------------------ photos -- */
function pickPhoto(fieldId, useCamera){
  const inp = document.createElement("input");
  inp.type="file"; inp.accept="image/*"; inp.multiple=true;
  if(useCamera) inp.setAttribute("capture","environment");
  inp.onchange = async () => {
    const out=[];
    for(const file of Array.from(inp.files).slice(0,10)){
      try{ out.push(await stampPhoto(file)); }catch(e){}
    }
    const cur = formState.values[fieldId]||[];
    formState.values[fieldId] = cur.concat(out).slice(0,20);
    render(); toast(out.length+" photo"+(out.length===1?"":"s")+" added");
  };
  inp.click();
}
/* Stamp burned into the pixels, so it survives the file being copied out of
   SharePoint and dropped into a report: time top right, logo bottom right. */
const MONS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function photoStampText(t){
  const d = new Date(t);
  const two = n => String(n).padStart(2,"0");
  return d.getDate()+" "+MONS[d.getMonth()]+" "+d.getFullYear()+" at "
    + two(d.getHours())+":"+two(d.getMinutes())+":"+two(d.getSeconds());
}
function loadImage(src){
  return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
}

function stampPhoto(file){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onerror = ()=>rej();
    fr.onload = () => {
      const img = new Image();
      img.onerror = ()=>rej();
      img.onload = async () => {
        const max = 1400;
        const sc = Math.min(1, max/Math.max(img.width,img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width*sc);
        cv.height = Math.round(img.height*sc);
        const g = cv.getContext("2d");
        g.drawImage(img, 0, 0, cv.width, cv.height);

        const W = cv.width, H = cv.height;
        const unit = Math.min(W, H);
        const margin = Math.round(unit*0.022);
        const takenAt = Date.now();

        /* time, top right, on a grey panel */
        const fs = Math.max(15, Math.round(unit*0.045));
        g.font = "700 "+fs+"px -apple-system, 'Segoe UI', system-ui, sans-serif";
        const text = photoStampText(takenAt);
        const tw = g.measureText(text).width;
        const padX = Math.round(fs*0.5), padY = Math.round(fs*0.34);
        const boxW = tw + padX*2, boxH = fs + padY*2;
        const boxX = W - margin - boxW, boxY = margin;
        g.fillStyle = "rgba(96,101,98,.62)";
        g.fillRect(boxX, boxY, boxW, boxH);
        g.fillStyle = "#fff";
        g.textBaseline = "middle";
        g.textAlign = "left";
        g.fillText(text, boxX + padX, boxY + boxH/2 + 1);

        /* logo, bottom right, on white so it reads over any background */
        try{
          const logo = await loadImage(LOGO);
          const lw = Math.round(W*0.24);
          const lh = Math.round(lw * (logo.height/logo.width));
          const lp = Math.round(lw*0.07);
          g.fillStyle = "#fff";
          g.fillRect(W - margin - lw - lp*2, H - margin - lh - lp*2, lw + lp*2, lh + lp*2);
          g.drawImage(logo, W - margin - lw - lp, H - margin - lh - lp, lw, lh);
        }catch(e){ /* carry on without it rather than lose the photo */ }

        res({ src: cv.toDataURL("image/jpeg",.72), takenAt });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* --------------------------------------------------------------- signature -- */
function wireSignature(cv, fieldId){
  const dpr = window.devicePixelRatio||1;
  const rect = cv.getBoundingClientRect();
  cv.width = rect.width*dpr; cv.height = rect.height*dpr;
  const g = cv.getContext("2d"); g.scale(dpr,dpr);
  g.lineWidth=2.2; g.lineCap="round"; g.lineJoin="round"; g.strokeStyle="#16261C";
  const saved = formState && formState.values[fieldId];
  if(saved && saved.src){ const im=new Image(); im.onload=()=>g.drawImage(im,0,0,rect.width,rect.height); im.src=saved.src; }
  let drawing=false, last=null;
  const pos = e => { const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  cv.addEventListener("pointerdown", e=>{ e.preventDefault(); drawing=true; last=pos(e); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e=>{ if(!drawing)return; const p=pos(e);
    g.beginPath(); g.moveTo(last.x,last.y); g.lineTo(p.x,p.y); g.stroke(); last=p; });
  const end = () => { if(!drawing)return; drawing=false;
    formState.values[fieldId] = { src:cv.toDataURL("image/png"), signedAt:Date.now() }; };
  cv.addEventListener("pointerup", end);
  cv.addEventListener("pointerleave", end);
}

/* ------------------------------------------------------------------ events -- */
function getVal(path){
  const parts = String(path).split(".");
  if(parts.length===1) return formState.values[parts[0]];
  const [fid, idx, cid] = parts;
  const row = (formState.values[fid]||[])[Number(idx)];
  return row ? row[cid] : undefined;
}
function setVal(path, value){
  const parts = String(path).split(".");
  if(parts.length===1){ formState.values[parts[0]] = value; return; }
  const [fid, idx, cid] = parts;
  formState.values[fid][Number(idx)][cid] = value;
}
function getField(id){
  for(const s of DIARY) for(const f of s.fields) if(f.id===id) return f;
  return null;
}

    const l = (DB.labour||[]).find(x=>x.id===id);
    askConfirm("Remove this person?", (l&&l.name?l.name:"They")+" will come off the register. Diaries already submitted keep their record.",
      "Remove", ()=>{ DB.labour = DB.labour.filter(x=>x.id!==id); save(); render(); toast("Removed"); });
  });

  app.querySelectorAll("[data-ts]").forEach(el=>el.onclick=()=>{
    const ws = view.week || weekStart(todayISO());
    go("timesheet", { week: addDays(ws, 7*Number(el.dataset.ts)) });
  });
  const tsp = app.querySelector("[data-tsprint]");
  if(tsp) tsp.onclick = ()=>printTimesheet(tsp.dataset.tsprint);

  const sh = app.querySelector("[data-share]"); if(sh) sh.onclick = shareBackup;
  const ex = app.querySelector("[data-export]"); if(ex) ex.onclick = exportBackup;
  const im = app.querySelector("[data-import]"); if(im) im.onclick = importBackup;
}
function after(){ if(formState.touched) formState.errors = validate(); render(); }

function saveDraft(){
  const id = formState.id || ("rec_"+Date.now());
  const existing = DB.records.find(r=>r.id===id);
  const rec = existing || { id, job:DB.job, date:formState.date, ref:null,
    status:"draft", createdAt:Date.now(), by:cfg().user.name };
  rec.data = formState.values;
  rec.updatedAt = Date.now();
  if(!existing) DB.records.push(rec);
  formState.id = id;
  save();
  return rec;
}
function submitForm(){
  formState.touched = true;
  formState.errors = validate();
  const n = Object.keys(formState.errors).length;
  if(n){
    render();
    toast(n+" question"+(n>1?"s":"")+" still to answer");
    const first = document.getElementById("fl_"+Object.keys(formState.errors)[0]);
    if(first) first.scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  const rec = saveDraft();
  if(rec.status!=="submitted"){ rec.ref = nextRef(); }
  rec.status = "submitted";
  rec.submittedAt = Date.now();
  rec.by = cfg().user.name;
  rec.byEmail = cfg().user.email;
  rec.synced = false;
  rec.version = (rec.version||0)+1;
  save();
  toast("Diary submitted");
  go("record",{id:rec.id});
}

/* -------------------------------------------------------------------- PDF -- */
function printRecord(id){
  const r = DB.records.find(x=>x.id===id);
  const c = cfg();
  const fmt = (fl,v) => v===undefined||v===null||v===""?"—"
    : fl.type==="yesno" ? (v?"Yes":"No")
    : Array.isArray(v) ? (v.length?v.join(", "):"—")
    : String(v)+(fl.suffix?" "+fl.suffix:"");
  let body = "";
  DIARY.forEach(s=>{
    const fs = s.fields.filter(f=>visible(f,r.data) && f.type!=="photos" && f.type!=="signature");
    if(!fs.length) return;
    body += `<h2>${esc(s.title)}</h2>`;
    fs.forEach(f=>{
      if(f.type==="planttable"||f.type==="labourtable"){
        body += tableRows(f, r.data[f.id]);
        return;
      }
      if(f.type==="repeater"){
        const rows = r.data[f.id]||[];
        body += `<div style="font-weight:600;margin:6px 0 3px">${esc(f.label)}</div>`;
        body += rows.length ? `<table><tr>`+f.columns.map(cl=>`<th style="width:auto">${esc(cl.label)}</th>`).join("")+`</tr>`+
          rows.map(row=>`<tr>`+f.columns.map(cl=>{
            const cv = row[cl.id];
            return `<td>${esc(Array.isArray(cv)?(cv.length?cv.join(", "):"—"):fmt(cl,cv))}</td>`;
          }).join("")+`</tr>`).join("")+`</table>`
          : `<div style="color:#666;margin-bottom:6px">None recorded</div>`;
      } else {
        const raw = r.data[f.id];
        const shown = Array.isArray(raw) ? (raw.length?raw.join(", "):"—") : fmt(f,raw);
        body += `<table><tr><th>${esc(f.label)}</th><td>${esc(shown)}</td></tr></table>`;
      }
    });
  });
  const photos = r.data.photos||[];
  if(photos.length){
    body += `<h2>Photographs</h2><div class="imgs">`+
      photos.map((p,i)=>`<figure style="margin:0"><img src="${p.src}">
        <figcaption style="font-size:9.5px;color:#555">Photo ${i+1} · ${stamp(p.takenAt)}</figcaption></figure>`).join("")+`</div>`;
  }
  const sig = r.data.signature;
  if(sig){
    body += `<h2>Declaration</h2><p style="margin:0 0 6px">I confirm this is a true account of activity on site on
      ${longDate(r.date)}.</p><img src="${sig.src}" style="height:58px;border:1px solid #CBD3CD;padding:3px">
      <div style="font-size:10px;color:#555;margin-top:3px">${esc(r.by)} · ${esc(r.byEmail||"")} · ${stamp(r.submittedAt)}</div>`;
  }
  document.getElementById("sheet").innerHTML = `
    <div class="ph-head">
      <img src="${LOGO}" alt="${esc(c.company)}">
      <div style="text-align:right"><h1>Daily Diary</h1>
      <div style="font-size:10.5px;color:#555">${esc(r.ref||"")} · v${r.version||1}</div></div>
    </div>
    <table>
      <tr><th>Job</th><td>${esc(r.job)}</td></tr>
      <tr><th>Date</th><td>${longDate(r.date)}</td></tr>
      <tr><th>Completed by</th><td>${esc(r.by)} — ${stamp(r.submittedAt)}</td></tr>
    </table>
    ${body}
    <div class="foot"><span>${esc(c.company)} · ${esc(r.ref||"")}</span>
      <span>Printed ${stamp(Date.now())}</span></div>`;
  document.getElementById("sheetTitle").textContent = "Daily Diary — " + shortDate(r.date);
  document.getElementById("sheetwrap").classList.add("open");
  window.scrollTo(0,0);
}
document.getElementById("sheetClose").onclick = () =>
  document.getElementById("sheetwrap").classList.remove("open");
document.getElementById("sheetPrint").onclick = () => {
  window.print();
  toast("Choose \u201cSave as PDF\u201d in the print options");
};

function printTimesheet(ws){
  const c = cfg();
  const { days, people } = timesheetWeek(ws);
  const grand = people.reduce((n,p)=>n+p.total,0);
  document.getElementById("sheet").innerHTML = `
    <div class="ph-head">
      <img src="${LOGO}" alt="${esc(c.company)}">
      <div style="text-align:right"><h1>Timesheet</h1>
        <div style="font-size:10.5px;color:#555">Week commencing ${shortDate(ws)}</div></div>
    </div>
    <table><tr><th>Job</th><td>${esc(DB.job)}</td></tr>
      <tr><th>Week</th><td>${shortDate(ws)} to ${shortDate(addDays(ws,6))}</td></tr>
      <tr><th>Prepared by</th><td>${esc(c.user.name)} — ${stamp(Date.now())}</td></tr></table>
    <h2>Hours worked</h2>
    <table>
      <tr><th style="width:auto">Name</th><th style="width:auto">Trade</th>
        ${days.map(d=>`<th style="width:auto;text-align:center">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][days.indexOf(d)]}<br>${parse(d).getDate()}</th>`).join("")}
        <th style="width:auto;text-align:right">Total</th></tr>
      ${people.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.trade||"")}</td>
        ${days.map(d=>`<td style="text-align:center">${p.days[d]?p.days[d].hours:"—"}</td>`).join("")}
        <td style="text-align:right"><b>${Math.round(p.total*100)/100}</b></td></tr>`).join("")}
      <tr><td colspan="${days.length+2}"><b>Total hours</b></td>
        <td style="text-align:right"><b>${Math.round(grand*100)/100}</b></td></tr>
    </table>
    <h2>Start and finish times</h2>
    <table><tr><th style="width:auto">Name</th><th style="width:auto">Day</th>
      <th style="width:auto">Start</th><th style="width:auto">Finish</th>
      <th style="width:auto">Break</th><th style="width:auto">Hours</th>
      <th style="width:auto">Reason if different</th></tr>
      ${people.map(p=>days.filter(d=>p.days[d]).map(d=>`<tr>
        <td>${esc(p.name)}</td><td>${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][days.indexOf(d)]} ${shortDate(d)}</td>
        <td>${esc(p.days[d].start)}</td><td>${esc(p.days[d].finish)}</td>
        <td>${c.hours.breakMins} min</td><td>${p.days[d].hours}</td>
        <td>${esc(p.days[d].reason||"")}</td></tr>`).join("")).join("")}
    </table>
    <div class="foot"><span>${esc(c.company)} · timesheet w/c ${shortDate(ws)}</span>
      <span>Built from the site diaries · ${stamp(Date.now())}</span></div>`;
  document.getElementById("sheetTitle").textContent = "Timesheet — w/c " + shortDate(ws);
  document.getElementById("sheetwrap").classList.add("open");
  window.scrollTo(0,0);
}

/* ----------------------------------------------------------------- backup -- */
function backupFile(){
  const name = "site-diary-"+DB.job.replace(/[^a-z0-9]+/gi,"-").toLowerCase()+"-"+todayISO()+".json";
  return new File([JSON.stringify(DB,null,2)], name, { type:"application/json" });
}
function exportBackup(){
  const f = backupFile();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(f);
  a.download = f.name;
  a.click();
  toast("Backup saved");
}
async function shareBackup(){
  const f = backupFile();
  if(navigator.canShare && navigator.canShare({ files:[f] })){
    try{
      await navigator.share({ files:[f], title:"Site diary backup" });
      DB.lastShared = Date.now(); save(); render();
      return;
    }catch(e){ return; }              /* cancelled */
  }
  exportBackup();
}
/* Merge, never overwrite. Anything with the same id keeps whichever copy was
   edited last, so moving a file between phone and laptop is safe in both
   directions and nothing already entered is lost. */
function mergeInto(list, incoming, stampKey){
  const out = list.slice();
  (incoming||[]).forEach(inc=>{
    const i = out.findIndex(x=>x.id===inc.id);
    if(i<0){ out.push(inc); return; }
    const a = out[i][stampKey] || out[i].submittedAt || out[i].updatedAt || 0;
    const b = inc[stampKey] || inc.submittedAt || inc.updatedAt || 0;
    if(b >= a) out[i] = inc;
  });
  return out;
}
function importBackup(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{
    const fr=new FileReader();
    fr.onload=()=>{
      let d;
      try{ d = JSON.parse(fr.result); }catch(e){ toast("That file could not be read"); return; }
      if(!d || !Array.isArray(d.records)){ toast("That is not a diary backup"); return; }
      const before = DB.records.length;
      askConfirm("Merge this backup?",
        "It has "+d.records.length+" diar"+(d.records.length===1?"y":"ies")+". Anything newer in the file wins; nothing on this device is deleted.",
        "Merge", ()=>{
          DB.records = mergeInto(DB.records, d.records, "updatedAt");
          DB.plant   = mergeInto(DB.plant||[],  d.plant||[],  "id");
          DB.labour  = mergeInto(DB.labour||[], d.labour||[], "id");
          DB.counter = Math.max(DB.counter||0, d.counter||0);
          if(d.job && !DB.job) DB.job = d.job;
          save(); render();
          toast("Merged — "+(DB.records.length-before)+" new");
        });
    };
    fr.readAsText(inp.files[0]);
  };
  inp.click();
}

/* ------------------------------------------------------------------- boot -- */
if(!DB.config) DB.config = JSON.parse(JSON.stringify(CONFIG));
if(!DB.job) DB.job = CONFIG.jobs[0];
if(!DB.plant) DB.plant = [];
if(!DB.labour) DB.labour = [];
if(!DB.config.hours) DB.config.hours = JSON.parse(JSON.stringify(CONFIG.hours));
if(DB.config.allowDelete === undefined) DB.config.allowDelete = CONFIG.allowDelete;
save();
render();
