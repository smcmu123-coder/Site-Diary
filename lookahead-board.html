<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CGC siteHUB — Two week look ahead</title>
<style>
/* ==========================================================================
   CGC siteHUB — two week look ahead
   The sister board to office-board.html, and deliberately the same page in a
   different arrangement: the token block below is lifted from it unchanged, so
   the two screens can never drift apart on colour, type or spacing. The site
   board answers "where are we today". This one answers "what is coming", and
   that is the only difference in its job.

   Read from three or four metres, same as the other, so density drops items
   rather than shrinking type.
   ========================================================================== */
:root{
  /* brand — straight from the logo panel (#1F5A2D base, #174C26 top) */
  --green:#1F5A2D; --green-700:#123D1E; --green-600:#2A7440;
  --green-deep:#174C26;
  --green-50:#EEF4EF; --green-100:#DBE8DE; --green-200:#B9D2C0;

  /* ink — every step clears 4.5:1 on white, which matters more at distance */
  --ink:#0E1411; --ink-2:#48534D; --ink-3:#626E67; --ink-4:#6B7770;

  /* surfaces */
  --paper:#fff; --canvas:#F5F7F6; --line:#DCE2DE; --line-2:#EAEEEB;

  /* semantic — darkened to survive a bright office and a cheap panel */
  --ok:#1E6B36; --ok-bg:#E7F1EA;
  --warn:#8A5000; --warn-700:#6B3E00; --warn-bg:#FAEEDB; --warn-on:#fff;
  --late:#9A4A06;
  --bad:#8F2119; --bad-bg:#FBEAE8;
  --info:#174680; --info-bg:#E7EFF8;

  /* the planner's colours, kept in step with the app */
  --blue:#174680; --blue-bg:#E7EFF8; --plum:#732F52; --plum-bg:#F4E8EE;
  --teal:#0C5A54; --teal-bg:#E0EEEC; --orange:#9A4A06; --orange-bg:#FAEADF;
  --amber:#8A5000; --amber-bg:#FAEEDB; --red:#8F2119; --red-bg:#FBEAE8;
  --violet:#4C3178; --violet-bg:#EDE8F6;
  --dark:#123D1E;

  /* type — the app's scale, but sized against the window rather than fixed.
     The board has to fill one screen with no scrolling, and that screen might
     be a wall-mounted TV or a laptop browser with a toolbar eating the top.
     Every size is clamped between a floor that is still readable across a desk
     and a ceiling that suits a 1080p panel, and follows the viewport height in
     between — height is the binding constraint here, not width. */
  --t-display:clamp(30px, 5.4vh, 64px);
  --t-title:clamp(20px, 3.3vh, 38px);
  --t-head:clamp(15px, 2.25vh, 26px);
  --t-lead:clamp(14px, 1.95vh, 22px);
  --t-body:clamp(13px, 1.75vh, 20px);
  --t-sub:clamp(12px, 1.55vh, 18px);
  --t-cap:clamp(11px, 1.35vh, 16px);
  --t-over:clamp(10px, 1.15vh, 14px);
  --w-reg:400; --w-med:560; --w-bold:680;

  /* spacing — same idea: the scale breathes with the window */
  --s1:clamp(3px, .35vh, 4px);   --s2:clamp(5px, .75vh, 8px);
  --s3:clamp(7px, 1.1vh, 12px);  --s4:clamp(9px, 1.45vh, 16px);
  --s5:clamp(11px, 1.8vh, 20px); --s6:clamp(13px, 2.2vh, 24px);
  --s7:clamp(16px, 2.9vh, 32px); --s8:clamp(20px, 3.6vh, 40px);
  --s9:clamp(26px, 5vh, 56px);

  /* the rings shrink with everything else */
  --dial:clamp(88px, 15.5vh, 170px);
  --mark:clamp(32px, 5.6vh, 62px);

  /* shape */
  --r-sm:12px; --r:18px; --r-lg:26px; --r-pill:999px;

  /* depth — a real border as well, so panels hold their edge on a dim screen */
  --sh:0 1px 2px rgba(15,21,18,.04), 0 8px 20px -16px rgba(15,21,18,.30);
  --sh-lift:0 2px 6px rgba(15,21,18,.06), 0 18px 40px -24px rgba(15,21,18,.42);

  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact}
body{background:var(--canvas);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,
    "Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:var(--t-body);line-height:1.4;height:100vh;overflow:hidden;
  -webkit-font-smoothing:antialiased}
.ghost{position:fixed;right:-7vw;bottom:-18vh;width:min(920px, 62vw);opacity:.04}

/* --- the frame ----------------------------------------------------------- */
.wrap{position:relative;height:100vh;padding:var(--s6) var(--s7) var(--s5);
  display:grid;grid-template-rows:auto 1fr auto;gap:var(--s5)}

/* --- header (the site board's, unchanged) -------------------------------- */
.top{display:flex;align-items:center;gap:var(--s6)}
.top .mark{height:var(--mark);flex:none}
.jobpill{display:inline-flex;align-items:center;gap:14px;
  background:var(--green-50);color:var(--green-700);padding:11px 26px;
  border-radius:var(--r-pill);font-size:var(--t-title);font-weight:var(--w-bold);
  letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:inset 0 0 0 1.5px var(--green-100)}
/* This board is not about the minute, it is about the fortnight, so the range
   leads and the clock steps back to the size the date has on the other board. */
.range{margin-left:auto;text-align:right;flex:none}
.range .r{font-size:var(--t-head);font-weight:var(--w-bold);letter-spacing:-.02em;
  color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.range .d{font-size:var(--t-sub);color:var(--ink-2);font-weight:var(--w-med);margin-top:4px}

/* --- the two weeks ------------------------------------------------------- */
.weeks{display:grid;grid-template-rows:1fr 1fr;gap:var(--s5);min-height:0}
.week{display:grid;grid-template-rows:auto 1fr;gap:var(--s3);min-height:0}
/* Same section heading as the panels on the site board: small spaced capitals
   in grey over a hairline, with the week's tally sitting on the right of it. */
.wkhead{display:flex;align-items:baseline;gap:var(--s3);
  font-size:var(--t-over);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);font-weight:var(--w-bold);
  padding-bottom:var(--s2);border-bottom:1px solid var(--line-2)}
.wkhead .tally{margin-left:auto;letter-spacing:.04em;color:var(--ink-2)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s3);min-height:0}

/* A day is a panel, and panels here carry a shadow, never a shadow and a
   border. Everything else — today, a weekend, a day already gone — is said
   inside the card, not by giving it different furniture. */
.day{background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--sh);
  padding:var(--s3) var(--s4) var(--s4);display:flex;flex-direction:column;
  min-height:0;overflow:hidden}
.day.rest{background:transparent;box-shadow:none;
  box-shadow:inset 0 0 0 1px var(--line-2)}
.day.past{opacity:.5}
/* Today is marked the way the app marks it: a green ring and the date in
   green, not a filled green block that would shout down every tag on it. */
.day.today{box-shadow:var(--sh-lift), inset 0 0 0 2px var(--green-600)}

.dhead{display:flex;align-items:baseline;gap:var(--s2);
  padding-bottom:var(--s2);margin-bottom:var(--s2);
  border-bottom:1px solid var(--line-2)}
.dow{font-size:var(--t-over);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);font-weight:var(--w-bold)}
.dnum{margin-left:auto;font-size:var(--t-lead);font-weight:var(--w-bold);
  letter-spacing:-.02em;color:var(--ink-2);font-variant-numeric:tabular-nums}
.day.today .dow,.day.today .dnum{color:var(--green-600)}
.day.today .dhead{border-bottom-color:var(--green-100)}
.todaytag{font-size:var(--t-over);font-weight:var(--w-bold);letter-spacing:.06em;
  text-transform:uppercase;background:var(--green-50);color:var(--green-700);
  border-radius:var(--r-pill);padding:2px 10px;
  box-shadow:inset 0 0 0 1px var(--green-100)}

.dlist{flex:1;min-height:0;overflow:hidden}
/* Rows are hairline-separated, exactly as on the site board. The colour comes
   from the tag and nothing else, so a day with four different things on it
   still reads as one list rather than four coloured boxes. */
.it{padding:var(--s2) 0;border-bottom:1px solid var(--line-2)}
.it:last-child{border-bottom:0}
.it .tag{margin-bottom:3px}
.it b{display:block;font-size:var(--t-body);font-weight:var(--w-med);
  letter-spacing:-.01em;color:var(--ink);line-height:1.25}
.it .sub{display:block;font-size:var(--t-cap);color:var(--ink-2);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .at{font-size:var(--t-cap);font-weight:var(--w-bold);color:var(--ink-3);
  font-variant-numeric:tabular-nums;margin-right:6px}
.none{font-size:var(--t-cap);color:var(--ink-3);padding:var(--s2) 0;font-weight:var(--w-med)}
.more{font-size:var(--t-cap);color:var(--ink-2);font-weight:var(--w-bold);
  padding:var(--s2) 0}

/* --- tags (the site board's shape; the colours come from the app) --------- */
.tag{display:inline-block;padding:2px 10px;border-radius:var(--r-pill);
  font-size:var(--t-over);font-weight:var(--w-bold);letter-spacing:.06em;
  text-transform:uppercase;border:1px solid transparent;white-space:nowrap;
  max-width:100%;overflow:hidden;text-overflow:ellipsis}

/* --- footer -------------------------------------------------------------- */
.foot{display:flex;align-items:center;gap:var(--s3);font-size:var(--t-cap);
  color:var(--ink-2);font-weight:var(--w-med)}
.foot .right{margin-left:auto}
.foot .legend{display:flex;gap:var(--s4);flex-wrap:wrap}
.foot .lg{display:inline-flex;align-items:center;gap:6px}
.foot .sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.dot{width:11px;height:11px;border-radius:50%;background:var(--ok);display:inline-block;flex:none}
.dot.stale{background:var(--late)}
.foot .age{font-weight:var(--w-bold);color:var(--ok)}
.foot .age.stale{color:var(--late)}

/* --- the waiting-for-data screen ----------------------------------------- */
.state{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:var(--s4);background:var(--canvas);z-index:5;
  text-align:center;padding:var(--s9)}
.state img{width:190px;opacity:.9;margin-bottom:var(--s2);border-radius:var(--r-lg)}
.state h2{font-size:var(--t-title);font-weight:var(--w-bold);letter-spacing:-.02em}
.state p{font-size:var(--t-lead);color:var(--ink-2);max-width:56ch;line-height:1.5}
.state code{background:#fff;border:1px solid var(--line);padding:3px 10px;
  border-radius:8px;font-size:var(--t-sub)}
.tried{display:flex;flex-direction:column;gap:6px;margin-top:var(--s3);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--t-cap)}
.tried span{background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:5px 12px;color:var(--ink-2)}

/* --- motion (the site board's two one-shot moves) ------------------------- */
@keyframes bRise{ from{ opacity:0; transform:translateY(14px) } to{ opacity:1; transform:none } }
@keyframes bSettle{ from{ opacity:.35; transform:translateY(5px) } to{ opacity:1; transform:none } }
.wrap.first .top{ animation:bRise .5s cubic-bezier(.16,1,.3,1) both }
.wrap.first .week:nth-child(1){ animation:bRise .58s cubic-bezier(.16,1,.3,1) .10s both }
.wrap.first .week:nth-child(2){ animation:bRise .58s cubic-bezier(.16,1,.3,1) .18s both }
.wrap.first .foot{ animation:bRise .5s cubic-bezier(.16,1,.3,1) .26s both }
.fresh{ animation:bSettle .42s cubic-bezier(.16,1,.3,1) both }
@media (prefers-reduced-motion:reduce){
  .wrap.first .top,.wrap.first .week,.wrap.first .foot,.fresh{
    animation:none;opacity:1;transform:none }
}

/* --- fitting whatever window it lands in --------------------------------- */
/* Fourteen columns across a narrow screen would be fourteen slivers, so the
   fortnight goes four across and scrolls no further than the screen. */
@media (max-width:1180px){
  .days{grid-template-columns:repeat(4,1fr)}
  .weeks{grid-template-rows:auto auto;overflow:auto;scrollbar-width:none}
  .weeks::-webkit-scrollbar{display:none}
  .days{grid-auto-rows:minmax(0,1fr)}
}
@media (max-width:820px){
  .days{grid-template-columns:repeat(2,1fr)}
  .top{flex-wrap:wrap}
  .range{margin-left:0}
}
@media (max-height:620px){
  .day{padding:var(--s2) var(--s3) var(--s3)}
  .wrap{gap:var(--s3)}
}
@media print{
  body,.wrap{height:auto;overflow:visible}
  .ghost,.state{display:none}
  .day{break-inside:avoid}
}

<script>
/* ------------------------------------------------------------------------
   The board holds no rules of its own. Everything shown here — which days are
   working days, what is booked on them, what each kind of thing is called and
   what colour it takes — is computed in the app and published in the snapshot.
   The wall can therefore never disagree with the phone.
   ------------------------------------------------------------------------ */
var REFRESH_MS = 300000;   /* re-read the file every five minutes */
var TICK_MS    = 60000;    /* redraw every minute for the date and today marker */

/* Where the figures come from. The app writes board-data.json into the
   repository; this board looks beside itself first, then a folder up, then at
   the site root, because the two files do not always end up in the same place.
   An address can also be forced:  ?data=https://…/board-data.json  */
var DATA_CANDIDATES = (function(){
  var forced = new URLSearchParams(location.search).get("data");
  if(forced) return [forced];
  var saved = null;
  try{ saved = localStorage.getItem("boardDataUrl"); }catch(e){}
  var list = ["board-data.json", "../board-data.json", "/board-data.json",
              "docs/board-data.json"];
  if(saved) list.unshift(saved);
  return list;
})();
var TRIED = [];

/* Rewriting the whole wall every five minutes makes it blink, and a blink with
   no news in it teaches the office to stop looking. Regions are written only
   when their markup has actually changed. */
var lastHTML = {}, painted = false;
function setHTML(id, html){
  if(lastHTML[id] === html) return;
  lastHTML[id] = html;
  var el = document.getElementById(id);
  el.innerHTML = html;
  if(painted){ el.classList.remove("fresh"); void el.offsetWidth; el.classList.add("fresh"); }
}

function pad(n){ return (n<10?"0":"")+n; }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parse(s){ var p=String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;"); }
var DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var MON = ["January","February","March","April","May","June","July","August",
           "September","October","November","December"];
function dowOf(s){ return DOW[(parse(s).getDay()+6)%7]; }
function dayMonth(s){ var d=parse(s); return d.getDate()+" "+MON[d.getMonth()].slice(0,3); }

/* the tag border is the tag's own colour, softened — worked out from the hex
   the app publishes, so a new kind added in the app needs nothing here */
function softBorder(hex){
  var h = String(hex||"").replace("#","");
  if(h.length !== 6) return "transparent";
  return "rgba("+parseInt(h.slice(0,2),16)+","+parseInt(h.slice(2,4),16)+","
    + parseInt(h.slice(4,6),16)+",.28)";
}

var KINDS = {};
function kindOf(k){
  return KINDS[k] || { label:String(k||"Item").replace(/^./,function(c){return c.toUpperCase();}),
                       colour:"#48534D", bg:"#EEF1EF" };
}

/* how many rows fit in a cell before the rest roll into "+ n more". Fewer
   rows, never smaller words. */
function capacity(){
  if(window.innerWidth < 820) return 6;
  if(window.innerHeight < 700) return 3;
  return 4;
}

function dayCell(d, todayISO){
  var cls = ["day"];
  if(d.date === todayISO) cls.push("today");
  else if(d.date < todayISO) cls.push("past");
  if(!d.working) cls.push("rest");

  var head = '<div class="dhead"><span class="dow">'+dowOf(d.date)+'</span>'
    + (d.date === todayISO ? '<span class="todaytag">Today</span>' : '')
    + '<span class="dnum">'+esc(dayMonth(d.date))+'</span></div>';

  var items = d.items || [], body = "";
  if(!items.length){
    body = '<div class="none">'+(d.working ? "Nothing booked" : "Not a working day")+'</div>';
  } else {
    var cap = capacity(), show = items.slice(0, cap), i, k;
    for(i=0;i<show.length;i++){
      k = kindOf(show[i].kind);
      body += '<div class="it">'
        + '<span class="tag" style="background:'+k.bg+';color:'+k.colour
        + ';border-color:'+softBorder(k.colour)+'">'+esc(k.label)+'</span>'
        + '<b>'+(show[i].time ? '<span class="at">'+esc(show[i].time)+'</span>' : '')
        + esc(show[i].text)+'</b>'
        + (show[i].sub ? '<span class="sub">'+esc(show[i].sub)+'</span>' : '')
        + '</div>';
    }
    if(items.length > cap)
      body += '<div class="more">+ '+(items.length-cap)+' more</div>';
  }
  return '<div class="'+cls.join(" ")+'">'+head
    + '<div class="dlist" data-total="'+items.length+'">'+body+'</div></div>';
}

/* A cell holds what it holds. Guessing a row count from the window gets close
   but not exact — two lines of wording in a title is enough to push the last
   row half off the bottom, and half a row showing looks like a fault. So after
   the board is written, each cell drops rows until its contents actually fit
   and says how many it dropped. Nothing is ever cut mid-line. */
function fitDays(){
  var cells = document.querySelectorAll(".dlist"), i;
  for(i=0;i<cells.length;i++){
    var box = cells[i], total = +box.getAttribute("data-total") || 0;
    if(!total) continue;
    var more = box.querySelector(".more");
    var guard = 0;
    while(box.scrollHeight > box.clientHeight + 1 && guard++ < 20){
      var rows = box.querySelectorAll(".it");
      if(rows.length <= 1) break;
      rows[rows.length-1].remove();
      if(!more){
        more = document.createElement("div");
        more.className = "more";
        box.appendChild(more);
      }
      more.textContent = "+ " + (total - box.querySelectorAll(".it").length) + " more";
    }
    if(more && box.querySelectorAll(".it").length === total) more.remove();
  }
}

function tally(days){
  var n = 0, working = 0, i;
  for(i=0;i<days.length;i++){ n += (days[i].items||[]).length; if(days[i].working) working++; }
  return n === 0 ? "Nothing booked"
    : n + (n===1 ? " thing" : " things") + " across " + working
      + (working===1 ? " working day" : " working days");
}

function draw(data){
  window.__last = data;
  KINDS = data.planKinds || {};
  var today = iso(new Date());
  var la = data.lookahead || [];

  setHTML("job", esc(data.job || "Site"));

  var first = la.length ? la[0].date : today;
  var last  = la.length ? la[la.length-1].date : today;
  setHTML("rangeTxt", esc(dayMonth(first)) + " &ndash; " + esc(dayMonth(last)));
  var td = new Date();
  setHTML("today", DOW[(td.getDay()+6)%7] === "Mon" ? "Monday " + td.getDate() + " " + MON[td.getMonth()]
    : ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][td.getDay()]
      + " " + td.getDate() + " " + MON[td.getMonth()]);

  var wk = [la.slice(0,7), la.slice(7,14)], html = "", w, i;
  for(w=0; w<2; w++){
    if(!wk[w].length) continue;
    html += '<div class="week"><div class="wkhead"><span>'
      + (w === 0 ? "This week" : "Next week")
      + '</span><span class="tally">'+esc(tally(wk[w]))+'</span></div><div class="days">';
    for(i=0;i<wk[w].length;i++) html += dayCell(wk[w][i], today);
    html += '</div></div>';
  }
  setHTML("weeks", html);

  /* the legend names every kind actually on the board, and nothing else */
  var used = {}, leg = "";
  for(i=0;i<la.length;i++) (la[i].items||[]).forEach(function(x){ used[x.kind] = 1; });
  Object.keys(used).forEach(function(k){
    var kk = kindOf(k);
    leg += '<span class="lg"><span class="sw" style="background:'+kk.bg
      + ';box-shadow:inset 0 0 0 1px '+softBorder(kk.colour)+'"></span>'+esc(kk.label)+'</span>';
  });
  setHTML("legend", leg);

  stampLine(data);

  document.getElementById("state").style.display = "none";
  var board = document.getElementById("board");
  board.style.display = "";
  /* only once the board is actually on screen do the cells have a height to
     measure against, so the fit pass runs here rather than at write time */
  fitDays();
  if(!painted){ board.classList.add("first"); painted = true;
    setTimeout(function(){ board.classList.remove("first"); }, 1600); }
}

function stampLine(data){
  var el = document.getElementById("stamp"), dot = document.getElementById("dot");
  var at = data.publishedAt || data.published;
  if(!at){ el.textContent = "\u2014"; return; }
  var p = new Date(at), mins = Math.round((Date.now() - p.getTime())/60000);
  var age = mins<2 ? "just now" : mins<60 ? mins+" minutes ago"
    : mins<1440 ? Math.round(mins/60)+" hours ago" : Math.round(mins/1440)+" days ago";
  var stale = mins > 36*60;
  el.innerHTML = "Published "+pad(p.getHours())+":"+pad(p.getMinutes())
    + " &middot; <span class=\"age"+(stale?" stale":"")+"\">"
    + (stale ? "out of date \u2014 " + age : age) + "</span>";
  dot.className = stale ? "dot stale" : "dot";
}

function message(title, body){
  document.getElementById("state").style.display = "";
  document.getElementById("board").style.display = "none";
  document.getElementById("stateTitle").textContent = title;
  document.getElementById("stateText").innerHTML = body;
}

/* Try each address in turn; the first that answers wins and is remembered. */
function fetchBoard(){
  var i = 0; TRIED = [];
  function attempt(){
    if(i >= DATA_CANDIDATES.length) return Promise.reject(new Error("not found"));
    var url = DATA_CANDIDATES[i++];
    return fetch(url + (url.indexOf("?") > -1 ? "&" : "?") + "t=" + Date.now(),
        { cache:"no-store" })
      .then(function(r){
        TRIED.push(url + " \u2014 " + r.status);
        if(!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(function(d){
        try{ localStorage.setItem("boardDataUrl", url); }catch(e){}
        return d;
      })
      .catch(function(){ return attempt(); });
  }
  return attempt();
}

function load(){
  var isFile = location.protocol === "file:";
  fetchBoard()
    .then(function(data){
      if(!data.lookahead){
        if(window.__last){ draw(window.__last); return; }
        message("Nothing to show yet",
          "The board file is there, but it was written by an older build of the app and "
          + "has no fortnight in it. Open the app and send the board again.");
        return;
      }
      draw(data);
    })
    .catch(function(){
      /* yesterday's plan on the wall is worth more than an error message */
      if(window.__last){ draw(window.__last); return; }
      var where = '<div class="tried">' + TRIED.map(function(x){
        return "<span>" + esc(x) + "</span>"; }).join("") + '</div>';
      message(isFile ? "Put this on a web address" : "Cannot find the board file",
        isFile
          ? "This page has been opened straight from the file system, and a browser will not "
            + "let it read <code>board-data.json</code> that way. Put both files on the same "
            + "web address and open it from there."
          : "The app is sending the file, but this page cannot reach it. These are the "
            + "addresses it tried, and what came back:" + where);
    });
}

load();
setInterval(load, REFRESH_MS);
/* the date line and the today marker move without a new file arriving */
setInterval(function(){ if(window.__last) draw(window.__last); }, TICK_MS);
window.addEventListener("resize", function(){
  if(window.__last){ lastHTML = {}; draw(window.__last); }
});
</script>
</body></html>
