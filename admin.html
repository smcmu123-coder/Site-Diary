<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiteHUB Admin</title>
<link rel="icon" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Cheltenham Green Civils brand (Brand & Forms Style Guide v2):
   one brand colour — CGC Green — plus neutrals; entered data in Value Blue;
   rounded green section bars with white bold capitals; thin grey table lines. */
:root{
  --green:#1F5A2D; --green-d:#174522; --green-h:#2A6B39;
  --tint:#EDF2EE; --tint-2:#D8DFDA; --line:#CBD3CD;
  --blue:#2E6DA4; --ink:#1A1A1A; --ink-2:#4A524C; --ink-3:#6E7771;
  --red:#B42318; --red-50:#FBEAE8; --amber:#9A5B07; --amber-50:#FCF1DF;
  --font:"Segoe UI",system-ui,-apple-system,Calibri,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:var(--font);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--green)}
[hidden]{display:none!important}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{display:flex;flex-direction:column;background:var(--green);position:sticky;top:0;height:100vh}
.side .brand{background:#fff;padding:22px 26px;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:3px solid var(--green)}
.side .brand img{height:78px;width:auto;display:block}
.side nav{display:flex;flex-direction:column;padding:14px 12px;gap:4px}
.side nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;color:#fff;text-decoration:none;
  font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:10px}
.side nav a:hover{background:var(--green-h)}
.side nav a.on{background:#fff;color:var(--green)}
.side nav a svg{width:18px;height:18px;flex:none}
.side .me{margin-top:auto;padding:16px 26px 20px;color:rgba(255,255,255,.78);font-size:12.5px;line-height:1.55;border-top:1px solid rgba(255,255,255,.16)}
.side .me b{color:#fff;font-weight:700;display:block;font-size:13.5px}
.side .me a,.side .me button{color:#fff;background:none;border:none;padding:0;font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.side .me .links{margin-top:8px;display:flex;gap:14px}
main{padding:clamp(18px,2.2vw,34px) clamp(16px,2.6vw,44px) 28px;min-width:0;display:flex;flex-direction:column;min-height:100vh}
main > .content{flex:1}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:40px;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3)}

/* ---------- page header: title + thin green rule ---------- */
.crumbs{display:flex;gap:8px;align-items:center;margin:0 0 10px;font-size:13px;color:var(--ink-3)}
.crumbs a{color:var(--ink-2);text-decoration:none}.crumbs a:hover{color:var(--green);text-decoration:underline}
.title{display:flex;align-items:flex-end;gap:14px;margin:0 0 24px;padding-bottom:12px;border-bottom:2px solid var(--green)}
.title h1{margin:0;font-size:24px;font-weight:700;color:var(--ink)}
.title .sub{color:var(--ink-3);font-size:13px;padding-bottom:3px}
.title .sp{flex:1}
.jobbar{background:var(--green);color:#fff;border-radius:12px;padding:12px 20px;margin:0 0 30px;
  display:flex;align-items:baseline;gap:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:16px}
.jobbar .ref{font-weight:400;text-transform:none;letter-spacing:0;font-size:13px;opacity:.85}
.jobbar .sp{flex:1}
.jobbar .lnk{color:#fff;text-transform:none;letter-spacing:0;text-decoration:underline;text-underline-offset:2px}

/* ---------- tiles ---------- */
.jobtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:clamp(14px,1.6vw,26px)}
.jt{min-height:200px;border-radius:22px;background:var(--green);color:#fff;border:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:22px;
  text-decoration:none;transition:transform .12s ease, background .12s ease, box-shadow .12s ease;font-family:var(--font)}
.jt:hover{background:var(--green-h);transform:translateY(-2px);box-shadow:0 8px 22px rgba(31,90,45,.22)}
.jt .n{font-size:19px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.jt .m{font-size:13px;color:rgba(255,255,255,.82)}
.jt .k{margin-top:10px;display:flex;gap:8px}
.jt .k span{background:rgba(255,255,255,.14);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:600}
.jt.new{background:var(--tint);color:var(--green);border:2px solid var(--green)}
.jt.new:hover{background:var(--tint-2);box-shadow:none}
.jt.new .plus{font-size:34px;line-height:1;font-weight:300}
/* dashboard job cards: the job at a glance */
.jobcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:clamp(14px,1.6vw,24px)}
.jobcards .jt.new{min-height:180px}
.jc{display:flex;flex-direction:column;border-radius:22px;overflow:hidden;border:1.5px solid var(--green);background:#fff;color:var(--ink);text-decoration:none;
  transition:transform .12s ease, box-shadow .12s ease}
.jc:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(31,90,45,.18)}
.jc:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.jc .jh{background:var(--green);color:#fff;padding:16px 20px;display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.jc .jh .n{display:block;font-size:18px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.jc .jh .m{display:block;font-size:13px;color:rgba(255,255,255,.82);margin-top:2px}
.jc .state{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:99px;background:#fff}
.jc .state .ico{width:15px;height:15px}
.jc .state.ok{color:var(--green)} .jc .state.warn{color:var(--red)}
.jc .jb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;flex:1}
.jks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line)}
.jk{padding:10px 12px;background:var(--tint);border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.jk:nth-child(4n){border-right:none} .jk:nth-last-child(-n+4){border-bottom:none}
.jk span{display:block;font-size:10.5px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jk b{display:block;font-size:20px;font-weight:600;color:var(--blue);line-height:1.3;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jk em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jk.warn{background:var(--red-50)} .jk.warn b,.jk.warn span{color:var(--red)}
.jp .jpl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.jp .jpl span{font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.05em}
.jp .jpl b{font-size:14px;color:var(--ink)} .jp .jpl em{font-style:normal;font-size:12.5px;color:var(--ink-3)}
.bar2{height:8px;border-radius:99px;background:var(--tint-2);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--green);border-radius:99px}
.jf{display:flex;flex-wrap:wrap;gap:6px}
.jf span{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--red);background:var(--red-50);border-radius:99px;padding:4px 10px}
.jf .ico{width:13px;height:13px;stroke-width:2.2}

@media (max-width:640px){ .jks{grid-template-columns:repeat(2,minmax(0,1fr))} .jk:nth-child(4n){border-right:1px solid var(--line)} .jk:nth-child(2n){border-right:none} .jk:nth-last-child(-n+4){border-bottom:1px solid var(--line)} .jk:nth-last-child(-n+2){border-bottom:none} }
.sectiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,1.6vw,24px)}
.st{min-height:clamp(170px,15vw,280px);border-radius:22px;background:var(--green);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:18px;
  text-decoration:none;position:relative;transition:transform .12s ease, background .12s ease, box-shadow .12s ease}
.st:hover{background:var(--green-h);transform:translateY(-2px);box-shadow:0 8px 22px rgba(31,90,45,.22)}
.st .t{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.st .v{font-size:21px;line-height:1.3;white-space:pre-line;font-weight:400}
.st .flag{position:absolute;top:12px;right:12px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:#fff}
.st .flag.red{color:var(--red)} .st .flag.amber{color:var(--amber)}
@media (max-width:900px){ .sectiles,.sectiles.three{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ---------- section bars + record tables ---------- */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.bar .sp{flex:1}
.panel{margin:0 0 28px}
.panel h2{margin:0 0 10px;background:var(--green);color:#fff;border-radius:10px;padding:9px 14px 9px 16px;
  font-size:13.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:10px;align-items:center;min-height:42px}
.panel h2 .note{font-weight:400;text-transform:none;letter-spacing:0;font-size:12.5px;color:rgba(255,255,255,.82)}
.panel h2 .sp{flex:1}
.panel h2 .btn{background:#fff;color:var(--green);border-color:#fff;text-transform:none;letter-spacing:0}
.panel h2 .btn:hover{background:var(--tint)}
.panel .body{padding:4px 2px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.05em;
  padding:9px 12px;border:1px solid var(--line);background:var(--tint);white-space:nowrap}
table.t td{padding:10px 12px;border:1px solid var(--line);vertical-align:middle;color:var(--blue)}
table.t tr:nth-child(odd) td{background:#FAFCFA}
table.t td b{font-weight:600}
table.t td .sub2{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
table.t tr.off td{color:var(--ink-3)}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t td.acts{text-align:right;white-space:nowrap;width:1%}
.muted{color:var(--ink-3)}
.fn{font-size:12px;color:var(--ink-3);margin:8px 2px 0}
.empty{padding:26px 18px;color:var(--ink-3);text-align:center;border:1px dashed var(--line);border-radius:10px;background:#fff}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--tint-2);color:var(--ink-2);white-space:nowrap;letter-spacing:.02em}
.pill.ok{background:var(--tint);color:var(--green)} .pill.red{background:var(--red-50);color:var(--red)}
.pill.amber{background:var(--amber-50);color:var(--amber)}
/* key facts: bold green label, value in blue, on the pale tint */
.stats{display:flex;gap:0;flex-wrap:wrap;margin:0 0 20px;border:1px solid var(--line);width:max-content;max-width:100%}
.stat{padding:10px 18px;min-width:140px;background:var(--tint);border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat span{display:block;font-size:11.5px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.05em}
.stat b{font-size:20px;font-weight:600;color:var(--blue)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:#fff;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--green);color:#fff}
.seg a.segl{display:inline-block;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--ink-2);text-decoration:none;background:#fff}
.seg a.segl + a.segl{border-left:1px solid var(--line)} .seg a.segl.on{background:var(--green);color:#fff}
/* job labour calendar */
.cal{border:1px solid var(--line)}
.cal-h{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--tint);border-bottom:1px solid var(--line)}
.cal-h span{padding:8px 10px;font-size:12px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.05em}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-d{min-height:clamp(96px,9vw,150px);border:none;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;padding:7px 8px;text-align:left;
  display:flex;flex-direction:column;gap:3px;font:inherit;color:inherit;cursor:pointer;min-width:0}
.cal-d:nth-child(7n){border-right:none}
.cal-d:hover{background:var(--tint)}
.cal-d.off{background:#F7F8F7;cursor:default} .cal-d.off:hover{background:#F7F8F7}
.cal-d.out .dn b{color:var(--ink-3);font-weight:400}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--green)}
.cal-d .dn{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.cal-d .dn b{font-size:14px} .cal-d .dn em{font-style:normal;font-size:11.5px;font-weight:700;background:var(--green);color:#fff;border-radius:99px;padding:1px 8px}
.cal-d .pn{display:block;font-size:12px;color:var(--blue);background:var(--tint);border-radius:5px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-d .pn.in{background:#E4EEF6;font-weight:600}
.cal-d .pn.leave{background:none;color:var(--ink-3);padding:0 2px;font-size:11.5px}
.cal-d .more{font-size:11.5px;color:var(--ink-3);padding:0 2px}

/* ---------- buttons, forms ---------- */
.btn{border:1.5px solid var(--green);background:var(--green);color:#fff;border-radius:10px;padding:9px 16px;font-weight:700;font-size:14px}
.btn:hover{background:var(--green-h);border-color:var(--green-h)}
.btn.line{background:#fff;color:var(--green);border-color:var(--green)}
.btn.line:hover{background:var(--tint)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--tint)}
.btn.danger{background:#fff;color:var(--red);border-color:#E9B7B1}
.btn.danger:hover{background:var(--red-50)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:default}
.lnk{background:none;border:none;color:var(--green);font-weight:700;padding:4px 6px;font-size:13px}
.lnk:hover{text-decoration:underline}
.lnk.red{color:var(--red)}
.f{display:flex;flex-direction:column;gap:5px;margin:0 0 12px}
.f label{font-size:12.5px;font-weight:700;color:var(--green)}
.f .hint{font-size:12px;color:var(--ink-3);margin-top:-2px}
.in{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;width:100%;color:var(--blue)}
.in:focus{outline:2px solid var(--tint-2);border-color:var(--green)}
.in:disabled{background:var(--tint);color:var(--ink-2)}
textarea.in{min-height:80px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chips button.on{background:var(--green);border-color:var(--green);color:#fff}

/* ---------- modal, toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(26,26,26,.42);display:flex;align-items:flex-start;justify-content:center;
  padding:6vh 16px;z-index:50;overflow-y:auto}
.dlg{background:#fff;border-radius:14px;width:100%;max-width:620px;padding:0 24px 20px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.dlg h3{margin:0 -24px 16px;padding:14px 24px;background:var(--green);color:#fff;font-size:15px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.dlg p.lead{margin:0 0 16px;color:var(--ink-2);font-size:14px;line-height:1.5}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--green);color:#fff;padding:11px 18px;
  border-radius:10px;font-size:14px;font-weight:600;z-index:60;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.22)}

/* ---------- sign-in ---------- */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--tint);padding:24px 16px}
.gate .card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px 30px 24px;text-align:left}
.gate img{height:72px;display:block;margin:0 0 18px}
.gate h1{font-size:20px;font-weight:700;margin:0;padding-bottom:10px;border-bottom:2px solid var(--green)}
.gate p{color:var(--ink-2);margin:12px 0 20px;font-size:14px}
.gate .btn{width:100%;padding:12px;font-size:15px;margin-top:4px;text-align:center}
.err{color:var(--red);font-size:13.5px;margin:2px 2px 10px}

/* ---------- UI/UX polish ---------- */
/* keyboard focus is always visible */
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.jt:focus-visible,.st:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.side nav a:focus-visible{outline:3px solid #fff;outline-offset:-3px}
/* rows light up under the pointer so the eye can follow across a wide table */
table.t tr:hover td{background:var(--tint)}
table.t tr.total td{background:var(--tint);border-top:2px solid var(--green);color:var(--ink)}
/* loading: a thin bar along the top, the page stays put underneath */
.busybar{position:fixed;top:0;left:0;right:0;height:3px;z-index:70;overflow:hidden;opacity:0;transition:opacity .15s;pointer-events:none}
body.busy .busybar{opacity:1}
.busybar::before{content:"";position:absolute;top:0;bottom:0;width:35%;background:var(--green);animation:busy 1.1s ease-in-out infinite}
@keyframes busy{from{left:-35%}to{left:100%}}
body.busy main .content{opacity:.6;transition:opacity .2s .15s}
.boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--ink-3);font-size:14px}
.boot img{height:64px}
/* empty states say what would be here and offer the action that fills it */
.empty{display:flex;flex-direction:column;align-items:center;gap:8px}
.empty b{color:var(--ink);font-size:15px}
.empty .btn{margin-top:6px}
/* tile icons: one outline family, one weight */
.ico{width:22px;height:22px;flex:none}
.ico:not(.app){fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.st .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:#fff;color:var(--green);flex:none;margin-bottom:4px}
.st .ic .ico{width:30px;height:30px}
/* the day at a glance (key facts) */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);margin:0 0 26px}
.kpi{padding:12px 16px;background:var(--tint);border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:none}
.kpi span{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{display:block;font-size:26px;font-weight:600;color:var(--blue);line-height:1.25;font-variant-numeric:tabular-nums}
.kpi.warn{background:var(--red-50)} .kpi.warn b,.kpi.warn span{color:var(--red)}
.kpi .ico{width:14px;height:14px;stroke-width:2.2}
.jt .k{flex-wrap:wrap;justify-content:center}
.jt .k span.bad{background:#fff;color:var(--red);display:inline-flex;align-items:center;gap:4px}
.jt .k .ico{width:13px;height:13px;stroke-width:2.4}
/* needs attention list under the job tiles */
.attn{margin-top:34px}
.attn ul{list-style:none;margin:0;padding:0;border:1px solid var(--line)}
.attn li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.attn li:last-child{border-bottom:none}
.attn li:hover{background:var(--tint)}
.attn li .ico{width:18px;height:18px}
.attn li.red .ico{color:var(--red)} .attn li.amber .ico{color:var(--amber)}
.attn li .what{flex:1;color:var(--blue)} .attn li .what b{font-weight:600}

<body>
<div class="busybar" role="progressbar" aria-label="Loading"></div>
<div id="root"><div class="boot"><img src="logo.png" alt="Cheltenham Green Civils">Loading SiteHUB…</div></div>

<script>
/* =====================================================================
   SiteHUB admin console. Same sign-in and database as the app; everything
   added here is written in the app's own format, so it turns up on site.
   The database decides what each person may do — this page only shows it.
   ===================================================================== */
const SUPABASE_URL = "https://adgjfsntjexzpkdbqhyo.supabase.co";
const SUPABASE_KEY = "sb_publishable_XxqonAYENqZzKu_Ocwm8Xg_KEManc6q";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY,
  { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false } });

/* ---------------------------------------------------------- lists (= app) */
const PLANT_TYPES = ["Excavator","Dumper","Roller","Telehandler","Other"];
const LIFTING_TYPES = ["Single leg chain","2 leg chain","3 leg chain","4 leg chain","Chain sling","Webbing sling",
  "Round sling","Shackle","Lifting beam","Chain block","Lever hoist","Pipe grab","Manhole lifter","Vacuum lifter",
  "Strop","Excavator lifting eye","Quick hitch","Other"];
const TOOL_TYPES = ["Breaker","Disc cutter","Angle grinder","Whacker plate","Trench rammer","Concrete poker",
  "Floor saw","Hammer drill","Drill","Chainsaw","Strimmer","Cement mixer","Site saw","Generator","Compressor","Pump",
  "Lighting tower","Fuel bowser","Tool store","Welfare unit","Storage container","Ladder","Step ladder","Trestle","Other"];
const TRADES = ["Groundworker","Machine operator","Banksman","Pipelayer","Steel fixer","Concrete gang","Kerb layer",
  "Traffic management","Supervisor","Apprentice","Other"];
const OWNERS = ["Hired","Owned","Subcontractor"];
const DELIVERY_TYPES = ["Stone","Sand","Concrete","Materials","Tools","Plant","Misc"];
const DELIVERY_UNITS = { Stone:"tonnes", Sand:"tonnes", Concrete:"m³", Materials:"items", Tools:"items", Plant:"items", Misc:"items" };
const DELIVERY_LOADS = { Stone:20, Sand:20 };
const HS_FORMS = { toolboxtalk:"Toolbox Talk", briefing:"Daily Activities Briefing", excavation:"Excavation Inspection",
  havs:"HAVs Record", plantcheck:"Plant Inspection", loler:"LOLER Weekly Inspection", puwer:"PUWER Register" };
const DEFAULT_HOURS = { start:"07:30", finish:"17:00", breakMins:30 };
const WEEKDAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

/* ---------------------------------------------------------------- helpers */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c]);
const iso = d => { const x = new Date(d); return x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0") + "-" + String(x.getDate()).padStart(2,"0"); };
const today = () => iso(new Date());
const parse = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const weekStart = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const nice = s => { if(!s) return "—"; const d = parse(s); return d.toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" }); };
const short = s => { if(!s) return "—"; const d = parse(s); return d.toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short" }); };
const toMins = t => { if(!t || String(t).indexOf(":") < 0) return null; const [h,m] = String(t).split(":").map(Number); return h*60 + m; };
const durMins = v => !v ? 0 : (Number(v.h)||0)*60 + (Number(v.m)||0);
const hm = mins => { const h = Math.floor(mins/60), m = Math.round(mins%60); return (h ? h+"h" : "") + (h && m ? " " : "") + (m ? m+"m" : (h ? "" : "0m")); };
const round2 = n => Math.round(n*100)/100;
const newId = p => p + "_" + Date.now() + Math.random().toString(36).slice(2, 6);
const plural = (n, w) => n + " " + (n === 1 ? w : w === "person" ? "people" : /[^aeiou]y$/.test(w) ? w.slice(0, -1) + "ies" : w + "s");

function toast(msg, ms){
  const o = $(".toast"); if(o) o.remove();
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), ms || 3200);
}
function words(e){
  const m = String((e && (e.message || e.error_description)) || e || "");
  if(/row-level security|permission denied|42501/i.test(m)) return "You don't have permission to do that.";
  if(/failed to fetch|network/i.test(m)) return "No connection — try again.";
  if(/duplicate key/i.test(m)) return "That already exists.";
  return m || "Something went wrong.";
}
function modal(html, bind){
  const w = document.createElement("div"); w.className = "scrim";
  w.innerHTML = `<div class="dlg">${html}</div>`;
  const close = () => w.remove();
  w.addEventListener("mousedown", e => { if(e.target === w) close(); });
  document.body.appendChild(w);
  if(bind) bind(w.querySelector(".dlg"), close);
  const first = w.querySelector("input,select,textarea"); if(first) first.focus();
  return close;
}
function confirmBox(title, text, yes, onYes, danger){
  modal(`<h3>${esc(title)}</h3><p class="lead">${esc(text)}</p>
    <div class="acts"><button class="btn ghost" data-no>Cancel</button>
    <button class="btn ${danger === false ? "" : "danger"}" data-yes>${esc(yes)}</button></div>`, (d, close) => {
    d.querySelector("[data-no]").onclick = close;
    d.querySelector("[data-yes]").onclick = async () => { d.querySelector("[data-yes]").disabled = true; await onYes(); close(); };
  });
}

/* ------------------------------------------------------------ app state */
const S = { me:null, perms:{}, jobs:[], items:{}, team:null, roles:[], members:[] };
const can = (m, a) => S.perms[m + "." + a] || "";
const isAdmin = () => !!can("company_settings", "view");

/* ---------------------------------------------------------------- data */
async function loadMe(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return null;
  const { data:p, error } = await sb.from("profiles")
    .select("id, full_name, email, active, company_id, role:roles(key, name), company:companies(name)")
    .eq("id", session.user.id).maybeSingle();
  if(error) throw error;
  if(!p) return null;
  const { data:perms } = await sb.rpc("my_permissions");
  S.perms = {}; (perms || []).forEach(x => S.perms[x.module + "." + x.action] = x.scope);
  S.me = p;
  return p;
}
async function loadJobs(){
  const { data, error } = await sb.from("jobs").select("id, code, name, principal_contractor, address, start_date, end_date, status, created_at").order("created_at");
  if(error) throw error;
  S.jobs = (data || []).filter(j => j.status !== "deleted");      /* a deleted job only stays as a marker for phones */
}
const jobById = id => S.jobs.find(j => j.id === id);

/* every live item on a job, in the app's own shape */
async function loadItems(jobId, force){
  if(S.items[jobId] && !force) return S.items[jobId];
  const out = [];
  for(let from = 0; ; from += 1000){
    const { data, error } = await sb.from("job_items").select("kind, item_id, data, updated_at")
      .eq("job_id", jobId).eq("deleted", false).order("updated_at").range(from, from + 999);
    if(error) throw error;
    out.push(...(data || []));
    if(!data || data.length < 1000) break;
  }
  const by = { meta:{}, counters:null };
  out.forEach(r => {
    if(r.kind === "_meta"){ by.meta = r.data || {}; return; }
    if(r.kind === "_counters"){ by.counters = r.data; return; }
    (by[r.kind] = by[r.kind] || []).push(Object.assign({}, r.data, { id: r.data && r.data.id != null ? r.data.id : r.item_id }));
  });
  S.items[jobId] = by;
  return by;
}
const list = (jobId, kind) => ((S.items[jobId] || {})[kind]) || [];

/* write one item exactly as the app would */
async function saveItem(jobId, kind, item){
  const job = jobById(jobId);
  const data = Object.assign({}, item, { job: job ? job.name : item.job, updatedAt: Date.now() });
  const { error } = await sb.from("job_items").upsert([{ job_id:jobId, kind, item_id:String(data.id), data,
    deleted:false, client_stamp:Date.now() }], { onConflict:"job_id,kind,item_id" });
  if(error) throw error;
  const arr = (S.items[jobId][kind] = S.items[jobId][kind] || []);
  const i = arr.findIndex(x => String(x.id) === String(data.id));
  if(i >= 0) arr[i] = data; else arr.push(data);
}
async function deleteItem(jobId, kind, id){
  const old = (S.items[jobId][kind] || []).find(x => String(x.id) === String(id)) || { id };
  const { error } = await sb.from("job_items").upsert([{ job_id:jobId, kind, item_id:String(id),
    data:Object.assign({}, old, { updatedAt:Date.now() }), deleted:true, client_stamp:Date.now() }], { onConflict:"job_id,kind,item_id" });
  if(error) throw error;
  S.items[jobId][kind] = (S.items[jobId][kind] || []).filter(x => String(x.id) !== String(id));
}
async function saveMeta(jobId, meta){
  const { error } = await sb.from("job_items").upsert([{ job_id:jobId, kind:"_meta", item_id:"job", data:meta,
    deleted:false, client_stamp:Date.now() }], { onConflict:"job_id,kind,item_id" });
  if(error) throw error;
  S.items[jobId].meta = meta;
}

/* ------------------------------------------------------------ job maths */
const onSite = x => !x.offDate || x.offDate > today();
const isHired = x => (x.owner || "Hired") !== "Owned";
function examState(x){
  if(!x.examDate) return null;
  const left = daysBetween(today(), x.examDate);
  if(left < 0) return { cls:"red", label:"Exam overdue" };
  if(left <= 30) return { cls:"amber", label:"Exam due " + nice(x.examDate) };
  return { cls:"ok", label:"Exam " + nice(x.examDate) };
}
function weekOf(jobId){
  const meta = (S.items[jobId] || {}).meta || {};
  if(Array.isArray(meta.week) && meta.week.length === 7) return meta.week;
  const b = meta.hours || DEFAULT_HOURS;
  return WEEKDAYS.map((_, i) => ({ working:i < 5, start:b.start, finish:b.finish,
    breakMins:Number.isFinite(Number(b.breakMins)) ? Number(b.breakMins) : 30 }));
}
const dayIdx = s => (parse(s).getDay() + 6) % 7;
function dayHours(jobId, date){
  const d = weekOf(jobId)[dayIdx(date)];
  const a = toMins(d.start), b = toMins(d.finish);
  if(a == null || b == null) return 0;
  let m = b - a; if(m < 0) m += 1440; m -= Number(d.breakMins) || 0;
  return Math.max(0, round2(m/60));
}
function normalDayMins(jobId){
  const d = weekOf(jobId).find(x => x.working) || weekOf(jobId)[0];
  const a = toMins(d.start), b = toMins(d.finish);
  let m = (b - a) - (Number(d.breakMins) || 0);
  return m > 0 ? m : 540;
}
function rowHours(jobId, row, date){
  if(!row || row.onSite !== true) return 0;
  if(row.normal === true) return dayHours(jobId, date);
  const a = toMins(row.start), b = toMins(row.finish);
  if(a == null || b == null) return 0;
  let m = b - a; if(m < 0) m += 1440;
  const brk = Number(weekOf(jobId)[dayIdx(date)].breakMins);
  m -= Number.isFinite(brk) ? brk : 30;
  return Math.max(0, round2(m/60));
}
const diaries = jobId => list(jobId, "records").filter(r => (r.form || "diary") === "diary" && r.status === "submitted");
function delays(jobId){
  const out = [];
  diaries(jobId).forEach(r => (((r.data || {}).delayList) || []).forEach(x => {
    const mins = durMins(x.time);
    if(mins) out.push({ date:r.date, cause:x.cause || "Other", detail:x.detail || "", affected:x.affected || "", mins, counted:x.counted !== false });
  }));
  return out.sort((a, b) => b.date.localeCompare(a.date));
}
function timesheet(jobId, ws){
  const days = [0,1,2,3,4,5,6].map(i => addDays(ws, i));
  const people = {};
  days.forEach(d => {
    const rec = diaries(jobId).find(r => r.date === d);
    ((rec && rec.data && rec.data.labourTable) || []).forEach(row => {
      const key = row.id || row.name;
      if(!people[key]) people[key] = { name:row.name, trade:row.trade, days:{}, total:0 };
      if(row.leave){ people[key].days[d] = { leave:row.leave }; return; }
      if(row.onSite !== true) return;
      const h = rowHours(jobId, row, d);
      people[key].days[d] = { hours:h }; people[key].total += h;
    });
  });
  list(jobId, "tsHours").filter(e => days.includes(e.date)).forEach(e => {
    if(people[e.key] && people[e.key].days[e.date]) return;
    if(!people[e.key]) people[e.key] = { name:e.name, trade:e.trade, days:{}, total:0 };
    const a = toMins(e.start), b = toMins(e.finish);
    let m = (a == null || b == null) ? 0 : (b - a + (b < a ? 1440 : 0)) - (Number(e.breakMins) || 0);
    const h = m > 0 ? round2(m/60) : 0;
    people[e.key].days[e.date] = { hours:h, manual:true }; people[e.key].total += h;
  });
  return { days, people:Object.values(people).filter(p => p.total > 0 || Object.keys(p.days).length)
    .sort((a, b) => String(a.name).localeCompare(String(b.name))) };
}
const receivedTotal = d => (d.received || []).reduce((n, r) => n + (Number(r.qty) || 0), 0);
function deliveryState(d){
  if(d.cancelled) return { key:"cancelled", label:"Cancelled", cls:"" };
  const got = receivedTotal(d), want = Number(d.qty) || 0;
  if(want && got >= want) return { key:"complete", label:"Received", cls:"ok" };
  if(got > 0) return { key:"part", label:"Part received", cls:"amber" };
  if(d.dueDate && d.dueDate < today()) return { key:"overdue", label:"Overdue", cls:"red" };
  if(d.dueDate === today()) return { key:"today", label:"Due today", cls:"amber" };
  return { key:"booked", label:"Booked", cls:"" };
}
const hsRecords = jobId => list(jobId, "records").filter(r => HS_FORMS[r.form]);

/* ================================================================ screens */
const ICON = {
  dash:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>`,
  staff:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.6c2.6.2 4.6 1.9 5.3 4.9"/></svg>`,
  admin:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6L12 3z"/><path d="M8.8 12.2l2.2 2.2 4.3-4.6"/></svg>`
};

const SVG = p => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const TI = {
  /* the app's own Project tile icons (TILE_ICONS), so both look the same */
  plant: `<svg class="ico app" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"> <rect x="2.6" y="18.3" width="18.8" height="2.7" rx="1.35"/> <rect x="13.2" y="12.2" width="6.8" height="6.1" rx="1.1"/> <rect x="14.4" y="13.4" width="2.9" height="2.2" rx="0.4" stroke-width="1.1"/> <path d="M13.3 14 8.2 8.8"/> <path d="M8.2 8.8 5.3 13.9"/> <path d="M5.6 13.2 3.1 15.4l1.5 1.7L7 15z" fill="currentColor" stroke-width="1.2"/></svg>`,
  lifting: `<svg class="ico app" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v6"/> <path d="M12 9 8 15h8z"/><path d="M9 18h6"/><circle cx="12" cy="20.5" r="1.6"/></svg>`,
  delays: `<svg class="ico app" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12.5" r="8"/> <path d="M12 8v5l3 2M9 2.5h6"/></svg>`,
  deliveries: `<svg class="ico app" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7.5h10v9H3z"/> <path d="M13 11h4l3 3v2.5h-7z"/><circle cx="7" cy="18" r="1.8"/><circle cx="16.5" cy="18" r="1.8"/></svg>`,
  labour: `<svg class="ico app" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/> <path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 11a3 3 0 1 0-1.5-5.6"/><path d="M17 20a5.5 5.5 0 0 0-1.6-3.9"/></svg>`,
  timesheets: `<svg class="ico app" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>`,
  hs: `<svg class="ico app" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 7.5 12 4l8 3.5v9L12 20l-8-3.5z"/> <path d="M4 7.5 12 11l8-3.5M12 11v9"/></svg>`,
  hire: `<svg class="ico app" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1.4 1.4 0 0 1 0 2l-6.7 6.7a1.4 1.4 0 0 1-2 0z"/><circle cx="8" cy="8" r="1.6"/></svg>`,
  alert: SVG('<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>'),
  ok: SVG('<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>')
};
const HSI = {  /* H&S tiles: the app's icons where it has one (plant, tools, lifting, RAMS), the rest drawn to match */
  briefings: `<svg class="ico app" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4.5" width="14" height="16.5" rx="2"/><path d="M9 4.5V3h6v1.5"/><path d="M8.5 10h7M8.5 13.5h7M8.5 17h4"/></svg>`,

/* ------------------------------------------------------------ dashboard */
async function viewDashboard(){
  await loadJobs();
  const live = S.jobs.filter(j => j.status !== "archived");
  await Promise.all(live.map(j => loadItems(j.id, true)));
  const t = today(), ws = weekStart(t);
  /* everything the card needs about one job, worked out the same way as the job's own pages */
  const sum = j => {
    const id = j.id, plant = list(id, "plant").filter(onSite), lift = list(id, "lifting").filter(onSite);
    const hire = hireRows(id), dels = list(id, "deliveries");
    const lost = delays(id).filter(x => x.counted), lostWeek = lost.filter(x => x.date >= ws);
    const exams = plant.concat(lift).map(examState).filter(e => e && e.cls === "red").length;
    const late = dels.filter(d => deliveryState(d).key === "overdue").length;
    const due = dels.filter(d => deliveryState(d).key === "today").length;
    const cur = ramsCurrent(id), unsigned = ramsUnsigned(id).length;
    const meta = (S.items[id] || {}).meta || {}, start = j.start_date || meta.start || "", end = j.end_date || "";
    let prog = null;
    if(start && end && end > start){
      const total = daysBetween(start, end), gone = Math.min(total, Math.max(0, daysBetween(start, t)));
      prog = { pct:Math.round(gone / total * 100), week:Math.max(1, Math.ceil((gone + 1) / 7)), weeks:Math.max(1, Math.ceil(total / 7)), left:Math.max(0, daysBetween(t, end)), over:t > end };
    }
    const hs = hsOverdueCount(id);
    const flags = [];
    if(exams) flags.push(plural(exams, "exam") + " overdue");
    if(hs) flags.push(plural(hs, "H&S item") + " overdue");
    if(late) flags.push(plural(late, "delivery") + " late");
    if(cur && unsigned) flags.push(unsigned + " to sign RAMS");
    if(!cur) flags.push("No RAMS");
    if(prog && prog.over) flags.push("Past completion date");
    return { ops:list(id, "labour").filter(onSite).length, plant:plant.length, lift:lift.length,
      hireN:hire.reduce((n, r) => n + hireQty(r.x), 0), hireW:hire.reduce((n, r) => n + (hireWeekly(r.x) || 0), 0), hirePriced:hire.some(r => hireWeekly(r.x) != null),
      due, late, booked:dels.filter(d => !["complete","cancelled"].includes(deliveryState(d).key)).length,
      hrs:round2(timesheet(id, ws).people.reduce((n, p) => n + p.total, 0)),
      lostMins:lost.reduce((n, x) => n + x.mins, 0), lostWeekMins:lostWeek.reduce((n, x) => n + x.mins, 0), dayMins:normalDayMins(id),
      hs, exams, cur, unsigned, prog, flags };
  };
  const S2 = live.map(j => ({ j, s:sum(j) }));
  const tot = S2.reduce((a, { s }) => ({ ops:a.ops + s.ops, plant:a.plant + s.plant, hireN:a.hireN + s.hireN, hireW:a.hireW + s.hireW,
    exams:a.exams + s.exams, hs:a.hs + s.hs, due:a.due + s.due + s.late }), { ops:0, plant:0, hireN:0, hireW:0, exams:0, hs:0, due:0 });
  const cell = (label, value, sub, warn) => `<div class="jk${warn ? " warn" : ""}"><span>${label}</span><b>${value}</b>${sub ? `<em>${sub}</em>` : ""}</div>`;
  const days = m => !m ? "None" : m >= 540 ? round2(m / 540) + " days" : hm(m);
  const card = ({ j, s }) => {
    const ok = !s.flags.length;
    return `<a class="jc" href="#/job/${j.id}">
      <div class="jh"><div><span class="n">${esc(j.name)}</span><span class="m">${esc([j.code, j.principal_contractor].filter(Boolean).join(" · "))}</span></div>
        <span class="state ${ok ? "ok" : "warn"}">${ok ? TI.ok + "On track" : TI.alert + plural(s.flags.length, "thing") + " to look at"}</span></div>
      <div class="jb">
        <div class="jks">
          ${cell("Ops on site", s.ops)}
          ${cell("Plant on site", s.plant, s.lift ? s.lift + " lifting" : "")}
          ${cell("Live hire", s.hirePriced ? money(s.hireW) : s.hireN, s.hirePriced ? plural(s.hireN, "item") + " · per week" : plural(s.hireN, "item"))}
          ${cell("Deliveries", s.due + s.late ? (s.due + s.late) + " due" : s.booked + " booked", s.late ? s.late + " late" : s.due ? "today" : "", s.late)}
          ${cell("Hours", s.hrs, "this week")}
          ${cell("Delays", days(s.lostMins), s.lostWeekMins ? hm(s.lostWeekMins) + " this week" : "time lost", s.lostWeekMins > 0)}
          ${cell("H&amp;S overdue", s.hs, s.hs ? "to catch up" : "all up to date", s.hs)}
          ${cell("RAMS", s.cur ? "Rev " + esc(revText(s.cur)) : "None", s.cur ? (s.unsigned ? s.unsigned + " still to sign" : "everyone signed") : "upload one", !s.cur || s.unsigned)}
        </div>
        ${s.prog ? `<div class="jp"><div class="jpl"><span>Programme</span><b>${s.prog.over ? "Past completion — " + nice(j.end_date) : "Week " + s.prog.week + " of " + s.prog.weeks}</b>
            <em>${s.prog.over ? "" : s.prog.left + " days to completion"}</em></div>
          <div class="bar2"><i style="width:${s.prog.pct}%"></i></div></div>`
        : `<div class="jp"><div class="jpl"><span>Programme</span><em>${j.start_date ? "Started " + nice(j.start_date) + " — " : ""}add a completion date under Edit job details to track time used</em></div></div>`}
        ${s.flags.length ? `<div class="jf">${s.flags.map(f => `<span>${TI.alert}${esc(f)}</span>`).join("")}</div>` : ""}
      </div></a>`;
  };
  const kpi = (label, n, warn) => `<div class="kpi${warn && n ? " warn" : ""}"><span>${warn && n ? TI.alert : ""}${label}</span><b>${n}</b></div>`;
  const dateNow = new Date().toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
  return shell("dash", `
    <div class="title"><h1>Jobs</h1><span class="sub">${plural(live.length, "live job")}</span><span class="sp"></span>
      ${S.jobs.some(j => j.status === "archived") ? `<a class="lnk" href="#/archived">Archived jobs</a>` : ""}<span class="today">${dateNow}</span></div>
    ${live.length ? `<div class="kpis">${kpi("Live jobs", live.length)}${kpi("Ops on site", tot.ops)}${kpi("Machines on site", tot.plant)}${kpi("Live hire / week", money(tot.hireW))}${kpi("Exams overdue", tot.exams, true)}${kpi("H&amp;S overdue", tot.hs, true)}</div>` : ""}
    <div class="jobcards">
      ${S2.map(card).join("")}
      ${can("jobs", "create") ? `<button class="jt new" data-newjob><span class="plus">+</span><span class="n">Create new job</span></button>` : ""}
    </div>`);
}

      <span><button class="btn ghost" data-no>Cancel</button> <button class="btn" data-yes>${job ? "Save" : "Create job"}</button></span></div>`,
  (d, close) => {
    const val = k => d.querySelector(`[data-k="${k}"]`).value.trim();
    const err = t => { const e = d.querySelector(".err"); e.textContent = t; e.hidden = !t; };
    d.querySelector("[data-no]").onclick = close;
    const del = d.querySelector("[data-deljob]");
    if(del) del.onclick = () => { close(); deleteJobFlow(job); };
    d.querySelector("[data-yes]").onclick = async () => {
      const name = job ? job.name : val("name"), code = val("code");
      if(!name) return err("Give the job a name.");
      if(!code) return err("Give the job a number.");
      if(!job && S.jobs.some(j => j.name.trim().toLowerCase() === name.toLowerCase())) return err("There's already a job with that name.");
      const btn = d.querySelector("[data-yes]"); btn.disabled = true;
      try{
        const row = { code, principal_contractor:val("pc") || null, address:val("address") || null,
          start_date:val("start") || null, end_date:val("end") || null, status:val("status") };
        let id = job && job.id;
        if(job){
          const { error } = await sb.from("jobs").update(row).eq("id", id); if(error) throw error;
        } else {
          const { data, error } = await sb.from("jobs").insert(Object.assign({ name }, row)).select("id").single();
          if(error) throw error; id = data.id;
        }
        await loadItems(id, true);
        const m = Object.assign({}, S.items[id].meta || {});
        m.info = Object.assign({}, m.info || {}, { pc:val("pc"), address:val("address"), ref:code, theirRef:val("theirRef") });
        if(val("start")) m.start = val("start");
        await saveMeta(id, m);
        close(); toast(job ? "Job saved" : "Job created");
        await loadJobs(); route();
      }catch(e){ btn.disabled = false; err(words(e)); }
    };
  });
}

/* deleting a job created by mistake: two questions, the second needs the name typed */
async function deleteJobFlow(job){
  try{ await loadItems(job.id, true); }catch(e){}
  const by = S.items[job.id] || {}, n = k => (by[k] || []).length;
  const parts = [[n("records"), "record"], [n("plant") + n("lifting") + n("tools"), "plant or equipment entry"], [n("labour"), "person"],
    [n("deliveries"), "delivery"], [n("rams"), "RAMS revision"]].filter(([c]) => c).map(([c, w]) => plural(c, w) + (w === "person" ? " on the labour list" : ""));
  const busy = parts.length > 0;
  modal(`<h3>Delete ${esc(job.name)}?</h3>
    <p class="lead">${busy ? "This job has " + esc(parts.join(", ")) + ". Deleting it removes all of that for everyone, and it comes off every phone."
      : "Nothing has been recorded on this job yet. Deleting it removes it for everyone, and it comes off every phone."}</p>
    ${busy ? `<p class="lead" style="margin-top:-6px">If the job has simply finished, set its status to <b>Archived</b> instead — it's kept, just out of the way.</p>` : ""}
    <div class="acts" style="justify-content:space-between"><span>${busy ? `<button class="btn line sm" data-archive>Archive it instead</button>` : ""}</span>
      <span><button class="btn ghost" data-no>Keep the job</button> <button class="btn danger" data-yes>Yes, delete it</button></span></div>`, (d, close) => {
    d.querySelector("[data-no]").onclick = close;
    const ar = d.querySelector("[data-archive]");
    if(ar) ar.onclick = async () => { const { error } = await sb.from("jobs").update({ status:"archived" }).eq("id", job.id);
      if(error) return toast(words(error)); close(); toast(job.name + " archived"); location.hash = "#/"; route(); };
    d.querySelector("[data-yes]").onclick = () => { close(); deleteJobConfirm(job, busy); };
  });
}
function deleteJobConfirm(job, busy){
  modal(`<h3>Are you sure?</h3>
    <p class="lead">This can't be undone.${busy ? " Every record, photo link and register entry on the job is deleted." : ""} To confirm, type the job name exactly as it's shown:</p>
    <p style="margin:0 0 8px"><b>${esc(job.name)}</b></p>
    <div class="f"><input class="in" data-type autocomplete="off" spellcheck="false" placeholder="Type the job name"></div>
    <p class="err" hidden></p>
    <div class="acts"><button class="btn ghost" data-no>Cancel</button><button class="btn danger" data-yes disabled>Delete for good</button></div>`, (d, close) => {
    const inp = d.querySelector("[data-type]"), yes = d.querySelector("[data-yes]");
    const err = t => { const e = d.querySelector(".err"); e.textContent = t; e.hidden = !t; };
    inp.oninput = () => { yes.disabled = inp.value.trim().toLowerCase() !== job.name.trim().toLowerCase(); };
    d.querySelector("[data-no]").onclick = close;
    yes.onclick = async () => {
      yes.disabled = true; yes.textContent = "Deleting…";
      const { error } = await sb.rpc("delete_job", { p_job:job.id });
      if(error){ yes.textContent = "Delete for good"; yes.disabled = false;
        return err(/delete_job|function|schema cache/i.test(error.message || "") ? "Run 11_delete_job.sql in Supabase first to switch deleting on." : words(error)); }
      delete S.items[job.id];
      close(); toast(job.name + " deleted"); location.hash = "#/"; await loadJobs(); route();
    };
  });
}

/* ---------------------------------------------------------------- job */
async function viewJob(jobId){
  if(!S.jobs.length) await loadJobs();
  const job = jobById(jobId);
  if(!job) return shell("dash", `<p class="empty">That job can't be found, or you don't have access to it.</p>`);
  await loadItems(jobId, true);
  const plant = list(jobId, "plant").filter(onSite), lift = list(jobId, "lifting").filter(onSite);
  const tools = list(jobId, "tools").filter(onSite), labour = list(jobId, "labour").filter(onSite);
  const dels = list(jobId, "deliveries");
  const booked = dels.filter(d => !["complete","cancelled"].includes(deliveryState(d).key)).length;
  const received = dels.filter(d => deliveryState(d).key === "complete").length;
  const lostMins = delays(jobId).filter(x => x.counted).reduce((n, x) => n + x.mins, 0);
  const lostDays = round2(lostMins / normalDayMins(jobId));
  const hire = plant.concat(lift, tools).filter(isHired);
  const ts = timesheet(jobId, weekStart(today()));
  const tsHours = round2(ts.people.reduce((n, p) => n + p.total, 0));
  const tbts = hsRecords(jobId).filter(r => r.form === "toolboxtalk").length;
  const examFlag = arr => { const s = arr.map(examState).filter(Boolean);
    return s.some(x => x.cls === "red") ? `<span class="flag red">Exam overdue</span>` : s.some(x => x.cls === "amber") ? `<span class="flag amber">Exam due</span>` : ""; };
  const tile = (key, title, value, flag) => `<a class="st" href="#/job/${jobId}/${key}">${flag || ""}<span class="ic">${TI[key]}</span><span class="t">${title}</span><span class="v">${value}</span></a>`;
  const attn = [];
  [["plant","Plant"],["lifting","Lifting"]].forEach(([k]) => list(jobId, k).filter(onSite).forEach(x => { const e = examState(x);
    if(e && e.cls !== "ok") attn.push({ cls:e.cls, sort:x.examDate, href:k, tag:e.cls === "red" ? "Exam overdue" : "Exam due",
      what:`<b>${esc(x.item)}</b>${x.fleetNo || x.idNo ? " · " + esc(x.fleetNo || x.idNo) : ""}`, when:nice(x.examDate) }); }));
  dels.forEach(d => { const st = deliveryState(d);
    if(st.key === "overdue" || st.key === "today") attn.push({ cls:st.key === "overdue" ? "red" : "amber", sort:d.dueDate, href:"deliveries",
      tag:st.key === "overdue" ? "Delivery overdue" : "Delivery today",
      what:`<b>${esc(d.description || d.type)}</b>${d.supplier ? " from " + esc(d.supplier) : ""}`,
      when:short(d.dueDate) + (d.dueTime && d.dueTime !== "none" ? " " + esc(d.dueTime) : "") }); });
  attn.sort((a, b) => (a.cls === b.cls ? 0 : a.cls === "red" ? -1 : 1) || String(a.sort).localeCompare(String(b.sort)));
  return shell("dash", `
    <div class="crumbs"><a href="#/">Dashboard</a> › ${esc(job.name)}</div>
    <div class="jobbar">${esc(job.name)}<span class="ref">${esc([job.code, job.principal_contractor].filter(Boolean).join(" · "))}</span>
      <span class="sp"></span>${can("jobs", "edit") ? `<button class="lnk" data-editjob="${jobId}">Edit job details</button>` : ""}</div>
    <div class="sectiles">
      ${tile("plant", "Plant", plural(plant.length, "item"), examFlag(plant))}
      ${tile("lifting", "Lifting", plural(lift.length, "item"), examFlag(lift))}
      ${tile("delays", "Delays", lostMins ? (lostDays >= 1 ? lostDays + " days delayed" : hm(lostMins) + " lost") : "No delays")}
      ${tile("deliveries", "Deliveries", booked + " booked\n" + received + " received")}

function itemForm(jobId, key, item){
  const R = REG[key], isNew = !item;

      : `<input class="in" type="${type}" data-k="${id}" value="${esc(v[id] || "")}" placeholder="${esc(o.ph || "")}">`;

  modal(`<h3>${isNew ? "Add " + R.noun : "Edit " + R.noun}</h3>

/* ------------------------------------------------------------ live hire */
/* Hire is kept on the register it belongs to (plant, lifting or work
   equipment) so it also shows on site; these extra fields ride along:
   hireCompany = supplier, hireRef = contract number, qty, hireRate (£ per item
   per week) and weeklyCost (qty × rate). */
const HIRE_KINDS = [["tools","Work equipment"],["plant","Plant"],["lifting","Lifting gear"]];
const HIRE_MOD = { plant:"plant", lifting:"lifting", tools:"tools" };
const money = n => n === "" || n == null || !isFinite(Number(n)) ? "—" : "£" + Number(n).toLocaleString("en-GB", { minimumFractionDigits:2, maximumFractionDigits:2 });
const hireQty = x => { const q = Number(x.qty); return q > 0 ? q : 1; };
const hireWeekly = x => x.hireRate === "" || x.hireRate == null || !isFinite(Number(x.hireRate)) ? null : round2(hireQty(x) * Number(x.hireRate));
function hireRows(jobId){
  const rows = [];
  HIRE_KINDS.forEach(([k, l]) => list(jobId, k).filter(x => onSite(x) && isHired(x)).forEach(x => rows.push({ k, l, x })));
  return rows.sort((a, b) => String(a.x.hireCompany || "").localeCompare(String(b.x.hireCompany || "")) || String(a.x.onDate || "").localeCompare(String(b.x.onDate || "")));
}
/* one job's live hire as a table — used on the job page and the hire controller's screen */
function hireTable(jobId, rows, withTotal){
  const weekly = rows.reduce((n, r) => n + (hireWeekly(r.x) || 0), 0);
  const priced = rows.filter(r => hireWeekly(r.x) != null).length;
  return `<table class="t"><tr><th>Supplier</th><th>Item</th><th>Contract number</th><th>Date on hire</th>
        <th class="num">Quantity</th><th class="num">Rate</th><th class="num">Weekly cost</th><th></th></tr>
      ${rows.map(r => { const w = hireWeekly(r.x), key = jobId + "|" + r.k + "|" + esc(r.x.id); return `<tr><td>${esc(r.x.hireCompany || "—")}</td>
        <td><b>${esc(r.x.item)}</b><span class="sub2">${esc(r.l)}${r.x.fleetNo || r.x.idNo ? " · " + esc(r.x.fleetNo || r.x.idNo) : ""}</span></td>
        <td>${esc(r.x.hireRef || "—")}</td><td>${short(r.x.onDate)}<span class="sub2">${r.x.onDate ? plural(Math.max(0, daysBetween(r.x.onDate, today())), "day") + " on hire" : ""}</span></td>
        <td class="num">${hireQty(r.x)}</td><td class="num">${r.x.hireRate === "" || r.x.hireRate == null ? "—" : money(r.x.hireRate) + "<span class=\"sub2\">per week</span>"}</td>
        <td class="num"><b>${w == null ? "—" : money(w)}</b></td>
        <td class="acts">${can(HIRE_MOD[r.k], "edit") ? `<button class="lnk" data-edithire="${key}">Edit</button>
          <button class="lnk" data-hireoff="${key}">Off hire</button>` : ""}</td></tr>`; }).join("")}
      ${withTotal ? `<tr class="total"><td colspan="6"><b>Total per week</b>${priced < rows.length ? `<span class="sub2">${plural(rows.length - priced, "item")} without a rate</span>` : ""}</td>
        <td class="num"><b>${money(weekly)}</b></td><td></td></tr>` : ""}</table>`;
}
const canAddHire = () => HIRE_KINDS.some(([k]) => can(HIRE_MOD[k], "create"));
function hireView(jobId){
  const job = jobById(jobId), rows = hireRows(jobId);
  const weekly = rows.reduce((n, r) => n + (hireWeekly(r.x) || 0), 0);
  const suppliers = new Set(rows.map(r => r.x.hireCompany || "Not set")).size;
  return shell("dash", `
    <div class="crumbs"><a href="#/">Dashboard</a> › <a href="#/job/${jobId}">${esc(job.name)}</a> › Live hire</div>
    <div class="title"><h1>Live hire</h1><span class="sub">Everything hired in and still on site</span><span class="sp"></span>
      ${canAddHire() ? `<button class="btn" data-addhire="${jobId}">+ Add hire item</button>` : ""}</div>
    <div class="stats"><div class="stat"><span>Items on hire</span><b>${rows.reduce((n, r) => n + hireQty(r.x), 0)}</b></div>
      <div class="stat"><span>Suppliers</span><b>${suppliers}</b></div>
      <div class="stat"><span>Weekly cost</span><b>${money(weekly)}</b></div></div>
    <div class="panel">${rows.length ? hireTable(jobId, rows, true)
      : emptyState("Nothing on hire", "Add what's been hired in — it also shows on the right register in the app.",
          canAddHire() ? `<button class="btn" data-addhire="${jobId}">+ Add hire item</button>` : "")}</div>`);
}
/* the hire controller's whole world: live hire on every job */
let hireFind = "";
async function viewHireAll(){
  await loadJobs();
  const live = S.jobs.filter(j => j.status !== "archived");
  await Promise.all(live.map(j => loadItems(j.id, true)));
  const q = hireFind.trim().toLowerCase();
  const match = r => !q || [r.x.hireCompany, r.x.item, r.x.hireRef, r.l].some(v => String(v || "").toLowerCase().includes(q));
  const per = live.map(j => ({ j, rows:hireRows(j.id).filter(match) }));
  const all = per.flatMap(p => p.rows);
  const weekly = all.reduce((n, r) => n + (hireWeekly(r.x) || 0), 0);
  const jobWeekly = rows => rows.reduce((n, r) => n + (hireWeekly(r.x) || 0), 0);
  return shell("hire", `
    <div class="title"><h1>Live hire</h1><span class="sub">Every job</span><span class="sp"></span>
      <input class="in" style="max-width:280px" type="search" placeholder="Search supplier, item or contract" data-hirefind value="${esc(hireFind)}"></div>
    <div class="stats">${stat("Items on hire", all.reduce((n, r) => n + hireQty(r.x), 0))}${stat("Weekly cost", money(weekly))}
      ${stat("Suppliers", new Set(all.map(r => r.x.hireCompany || "Not set")).size)}${stat("Jobs with hire", per.filter(p => p.rows.length).length)}</div>
    ${per.length ? per.filter(p => p.rows.length || !q).map(p => `<div class="panel"><h2>${esc(p.j.name)}<span class="note">${esc([p.j.code, p.j.principal_contractor].filter(Boolean).join(" · "))}</span>
        <span class="sp"></span>${p.rows.length ? `<span class="note">${money(jobWeekly(p.rows))} / week</span>` : ""}
        ${canAddHire() ? `<button class="btn sm" data-addhire="${p.j.id}">+ Add hire item</button>` : ""}</h2>
      ${p.rows.length ? hireTable(p.j.id, p.rows, false) : `<p class="fn" style="margin:0 2px 6px">Nothing on hire on this job.</p>`}</div>`).join("")
      || emptyState("Nothing matches “" + hireFind + "”", "Try a supplier, an item or a contract number.")
    : emptyState("No live jobs yet", "Jobs set up by the office show here.")}`);
}

  (d, close) => {
    const k = n => d.querySelector(`[data-k="${n}"]`);

function delaysView(jobId){
  const job = jobById(jobId), all = delays(jobId);
  const counted = all.filter(x => x.counted), mins = counted.reduce((n, x) => n + x.mins, 0);

/* ------------------------------------------------- health & safety + library */
/* The rules for what's due follow the app: daily forms are chased on working
   days from the day the form was first used; weekly forms on their day of the
   week (toolbox talk Monday, PUWER and LOLER Friday); an excavation inspection
   is due the morning after a diary says it was left open. */
const HS_WEEKLY_DAY = { toolboxtalk:0, puwer:4, loler:4 };
const HS_LOOKBACK = 60;
const recsOf = (jobId, form) => list(jobId, "records").filter(r => r.form === form);
const doneRecs = (jobId, form) => recsOf(jobId, form).filter(r => r.status === "submitted");
const isWorkingDay = (jobId, d) => !!weekOf(jobId)[dayIdx(d)].working;
const jobStart = jobId => { const m = (S.items[jobId] || {}).meta || {}, j = jobById(jobId) || {}; return m.start || j.start_date || ""; };
function firstDone(jobId, form){
  const ds = doneRecs(jobId, form).map(r => r.date).filter(Boolean).sort();
  return ds[0] || null;
}
/* working days from `from` up to and including `to`, newest first, capped */
function workingDays(jobId, from, to){
  const out = []; let d = to;
  for(let i = 0; i < HS_LOOKBACK && d >= from; i++, d = addDays(d, -1)) if(isWorkingDay(jobId, d)) out.push(d);
  return out;
}
const byNewest = (a, b) => String(b.date || "").localeCompare(String(a.date || "")) || (b.submittedAt || 0) - (a.submittedAt || 0);
const statusPill = r => `<span class="pill ${r.status === "submitted" ? "ok" : "amber"}">${r.status === "submitted" ? "Done" : "In progress"}</span>`;

/* daily: briefing ------------------------------------------------------ */
function dailyDue(jobId, form){
  const from = [firstDone(jobId, form), jobStart(jobId)].filter(Boolean).sort().pop();
  const t = today(), done = new Set(doneRecs(jobId, form).map(r => r.date));
  const overdue = firstDone(jobId, form) && from ? workingDays(jobId, from, addDays(t, -1)).filter(d => !done.has(d)) : [];
  const dueToday = isWorkingDay(jobId, t) && !done.has(t);
  return { overdue, dueToday, started:!!firstDone(jobId, form) };
}
/* plant inspections: one per machine on site per working day (paper sheets
   scanned in for the week count too) ------------------------------------- */
function plantOnDay(jobId, d){ return list(jobId, "plant").filter(p => (!p.onDate || p.onDate <= d) && (!p.offDate || p.offDate > d)); }
function plantDue(jobId){
  const firstScan = list(jobId, "scans").filter(x => x.plantId).map(x => x.week).filter(Boolean).sort()[0];
  const first = [firstDone(jobId, "plantcheck"), firstScan].filter(Boolean).sort()[0];
  const from = [first, jobStart(jobId)].filter(Boolean).sort().pop();
  const t = today();
  const checked = new Set(doneRecs(jobId, "plantcheck").map(r => r.date + "|" + r.plantId));
  const paper = new Set(list(jobId, "scans").filter(x => x.plantId).map(x => x.week + "|" + x.plantId));
  const ok = (d, m) => checked.has(d + "|" + m.id) || paper.has(weekStart(d) + "|" + m.id);
  const overdue = [];
  if(first) workingDays(jobId, from, addDays(t, -1)).forEach(d => plantOnDay(jobId, d).forEach(m => { if(!ok(d, m)) overdue.push({ date:d, m }); }));
  const dueToday = isWorkingDay(jobId, t) ? plantOnDay(jobId, t).filter(m => !ok(t, m)) : [];
  return { overdue, dueToday, started:!!first };
}
/* excavations: what the latest diary left open, and inspections missed --- */
function diaryOn(jobId, d){ return list(jobId, "records").find(r => (r.form || "diary") === "diary" && r.status === "submitted" && r.date === d); }
function openList(diary){
  if(!diary || !diary.data || diary.data.excavationsOpen !== true) return [];
  return (Array.isArray(diary.data.excavationList) ? diary.data.excavationList : []).filter(x => x && x.ref);
}
function prevWorkingDay(jobId, d){ let p = addDays(d, -1); for(let i = 0; i < 10 && !isWorkingDay(jobId, p); i++) p = addDays(p, -1); return p; }
function excDue(jobId){
  const t = today(), start = jobStart(jobId) || addDays(t, -HS_LOOKBACK);
  const done = new Set(doneRecs(jobId, "excavation").map(r => r.date + "|" + (r.excRef || (r.data || {}).ref || "")));
  const missed = [];
  workingDays(jobId, start, addDays(t, -1)).forEach(d => openList(diaryOn(jobId, prevWorkingDay(jobId, d)))
    .forEach(x => { if(!done.has(d + "|" + x.ref)) missed.push({ date:d, ref:x.ref, location:x.location || "" }); }));
  const latest = list(jobId, "records").filter(r => (r.form || "diary") === "diary" && r.status === "submitted" && r.date <= t).sort(byNewest)[0];
  const open = openList(latest).map(x => Object.assign({}, x, { since:latest.date }));
  const todayDue = isWorkingDay(jobId, t) ? openList(diaryOn(jobId, prevWorkingDay(jobId, t))).filter(x => !done.has(t + "|" + x.ref)) : [];
  const unsafe = doneRecs(jobId, "excavation").filter(r => (r.data || {}).safe === false);
  return { missed, open, todayDue, unsafe };
}
/* weekly: toolbox talk, PUWER, LOLER ------------------------------------- */
function weeklyDue(jobId, form){
  const t = today(), first = firstDone(jobId, form), day = HS_WEEKLY_DAY[form] || 0;
  const doneWeeks = new Set(doneRecs(jobId, form).map(r => weekStart(r.date)));
  const overdue = [];
  let ws = first ? weekStart([first, jobStart(jobId)].filter(Boolean).sort().pop()) : weekStart(t);
  for(let i = 0; i < 52 && ws <= weekStart(t); i++, ws = addDays(ws, 7)){
    const due = addDays(ws, day);
    if(due < t && !doneWeeks.has(ws) && (first || ws === weekStart(t))) overdue.push({ week:ws, due });
  }
  const dueNow = addDays(weekStart(t), day) === t && !doneWeeks.has(weekStart(t));
  return { overdue, dueNow, doneThisWeek:doneWeeks.has(weekStart(t)) };
}

const ramsCurrent = jobId => ramsAll(jobId).find(r => r.status === "current") || null;

const readDataUrl = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
async function shaHex(v){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 40);
}
const EXT = { "application/pdf":"pdf", "image/jpeg":"jpg", "image/png":"png", "image/webp":"webp" };
async function uploadJobFile(jobId, file){
  if(file.size > 20 * 1024 * 1024) throw new Error(file.name + " is over 20 MB — please make it smaller.");
  const url = await readDataUrl(file);
  const type = url.slice(5, url.indexOf(";")), ext = EXT[type];
  if(!ext) throw new Error(file.name + " needs to be a PDF or a photo.");
  const path = S.me.company_id + "/" + jobId + "/" + (await shaHex(url)) + "." + ext;
  const { error } = await sb.storage.from("job-photos").upload(path, file, { contentType:type, upsert:false });
  if(error && !/exists|duplicate/i.test(error.message || "")) throw error;
  const doc = { src:"sbimg:" + path, name:file.name, scannedAt:Date.now() };
  if(ext === "pdf") doc.pdf = true;
  return doc;
}
async function openDoc(doc){
  if(!doc || !doc.src) return toast("No document attached.");
  const w = window.open("about:blank", "_blank");
  let href = doc.src;
  try{
    if(href.indexOf("sbimg:") === 0){
      const { data, error } = await sb.storage.from("job-photos").createSignedUrl(href.slice(6), 300);
      if(error || !data) throw error || new Error("missing");
      href = data.signedUrl;
    } else if(href.indexOf("data:") === 0){
      href = URL.createObjectURL(await (await fetch(href)).blob());
    }
    if(w) w.location = href; else location.href = href;
  }catch(e){ if(w) w.close(); toast("That document couldn't be opened — " + words(e)); }
}
function bindDocs(find){

        if(error){ btn.disabled = false; return err(/category/i.test(error.message) ? "Run 09_hs.sql in Supabase first to switch categories on." : words(error)); }
        close(); toast("Saved"); await loadLibrary(); return route();
      }
      const f = fileIn.files[0];
      if(!f) return err("Choose the PDF.");
      if(!/pdf$/i.test(f.type) && !/\.pdf$/i.test(f.name)) return err("That isn't a PDF.");
      if(f.size > 20 * 1024 * 1024) return err("That PDF is over 20 MB — please make it smaller.");
      btn.disabled = true; btn.textContent = "Uploading…";
      const path = S.me.company_id + "/" + (crypto.randomUUID ? crypto.randomUUID() : newId("tbt")) + ".pdf";
      try{
        const u = await sb.storage.from("company-library").upload(path, f, { contentType:"application/pdf", upsert:false });
        if(u.error) throw u.error;
        let { error } = await sb.from("tbt_library").insert(Object.assign({}, row, { file_path:path, file_name:f.name, size_bytes:f.size }));
        if(error && /category/i.test(error.message || "")){ delete row.category;
          ({ error } = await sb.from("tbt_library").insert(Object.assign({}, row, { file_path:path, file_name:f.name, size_bytes:f.size }))); }
        if(error){ await sb.storage.from("company-library").remove([path]); throw error; }
        close(); toast("Added to the library"); await loadLibrary(); route();
      }catch(e){ btn.disabled = false; btn.textContent = "Upload"; err(words(e)); }
    };
  });
}

  if(key === "briefings"){ const s = dailyDue(jobId, "briefing"); return { v:plural(n("briefing"), "briefing"), flag:late(s.overdue.length, "overdue") || (s.dueToday ? { cls:"amber", label:"Due today" } : null) }; }

    flag:late(s.missed.length, "missed") || (s.unsafe.length ? { cls:"red", label:s.unsafe.length + " not safe" } : s.todayDue.length ? { cls:"amber", label:"Due today" } : null) }; }
  if(key === "havs"){ const ws = weekStart(today()); const c = doneRecs(jobId, "havs").filter(r => weekStart(r.date) === ws).length; return { v:plural(c, "record") + " this week" }; }
  if(key === "plant"){ const s = plantDue(jobId); return { v:plural(n("plantcheck"), "inspection"), flag:late(s.overdue.length, "overdue") || (s.dueToday.length ? { cls:"amber", label:s.dueToday.length + " due today" } : null) }; }
  if(["puwer","loler"].includes(key)){ const s = weeklyDue(jobId, key); return { v:plural(n(key), "week") + " done", flag:late(s.overdue.length, "overdue") || (s.dueNow ? { cls:"amber", label:"Due today" } : null) }; }
  if(key === "toolbox"){ const s = weeklyDue(jobId, "toolboxtalk"); return { v:plural(n("toolboxtalk"), "talk"), flag:late(s.overdue.length, "overdue") || (s.dueNow ? { cls:"amber", label:"Due today" } : null) }; }

/* 3. HAVs */
let havsWeek = null;
const havsPts = (a, hrs) => Math.round(2 * (Number(a) || 0) * (Number(a) || 0) * hrs);
const durH = v => !v ? 0 : typeof v === "number" ? v : (Number(v.h) || 0) + (Number(v.m) || 0) / 60;
const ptsCls = p => p >= 400 ? "red" : p >= 100 ? "amber" : "ok";
function hsHavs(jobId){
  havsWeek = havsWeek || weekStart(today());
  const days = [0,1,2,3,4,5,6].map(i => addDays(havsWeek, i));
  const recs = recsOf(jobId, "havs").filter(r => days.includes(r.date)).sort(byNewest);
  const ops = {};
  recs.filter(r => r.status === "submitted").forEach(r => (((r.data || {}).entries) || []).forEach(e => {
    if(!e || !e.operative) return;
    const o = ops[e.operative] = ops[e.operative] || { name:e.operative, days:{}, max:0 };
    o.days[r.date] = (o.days[r.date] || 0) + havsPts(e.magnitude, durH(e.triggerTime));
    o.max = Math.max(o.max, o.days[r.date]);
  }));
  const people = Object.values(ops).sort((a, b) => b.max - a.max);
  const over = c => people.filter(p => p.max >= c).length;
  const recMax = r => { const by = {}; (((r.data || {}).entries) || []).forEach(e => { if(e && e.operative) by[e.operative] = (by[e.operative] || 0) + havsPts(e.magnitude, durH(e.triggerTime)); }); return Math.max(0, ...Object.values(by)); };
  return shell("dash", hsHead(jobId, "HAVs Records", "Hand-arm vibration — points per operative per day (EAV 100, ELV 400)") + `
    <div class="bar"><button class="btn line sm" data-havsw="-7">‹ Previous</button><b style="font-size:15px">Week commencing ${nice(havsWeek)}</b>
      <button class="btn line sm" data-havsw="7">Next ›</button></div>
    <div class="stats">${stat("Records", recs.filter(r => r.status === "submitted").length)}${stat("Operatives", people.length)}${stat("Over EAV", over(100), true)}${stat("Over ELV", over(400), true)}</div>
    <div class="panel"><h2>Exposure by operative</h2>${people.length ? `<table class="t"><tr><th>Operative</th>${days.map((d, i) => `<th class="num">${WEEKDAYS[i]} ${parse(d).getDate()}</th>`).join("")}<th class="num">Highest</th></tr>
      ${people.map(p => `<tr><td><b>${esc(p.name)}</b></td>${days.map(d => `<td class="num">${p.days[d] == null ? "" : `<span class="pill ${ptsCls(p.days[d])}">${p.days[d]}</span>`}</td>`).join("")}
        <td class="num"><b>${p.max}</b></td></tr>`).join("")}</table>`
      : emptyState("No HAVs records this week", "HAVs records are only needed on days vibrating tools are used.")}</div>
    <div class="panel"><h2>Records this week</h2>${recs.length ? `<table class="t"><tr><th>Date</th><th>Ref</th><th>Supervisor</th><th class="num">Entries</th><th class="num">Highest exposure</th><th>Status</th></tr>
      ${recs.map(r => { const d = r.data || {}, m = recMax(r); return `<tr><td>${short(r.date)}</td><td>${esc(r.ref || "—")}</td><td>${esc(d.supervisor || "—")}</td>
        <td class="num">${(d.entries || []).length}</td><td class="num">${m ? `<span class="pill ${ptsCls(m)}">${m} points</span>` : "—"}</td><td>${statusPill(r)}</td></tr>`; }).join("")}</table>`
      : emptyState("Nothing this week", "")}</div>
    ${havsToolsPanel()}`);
}

/* 5–6. PUWER / LOLER (weekly) */
function hsWeekly(jobId, form){

/* ------------------------------------------------- company plant (fleet) */
/* Owned kit is kept once, here. Allocating it to a job adds it to that job's
   register exactly as the app would (with fleetId pointing back); moving it
   off-hires it on the old job and adds it to the new one, so every job keeps
   its own history and the app needs nothing new. */
const FLEET_KINDS = [["plant","Plant","machine"],["lifting","Lifting gear","item"],["tools","Work equipment","item"]];
const FLEET_TYPES = { plant:PLANT_TYPES, lifting:LIFTING_TYPES, tools:TOOL_TYPES };
const FLEET_PREFIX = { plant:"pl", lifting:"lf", tools:"tl" };
let FLEET = null, fleetKind = "plant", fleetFind = "", fleetWhere = "all";
async function loadFleet(){
  const { data, error } = await sb.from("fleet_items").select("*").eq("archived", false).order("item");
  FLEET = error ? { error:/fleet_items|relation|schema cache/i.test(error.message || "") ? "Run 10_fleet.sql in Supabase to switch the company plant register on." : words(error), items:[] } : { items:data || [] };
  return FLEET;
}
/* where everything is: every owned entry on every live job's registers */
let FLOC = null;
async function loadFleetLocations(){
  if(!S.jobs.length) await loadJobs();
  const live = S.jobs.filter(j => j.status !== "archived"), rows = [];
  if(live.length) for(let from = 0; ; from += 1000){
    const { data, error } = await sb.from("job_items").select("job_id, kind, item_id, data").in("kind", ["plant","lifting","tools"])
      .eq("deleted", false).in("job_id", live.map(j => j.id)).range(from, from + 999);
    if(error) throw error;
    rows.push(...(data || []));
    if(!data || data.length < 1000) break;
  }
  const at = {}, history = {}, loose = [];
  rows.forEach(r => {
    const x = Object.assign({}, r.data, { id:(r.data || {}).id != null ? r.data.id : r.item_id });
    const e = { jobId:r.job_id, kind:r.kind, x };
    if(x.fleetId){
      (history[x.fleetId] = history[x.fleetId] || []).push(e);
      if(onSite(x)) at[x.fleetId] = e;
    } else if(x.owner === "Owned" && onSite(x)) loose.push(e);
  });
  Object.values(history).forEach(h => h.sort((a, b) => String(b.x.onDate || "").localeCompare(String(a.x.onDate || ""))
    || String(b.x.offDate || "9999").localeCompare(String(a.x.offDate || "9999"))));
  FLOC = { at, history, loose };
  return FLOC;
}
const fleetNoOf = x => x.fleetNo || x.idNo || "";
function fleetToJobItem(f, jobId, date){
  const base = { item:f.item, owner:"Owned", onDate:date, offDate:"", fleetId:f.id };
  const job = jobById(jobId);
  if(f.kind === "plant") Object.assign(base, { fleetNo:f.fleet_no || "", model:f.make_model || "", type:f.type || "Other", examDate:f.exam_date || "" });
  if(f.kind === "lifting") Object.assign(base, { idNo:f.fleet_no || "", type:f.type || "Other", swl:f.swl || "", examDate:f.exam_date || "" });
  if(f.kind === "tools") Object.assign(base, { idNo:f.fleet_no || "", type:f.type || "Other" });
  return Object.assign({ id:newId(FLEET_PREFIX[f.kind]), job:job ? job.name : "" }, base);
}
async function fleetAllocate(f, jobId, date){
  const cur = FLOC.at[f.id];
  if(cur && cur.jobId === jobId) throw new Error("It's already on that job.");
  if(cur){ await loadItems(cur.jobId); await saveItem(cur.jobId, cur.kind, Object.assign({}, cur.x, { offDate:date })); }
  await loadItems(jobId);
  await saveItem(jobId, f.kind, fleetToJobItem(f, jobId, date));
}
async function fleetReturn(f, date){
  const cur = FLOC.at[f.id]; if(!cur) return;
  await loadItems(cur.jobId);
  await saveItem(cur.jobId, cur.kind, Object.assign({}, cur.x, { offDate:date }));
}
/* keep the job's copy in step when the company record is edited */
async function fleetSyncCurrent(f){
  const cur = FLOC.at[f.id]; if(!cur) return;
  const fresh = fleetToJobItem(f, cur.jobId, cur.x.onDate);
  const keep = { id:cur.x.id, onDate:cur.x.onDate, offDate:cur.x.offDate || "" };
  await loadItems(cur.jobId);
  await saveItem(cur.jobId, cur.kind, Object.assign({}, cur.x, fresh, keep));
}

  await Promise.all([loadFleet(), loadJobs()]);
  await loadFleetLocations();
  const manage = k => can(k === "lifting" ? "lifting" : k === "tools" ? "tools" : "plant", "manage") === "all";
  const [kk, label, noun] = FLEET_KINDS.find(k => k[0] === fleetKind);

    .filter(f => fleetWhere === "all" || (fleetWhere === "yard" ? !FLOC.at[f.id] : !!FLOC.at[f.id]));
  const onJob = mine.filter(f => FLOC.at[f.id]).length;

  const loose = FLOC.loose.filter(e => e.kind === fleetKind);

async function fleetImport(){
  const loose = FLOC.loose.filter(e => e.kind === fleetKind);
  let made = 0, linked = 0;
  for(const e of loose){
    const no = fleetNoOf(e.x);
    let f = no && FLEET.items.find(i => i.kind === e.kind && String(i.fleet_no || "").toLowerCase() === no.toLowerCase());
    if(!f){
      const row = { kind:e.kind, item:e.x.item || "Item", fleet_no:no || null, make_model:e.x.model || null, type:e.x.type || null, swl:e.x.swl || null, exam_date:e.x.examDate || null };
      const { data, error } = await sb.from("fleet_items").insert(row).select().single();
      if(error) throw error;
      f = data; FLEET.items.push(f); made++;
    } else linked++;
    await loadItems(e.jobId);
    await saveItem(e.jobId, e.kind, Object.assign({}, e.x, { fleetId:f.id }));
  }
  return { made, linked };
}
