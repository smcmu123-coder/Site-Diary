/* ------------------------------------------------- staff allocation */
/* Allocating someone puts them on the job's labour register (the same list
   site uses for diaries and timesheets), linked back by staffId. Moving them
   from a date takes them off the old job that day and onto the new one, so
   each job keeps its own history and the calendar reads straight off it. */
let WORKERS = null, ALLOC = null, staffShow = "all", staffFind = "";
async function loadWorkers(){
  const { data, error } = await sb.from("workers").select("*").eq("archived", false).order("name");
  WORKERS = error ? { error:/workers|relation|schema cache/i.test(error.message || "") ? "Run 12_staff.sql in Supabase to add people without a login." : words(error), items:[] } : { items:data || [] };
  return WORKERS;
}
async function loadAllocations(){
  await loadJobs();
  const live = S.jobs.filter(j => j.status !== "archived"), rows = [];
  if(live.length) for(let from = 0; ; from += 1000){
    const { data, error } = await sb.from("job_items").select("job_id, item_id, data").eq("kind", "labour")
      .eq("deleted", false).in("job_id", live.map(j => j.id)).range(from, from + 999);
    if(error) throw error;
    rows.push(...(data || []));
    if(!data || data.length < 1000) break;
  }
  const by = {};
  rows.forEach(r => { const x = Object.assign({}, r.data, { id:(r.data || {}).id != null ? r.data.id : r.item_id });
    if(x.staffId) (by[x.staffId] = by[x.staffId] || []).push({ jobId:r.job_id, x }); });
  Object.values(by).forEach(a => a.sort((p, q) => String(p.x.onDate || "").localeCompare(String(q.x.onDate || ""))));
  ALLOC = { by };
  return ALLOC;
}
const isOn = (x, d) => (!x.onDate || x.onDate <= d) && (!x.offDate || x.offDate > d);
const allocNow = id => (ALLOC.by[id] || []).find(e => isOn(e.x, today())) || null;
function allocNext(id){
  const t = today(), cur = allocNow(id);
  const nxt = (ALLOC.by[id] || []).find(e => e.x.onDate > t);
  if(nxt) return { date:nxt.x.onDate, jobId:nxt.jobId };
  if(cur && cur.x.offDate) return { date:cur.x.offDate, jobId:null };
  return null;
}

function staffPeople(){
  const co = ((S.me || {}).company || {}).name || "";
  const users = (S.team || []).filter(p => p.role_key !== "hire_controller").map(p => ({ id:p.id, user:true, name:p.full_name || p.email, trade:p.role_name || "",
    company:co, email:p.email || "", phone:"", roleKey:p.role_key, active:p.active, joined:p.joined, roleName:p.role_name, raw:p }));
  const others = (WORKERS ? WORKERS.items : []).map(w => ({ id:w.id, user:false, name:w.name, trade:w.trade || "", company:w.employer || co,
    email:w.email || "", phone:w.phone || "", raw:w }));
  return users.concat(others);
}
async function allocMove(person, jobId, date){
  for(const e of (ALLOC.by[person.id] || [])){
    const on = e.x.onDate || "", off = e.x.offDate || "";
    await loadItems(e.jobId);
    if(on >= date) await deleteItem(e.jobId, "labour", e.x.id);                      /* planned from then on — replaced */
    else if(!off || off > date) await saveItem(e.jobId, "labour", Object.assign({}, e.x, { offDate:date }));
  }
  if(!jobId) return;
  await loadItems(jobId);
  await saveItem(jobId, "labour", { id:newId("lb"), name:person.name, trade:person.trade, company:person.company,
    phone:person.phone, email:person.email, onDate:date, offDate:"", staffId:person.id });
  /* a SiteHUB user also needs the job in their app */
  if(person.user && !SEES_ALL.includes(person.roleKey) && !jobsOf(person.id).includes(jobId)){
    const jr = ["contracts_manager","project_manager","site_manager","operative"].includes(person.roleKey) ? person.roleKey : "viewer";
    const { error } = await sb.from("job_members").insert([{ job_id:jobId, user_id:person.id, job_role:jr }]);
    if(error && !/duplicate/i.test(error.message || "")) throw new Error("Allocated, but their app access to the job couldn't be added: " + words(error));
    S.members.push({ job_id:jobId, user_id:person.id });
  }
}

/* ------------------------------------------------- job labour calendar */
let calMonth = null;
function labourCalendar(jobId){
  const job = jobById(jobId);
  calMonth = calMonth || today().slice(0, 7);
  const [y, m] = calMonth.split("-").map(Number);
  const first = calMonth + "-01", days = new Date(y, m, 0).getDate(), last = calMonth + "-" + String(days).padStart(2, "0");
  const startGrid = weekStart(first), endGrid = addDays(weekStart(last), 6);
  const people = list(jobId, "labour");
  const on = d => people.filter(p => isOn(p, d)).sort((a, b) => String(a.name).localeCompare(String(b.name)));
  const work = d => !!weekOf(jobId)[dayIdx(d)].working;
  const cells = []; for(let d = startGrid; d <= endGrid; d = addDays(d, 1)) cells.push(d);
  const inMonth = cells.filter(d => d >= first && d <= last && work(d));
  const counts = inMonth.map(d => on(d).length);
  const names = new Set(); inMonth.forEach(d => on(d).forEach(p => names.add(p.name)));
  const monthName = new Date(y, m - 1, 1).toLocaleDateString("en-GB", { month:"long", year:"numeric" });
  const mv = n => { const dt = new Date(y, m - 1 + n, 1); return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0"); };
  return shell("dash", `
    <div class="crumbs"><a href="#/">Dashboard</a> › <a href="#/job/${jobId}">${esc(job.name)}</a> › Labour</div>
    <div class="title"><h1>Labour</h1><span class="sub">Who's on site each working day</span><span class="sp"></span>
      <div class="seg"><a class="segl" href="#/job/${jobId}/labour">Register</a><a class="segl on" href="#/job/${jobId}/calendar">Calendar</a></div></div>
    <div class="bar"><button class="btn line sm" data-calm="${mv(-1)}">‹ ${new Date(y, m - 2, 1).toLocaleDateString("en-GB", { month:"short" })}</button>
      <b style="font-size:17px;min-width:150px;text-align:center">${monthName}</b>
      <button class="btn line sm" data-calm="${mv(1)}">${new Date(y, m, 1).toLocaleDateString("en-GB", { month:"short" })} ›</button>
      ${calMonth !== today().slice(0, 7) ? `<button class="lnk" data-calm="${today().slice(0, 7)}">This month</button>` : ""}</div>
    <div class="stats">${stat("Most on site", counts.length ? Math.max(...counts) : 0)}${stat("Average a day", counts.length ? round2(counts.reduce((a, b) => a + b, 0) / counts.length) : 0)}${stat("People this month", names.size)}</div>
    <div class="cal"><div class="cal-h">${WEEKDAYS.map(d => `<span>${d}</span>`).join("")}</div>
      <div class="cal-g">${cells.map(d => { const o = work(d) ? on(d) : [], out = d < first || d > last, arrivals = people.filter(p => p.onDate === d), leavers = people.filter(p => p.offDate === d);
        return `<button type="button" class="cal-d${out ? " out" : ""}${work(d) ? "" : " off"}${d === today() ? " today" : ""}" data-calday="${d}" ${work(d) ? "" : "disabled"}>
          <span class="dn"><b>${parse(d).getDate()}</b>${work(d) && o.length ? `<em>${o.length}</em>` : ""}</span>
          ${work(d) ? o.slice(0, 5).map(p => `<span class="pn${arrivals.includes(p) ? " in" : ""}" title="${esc(p.name)}${p.trade ? " — " + esc(p.trade) : ""}">${arrivals.includes(p) ? "→ " : ""}${esc(p.name)}</span>`).join("")
            + (o.length > 5 ? `<span class="more">+${o.length - 5} more</span>` : "")
            + (leavers.length ? `<span class="pn leave">${leavers.length} left</span>` : "") : ""}</button>`; }).join("")}</div></div>
    <p class="fn">→ starts that day. Built from the job's labour register — allocations from Staff and anyone added on site.</p>`);
}
function bindCalendar(jobId){
  document.querySelectorAll("[data-calm]").forEach(b => b.onclick = () => { calMonth = b.dataset.calm; route(); });
  document.querySelectorAll("[data-calday]").forEach(b => b.onclick = () => {
    const d = b.dataset.calday, ppl = list(jobId, "labour").filter(p => isOn(p, d)).sort((a, c) => String(a.name).localeCompare(String(c.name)));
    const left = list(jobId, "labour").filter(p => p.offDate === d);

      ${ppl.length ? `<table class="t"><tr><th>Name</th><th>Trade</th><th>Company</th><th>Since</th></tr>${ppl.map(p => `<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.trade || "—")}</td>

/* ================================================================ router */
let routing = 0;
let fresh = true;      /* moving page fetches the latest; redrawing after a save doesn't need to */
async function route(){
  const my = ++routing;
  const wasFresh = fresh; fresh = false;
  const slow = setTimeout(() => { document.body.classList.add("busy"); $("#root").setAttribute("aria-busy", "true"); }, 120);
  const done = () => { clearTimeout(slow); if(my === routing){ document.body.classList.remove("busy"); $("#root").removeAttribute("aria-busy"); } };
  const root = $("#root");
  const h = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  try{
    let html, bind = () => {};
    if(isHireOnly()){ html = await viewHireAll(); bind = bindHire; }
    else if(h[0] === "plant"){ html = await viewFleet(); bind = bindFleet; }
    else if(h[0] === "staff"){ html = await viewStaff(); bind = bindStaff; }
    else if(h[0] === "admin"){ html = await viewAdmin(); bind = bindLibrary; }
    else if(h[0] === "archived"){ html = await viewArchived(); }
    else if(h[0] === "job" && h[1]){
      const id = h[1], sec = h[2];
      if(!sec){ html = await viewJob(id); bind = () => { const e = $("[data-editjob]"); if(e) e.onclick = () => jobForm(jobById(id), S.items[id].meta); }; }
      else{
        if(!S.jobs.length) await loadJobs();
        if(!jobById(id)){ html = shell("dash", `<p class="empty">That job can't be found.</p>`); }
        else{
          await loadItems(id, wasFresh);
          if(sec === "calendar"){ html = labourCalendar(id); bind = () => bindCalendar(id); }
          else if(REG[sec]){ html = registerView(id, sec); bind = () => bindRegister(id, sec); }
          else if(sec === "hire"){ html = hireView(id); bind = bindHire; }
          else if(sec === "delays"){ html = delaysView(id); }
          else if(sec === "deliveries"){ html = deliveriesView(id); bind = () => bindDeliveries(id); }
          else if(sec === "timesheets"){ html = timesheetsView(id); bind = bindTimesheets; }
          else if(sec === "hs"){
            const sub = h[3] || "";
            if(sub === "toolbox" && !LIB) await loadLibrary();
            if(sub === "havs" && !HAVT) await loadHavsTools();
            const pg = hsPage(id, sub); html = pg.html; bind = pg.bind || (() => {});
          }
          else html = await viewJob(id);
        }
      }
    }
    else { html = await viewDashboard(); bind = () => { const n = $("[data-newjob]"); if(n) n.onclick = () => jobForm(null, null); }; }
    done();
    if(my !== routing) return;
    root.innerHTML = html;
    const so = $("[data-signout]"); if(so) so.onclick = async () => { await sb.auth.signOut(); location.reload(); };
    bind();
  }catch(e){
    done();
    if(my !== routing) return;
    root.innerHTML = shell("dash", `<div class="panel"><div class="body"><p class="err">${esc(words(e))}</p>
      <button class="btn line" onclick="route()">Try again</button></div></div>`);
  }
}
window.addEventListener("hashchange", () => { regShow = "on"; fresh = true; route(); });

/* --------------------------------------------------------------- sign in */
function signIn(msg){
  $("#root").innerHTML = `<div class="gate"><div class="card"><img src="logo.png" alt="">
    <h1>SiteHUB admin</h1><p>Sign in with your SiteHUB account</p>
    <form id="si"><div class="f"><label>Email</label><input class="in" type="email" id="em" autocomplete="email"></div>
      <div class="f"><label>Password</label><input class="in" type="password" id="pw" autocomplete="current-password"></div>
      <p class="err" id="er" ${msg ? "" : "hidden"}>${esc(msg || "")}</p>
      <button class="btn" type="submit">Sign in</button></form>
    <p style="margin-top:18px;font-size:13.5px">Forgotten your password? Reset it from the <a href="./">SiteHUB app</a>.</p></div></div>`;
  $("#em").focus();
  $("#si").onsubmit = async e => {
    e.preventDefault();
    const er = $("#er"); er.hidden = true;
    const { error } = await sb.auth.signInWithPassword({ email:$("#em").value.trim(), password:$("#pw").value });
    if(error){ er.textContent = /invalid/i.test(error.message) ? "Email or password not recognised." : error.message; er.hidden = false; return; }
    start();
  };
}
async function start(){
  if(SUPABASE_URL.indexOf("https://") !== 0){ $("#root").innerHTML = `<div class="gate"><p>This copy isn't connected to a database yet.</p></div>`; return; }
  let me = null;
  try{ me = await loadMe(); }catch(e){ return signIn(words(e)); }
  if(!me) return signIn();
  if(!me.active || !me.company_id) return signIn("Your account isn't set up for SiteHUB. Speak to your admin.");
  if(!isAdmin() && !isHireOnly()){
    $("#root").innerHTML = `<div class="gate"><div class="card"><img src="logo.png" alt=""><h1>Use the SiteHUB app</h1>
      <p>The admin console is for admins. Everything for your role is in the SiteHUB app.</p>
      <a class="btn" style="display:block;text-decoration:none" href="./">Open the app</a>
      <p><button class="lnk" id="so">Sign out</button></p></div></div>`;
    $("#so").onclick = async () => { await sb.auth.signOut(); location.reload(); };
    return;
  }
  route();
}
start();
</script>
